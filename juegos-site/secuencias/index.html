  /* El fondo real (sol + nubes + piso) lo pinta React recién al montar;
     hasta entonces se ve este mismo degradé de cielo (idéntico al de

     HTML/CSS puro: pinta YA, sin esperar a que cargue React, para que la
     llegada desde la home se sienta tan fluida como la vuelta al menú
     (que es 100% estática). En cuanto React monta algo en #root, un
     script la saca y queda la escena real. ---------- */
  .jxpre-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .jxpre-sky { position: absolute; inset: 0; background: linear-gradient(180deg, #2A0F5E 0%, #5A1F94 20%, #9435B0 42%, #E84F8C 62%, #FF6B3D 80%, #FFC93D 100%); }

  .jxpre-cloud.c6 { top: 12.0%; font-size: 50px; animation-duration: 22s; animation-delay: -9s; }
  .jxpre-cloud.c7 { top: 16.2%; font-size: 44px; animation-duration: 44s; animation-delay: -12s; }
  .jxpre-cloud.c8 { top: 17.3%; font-size: 40px; animation-duration: 36s; animation-delay: -3s; }
  .jxpre-cloud.c9 { top: 21.8%; font-size: 32px; animation-duration: 38s; animation-delay: -9s; }
  .jxpre-cloud.c10 { top: 24.1%; font-size: 36px; animation-duration: 24s; animation-delay: -4s; }
  .jxpre-cloud.c11 { top: 28.2%; font-size: 44px; animation-duration: 34s; animation-delay: -11s; }
  .jxpre-cloud.c12 { top: 32.5%; font-size: 30px; animation-duration: 24s; animation-delay: -25s; }
  .jxpre-cloud.c13 { top: 34.6%; font-size: 28px; animation-duration: 38s; animation-delay: -15s; }
  .jxpre-cloud.c14 { top: 38.6%; font-size: 48px; animation-duration: 30s; animation-delay: -15s; }
  .jxpre-cloud.c15 { top: 43.4%; font-size: 30px; animation-duration: 48s; animation-delay: -8s; }
  .jxpre-cloud.c16 { top: 46.6%; font-size: 46px; animation-duration: 42s; animation-delay: -11s; }
  @keyframes jxpre-drift { from { transform: translateX(115vw); } to { transform: translateX(-45vw); } }
  .jxpre-floor {
    position: absolute; left: -70%; right: -70%; bottom: -4%; height: 36vh;

    background-image: linear-gradient(90deg, rgba(255,255,255,0.16) 50%, transparent 50%), linear-gradient(rgba(255,255,255,0.16) 50%, transparent 50%);

  .jxpre-fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,6,32,0) 0%, rgba(12,6,32,0.15) 40%, rgba(12,6,32,0.6) 75%, rgba(12,6,32,0.9) 100%); }

<div id="root"></div>
<script>
  // Apenas React mete el primer contenido en #root, sacamos esta escena
  // estática (ya cumplió su función) y queda la real. OJO: este script
  // tiene que ir DESPUÉS del <div id="root">, si no getElementById("root")
  // da null (el parser todavía no llegó a esa línea) y el observer nunca
  // se arma.
  (function () {
    var root = document.getElementById("root");
    var pre = document.getElementById("jxPreScene");
    if (!root || !pre) return;
    var obs = new MutationObserver(function () {
      if (root.childElementCount > 0) {
        pre.remove();
        obs.disconnect();
      }
    });
    obs.observe(root, { childList: true });
  })();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ============================================================
// Secuencias en Cadena: hasta 8 jugadores, cada uno en su celu.
// Todos arrancan con las mismas 5 secuencias (contar de X en X,
// del 1 al 99). Al completar una, le mandás una secuencia nueva a
// otro jugador — como una línea de Tetris. Si a alguien se le
// acumulan demasiadas, queda eliminado. Gana el último en pie.
// ============================================================
const STORAGE_PREFIX = "secuencias:sala:";
const POLL_MS = 1000;
// El listado de "salas abiertas ahora" (JoinScreen, antes de entrar a
// jugar) usa list() de Workers KV, que en el plan gratuito tiene una
// cuota diaria mucho más chica que get() (1.000/día contra 100.000/día,
// compartida por todo el sitio). No hace falta que se actualice cada
// segundo — nadie necesita precisión al segundo para ver qué salas hay
// abiertas — así que sondea bastante más espaciado.
const LOBBY_LIST_POLL_MS = 8000;
const SESSION_KEY = "secuencias:sesion";
const MAX_PLAYERS = 8;
const DEFAULT_MAX_QUEUE = 8;
const BASE_QUEUE_SIZE = 5;
const STEP_MIN = 8;
const STEP_MAX = 27;
const PRACTICE_BEST_KEY = "secuencias:practica:mejores";

const PLAYER_COLORS = ["#FF3E7F", "#5B4B8A", "#FFD23F", "#3DDC84", "#4FC3F7", "#FF9F1C", "#B983FF", "#FF6B6B"];

function randomId() {
  return Math.random().toString(36).slice(2, 10);
}
function randomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
const MY_DEVICE_ID = (() => {
  const KEY = "secuencias:deviceId";
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = randomId();
    localStorage.setItem(KEY, id);
  }
  return id;
})();

async function readRoom(code) {
  try {
    const res = await window.storage.get(STORAGE_PREFIX + code, true);
    if (!res) return null;
    return JSON.parse(res.value);
  } catch {
    return null;
  }
}
async function writeRoom(code, room) {
  await window.storage.set(STORAGE_PREFIX + code, JSON.stringify(room), true);
}
function playerKey(code, round, playerId) {
  return STORAGE_PREFIX + code + ":r" + round + ":player:" + playerId;
}
async function readPlayerState(code, round, playerId) {
  try {
    const res = await window.storage.get(playerKey(code, round, playerId), true);
    if (!res) return null;
    return JSON.parse(res.value);
  } catch {
    return null;
  }
}
async function writePlayerState(code, round, playerId, state) {
  await window.storage.set(playerKey(code, round, playerId), JSON.stringify(state), true);
}
// Antes esto usaba list() de Workers KV (pedir todas las keys bajo el
// prefijo de la ronda y parsear cada una). list() tiene una cuota diaria
// gratuita mucho más chica que get() (1.000/día contra 100.000/día,
// compartida por todo el sitio) — con 1 sondeo por segundo por jugador se
// agota en minutos, y cuando eso pasa las llamadas fallan y devuelven
// vacío, lo que hacía que el sondeo pisara el progreso local de cada uno
// con "no hay nadie". playerIds sale de room.players, que ya tenemos
// siempre a mano (no hace falta descubrir las keys con list()), así que
// pedimos cada estado por su key exacta con readPlayerState, en paralelo.
async function readAllPlayerStates(code, round, playerIds) {
  const entries = await Promise.all(
    (playerIds || []).map(async (id) => [id, await readPlayerState(code, round, id)])
  );
  const map = {};
  entries.forEach(([id, state]) => {
    if (state) map[id] = state;
  });
  return map;
}

// Siempre 10 casilleros (10 múltiplos de "step"), sin importar el paso: antes
// se contaba "hasta 99", así que un paso grande (27) daba secuencias de 3
// números y uno chico (8) de 12 — la dificultad y la duración de la tarea
// variaban un montón según te tocara. Ahora la longitud es siempre la misma,
// tanto en modo batalla como en práctica (comparten esta misma función).
function seqForStep(step) {
  const arr = [];
  for (let i = 1; i <= 10; i++) arr.push(step * i);
  return arr;
}
function randomStep() {
  return STEP_MIN + Math.floor(Math.random() * (STEP_MAX - STEP_MIN + 1));
}
function pickSteps(n) {
  const pool = [];
  for (let i = STEP_MIN; i <= STEP_MAX; i++) pool.push(i);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, n);
}

// Tarea tipo "grilla": NxN casilleros con números al azar del 0 al 99 (sin
// repetir dentro de la misma grilla), hay que tocarlos de mayor a menor.
function randomGridNumbers(size) {
  const count = size * size;
  const used = new Set();
  const numbers = [];
  while (numbers.length < count) {
    const v = Math.floor(Math.random() * 100); // 0 al 99
    if (!used.has(v)) {
      used.add(v);
      numbers.push(v);
    }
  }
  return numbers;
}
function randomTask(taskType, gridSize) {
  if (taskType === "grid") {
    return { type: "grid", size: gridSize || 3, numbers: randomGridNumbers(gridSize || 3) };
  }
  return { type: "seq", step: randomStep() };
}
function pickTasks(n, taskType, gridSize) {
  if (taskType === "grid") {
    return Array.from({ length: n }, () => randomTask("grid", gridSize));
  }
  return pickSteps(n).map((step) => ({ type: "seq", step }));
}
function cloneTask(t) {
  return t.type === "grid" ? { ...t, numbers: [...t.numbers] } : { ...t };
}
// Lista de respuestas correctas en el orden en que hay que darlas, sea cual
// sea el tipo de tarea: para "seq" es la cuenta ascendente de siempre; para
// "grid" son los números de la grilla ordenados de mayor a menor.
function expectedAnswers(task) {
  if (task.type === "grid") return [...task.numbers].sort((a, b) => b - a);
  return seqForStep(task.step);
}

function SequenceTrail({ step, progress }) {

function GridBoard({ task, progress, onTap, shake, locked }) {
  const sorted = [...task.numbers].sort((a, b) => b - a);
  const fontSize = task.size >= 5 ? 22 : task.size === 4 ? 26 : 32;
  return (
    <div
      style={{
        display: "grid",
        gridTemplateColumns: `repeat(${task.size}, 1fr)`,
        gap: task.size >= 5 ? 8 : 10,
        width: "100%",
        maxWidth: 460,
        marginBottom: 16,
        padding: 8,
        borderRadius: 14,
        border: shake ? "2px solid #FF5D7A" : "2px solid transparent",
        opacity: locked ? 0.55 : 1,
        transition: "opacity 0.15s ease",
      }}
    >
      {task.numbers.map((v, i) => {
        const rank = sorted.indexOf(v);
        const done = rank < progress;
        return (
          <button
            key={i}
            onClick={() => !done && !locked && onTap(i)}
            disabled={done || locked}
            style={{
              aspectRatio: "1",
              borderRadius: 12,
              border: "none",
              fontSize,
              fontWeight: 800,
              fontFamily: "'Baloo 2', sans-serif",
              cursor: done || locked ? "default" : "pointer",
              background: done ? "rgba(61,220,132,0.18)" : "rgba(255,255,255,0.08)",
              color: done ? "#3DDC84" : "#F3EEFF",
              textDecoration: done ? "line-through" : "none",
              opacity: done ? 0.6 : 1,
            }}
          >
            {v}
          </button>
        );
      })}
    </div>
  );
}

function NumericKeypad({ draft, setDraft, onEnter, disabled }) {
  const press = (d) => {
    if (!disabled) setDraft((v) => (v + d).slice(0, 3));
  };
  const backspace = () => {
    if (!disabled) setDraft((v) => v.slice(0, -1));
  };
  const rows = [
    ["1", "2", "3"],
    ["4", "5", "6"],
    ["7", "8", "9"],
    ["⌫", "0", "✓"],
  ];
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, width: "100%", maxWidth: 300 }}>
      {rows.flat().map((k, i) => (
        <button
          key={i}
          disabled={disabled}
          onClick={() => {
            if (k === "⌫") backspace();
            else if (k === "✓") onEnter();
            else press(k);
          }}
          style={{
            fontSize: 22,
            fontWeight: 800,
            fontFamily: "'Baloo 2', sans-serif",
            padding: "16px 0",
            borderRadius: 14,
            border: "none",
            cursor: disabled ? "default" : "pointer",
            background: k === "✓" ? "#3DDC84" : k === "⌫" ? "#FF5D7A" : "rgba(255,255,255,0.08)",
            color: k === "✓" || k === "⌫" ? "#1B1035" : "#F3EEFF",
            opacity: disabled ? 0.4 : 1,
          }}
        >
          {k}
        </button>
      ))}
    </div>
  );
}

function PlayerBadgeRow({ players, playerStates, myId }) {
  const aliveList = players.filter((p) => (playerStates[p.id] || {}).alive !== false);
  const maxQueueAlive = Math.max(0, ...aliveList.map((p) => ((playerStates[p.id] || {}).queue || []).length));
  return (
    <div
      style={{
        display: "grid",
        gridTemplateColumns: "repeat(4, 1fr)",
        gap: 8,
        width: "100%",
        maxWidth: 460,
        marginBottom: 18,
      }}
    >
      {players.map((p, i) => {
        const st = playerStates[p.id];
        const qLen = st ? (st.queue || []).length : 0;
        const alive = st ? st.alive !== false : true;
        const isJoker = alive && qLen === maxQueueAlive && maxQueueAlive > 0;
        return (
          <div
            key={p.id}
            style={{
              background: alive ? PLAYER_COLORS[i % PLAYER_COLORS.length] : "#241d38",
              borderRadius: 12,
              padding: "8px 6px",
              textAlign: "center",
              opacity: alive ? 1 : 0.6,

            <div

                fontSize: 12,
                fontWeight: 800,
                color: alive ? "#1B1035" : "#8b7fa8",
                overflow: "hidden",
                textOverflow: "ellipsis",
                whiteSpace: "nowrap",

function TargetPicker({ players, playerStates, myId, myLastAttacked, isJoker, onAttack }) {
  const [useJoker, setUseJoker] = useState(false);
  const aliveList = players.filter((p) => (playerStates[p.id] || {}).alive !== false);
  const aliveCount = aliveList.length;
  const candidates = aliveList.filter((p) => {
    if (p.id === myId) return false;
    if (aliveCount > 2 && p.id === myLastAttacked) return false;
    return true;
  });
  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(0,0,0,0.75)",
        display: "flex",
        alignItems: "center",

        zIndex: 100,
        padding: 20,

      <Card style={{ maxWidth: 380, marginBottom: 0 }}>
        <Title size={22}>¡Bien! ¿A quién atacás?</Title>

          <label
            style={{
              display: "flex",
              alignItems: "center",
              gap: 8,
              marginBottom: 14,
              color: "#FFD23F",
              fontWeight: 700,

}

function PracticeGame({ onBack }) {
  const [taskType, setTaskType] = useState("seq");
  const [gridSize, setGridSize] = useState(3);
  const [penalty, setPenalty] = useState(false);
  const [started, setStarted] = useState(false);
  const [task, setTask] = useState(null);
  const [progress, setProgress] = useState(0);
  const [typedDraft, setTypedDraft] = useState("");
  const [wrongFlash, setWrongFlash] = useState(false);
  // Modo "con penalidad": cada error frena todo click/toque por 1s (en vez
  // del flash rojo breve de siempre). wrongFlashTimerRef guarda el timeout
  // en curso para poder cancelarlo si llega un error nuevo antes de que
  // termine el anterior (si no, dos errores seguidos podrían "destrabar"
  // antes de tiempo).
  const [locked, setLocked] = useState(false);
  const wrongFlashTimerRef = useRef(null);
  const registerWrong = () => {
    if (wrongFlashTimerRef.current) clearTimeout(wrongFlashTimerRef.current);
    setWrongFlash(true);
    if (penalty) {
      setLocked(true);
      wrongFlashTimerRef.current = setTimeout(() => {
        setWrongFlash(false);
        setLocked(false);
      }, 1000);
    } else {
      wrongFlashTimerRef.current = setTimeout(() => setWrongFlash(false), 500);
    }
  };
  const [startTime, setStartTime] = useState(null);
  const [elapsedMs, setElapsedMs] = useState(0);
  const [finished, setFinished] = useState(false);
  const [finalMs, setFinalMs] = useState(null);
  const [bestMs, setBestMs] = useState(null);
  const [isNewBest, setIsNewBest] = useState(false);

  const practiceKey = taskType === "grid" ? `grid-${gridSize}` : "seq";

  useEffect(() => {
    try {
      const all = JSON.parse(localStorage.getItem(PRACTICE_BEST_KEY) || "{}");
      setBestMs(all[practiceKey] != null ? all[practiceKey] : null);
    } catch {
      setBestMs(null);
    }
  }, [practiceKey]);

  useEffect(() => {
    if (!started || finished || !startTime) return;
    const id = setInterval(() => setElapsedMs(Date.now() - startTime), 100);
    return () => clearInterval(id);
  }, [started, finished, startTime]);

  const fmt = (ms) => (Math.max(0, ms) / 1000).toFixed(1) + "s";

  const newTask = () => {
    setTask(randomTask(taskType, gridSize));
    setProgress(0);
    setTypedDraft("");
    setFinished(false);
    setFinalMs(null);
    setIsNewBest(false);
    setElapsedMs(0);
    setStartTime(Date.now());
    setStarted(true);
    if (wrongFlashTimerRef.current) clearTimeout(wrongFlashTimerRef.current);
    setWrongFlash(false);
    setLocked(false);
  };

  const finishTask = (ms) => {
    setFinished(true);
    setFinalMs(ms);
    try {
      const all = JSON.parse(localStorage.getItem(PRACTICE_BEST_KEY) || "{}");
      const prevBest = all[practiceKey];
      if (prevBest == null || ms < prevBest) {
        all[practiceKey] = ms;
        localStorage.setItem(PRACTICE_BEST_KEY, JSON.stringify(all));
        setBestMs(ms);
        setIsNewBest(true);
      }
    } catch {}
  };

  const submitDigit = () => {
    if (!task || finished || !typedDraft || locked) return;
    const answers = expectedAnswers(task);
    const expected = answers[progress];
    const typed = parseInt(typedDraft, 10);
    if (typed === expected) {
      const isLast = progress + 1 >= answers.length;
      setTypedDraft("");
      if (isLast) finishTask(Date.now() - startTime);
      else setProgress(progress + 1);
    } else {
      setTypedDraft("");
      registerWrong();
    }
  };

  const tapCell = (idx) => {
    if (!task || finished || locked) return;
    const answers = expectedAnswers(task);
    const expected = answers[progress];
    const value = task.numbers[idx];
    if (value !== expected) {
      registerWrong();
      return;
    }
    const isLast = progress + 1 >= answers.length;
    if (isLast) finishTask(Date.now() - startTime);
    else setProgress(progress + 1);
  };

  if (!started) {
    return (
      <Screen>
        <Title size={26}>🏋️ Practicar</Title>
        <Sub style={{ marginTop: -10 }}>Solo/a, contra el reloj — sin ataques ni rivales</Sub>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Tipo de ejercicio</div>
          <div style={{ display: "flex", gap: 8, marginBottom: taskType === "grid" ? 10 : 0 }}>
            <button onClick={() => setTaskType("seq")} style={pillStyle(taskType !== "grid")}>
              🔢 Secuencias
            </button>
            <button onClick={() => setTaskType("grid")} style={pillStyle(taskType === "grid")}>
              🔳 Grilla
            </button>
          </div>
          {taskType === "grid" && (
            <div style={{ display: "flex", gap: 8 }}>
              {[3, 4, 5].map((n) => (
                <button key={n} onClick={() => setGridSize(n)} style={pillStyle(gridSize === n)}>
                  {n}x{n}
                </button>
              ))}
            </div>
          )}
        </Card>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Dificultad</div>
          <button onClick={() => setPenalty((v) => !v)} style={{ ...pillStyle(penalty), width: "100%" }}>
            ⏱️ Con penalidad (1s frenado si te equivocás)
          </button>
        </Card>
        {bestMs != null && (
          <Sub style={{ marginTop: -6 }}>
            🏆 Tu mejor tiempo acá: <b style={{ color: "#FFD23F" }}>{fmt(bestMs)}</b>
          </Sub>
        )}
        <BigButton onClick={newTask}>Empezar ▶️</BigButton>
        <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Volver
        </BigButton>
      </Screen>
    );
  }

  return (
    <Screen
      homeConfirm={finished ? null : "¿Salir? Perdés el tiempo de este intento."}
      style={task && task.type === "grid" ? { justifyContent: "center" } : undefined}
    >
      <Title size={24}>🏋️ Practicando</Title>
      <div
        style={{
          fontSize: 40,
          fontWeight: 800,
          fontFamily: "'Baloo 2', sans-serif",
          color: finished ? (isNewBest ? "#3DDC84" : "#FFD23F") : "#F3EEFF",
          marginBottom: 2,
        }}
      >
        {fmt(finished ? finalMs : elapsedMs)}
      </div>
      {bestMs != null && (
        <Sub style={{ marginTop: 0, fontSize: 13 }}>Mejor marca: {fmt(bestMs)}</Sub>
      )}

      {finished ? (
        <Card style={{ width: "100%", maxWidth: 420, textAlign: "center" }}>
          {isNewBest && <div style={{ color: "#3DDC84", fontWeight: 800, marginBottom: 10 }}>🎉 ¡Nueva mejor marca!</div>}
          <BigButton onClick={newTask}>Otra 🔁</BigButton>
          <BigButton
            onClick={() => setStarted(false)}
            color="transparent"
            style={{ boxShadow: "none", color: "#C9B8F0" }}
          >
            Cambiar ejercicio
          </BigButton>
        </Card>
      ) : task.type === "grid" ? (
        <>
          <GridInstruction />
          <GridBoard task={task} progress={progress} onTap={tapCell} shake={wrongFlash} locked={locked} />
          {locked && <PenaltyNotice />}
        </>
      ) : (
        <>
          <Sub style={{ marginTop: -6 }}>
            Contá de <b style={{ color: "#FFD23F" }}>{task.step}</b> en {task.step}
          </Sub>
          <SequenceTrail step={task.step} progress={progress} />
          <input
            value={typedDraft}
            onChange={(e) => setTypedDraft(e.target.value.replace(/[^0-9]/g, ""))}
            onKeyDown={(e) => e.key === "Enter" && submitDigit()}
            inputMode="numeric"
            placeholder="?"
            disabled={locked}
            style={{
              ...inputStyle,
              maxWidth: 300,
              textAlign: "center",
              fontSize: 28,
              fontWeight: 800,
              fontFamily: "'Baloo 2', sans-serif",
              border: wrongFlash ? "2px solid #FF5D7A" : inputStyle.border,
              opacity: locked ? 0.55 : 1,
            }}
          />
          <NumericKeypad draft={typedDraft} setDraft={setTypedDraft} onEnter={submitDigit} disabled={locked} />
          {locked && <PenaltyNotice />}
        </>
      )}
      {!finished && (
        <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0", marginTop: 12 }}>
          Salir
        </BigButton>
      )}
    </Screen>
  );
}

function JoinScreen({ onJoined, onBack }) {
  const [name, setName] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [joinError, setJoinError] = useState("");
  const [joining, setJoining] = useState(false);
  const [openRooms, setOpenRooms] = useState([]);
  const [resumable, setResumable] = useState(null);

  useEffect(() => {
    let cancelled = false;
    const tick = async () => {
      try {
        const entries = await window.storage.list(STORAGE_PREFIX);
        if (cancelled) return;
        const rooms = entries
          .map((e) => {
            if (!/^secuencias:sala:[^:]+$/.test(e.key)) return null;
            try {
              return JSON.parse(e.value);
            } catch {
              return null;
            }
          })
          .filter((r) => r && r.phase === "lobby" && Date.now() - (r.createdAt || 0) < 3 * 60 * 60 * 1000)
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        setOpenRooms(rooms);
      } catch {}
    };
    tick();
    const id = setInterval(tick, LOBBY_LIST_POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      let saved;
      try {
        saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      } catch {
        saved = null;
      }
      if (!saved || !saved.code || !saved.playerId) {
        setResumable(null);
        return;
      }
      const existing = await readRoom(saved.code);
      if (cancelled) return;
      if (existing && existing.players.some((p) => p.id === saved.playerId)) {
        setResumable({
          code: saved.code,
          playerId: saved.playerId,
          name: (existing.players.find((p) => p.id === saved.playerId) || {}).name,
        });
      } else {
        localStorage.removeItem(SESSION_KEY);
        setResumable(null);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, []);

  const doJoin = async (codeMaybe) => {
    const trimmed = name.trim();
    if (!trimmed) {
      setJoinError("Escribí tu nombre.");
      return;
    }
    setJoining(true);
    setJoinError("");
    try {
      const code = codeMaybe || (codeInput.trim() ? codeInput.trim().toUpperCase() : randomCode());
      let existing = await readRoom(code);
      if (existing && existing.phase !== "lobby") {
        setJoinError("Esa sala ya está jugando. Esperá a la próxima ronda.");
        setJoining(false);
        return;
      }
      const me = { id: randomId(), name: trimmed, deviceId: MY_DEVICE_ID, joinedAt: Date.now() };
      if (!existing) {
        existing = {
          code,
          hostId: me.id,
          players: [me],
          phase: "lobby",
          round: 1,
          maxQueue: DEFAULT_MAX_QUEUE,
          winnerId: null,
          createdAt: Date.now(),
        };
      } else {
        if (existing.players.length >= MAX_PLAYERS) {
          setJoinError(`Sala llena (máximo ${MAX_PLAYERS} jugadores).`);
          setJoining(false);
          return;
        }
        if (existing.players.some((p) => p.name.toLowerCase() === trimmed.toLowerCase())) {
          setJoinError(`Ya hay alguien llamado "${trimmed}" en esa sala. Cambiá el nombre.`);
          setJoining(false);
          return;
        }
        existing.players = [...existing.players, me];
      }
      await writeRoom(code, existing);
      window.storage.incrementCounter("players").catch(() => {});
      localStorage.setItem(SESSION_KEY, JSON.stringify({ code, playerId: me.id }));
      onJoined(code, me.id);
    } catch (e) {
      setJoinError("No se pudo conectar a la sala. Probá de nuevo.");
    } finally {
      setJoining(false);
    }
  };

  return (
    <Screen>
      <Title size={26}>Secuencias en Cadena</Title>
      <Sub style={{ marginTop: -10 }}>Hasta 8 jugadores, cada uno en su celu</Sub>
      <Card style={{ width: "100%", maxWidth: 420 }}>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Tu nombre" style={inputStyle} />
        <input
          value={codeInput}
          onChange={(e) => setCodeInput(e.target.value.toUpperCase())}
          placeholder="Código de sala (opcional)"
          style={inputStyle}
        />
        {joinError && <div style={{ color: "#FF5D7A", fontSize: 13, marginBottom: 8 }}>{joinError}</div>}
        <BigButton onClick={() => doJoin(null)} disabled={joining}>
          {codeInput.trim() ? "Unirme a esa sala" : "Crear sala nueva"}
        </BigButton>
      </Card>

      {resumable && (
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <Sub style={{ marginTop: 0 }}>
            Ya estabas en la sala <b>{resumable.code}</b> como {resumable.name}
          </Sub>
          <BigButton onClick={() => onJoined(resumable.code, resumable.playerId)} color="#6D3FD1">
            Volver a esa sala
          </BigButton>
        </Card>
      )}

      {openRooms.length > 0 && (
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", fontWeight: 700, marginBottom: 8 }}>Salas abiertas ahora</div>
          {openRooms.map((r) => (
            <button
              key={r.code}
              onClick={() => {
                setCodeInput(r.code);
                doJoin(r.code);
              }}
              style={{
                display: "flex",
                justifyContent: "space-between",
                width: "100%",
                background: "rgba(255,255,255,0.06)",
                border: "none",
                borderRadius: 10,
                padding: "10px 12px",
                marginBottom: 6,
                color: "#F3EEFF",
                cursor: "pointer",
                fontWeight: 700,
              }}
            >
              <span>{r.code}</span>
              <span style={{ color: "#8b7fa8" }}>{(r.players || []).length}/{MAX_PLAYERS} jugadores</span>
            </button>
          ))}
        </Card>
      )}

      <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
        Volver
      </BigButton>
    </Screen>
  );
}

function GameRoom({ roomCode, myId, onBack }) {
  const [room, setRoom] = useState(null);
  const [playerStates, setPlayerStates] = useState({});
  const [typedDraft, setTypedDraft] = useState("");
  const [wrongFlash, setWrongFlash] = useState(false);
  const [showTargetPicker, setShowTargetPicker] = useState(false);
  // Modo "con penalidad" (room.penalty, lo elige el anfitrión/a en el
  // lobby): cada error frena todo click/toque por 1s en vez del flash
  // rojo breve de siempre.
  const [locked, setLocked] = useState(false);
  const wrongFlashTimerRef = useRef(null);
  // Cada dígito/toque aplica YA en lo local (instantáneo, sin esperar red)
  // y el guardado real al servidor pasa en segundo plano — mismo esquema
  // que Bloques en Cadena. myLiveStateRef es la fuente de verdad de "mi
  // estado" en todo momento (síncrona, nunca desactualizada entre toques
  // rápidos). El sync relee el servidor recién antes de escribir y solo
  // "estampa" mi progreso encima, preservando cualquier tarea que haya
  // llegado por ataque mientras tanto.
  const myLiveStateRef = useRef(null);
  const pendingWritesRef = useRef(0);
  const syncingRef = useRef(false);
  const syncDirtyRef = useRef(false);
  // Cuántos elementos tenía mi cola la última vez que supimos con certeza
  // qué tenía el servidor (recién leído, o recién escrito por mí). Comparar
  // la cola fresca contra ESTO — y no contra el largo de mi cola local
  // actual — es lo que distingue "llegó un ataque nuevo" de "todavía no
  // sincronicé que yo misma acorté mi cola al completar una tarea": si
  // comparara contra mi cola local, completar una tarea (que la acorta)
  // haría parecer que el servidor "tiene de más", y ese sobrante (en
  // realidad la tarea vieja que ya completé) se volvería a agregar solo.
  const lastKnownServerQueueLenRef = useRef(0);

  const runSyncLoop = async (roomCode, round, myId) => {
    if (syncingRef.current) return;
    syncingRef.current = true;
    pendingWritesRef.current += 1;
    try {
      while (syncDirtyRef.current) {
        syncDirtyRef.current = false;
        const cur = myLiveStateRef.current;
        if (!cur) break;
        const fresh = (await readPlayerState(roomCode, round, myId)) || cur;
        const freshQueueLen = (fresh.queue || []).length;
        let liveNow = myLiveStateRef.current;
        let liveQueue = liveNow.queue || [];
        if (freshQueueLen > lastKnownServerQueueLenRef.current) {
          // Esto sí es nuevo desde la última vez que supimos del servidor
          // (un ataque que llegó mientras tanto): lo sumamos al final.
          const extra = fresh.queue.slice(lastKnownServerQueueLenRef.current);
          liveQueue = liveQueue.concat(extra);
          liveNow = { ...liveNow, queue: liveQueue };
          myLiveStateRef.current = liveNow;
          setPlayerStates((m) => ({ ...m, [myId]: liveNow }));
        }
        const merged = {
          ...fresh,
          queue: liveQueue,
          progress: liveNow.progress,
          lastAttacked: liveNow.lastAttacked,
          alive: liveNow.alive === false || fresh.alive === false ? false : true,
          eliminatedAt: liveNow.eliminatedAt || fresh.eliminatedAt || null,
        };
        await writePlayerState(roomCode, round, myId, merged);
        lastKnownServerQueueLenRef.current = merged.queue.length;
      }
    } finally {
      syncingRef.current = false;
      pendingWritesRef.current = Math.max(0, pendingWritesRef.current - 1);
    }
  };
  const scheduleSync = () => {
    syncDirtyRef.current = true;
    runSyncLoop(roomCode, room ? room.round || 1 : 1, myId);
  };
  const setMyStateNow = (next) => {
    myLiveStateRef.current = next;
    setPlayerStates((m) => ({ ...m, [myId]: next }));
    scheduleSync();
  };

  const leaveRoom = async () => {
    try {
      const fresh = await readRoom(roomCode);
      if (fresh) {
        fresh.players = (fresh.players || []).filter((p) => p.id !== myId);
        await writeRoom(roomCode, fresh);
      }
    } catch {}
    localStorage.removeItem(SESSION_KEY);
    onBack();
  };

  useEffect(() => {
    let cancelled = false;
    const tick = async () => {
      const r = await readRoom(roomCode);
      if (cancelled || !r) return;
      setRoom(r);
      const round = r.round || 1;
      if (r.phase === "playing" || r.phase === "ended") {
        const states = await readAllPlayerStates(roomCode, round, (r.players || []).map((p) => p.id));
        if (cancelled) return;
        // Si el sondeo no trajo NADA (falló el pedido — por ejemplo, se
        // agotó alguna cuota diaria de Workers KV — o la sala genuinamente
        // no tiene estado todavía), no lo tratamos como "no hay nadie
        // jugando": se descarta este sondeo entero y se mantiene lo que ya
        // se sabía. Sin este chequeo, un sondeo fallido pisaba mi propio
        // progreso (y el de todos) con un objeto vacío, mostrando "ya
        // terminaste, esperando a los demás" sin haber tocado nada.
        const hasData = states && Object.keys(states).length > 0;
        if (!hasData) return;
        if (pendingWritesRef.current === 0) {
          myLiveStateRef.current = states[myId] || myLiveStateRef.current;
          lastKnownServerQueueLenRef.current = (myLiveStateRef.current && myLiveStateRef.current.queue || []).length;
        }
        setPlayerStates((prev) =>
          pendingWritesRef.current > 0 && prev[myId] ? { ...states, [myId]: prev[myId] } : states
        );

        if (r.phase === "playing") {
          const aliveList = (r.players || []).filter((p) => (states[p.id] || {}).alive !== false && states[p.id]);
          if (aliveList.length <= 1 && Object.keys(states).length >= (r.players || []).length) {
            const fresh = await readRoom(roomCode);
            if (fresh && fresh.phase === "playing") {
              fresh.phase = "ended";
              fresh.winnerId = aliveList[0] ? aliveList[0].id : null;
              await writeRoom(roomCode, fresh);
            }
          }
        }
      }
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, [roomCode]);

  if (!room) {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <Sub>Cargando sala...</Sub>
      </Screen>
    );
  }

  const players = room.players || [];
  const effectiveHost =
    players.find((p) => p.id === room.hostId) ||
    [...players].sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0))[0] ||
    null;
  const isHost = !!effectiveHost && effectiveHost.id === myId;
  const roomTaskType = room.taskType === "grid" ? "grid" : "seq";
  const roomGridSize = room.gridSize || 3;
  const roomPenalty = !!room.penalty;
  const registerWrong = () => {
    if (wrongFlashTimerRef.current) clearTimeout(wrongFlashTimerRef.current);
    setWrongFlash(true);
    if (roomPenalty) {
      setLocked(true);
      wrongFlashTimerRef.current = setTimeout(() => {
        setWrongFlash(false);
        setLocked(false);
      }, 1000);
    } else {
      wrongFlashTimerRef.current = setTimeout(() => setWrongFlash(false), 500);
    }
  };

  const passControlTo = async (targetId) => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.hostId = targetId;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const startGame = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh || fresh.players.length < 2) return;
    const round = fresh.round || 1;
    const taskType = fresh.taskType === "grid" ? "grid" : "seq";
    const gridSize = fresh.gridSize || 3;
    const tasks = pickTasks(BASE_QUEUE_SIZE, taskType, gridSize);
    const newStates = {};
    fresh.players.forEach((p) => {
      newStates[p.id] = {
        queue: tasks.map(cloneTask),
        progress: 0,
        alive: true,
        lastAttacked: null,
        eliminatedAt: null,
      };
    });
    await Promise.all(fresh.players.map((p) => writePlayerState(roomCode, round, p.id, newStates[p.id])));
    fresh.phase = "playing";
    fresh.winnerId = null;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    myLiveStateRef.current = newStates[myId] || null;
    lastKnownServerQueueLenRef.current = (newStates[myId] && newStates[myId].queue || []).length;
    setPlayerStates(newStates);
  };

  const setTaskType = async (taskType) => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.taskType = taskType;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const setGridSize = async (gridSize) => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.gridSize = gridSize;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const setRoomPenalty = async (value) => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.penalty = value;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const playAgain = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.round = (fresh.round || 1) + 1;
    fresh.phase = "lobby";
    fresh.winnerId = null;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setPlayerStates({});
  };

  // ---------- LOBBY ----------
  if (room.phase === "lobby") {
    return (
      <Screen homeConfirm="¿Salir de la sala?">
        <Title size={26}>Sala {room.code}</Title>
        <Sub style={{ marginTop: -10 }}>
          Compartí el código para que se sumen ({players.length}/{MAX_PLAYERS}). Mínimo 2 jugadores.
        </Sub>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          {players.map((p) => (
            <div key={p.id} style={{ padding: "6px 2px", color: "#F3EEFF" }}>
              {p.id === effectiveHost?.id ? "👑 " : "• "}
              {p.name}
              {p.id === myId ? " (vos)" : ""}
            </div>
          ))}
        </Card>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Tipo de ejercicio</div>
          {isHost ? (
            <>
              <div style={{ display: "flex", gap: 8, marginBottom: roomTaskType === "grid" ? 10 : 0 }}>
                <button onClick={() => setTaskType("seq")} style={pillStyle(roomTaskType !== "grid")}>
                  🔢 Secuencias
                </button>
                <button onClick={() => setTaskType("grid")} style={pillStyle(roomTaskType === "grid")}>
                  🔳 Grilla
                </button>
              </div>
              {roomTaskType === "grid" && (
                <div style={{ display: "flex", gap: 8 }}>
                  {[3, 4, 5].map((n) => (
                    <button key={n} onClick={() => setGridSize(n)} style={pillStyle(roomGridSize === n)}>
                      {n}x{n}
                    </button>
                  ))}
                </div>
              )}
            </>
          ) : (
            <div style={{ color: "#F3EEFF", fontWeight: 700 }}>
              {roomTaskType === "grid" ? `🔳 Grilla ${roomGridSize}x${roomGridSize}` : "🔢 Secuencias"}
            </div>
          )}
        </Card>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Dificultad</div>
          {isHost ? (
            <button onClick={() => setRoomPenalty(!roomPenalty)} style={{ ...pillStyle(roomPenalty), width: "100%" }}>
              ⏱️ Con penalidad (1s frenado si te equivocás)
            </button>
          ) : (
            <div style={{ color: "#F3EEFF", fontWeight: 700 }}>
              {roomPenalty ? "⏱️ Con penalidad" : "Sin penalidad"}
            </div>
          )}
        </Card>
        {isHost ? (
          <>
            <BigButton onClick={startGame} disabled={players.length < 2}>
              {players.length < 2 ? "Esperando otro jugador..." : "Empezar 🎮"}
            </BigButton>
            {players.length > 1 && (
              <Card style={{ width: "100%", maxWidth: 420 }}>
                <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 6 }}>Pasarle el mando a otro/a</div>
                {players
                  .filter((p) => p.id !== myId)
                  .map((p) => (
                    <button
                      key={p.id}
                      onClick={() => passControlTo(p.id)}
                      style={{
                        display: "block",
                        width: "100%",
                        textAlign: "left",
                        background: "rgba(255,255,255,0.06)",
                        border: "none",
                        borderRadius: 8,
                        padding: "8px 10px",
                        marginBottom: 4,
                        color: "#F3EEFF",
                        cursor: "pointer",
                      }}
                    >
                      👑 {p.name}
                    </button>
                  ))}
              </Card>
            )}
          </>
        ) : (
          <Sub>Esperando a que {effectiveHost ? effectiveHost.name : "el anfitrión/a"} empiece...</Sub>
        )}
        <BigButton onClick={leaveRoom} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Salir de la sala
        </BigButton>
      </Screen>
    );
  }

  // ---------- ENDED ----------
  if (room.phase === "ended") {
    const round = room.round || 1;
    const ranked = [...players].sort((a, b) => {
      const sa = playerStates[a.id] || {};
      const sb = playerStates[b.id] || {};
      if (a.id === room.winnerId) return -1;
      if (b.id === room.winnerId) return 1;
      return (sb.eliminatedAt || 0) - (sa.eliminatedAt || 0);
    });
    const medals = ["🥇", "🥈", "🥉"];
    return (
      <Screen>
        <Title size={26}>🏆 {room.winnerId ? "¡Fin de la partida!" : "Partida terminada"}</Title>
        {room.winnerId && (
          <Sub style={{ marginTop: -10 }}>
            Ganó <b style={{ color: "#FFD23F" }}>{(players.find((p) => p.id === room.winnerId) || {}).name}</b>
          </Sub>
        )}
        <Card style={{ width: "100%", maxWidth: 420 }}>
          {ranked.map((p, i) => (
            <div
              key={p.id}
              style={{
                display: "flex",
                justifyContent: "space-between",
                padding: "8px 2px",
                borderBottom: i < ranked.length - 1 ? "1px solid rgba(255,255,255,0.08)" : "none",
              }}
            >
              <span>
                {medals[i] || `${i + 1}°`} {p.name}
                {p.id === myId ? " (vos)" : ""}
              </span>
            </div>
          ))}
        </Card>
        {isHost && <BigButton onClick={playAgain}>🔁 Jugar otra ronda</BigButton>}
        <BigButton onClick={leaveRoom} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Salir de la sala
        </BigButton>
      </Screen>
    );
  }

  // ---------- PLAYING ----------
  const round = room.round || 1;
  const myState = playerStates[myId];
  const iAmAlive = myState ? myState.alive !== false : true;
  const aliveList = players.filter((p) => (playerStates[p.id] || {}).alive !== false);
  const maxQueueAlive = Math.max(0, ...aliveList.map((p) => ((playerStates[p.id] || {}).queue || []).length));
  const isJoker = iAmAlive && myState && (myState.queue || []).length === maxQueueAlive && maxQueueAlive > 0;

  // El picker se cierra YA; los dos guardados (la tarea extra para el
  // rival, y mi propio "a quién ataqué") pasan en segundo plano.
  const performAttack = (targetId, useJoker) => {
    setShowTargetPicker(false);
    const cur = myLiveStateRef.current;
    if (cur) setMyStateNow({ ...cur, lastAttacked: targetId });
    const howMany = useJoker && isJoker ? 2 : 1;
    (async () => {
      const freshTarget = (await readPlayerState(roomCode, round, targetId)) || {
        queue: [],
        progress: 0,
        alive: true,
        lastAttacked: null,
        eliminatedAt: null,
      };
      const newTasks = [];
      for (let i = 0; i < howMany; i++) newTasks.push(randomTask(roomTaskType, roomGridSize));
      const newQueue = [...(freshTarget.queue || []), ...newTasks];
      const overflowed = newQueue.length > (room.maxQueue || DEFAULT_MAX_QUEUE);
      const nextTargetState = {
        ...freshTarget,
        queue: newQueue,
        alive: overflowed ? false : freshTarget.alive,
        eliminatedAt: overflowed && freshTarget.alive !== false ? Date.now() : freshTarget.eliminatedAt,
      };
      await writePlayerState(roomCode, round, targetId, nextTargetState);
      setPlayerStates((m) => ({ ...m, [targetId]: nextTargetState }));
    })();
  };

  // Se llama cuando se completó del todo la tarea que está primera en la
  // cola (sea "seq" o "grid"): la saca de la cola YA (instantáneo) y abre
  // el selector de a quién atacar. Compartido entre submitDigit
  // (secuencias) y tapCell (grilla) porque a ambos les toca lo mismo.
  const completeCurrentTask = (cur) => {
    const newQueue = cur.queue.slice(1);
    setMyStateNow({ ...cur, queue: newQueue, progress: 0 });
    setShowTargetPicker(true);
  };

  // Aplica el dígito YA sobre mi estado local (síncrono, instantáneo) y
  // pide que se guarde en segundo plano. myLiveStateRef es la fuente de
  // verdad, así que aunque tipees rápido cada dígito parte del resultado
  // real del anterior, no de una copia vieja.
  const submitDigit = () => {
    if (locked) return;
    const cur = myLiveStateRef.current;
    if (!cur || cur.alive === false || !typedDraft) return;
    const task = cur.queue && cur.queue[0];
    if (!task) return;
    const answers = expectedAnswers(task);
    const expected = answers[cur.progress];
    const typed = parseInt(typedDraft, 10);
    if (typed === expected) {
      const isLast = cur.progress + 1 >= answers.length;
      setTypedDraft("");
      if (isLast) completeCurrentTask(cur);
      else setMyStateNow({ ...cur, progress: cur.progress + 1 });
    } else {
      setTypedDraft("");
      registerWrong();
    }
  };

  const tapCell = (idx) => {
    if (locked) return;
    const cur = myLiveStateRef.current;
    if (!cur || cur.alive === false) return;
    const task = cur.queue && cur.queue[0];
    if (!task || task.type !== "grid") return;
    const answers = expectedAnswers(task);
    const expected = answers[cur.progress];
    const value = task.numbers[idx];
    if (value !== expected) {
      registerWrong();
      return;
    }
    const isLast = cur.progress + 1 >= answers.length;
    if (isLast) completeCurrentTask(cur);
    else setMyStateNow({ ...cur, progress: cur.progress + 1 });
  };

  return (
    <Screen
      homeConfirm="¿Salir? Perdés tu progreso de esta partida."
      style={myState && myState.queue && myState.queue[0] && myState.queue[0].type === "grid" ? { justifyContent: "center" } : undefined}
    >
      <Title size={22}>Sala {room.code}</Title>
      <PlayerBadgeRow players={players} playerStates={playerStates} myId={myId} />

      {!iAmAlive ? (
        <Card style={{ width: "100%", maxWidth: 420, textAlign: "center" }}>
          <div style={{ fontSize: 44, marginBottom: 8 }}>💀</div>
          <Title size={20}>Fuiste eliminado/a</Title>
          <Sub style={{ marginBottom: 0 }}>Mirá cómo sigue la partida arriba.</Sub>
        </Card>
      ) : myState && myState.queue && myState.queue.length > 0 ? (
        myState.queue[0].type === "grid" ? (
          <>
            <GridInstruction />
            <GridBoard task={myState.queue[0]} progress={myState.progress} onTap={tapCell} shake={wrongFlash} locked={locked} />
            {locked && <PenaltyNotice />}
          </>
        ) : (
          <>
            <Sub style={{ marginTop: -6 }}>
              Contá de <b style={{ color: "#FFD23F" }}>{myState.queue[0].step}</b> en {myState.queue[0].step}
            </Sub>
            <SequenceTrail step={myState.queue[0].step} progress={myState.progress} />
            <input
              value={typedDraft}
              onChange={(e) => setTypedDraft(e.target.value.replace(/[^0-9]/g, ""))}
              onKeyDown={(e) => e.key === "Enter" && submitDigit()}
              inputMode="numeric"
              placeholder="?"
              disabled={locked}
              style={{
                ...inputStyle,
                maxWidth: 300,
                textAlign: "center",
                fontSize: 28,
                fontWeight: 800,
                fontFamily: "'Baloo 2', sans-serif",
                border: wrongFlash ? "2px solid #FF5D7A" : inputStyle.border,
                opacity: locked ? 0.55 : 1,
              }}
            />
            <NumericKeypad draft={typedDraft} setDraft={setTypedDraft} onEnter={submitDigit} disabled={locked} />
            {locked && <PenaltyNotice />}
          </>
        )
      ) : (
        <Sub>Esperando la próxima tarea...</Sub>
      )}

      {showTargetPicker && (
        <TargetPicker
          players={players}
          playerStates={playerStates}
          myId={myId}
          myLastAttacked={myState ? myState.lastAttacked : null}
          isJoker={isJoker}
          onAttack={performAttack}
        />
      )}

      <BigButton
        onClick={leaveRoom}
        color="transparent"
        style={{ boxShadow: "none", color: "#C9B8F0", marginTop: 20 }}
      >
        Salir de la sala
      </BigButton>
    </Screen>
  );
}

function App() {
  useInjectFont();
  const [mode, setMode] = useState("home");
  const [roomCode, setRoomCode] = useState(null);
  const [myId, setMyId] = useState(null);

  if (mode === "home") return <Home onSelect={setMode} />;
  if (mode === "practice") return <PracticeGame onBack={() => setMode("home")} />;
  if (mode === "game" && roomCode && myId) {
    return (
      <GameRoom
        roomCode={roomCode}
        myId={myId}
        onBack={() => {
          setRoomCode(null);
          setMyId(null);
          setMode("home");
        }}
      />
    );
  }
  return (
    <JoinScreen
      onJoined={(code, id) => {
        setRoomCode(code);
        setMyId(id);
      }}
      onBack={() => setMode("home")}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
