<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Juegos de JX</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Juegos JX" />
<meta name="theme-color" content="#1B1035" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: radial-gradient(circle at 20% -10%, #3a2166 0%, #170b2e 45%, #0c0620 100%);
    font-family: 'Nunito', sans-serif;
    color: #F3EEFF;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 20px 40px;
  }

  /* ---------- Portada estilo "mapa" SNES: cielo + sol + nubes + piso
     Mode 7 (el efecto de perspectiva/rotación de Super Mario World) ---------- */
  .hero {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 220px;
    border-radius: 26px;
    overflow: hidden;
    margin-bottom: 22px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(255,255,255,0.1);
    isolation: isolate;
  }
  .hero-sky {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #241249 0%, #5a2c86 32%, #b8478f 60%, #ef7a4f 82%, #ffcf6b 100%);
  }
  .hero-sun {
    position: absolute;
    left: 50%; top: 26px;
    width: 76px; height: 76px;
    margin-left: -38px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff8d8, #ffd23f 55%, #ff9a1c 100%);
    box-shadow: 0 0 46px 12px rgba(255, 199, 82, 0.55);
    animation: sun-pulse 3.2s ease-in-out infinite;
  }
  @keyframes sun-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .hero-clouds { position: absolute; inset: 0; overflow: hidden; }
  .cloud {
    position: absolute;
    font-size: 30px;
    opacity: 0.92;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,0.18));
    animation: drift linear infinite;
  }
  .cloud.c1 { top: 18px;  font-size: 32px; animation-duration: 16s; }
  .cloud.c2 { top: 46px;  font-size: 22px; animation-duration: 24s; animation-delay: -7s; }
  .cloud.c3 { top: 8px;   font-size: 18px; animation-duration: 20s; animation-delay: -13s; }
  @keyframes drift {
    from { transform: translateX(120px); }
    to   { transform: translateX(-420px); }
  }
  .hero-floor {
    position: absolute;
    left: -70%; right: -70%; bottom: -6%;
    height: 58%;
    background-color: #3a1665;
    background-image:
      linear-gradient(90deg, rgba(255,255,255,0.16) 50%, transparent 50%),
      linear-gradient(rgba(255,255,255,0.16) 50%, transparent 50%);
    background-size: 56px 56px;
    transform: perspective(200px) rotateX(58deg);
    transform-origin: bottom;
    animation: floor-move 1.1s linear infinite;
  }
  @keyframes floor-move {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 56px 0, 0 56px; }
  }
  .hero-fade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(36,18,73,0) 55%, rgba(12,6,32,0.55) 100%);
  }
  .hero-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .hero-emoji {
    font-size: 40px;
    animation: pop-in 0.5s cubic-bezier(.34,1.56,.64,1) both;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
  }
  .hero-content h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 30px;
    margin: 4px 0 0;
    text-align: center;
    color: #FFD23F;
    -webkit-text-stroke: 1.5px #7a2a5c;
    text-shadow:
      0 2px 0 #7a2a5c,
      0 4px 0 #5c1f45,
      0 10px 16px rgba(0,0,0,0.45);
    letter-spacing: 0.5px;
    animation: pop-in 0.6s 0.08s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(14px) scale(0.85); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-sun, .cloud, .hero-floor, .hero-emoji, .hero-content h1 { animation: none; }
  }

  .counter {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 30px;
    padding: 8px 18px;
    margin: 0 0 22px;
    font-size: 14px;
    color: #C9B8F0;
    font-weight: 700;
  }
  .counter b { color: #FFD23F; font-family: 'Baloo 2', sans-serif; }

  .card {
    width: 100%; max-width: 380px;
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 14px;
    text-decoration: none;
    color: inherit;
    opacity: 0;
    transform: translateY(10px);
    animation: card-in 0.5s ease both;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.11s; }
  .card:nth-child(3) { animation-delay: 0.17s; }
  .card:nth-child(4) { animation-delay: 0.23s; }
  .card:nth-child(5) { animation-delay: 0.29s; }
  .card:nth-child(6) { animation-delay: 0.35s; }
  @keyframes card-in {
    to { opacity: 1; transform: translateY(0); }
  }
  .card:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,210,63,0.4);
    transform: translateY(-2px);
  }
  .card:active { transform: translateY(1px) scale(0.99); }
  .card.disabled { opacity: 0.45; pointer-events: none; }
  .emoji { font-size: 34px; transition: transform 0.15s ease; }
  .card:hover .emoji { transform: scale(1.12) rotate(-4deg); }
  .name { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; color: #F3EEFF; }
  .tag { font-size: 12px; color: #C9B8F0; }
  @media (prefers-reduced-motion: reduce) {
    .card { opacity: 1; transform: none; animation: none; }
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="hero-sky"></div>
    <div class="hero-sun"></div>
    <div class="hero-clouds">
      <span class="cloud c1">☁️</span>
      <span class="cloud c2">☁️</span>
      <span class="cloud c3">☁️</span>
    </div>
    <div class="hero-floor"></div>
    <div class="hero-fade"></div>
    <div class="hero-content">
      <div class="hero-emoji">🎉</div>
      <h1>Juegos de JX</h1>
    </div>
  </div>
  <div class="counter" id="playerCounter"></div>

  <a class="card" href="./quien-soy/">
    <div class="emoji">🕵️‍♂️</div>
    <div>
      <div class="name">¿Quién Soy?</div>
      <div class="tag">Adiviná con emojis</div>
    </div>
  </a>

  <a class="card" href="./impostor/">
    <div class="emoji">🎭</div>
    <div>
      <div class="name">El Impostor</div>
      <div class="tag">Encontrá al impostor</div>
    </div>
  </a>

  <a class="card" href="./emoji/">
    <div class="emoji">😂</div>
    <div>
      <div class="name">Adiviná el Emoji</div>
      <div class="tag">Actuá con emojis</div>
    </div>
  </a>

  <a class="card" href="./parejas/">
    <div class="emoji">💞</div>
    <div>
      <div class="name">Parejas Actuales</div>
      <div class="tag">¿Qué haría mi pareja?</div>
    </div>
  </a>

  <a class="card" href="./secuencias/">
    <div class="emoji">🧮</div>
    <div>
      <div class="name">Secuencias en Cadena</div>
      <div class="tag">Contá, atacá, sobreviví</div>
    </div>
  </a>

  <a class="card" href="./bloques/">
    <div class="emoji">🧱</div>
    <div>
      <div class="name">Bloques en Cadena</div>
      <div class="tag">Limpiá colores, atacá y llegá a la final</div>
    </div>
  </a>

  <script src="./storage.js"></script>
  <script>
    (async function () {
      try {
        const total = await window.storage.getCounter("players");
        const el = document.getElementById("playerCounter");
        if (el && total > 0) {
          el.innerHTML = "🎮 <b>" + total.toLocaleString("es-AR") + "</b> jugadores entraron a jugar";
          el.style.display = "flex";
        }
      } catch (e) {
        // sin contador visible, no molesta a nadie
      }
    })();
  </script>
</body>
</html>
