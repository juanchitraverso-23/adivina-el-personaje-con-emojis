<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Juegos de JX</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Juegos JX" />
<meta name="theme-color" content="#1B1035" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: #0c0620;
    font-family: 'Nunito', sans-serif;
    color: #F3EEFF;
  }

  /* ---------- Portada estilo "mapa" SNES a pantalla completa: cielo + sol
     + nubes + piso Mode 7 (el efecto de perspectiva/rotación de Super
     Mario World), fija detrás de todo el contenido mientras se scrollea. ---------- */
  .bg-scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-sky {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #241249 0%, #4a2478 20%, #7a3390 42%, #c85a86 62%, #ef7a4f 80%, #ffcf6b 100%);
  }
  .bg-sun {
    position: absolute;
    left: 50%; top: 7%;
    width: 120px; height: 120px;
    margin-left: -60px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff8d8, #ffd23f 55%, #ff9a1c 100%);
    box-shadow: 0 0 80px 22px rgba(255, 199, 82, 0.5);
    animation: sun-pulse 3.2s ease-in-out infinite;
  }
  @keyframes sun-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .bg-clouds { position: absolute; inset: 0; overflow: hidden; }
  .cloud {
    position: absolute;
    font-size: 30px;
    opacity: 0.92;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,0.18));
    animation: drift linear infinite;
  }
  .cloud.c1 { top: 12%; font-size: 56px; animation-duration: 26s; }
  .cloud.c2 { top: 24%; font-size: 34px; animation-duration: 34s; animation-delay: -11s; }
  .cloud.c3 { top: 6%;  font-size: 26px; animation-duration: 30s; animation-delay: -21s; }
  .cloud.c4 { top: 33%; font-size: 42px; animation-duration: 40s; animation-delay: -6s; }
  @keyframes drift {
    from { transform: translateX(115vw); }
    to   { transform: translateX(-45vw); }
  }
  .bg-floor {
    position: absolute;
    left: -70%; right: -70%; bottom: -4%;
    height: 36vh;
    background-color: #3a1665;
    background-image:
      linear-gradient(90deg, rgba(255,255,255,0.16) 50%, transparent 50%),
      linear-gradient(rgba(255,255,255,0.16) 50%, transparent 50%);
    background-size: 64px 64px;
    transform: perspective(280px) rotateX(58deg);
    transform-origin: bottom;
    animation: floor-move 1.1s linear infinite;
  }
  @keyframes floor-move {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 64px 0, 0 64px; }
  }
  .bg-fade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(12,6,32,0) 0%, rgba(12,6,32,0.15) 40%, rgba(12,6,32,0.55) 70%, rgba(12,6,32,0.85) 100%);
  }
  @media (prefers-reduced-motion: reduce) {
    .bg-sun, .cloud, .bg-floor { animation: none; }
  }

  /* ---------- Contenido, por encima del fondo fijo ---------- */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 34px 20px 40px;
  }
  .title-row {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 18px;
  }
  .title-emoji {
    font-size: 44px;
    animation: pop-in 0.5s cubic-bezier(.34,1.56,.64,1) both;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 34px;
    margin: 4px 0 0;
    text-align: center;
    color: #FFD23F;
    -webkit-text-stroke: 1.5px #7a2a5c;
    text-shadow:
      0 2px 0 #7a2a5c,
      0 4px 0 #5c1f45,
      0 12px 20px rgba(0,0,0,0.5);
    letter-spacing: 0.5px;
    animation: pop-in 0.6s 0.08s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(14px) scale(0.85); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .title-emoji, h1 { animation: none; }
  }

  .counter {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(12,6,32,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 30px;
    padding: 8px 18px;
    margin: 0 0 22px;
    font-size: 14px;
    color: #C9B8F0;
    font-weight: 700;
  }
  .counter b { color: #FFD23F; font-family: 'Baloo 2', sans-serif; }

  .card {
    width: 100%; max-width: 380px;
    display: flex; align-items: center; gap: 14px;
    background: rgba(12,6,32,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 14px;
    text-decoration: none;
    color: inherit;
    opacity: 0;
    transform: translateY(10px);
    animation: card-in 0.5s ease both;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.11s; }
  .card:nth-child(3) { animation-delay: 0.17s; }
  .card:nth-child(4) { animation-delay: 0.23s; }
  .card:nth-child(5) { animation-delay: 0.29s; }
  .card:nth-child(6) { animation-delay: 0.35s; }
  @keyframes card-in {
    to { opacity: 1; transform: translateY(0); }
  }
  .card:hover {
    background: rgba(20,10,48,0.7);
    border-color: rgba(255,210,63,0.5);
    transform: translateY(-2px);
  }
  .card:active { transform: translateY(1px) scale(0.99); }
  .card.disabled { opacity: 0.45; pointer-events: none; }
  .emoji { font-size: 34px; transition: transform 0.15s ease; }
  .card:hover .emoji { transform: scale(1.12) rotate(-4deg); }
  .name { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; color: #F3EEFF; }
  .tag { font-size: 12px; color: #C9B8F0; }
  @media (prefers-reduced-motion: reduce) {
    .card { opacity: 1; transform: none; animation: none; }
  }
</style>
</head>
<body>
  <div class="bg-scene">
    <div class="bg-sky"></div>
    <div class="bg-sun"></div>
    <div class="bg-clouds">
      <span class="cloud c1">☁️</span>
      <span class="cloud c2">☁️</span>
      <span class="cloud c3">☁️</span>
      <span class="cloud c4">☁️</span>
    </div>
    <div class="bg-floor"></div>
    <div class="bg-fade"></div>
  </div>

  <div class="page">
    <div class="title-row">
      <div class="title-emoji">🎉</div>
      <h1>Juegos de JX</h1>
    </div>
    <div class="counter" id="playerCounter"></div>

    <a class="card" href="./quien-soy/">
      <div class="emoji">🕵️‍♂️</div>
      <div>
        <div class="name">¿Quién Soy?</div>
        <div class="tag">Adiviná con emojis</div>
      </div>
    </a>

    <a class="card" href="./impostor/">
      <div class="emoji">🎭</div>
      <div>
        <div class="name">El Impostor</div>
        <div class="tag">Encontrá al impostor</div>
      </div>
    </a>

    <a class="card" href="./emoji/">
      <div class="emoji">😂</div>
      <div>
        <div class="name">Adiviná el Emoji</div>
        <div class="tag">Actuá con emojis</div>
      </div>
    </a>

    <a class="card" href="./parejas/">
      <div class="emoji">💞</div>
      <div>
        <div class="name">Parejas Actuales</div>
        <div class="tag">¿Qué haría mi pareja?</div>
      </div>
    </a>

    <a class="card" href="./secuencias/">
      <div class="emoji">🧮</div>
      <div>
        <div class="name">Secuencias en Cadena</div>
        <div class="tag">Contá, atacá, sobreviví</div>
      </div>
    </a>

    <a class="card" href="./bloques/">
      <div class="emoji">🧱</div>
      <div>
        <div class="name">Bloques en Cadena</div>
        <div class="tag">Limpiá colores, atacá y llegá a la final</div>
      </div>
    </a>
  </div>

  <script src="./storage.js"></script>
  <script>
    (async function () {
      try {
        const total = await window.storage.getCounter("players");
        const el = document.getElementById("playerCounter");
        if (el && total > 0) {
          el.innerHTML = "🎮 <b>" + total.toLocaleString("es-AR") + "</b> jugadores entraron a jugar";
          el.style.display = "flex";
        }
      } catch (e) {
        // sin contador visible, no molesta a nadie
      }
    })();
  </script>
</body>
</html>
