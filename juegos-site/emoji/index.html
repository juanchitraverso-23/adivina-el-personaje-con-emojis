function randomId() {
  return Math.random().toString(36).slice(2, 10);
}
function randomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function pickRandom(arr, exclude = []) {
  const pool = arr.filter((x) => !exclude.includes(x));
  const source = pool.length > 0 ? pool : arr;
  return source[Math.floor(Math.random() * source.length)];
}
async function readRoom(code) {
  try {
    const res = await window.storage.get(STORAGE_PREFIX + code, true);
    if (!res) return null;
    return JSON.parse(res.value);
  } catch {
    return null;
  }
}
async function writeRoom(code, room) {
  await window.storage.set(STORAGE_PREFIX + code, JSON.stringify(room), true);
}

function OfflineGame({ onBack }) {
  const [step, setStep] = useState("setup"); // setup | lobby | handoff-actor | preview | acting | handoff-guesser | answering | reveal
  const [nameInput, setNameInput] = useState("");
  const [players, setPlayers] = useState([]);
  const [actorId, setActorId] = useState(null);
  const [emoji, setEmoji] = useState(null);
  const [used, setUsed] = useState([]);
  const [startTime, setStartTime] = useState(null);
  const [now, setNow] = useState(Date.now());
  const [queue, setQueue] = useState([]); // ids de los que faltan adivinar
  const [answers, setAnswers] = useState({}); // playerId -> emoji elegido
  const guardRef = useRef(false);

  useEffect(() => {
    if (step !== "acting") return;
    const id = setInterval(() => setNow(Date.now()), 100);
    return () => clearInterval(id);
  }, [step]);

  const elapsed = startTime ? (now - startTime) / 1000 : 0;
  const remaining = Math.max(0, ROUND_SECONDS - elapsed);

  useEffect(() => {
    if (step !== "acting") {
      guardRef.current = false;
      return;
    }
    if (remaining <= 0 && !guardRef.current) {
      guardRef.current = true;
      setStep(queue.length > 0 ? "handoff-guesser" : "reveal");
    }
  }, [remaining, step, queue.length]);

  const addPlayer = () => {
    const trimmed = nameInput.trim();
    if (!trimmed) return;
    setPlayers((p) => [...p, { id: randomId(), name: trimmed, score: 0 }]);
    setNameInput("");
  };

  const beginGame = () => setStep("lobby");

  const nextRound = () => {
    const nextActor = pickRandom(players.map((p) => p.id), actorId ? [actorId] : []);
    setActorId(nextActor);
    setQueue(players.filter((p) => p.id !== nextActor).map((p) => p.id));
    setAnswers({});
    setStep("handoff-actor");
  };

  const actorReady = () => {
    let pool = used;
    if (pool.length >= ALL_EMOJIS.length) pool = [];
    const e = pickRandom(ALL_EMOJIS, pool);
    setUsed([...pool, e]);
    setEmoji(e);
    setStep("preview");
  };

  const startTimer = () => {
    setStartTime(Date.now());
    setStep("acting");
  };

  const guesserReady = () => setStep("answering");

  const submitAnswer = (chosenEmoji) => {
    const currentGuesserId = queue[0];
    setAnswers((a) => ({ ...a, [currentGuesserId]: chosenEmoji }));
    const rest = queue.slice(1);
    setQueue(rest);
    setStep(rest.length > 0 ? "handoff-guesser" : "reveal");
  };

  const confirmRound = () => {
    const correctIds = Object.keys(answers).filter((id) => answers[id] === emoji);
    setPlayers((ps) =>
      ps.map((p) => {
        if (correctIds.includes(p.id)) return { ...p, score: p.score + 1 };
        if (p.id === actorId) return { ...p, score: p.score + correctIds.length };
        return p;
      })
    );
    setStep("lobby");
  };

  const resetScores = () => setPlayers((ps) => ps.map((p) => ({ ...p, score: 0 })));

  const nameOf = (id) => players.find((p) => p.id === id)?.name || "";
  const avatarOf = (id) => {
    const i = players.findIndex((p) => p.id === id);
    return AVATARS[i % AVATARS.length];
  };
  const pct = remaining / ROUND_SECONDS;
  const inProgress = step !== "setup" && step !== "lobby";
  const confirmMsg = inProgress ? "¿Salir? Se pierde el progreso de esta partida (pasando el celu)." : undefined;

  return (
    <div className="min-h-screen w-full flex flex-col" style={bgStyle}>
      <HomeButton confirmMessage={confirmMsg} />
      <TopBar title="Un solo celu" onBack={onBack} confirmMessage={confirmMsg} />
      <div className="flex-1 flex flex-col p-5">
        {step === "setup" && (
          <div className="flex-1 flex flex-col">
            <h2 className="font-black text-lg mb-1 text-white">¿Quiénes juegan?</h2>
            <p className="text-sm mb-4" style={{ color: C.textMuted }}>
              Sumá a todos los jugadores. Cada ronda uno actúa y el resto va pasando el celu para responder.
            </p>
            <div className="flex gap-2 mb-3">
              <input
                value={nameInput}
                onChange={(e) => setNameInput(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addPlayer()}
                placeholder="Nombre del jugador"
                className="flex-1 rounded-xl px-4 py-3 font-semibold outline-none"
                style={{ backgroundColor: C.inputBg, color: C.textDark }}
                maxLength={16}
              />
              <button onClick={addPlayer} className="rounded-xl px-4 font-black" style={{ backgroundColor: C.gold, color: C.textDark }}>
                +
              </button>
            </div>
            <div className="flex-1 space-y-2 overflow-y-auto mb-4">
              {players.map((p, i) => (
                <div key={p.id} className="flex items-center justify-between rounded-2xl px-4 py-3" style={{ backgroundColor: C.card, border: `1px solid ${C.cardBorder}` }}>
                  <span className="font-bold text-white">
                    {AVATARS[i % AVATARS.length]} {p.name}
                  </span>
                  <button onClick={() => setPlayers((ps) => ps.filter((x) => x.id !== p.id))} className="text-sm font-bold" style={{ color: C.pinkSoft }}>
                    Quitar
                  </button>
                </div>
              ))}
            </div>
            {players.length < 2 && (
              <p className="text-center text-sm mb-3" style={{ color: C.textMuted }}>
                Necesitás al menos 2 jugadores.
              </p>
            )}
            <PrimaryButton onClick={beginGame} disabled={players.length < 2}>
              <Icon name="Sparkles" size={20} /> Empezar
            </PrimaryButton>
          </div>
        )}

        {step === "lobby" && (
          <div className="flex-1 flex flex-col items-center justify-center text-center gap-6">
            {players.some((p) => p.score > 0) && (
              <div className="w-full max-w-xs space-y-1.5 mb-2">
                {[...players].sort((a, b) => b.score - a.score).map((p, i) => (
                  <div key={p.id} className="flex items-center justify-between rounded-xl px-3 py-2 text-sm" style={{ backgroundColor: C.card }}>
                    <span className="font-bold flex items-center gap-1.5 text-white">
                      {avatarOf(p.id)} {p.name} {i === 0 && p.score > 0 && <Icon name="Trophy" size={13} style={{ color: C.gold }} />}
                    </span>
                    <span className="font-black" style={{ color: C.gold }}>
                      {p.score}
                    </span>
                  </div>
                ))}
              </div>
            )}
            <div className="text-6xl">🎲</div>
            <h2 className="text-2xl font-black text-white">¿Listos para la ronda?</h2>
            <button
              onClick={nextRound}
              className="rounded-2xl px-10 py-4 font-black text-xl transition active:scale-95 flex items-center gap-2"
              style={{ backgroundColor: C.gold, color: C.textDark }}
            >
              <Icon name="Shuffle" size={20} /> Siguiente ronda
            </button>
            {players.some((p) => p.score > 0) && (
              <button onClick={resetScores} className="rounded-2xl px-6 py-2.5 font-bold text-sm flex items-center justify-center gap-2" style={{ backgroundColor: "rgba(255,255,255,0.05)", color: C.textMuted }}>
                <Icon name="RefreshCw" size={14} /> Reiniciar puntajes
              </button>
            )}
          </div>
        )}

        {step === "handoff-actor" && (
          <HandoffScreen playerName={nameOf(actorId)} subtitle="Te toca actuar. Cuando lo tengas en tus manos, tocá listo." onReady={actorReady} />
        )}

        {step === "preview" && (
          <div className="flex-1 flex flex-col items-center justify-center gap-6 text-center">
            <p className="text-sm" style={{ color: C.textMuted }}>
              Solo vos lo ves. Cuando estés listo, arrancá el cronómetro.
            </p>
            <div className="leading-none select-none" style={{ fontSize: "min(45vw, 220px)" }}>
              {emoji}
            </div>
            <button onClick={startTimer} className="rounded-2xl px-10 py-4 font-black text-xl transition active:scale-95" style={{ backgroundColor: C.gold, color: C.textDark }}>
              OK, ¡empezar!
            </button>
          </div>
        )}

        {step === "acting" && (
          <div className="flex-1 flex flex-col items-center justify-center gap-8 text-center">
            <div className="text-6xl">🤫</div>
            <p className="text-sm" style={{ color: C.textMuted }}>
              Ya no se muestra el emoji: mostrale esta pantalla a todos para que vean el tiempo
            </p>
            <TimerBar pct={pct} remaining={remaining} />
          </div>
        )}

        {step === "handoff-guesser" && (
          <HandoffScreen
            playerName={nameOf(queue[0])}
            subtitle={`¿Qué actuó ${nameOf(actorId)}? Elegí tu respuesta.`}
            onReady={guesserReady}
          />
        )}

        {step === "answering" && (
          <div className="flex flex-col h-full -mx-5">
            <div className="px-5 pb-2">
              <p className="text-center text-sm" style={{ color: C.textMuted }}>
                <span className="font-bold text-white">{nameOf(queue[0])}</span>, tocá el emoji que actuó {nameOf(actorId)}
              </p>
            </div>
            <EmojiGrid onPick={submitAnswer} />
          </div>
        )}

        {step === "reveal" && (
          <div className="flex flex-col h-full">
            <h2 className="text-2xl font-black text-center mb-1 text-white">¡Era esto!</h2>
            <div className="text-center leading-none select-none mb-4" style={{ fontSize: "5rem" }}>
              {emoji}
            </div>
            <div className="flex-1 space-y-2 overflow-y-auto mb-4">
              <div className="flex items-center justify-between rounded-2xl px-4 py-3" style={{ backgroundColor: C.card, border: `1px solid ${C.cardBorder}` }}>
                <span className="font-bold text-white">{avatarOf(actorId)} {nameOf(actorId)} (actuó)</span>
              </div>
              {Object.keys(answers).map((id) => {
                const correct = answers[id] === emoji;
                return (
                  <div
                    key={id}
                    className="flex items-center justify-between rounded-2xl px-4 py-3"
                    style={{ backgroundColor: correct ? "rgba(0,212,184,0.2)" : "rgba(255,46,136,0.12)", border: `1px solid ${correct ? C.teal : "rgba(255,46,136,0.4)"}` }}
                  >
                    <span className="font-bold text-white">
                      {avatarOf(id)} {nameOf(id)}
                    </span>
                    <span className="flex items-center gap-2">
                      <span className="text-xl">{answers[id]}</span>
                      {correct ? <Icon name="Check" size={18} style={{ color: C.teal }} /> : <span style={{ color: C.pinkSoft }}>✕</span>}
                    </span>
                  </div>
                );
              })}
            </div>
            <PrimaryButton onClick={confirmRound}>Continuar</PrimaryButton>
          </div>
        )}
      </div>
    </div>
  );
}

// ==================== ONLINE: VARIOS CELULARES (SALA COMPARTIDA) ====================

function OnlineGame({ onBack }) {
  const [screen, setScreen] = useState("join");
  const [name, setName] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [joinError, setJoinError] = useState("");
  const [joining, setJoining] = useState(false);

  const [roomCode, setRoomCode] = useState(null);
  const [playerId, setPlayerId] = useState(null);
  const [room, setRoom] = useState(null);
  const [copied, setCopied] = useState(false);

  const [now, setNow] = useState(Date.now());
  const [checked, setChecked] = useState({});
  const [openRooms, setOpenRooms] = useState([]);
  const transitionGuard = useRef(false);

  // Salas abiertas: se listan solo mientras estamos en la pantalla de unirse,
  // para no seguir gastando pedidos una vez adentro de una sala.
  useEffect(() => {
    if (screen !== "join") return;
    let cancelled = false;
    const tick = async () => {
      try {
        const entries = await window.storage.list(STORAGE_PREFIX);
        if (cancelled) return;
        const rooms = entries
          .map((e) => {
            try {
              return JSON.parse(e.value);
            } catch {
              return null;
            }
          })
          .filter((r) => r && r.phase === "lobby" && Date.now() - (r.createdAt || 0) < 3 * 60 * 60 * 1000)
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        setOpenRooms(rooms);
      } catch {
        // sin salas visibles, no molesta al jugador con un error acá
      }
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, [screen]);

  const quickJoin = async (code) => {
    setCodeInput(code);
    const trimmedName = name.trim();
    if (!trimmedName) {
      setJoinError("Poné tu nombre primero.");
      return;
    }
    setJoining(true);
    setJoinError("");
    try {
      let existing = await readRoom(code);
      if (!existing) {
        setJoinError("Esa sala ya no está disponible.");
        return;
      }
      if (existing.players.some((p) => p.name.toLowerCase() === trimmedName.toLowerCase())) {
        setJoinError("Ese nombre ya está en uso en esta sala. Probá otro.");
        return;
      }
      const id = randomId();
      const avatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
      existing.players.push({ id, name: trimmedName, avatar, score: 0 });
      await writeRoom(code, existing);
      localStorage.setItem(SESSION_KEY, JSON.stringify({ code, playerId: id, name: trimmedName }));
      setRoom(existing);
      setRoomCode(code);
      setPlayerId(id);
      setScreen("game");
    } catch (e) {
      setJoinError("No se pudo conectar a la sala. Probá de nuevo.");
    } finally {
      setJoining(false);
    }
  };

  // Sesión guardada: si volviste al menú por error (o cerraste la pestaña),
  // acá se ofrece retomar la sala en la que estabas sin volver a unirte.
  const [resumable, setResumable] = useState(null);
  useEffect(() => {
    if (screen !== "join") return;
    let cancelled = false;
    (async () => {
      let saved;
      try {
        saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      } catch {
        saved = null;
      }
      if (!saved || !saved.code || !saved.playerId) {
        setResumable(null);
        return;
      }
      const existing = await readRoom(saved.code);
      if (cancelled) return;
      if (existing && existing.players.some((p) => p.id === saved.playerId)) {
        setResumable(saved);
      } else {
        localStorage.removeItem(SESSION_KEY);
        setResumable(null);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [screen]);

  const resumeSession = async () => {
    if (!resumable) return;
    const existing = await readRoom(resumable.code);
    if (!existing) {
      localStorage.removeItem(SESSION_KEY);
      setResumable(null);
      return;
    }
    setRoom(existing);
    setRoomCode(resumable.code);
    setPlayerId(resumable.playerId);
    setScreen("game");
  };

  const leaveRoom = () => {
    localStorage.removeItem(SESSION_KEY);
    onBack();
  };

  useEffect(() => {
    if (!roomCode) return;
    let cancelled = false;
    const tick = async () => {
      const r = await readRoom(roomCode);
      if (!cancelled && r) setRoom(r);
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, [roomCode]);

  useEffect(() => {
    if (!room || room.phase !== "acting") return;
    const id = setInterval(() => setNow(Date.now()), 100);
    return () => clearInterval(id);
  }, [room?.phase, room?.roundStartTime]);

  const me = room?.players?.find((p) => p.id === playerId) || null;
  const actor = room?.players?.find((p) => p.id === room?.actorId) || null;
  const isActor = room?.actorId === playerId;

  const elapsed = room?.roundStartTime ? (now - room.roundStartTime) / 1000 : 0;
  const remaining = Math.max(0, ROUND_SECONDS - elapsed);

  useEffect(() => {
    if (!room || room.phase !== "acting") {
      transitionGuard.current = false;
      return;
    }
    if (remaining <= 0 && !transitionGuard.current) {
      transitionGuard.current = true;
      (async () => {
        const fresh = await readRoom(roomCode);
        if (fresh && fresh.phase === "acting") {
          fresh.phase = "scoring";
          await writeRoom(roomCode, fresh);
          setRoom(fresh);
        }
      })();
    }
  }, [remaining, room, roomCode]);

  const handleJoin = async () => {
    const trimmedName = name.trim();
    if (!trimmedName) {
      setJoinError("Poné tu nombre.");
      return;
    }
    setJoining(true);
    setJoinError("");
    try {
      const code = codeInput.trim() ? codeInput.trim().toUpperCase() : randomCode();
      let existing = await readRoom(code);
      const id = randomId();
      const avatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];

      if (!existing) {
        existing = {
          code,
          players: [{ id, name: trimmedName, avatar, score: 0 }],
          phase: "lobby",
          actorId: null,
          emoji: null,
          roundStartTime: null,
          usedEmojis: [],
          createdAt: Date.now(),
        };
      } else {
        if (existing.players.some((p) => p.name.toLowerCase() === trimmedName.toLowerCase())) {
          setJoinError("Ese nombre ya está en uso en esta sala. Probá otro.");
          setJoining(false);
          return;
        }
        existing.players.push({ id, name: trimmedName, avatar, score: 0 });
      }
      await writeRoom(code, existing);
      localStorage.setItem(SESSION_KEY, JSON.stringify({ code, playerId: id, name: trimmedName }));
      setRoom(existing);
      setRoomCode(code);
      setPlayerId(id);
      setScreen("game");
    } catch (e) {
      setJoinError("No se pudo conectar a la sala. Probá de nuevo.");
    } finally {
      setJoining(false);
    }
  };

  const startRound = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh || fresh.players.length < 2) return;
    const nextActor = pickRandom(
      fresh.players.map((p) => p.id),
      fresh.actorId ? [fresh.actorId] : []
    );
    fresh.phase = "ready";
    fresh.actorId = nextActor;
    fresh.emoji = null;
    fresh.roundStartTime = null;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const revealEmoji = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    let used = fresh.usedEmojis || [];
    if (used.length >= ALL_EMOJIS.length) used = [];
    const emoji = pickRandom(ALL_EMOJIS, used);
    fresh.emoji = emoji;
    fresh.usedEmojis = [...used, emoji];
    fresh.phase = "preview";
    fresh.roundStartTime = null;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const startTimer = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.phase = "acting";
    fresh.roundStartTime = Date.now();
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const confirmScores = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    const guesserIds = Object.keys(checked).filter((id) => checked[id]);
    fresh.players = fresh.players.map((p) => {
      if (guesserIds.includes(p.id)) return { ...p, score: p.score + 1 };
      if (p.id === fresh.actorId) return { ...p, score: p.score + guesserIds.length };
      return p;
    });
    fresh.phase = "lobby";
    fresh.actorId = null;
    fresh.emoji = null;
    fresh.roundStartTime = null;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setChecked({});
  };

  const resetScores = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.players = fresh.players.map((p) => ({ ...p, score: 0 }));
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const copyCode = () => {
    if (!roomCode) return;
    navigator.clipboard?.writeText(roomCode).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  if (screen === "join") {
    return (
      <div className="min-h-screen w-full flex items-center justify-center p-6" style={bgStyle}>
        <HomeButton />
        <div className="w-full max-w-sm">
          <button onClick={onBack} className="flex items-center gap-1.5 font-bold text-sm mb-6" style={{ color: C.textMuted }}>
            <Icon name="ArrowLeft" size={16} /> Volver
          </button>
          <div className="text-center mb-8">
            <div className="text-6xl mb-2">🌐</div>
            <h1 className="text-3xl font-black tracking-tight text-white">Jugar en varios celus</h1>
            <p className="mt-2 text-sm" style={{ color: C.textMuted }}>
              Actuá el emoji gigante antes de que se acabe el tiempo
            </p>
          </div>

          {resumable && (
            <button
              onClick={resumeSession}
              className="w-full text-left rounded-2xl p-4 mb-4 transition active:scale-95"
              style={{ backgroundColor: "rgba(255,183,3,0.18)", border: `1px solid ${C.gold}` }}
            >
              <div className="font-black text-sm" style={{ color: C.gold }}>
                ↩️ Volver a tu sala ({resumable.code})
              </div>
              <div className="text-xs mt-0.5" style={{ color: C.textMuted }}>
                Eras {resumable.name} — seguís ahí adentro
              </div>
            </button>
          )}

          <div className="rounded-3xl p-6" style={{ backgroundColor: C.card, border: `1px solid ${C.cardBorder}` }}>
            <label className="block text-xs font-bold uppercase tracking-wider mb-1" style={{ color: C.textMuted }}>
              Tu nombre
            </label>
            <input
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="Ej: Juanchi"
              className="w-full rounded-xl px-4 py-3 mb-4 font-semibold outline-none"
              style={{ backgroundColor: C.inputBg, color: C.textDark }}
              maxLength={16}
            />
            <label className="block text-xs font-bold uppercase tracking-wider mb-1" style={{ color: C.textMuted }}>
              Código de sala
            </label>
            <input
              value={codeInput}
              onChange={(e) => setCodeInput(e.target.value.toUpperCase())}
              placeholder="Dejalo vacío para crear una sala"
              className="w-full rounded-xl px-4 py-3 mb-1 font-semibold tracking-widest outline-none"
              style={{ backgroundColor: C.inputBg, color: C.textDark }}
              maxLength={4}
            />
            <p className="text-xs mb-4" style={{ color: C.textFaint }}>
              Si ya tenés un código de un amigo, ponelo acá para unirte a su sala.
            </p>

            {joinError && (
              <p className="text-sm mb-3 font-medium" style={{ color: C.pinkSoft }}>
                {joinError}
              </p>
            )}

            <PrimaryButton onClick={handleJoin} disabled={joining}>
              {joining ? "Entrando..." : codeInput.trim() ? "Unirme a la sala" : "Crear sala y jugar"}
            </PrimaryButton>
          </div>

          {openRooms.length > 0 && (
            <div className="mt-6">
              <p className="text-xs font-bold uppercase tracking-wider mb-2" style={{ color: C.textMuted }}>
                Salas abiertas ahora
              </p>
              <div className="space-y-2">
                {openRooms.map((r) => (
                  <button
                    key={r.code}
                    onClick={() => quickJoin(r.code)}
                    disabled={joining}
                    className="w-full flex items-center justify-between rounded-2xl px-4 py-3 text-left transition active:scale-95 disabled:opacity-40"
                    style={{ backgroundColor: C.card, border: `1px solid ${C.cardBorder}` }}
                  >
                    <span className="flex items-center gap-2 min-w-0">
                      <span className="flex -space-x-1 text-xl shrink-0">
                        {r.players.slice(0, 4).map((p, i) => (
                          <span key={i}>{p.avatar}</span>
                        ))}
                      </span>
                      <span className="font-semibold text-sm text-white truncate">
                        {r.players.map((p) => p.name).join(", ")}
                      </span>
                    </span>
                    <span className="font-black text-xs tracking-widest shrink-0 ml-2" style={{ color: C.gold }}>
                      {r.code}
                    </span>
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  if (!room) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={bgStyle}>
        <HomeButton />
        <p className="text-white">Cargando sala...</p>
      </div>
    );
  }

  const players = room.players || [];
  const sorted = [...players].sort((a, b) => b.score - a.score);

  return (
    <div className="min-h-screen w-full flex flex-col" style={bgStyle}>
      <HomeButton />
      <div className="flex items-center justify-between px-5 py-4" style={{ borderBottom: "1px solid rgba(255,255,255,0.12)" }}>
        <div className="flex items-center gap-2 pl-11">
          <span className="text-2xl">{me?.avatar}</span>
          <span className="font-bold text-white">{me?.name}</span>
        </div>
        <button onClick={copyCode} className="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-bold tracking-widest text-white" style={{ backgroundColor: C.card }}>
          {roomCode} {copied ? <Icon name="Check" size={14} /> : <Icon name="Copy" size={14} />}
        </button>
      </div>
      <div className="px-5 pt-2">
        <button onClick={leaveRoom} className="text-xs font-bold" style={{ color: C.textMuted }}>
          Salir de la sala
        </button>
      </div>

      <div className="flex-1 flex flex-col p-5">
        {room.phase === "lobby" && <LobbyView players={sorted} onStart={startRound} onReset={resetScores} />}
        {room.phase === "ready" && <ReadyView isActor={isActor} actor={actor} onBegin={revealEmoji} />}
        {room.phase === "preview" && <PreviewView isActor={isActor} actor={actor} emoji={room.emoji} onStartTimer={startTimer} />}
        {room.phase === "acting" && <ActingView isActor={isActor} actor={actor} remaining={remaining} />}
        {room.phase === "scoring" && (
          <ScoringView isActor={isActor} actor={actor} players={players} checked={checked} setChecked={setChecked} onConfirm={confirmScores} />
        )}
      </div>
    </div>
  );
}

function LobbyView({ players, onStart, onReset }) {
  const canStart = players.length >= 2;
  const maxScore = players.length ? Math.max(...players.map((p) => p.score)) : 0;
  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-2 mb-3">
        <Icon name="Users" size={18} style={{ color: C.gold }} />
        <h2 className="font-black text-lg text-white">Jugadores ({players.length})</h2>
      </div>
      <div className="flex-1 space-y-2 overflow-y-auto mb-4">
        {players.map((p) => (
          <div key={p.id} className="flex items-center justify-between rounded-2xl px-4 py-3" style={{ backgroundColor: C.card, border: `1px solid ${C.cardBorder}` }}>
            <div className="flex items-center gap-3">
              <span className="text-2xl">{p.avatar}</span>
              <span className="font-bold text-white">{p.name}</span>
              {p.score > 0 && p.score === maxScore && <Icon name="Trophy" size={16} style={{ color: C.gold }} />}
            </div>
            <span className="font-black text-lg" style={{ color: C.gold }}>
              {p.score}
            </span>
          </div>
        ))}
      </div>
      {!canStart && (
        <p className="text-center text-sm mb-3" style={{ color: C.textMuted }}>
          Compartí el código de sala para que se sumen. Necesitás al menos 2 jugadores.
        </p>
      )}
      <PrimaryButton onClick={onStart} disabled={!canStart}>
        <Icon name="Sparkles" size={20} /> Siguiente ronda
      </PrimaryButton>
      {players.some((p) => p.score > 0) && (
        <button onClick={onReset} className="w-full mt-3 rounded-2xl py-2.5 font-bold text-sm flex items-center justify-center gap-2" style={{ backgroundColor: "rgba(255,255,255,0.05)", color: C.textMuted }}>
          <Icon name="RefreshCw" size={14} /> Reiniciar puntajes
        </button>
      )}
    </div>
  );
}

function ReadyView({ isActor, actor, onBegin }) {
  if (isActor) {
    return (
      <div className="flex-1 flex flex-col items-center justify-center text-center gap-6">
        <div className="text-7xl">🎭</div>
        <div>
          <h2 className="text-3xl font-black text-white">¡Te toca actuar!</h2>
          <p className="mt-2" style={{ color: C.textMuted }}>
            Te vamos a mostrar tu emoji en privado. Los demás no deben ver tu pantalla.
          </p>
        </div>
        <button onClick={onBegin} className="rounded-2xl px-10 py-4 font-black text-xl transition active:scale-95" style={{ backgroundColor: C.gold, color: C.textDark }}>
          Mostrame el emoji
        </button>
      </div>
    );
  }
  return (
    <div className="flex-1 flex flex-col items-center justify-center text-center gap-4">
      <span className="text-5xl">{actor?.avatar}</span>
      <h2 className="text-2xl font-black text-white">{actor?.name} se está preparando...</h2>
      <p style={{ color: C.textMuted }}>Atenti, en cualquier momento empieza a actuar 👀</p>
    </div>
  );
}

function PreviewView({ isActor, actor, emoji, onStartTimer }) {
  if (isActor) {
    return (
      <div className="flex-1 flex flex-col items-center justify-center gap-6 text-center">
        <p className="text-sm" style={{ color: C.textMuted }}>
          Solo vos lo ves. Cuando estés listo, arrancá el cronómetro.
        </p>
        <div className="leading-none select-none" style={{ fontSize: "min(45vw, 220px)" }}>
          {emoji}
        </div>
        <button onClick={onStartTimer} className="rounded-2xl px-10 py-4 font-black text-xl transition active:scale-95" style={{ backgroundColor: C.gold, color: C.textDark }}>
          OK, ¡empezar!
        </button>
      </div>
    );
  }
  return (
    <div className="flex-1 flex flex-col items-center justify-center text-center gap-4">
      <span className="text-5xl">{actor?.avatar}</span>
      <h2 className="text-2xl font-black text-white">{actor?.name} ya vio su emoji...</h2>
      <p style={{ color: C.textMuted }}>El cronómetro arranca en cualquier momento ⏳</p>
    </div>
  );
}

function ActingView({ isActor, actor, remaining }) {
  const pct = Math.max(0, remaining / ROUND_SECONDS);
  if (isActor) {
    return (
      <div className="flex-1 flex flex-col items-center justify-center gap-8 text-center">
        <div className="text-6xl">🤫</div>
        <p className="text-sm" style={{ color: C.textMuted }}>
          Ya no se muestra el emoji. ¡A actuar!
        </p>
        <TimerBar pct={pct} remaining={remaining} />
      </div>
    );
  }
  return (
    <div className="flex-1 flex flex-col items-center justify-center gap-6 text-center">
      <span className="text-5xl">{actor?.avatar}</span>
      <h2 className="text-3xl font-black text-white">¡{actor?.name} está actuando!</h2>
      <p style={{ color: C.textMuted }}>Gritá tu respuesta en voz alta 🗣️</p>
      <TimerBar pct={pct} remaining={remaining} />
    </div>
  );
}

function ScoringView({ isActor, actor, players, checked, setChecked, onConfirm }) {
  const others = players.filter((p) => p.id !== actor?.id);
  if (!isActor) {
    return (
      <div className="flex-1 flex flex-col items-center justify-center text-center gap-4">
        <span className="text-5xl">{actor?.avatar}</span>
        <h2 className="text-2xl font-black text-white">¡Se acabó el tiempo!</h2>
        <p style={{ color: C.textMuted }}>{actor?.name} está cargando quién adivinó...</p>
      </div>
    );
  }
  const toggle = (id) => setChecked((c) => ({ ...c, [id]: !c[id] }));
  const count = Object.values(checked).filter(Boolean).length;
  return (
    <div className="flex flex-col h-full">
      <h2 className="text-2xl font-black text-center mb-1 text-white">¿Quién lo adivinó?</h2>
      <p className="text-center text-sm mb-4" style={{ color: C.textMuted }}>
        Tocá a cada uno que acertó. Vos sumás 1 punto por cada acierto.
      </p>
      <div className="flex-1 space-y-2 overflow-y-auto mb-4">
        {others.map((p) => (
          <button
            key={p.id}
            onClick={() => toggle(p.id)}
            className="w-full flex items-center justify-between rounded-2xl px-4 py-3 transition"
            style={{
              backgroundColor: checked[p.id] ? "rgba(0,212,184,0.2)" : C.card,
              border: `1px solid ${checked[p.id] ? C.teal : C.cardBorder}`,
            }}
          >
            <div className="flex items-center gap-3">
              <span className="text-2xl">{p.avatar}</span>
              <span className="font-bold text-white">{p.name}</span>
            </div>
            {checked[p.id] && <Icon name="Check" size={20} style={{ color: C.teal }} />}
          </button>
        ))}
      </div>
      <PrimaryButton onClick={onConfirm}>Confirmar puntos {count > 0 ? `(+${count} para vos)` : ""}</PrimaryButton>
    </div>
  );
}

// ==================== APP ====================

function App() {
  const [mode, setMode] = useState("home");

  if (mode === "home") return <Home onSelect={setMode} />;
  if (mode === "online") return <OnlineGame onBack={() => setMode("home")} />;
  if (mode === "offline") return <OfflineGame onBack={() => setMode("home")} />;
  return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
