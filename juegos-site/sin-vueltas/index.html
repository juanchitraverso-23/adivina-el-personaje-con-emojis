<script>
  // Apenas React mete el primer contenido en #root, sacamos esta escena
  // estática (ya cumplió su función) y queda la real. OJO: este script
  // tiene que ir DESPUÉS del <div id="root">, si no getElementById("root")
  // da null (el parser todavía no llegó a esa línea) y el observer nunca
  // se arma.
  (function () {
    var root = document.getElementById("root");
    var pre = document.getElementById("jxPreScene");
    if (!root || !pre) return;
    var obs = new MutationObserver(function () {
      if (root.childElementCount > 0) {
        pre.remove();
        obs.disconnect();
      }
    });
    obs.observe(root, { childList: true });
  })();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ==================== CONFIG DEL JUEGO ====================
// Sin Vueltas: pedido del usuario — "juego con piezas de tetris, hay que
// acomodarlas para formar una forma que aparece... rápido, no giramos
// piezas, tocar y arrastrar. Me das 10 piezas, las coloco para llenar una
// figura de cuadraditos, dejando posiblemente alguna pieza afuera."
//
// Primera versión (a propósito, todavía sin colores-como-condición ni
// ataques — eso lo pensamos después, como pasó con Bloques: primero
// arrancó con el modo Práctica solo, y Guerra/ataques se sumaron
// después). Por ahora es 100% local, sin sala online ni storage.js — un
// modo práctica cronometrado, como el de los otros juegos.
//
// Mecánica: el generador arma una "figura" (una mancha conexa de
// cuadraditos) juntando entre 8 y 10 piezas de tetris, CADA UNA en una
// única orientación fija (nunca rotada — ni por el generador ni por el
// jugador, esa es la gracia del nombre). Esas piezas van al azar a una
// bandeja de 10 (de sobra a veces quedan 1-2 piezas que NO son parte de
// la figura — decoys, no entran en ningún lado). El jugador arrastra cada
// pieza de la bandeja al tablero; si la suelta justo en su lugar
// correcto, encastra sola. Termina cuando encastró todas las piezas que
// sí formaban la figura (no hace falta tocar las que sobran).

const CELL = 36; // px por celda del tablero — grande para dedos en celu
const TRAY_CELL = 20; // px por celda de las fichitas en la bandeja (más chico)
const GRID_COLS = 8;
const GRID_ROWS = 8;
const TOTAL_PIECES = 10;
const ROUND_OPTIONS = [3, 5, 8];
const DEFAULT_ROUNDS = 3;
const PRACTICE_BEST_KEY = "sinvueltas:mejor";

// Las 7 piezas de tetris, cada una en UNA sola orientación fija (esto es
// justo lo que permite que el juego sea "sin vueltas": el jugador
// aprende a reconocer cada forma de memoria, como en el Tetris de
// siempre, pero acá ni el jugador ni el generador la giran jamás).
// `cells` son offsets [x,y] relativos a la esquina superior izquierda de
// la caja que envuelve a la pieza.
const TETROMINOES = {
  I: { cells: [[0, 0], [1, 0], [2, 0], [3, 0]], w: 4, h: 1, color: "#3E9EFF" },
  O: { cells: [[0, 0], [1, 0], [0, 1], [1, 1]], w: 2, h: 2, color: "#FFD23F" },
  T: { cells: [[0, 0], [1, 0], [2, 0], [1, 1]], w: 3, h: 2, color: "#B983FF" },
  S: { cells: [[1, 0], [2, 0], [0, 1], [1, 1]], w: 3, h: 2, color: "#3DDC84" },
  Z: { cells: [[0, 0], [1, 0], [1, 1], [2, 1]], w: 3, h: 2, color: "#F0454B" },
  J: { cells: [[0, 0], [0, 1], [1, 1], [2, 1]], w: 3, h: 2, color: "#7C9BFF" },
  L: { cells: [[2, 0], [0, 1], [1, 1], [2, 1]], w: 3, h: 2, color: "#FF9F1C" },
};
const TETROMINO_TYPES = Object.keys(TETROMINOES);

function randInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function cellKey(x, y) {
  return x + "," + y;
}
// Cuántas piezas de las 10 NO forman parte de la figura ("dejando
// posiblemente alguna pieza afuera") — la mayoría de las rondas no tiene
// ninguna, para no frustrar de entrada; después se van sumando.
function randomDecoyCount() {
  const r = Math.random();
  if (r < 0.5) return 0;
  if (r < 0.85) return 1;
  return 2;
}

// Intenta acomodar `count` piezas en una sola mancha conexa (cada pieza
// nueva tiene que tocar, de canto, a la mancha ya puesta) dentro del
// tablero de GRID_COLS x GRID_ROWS. Devuelve la lista de piezas puestas
// (con su posición ya definitiva) o null si se trabó — el llamador
// reintenta las veces que haga falta.
function tryPlacePieces(count) {
  const placed = [];
  const filled = new Set();
  const filledList = []; // [x,y] — para elegir un punto de referencia al azar rápido
  for (let i = 0; i < count; i++) {
    let ok = false;
    for (let attempt = 0; attempt < 400 && !ok; attempt++) {
      const type = TETROMINO_TYPES[randInt(0, TETROMINO_TYPES.length - 1)];
      const piece = TETROMINOES[type];
      let ax, ay;
      if (i === 0) {
        // La primera pieza arranca cerca del centro, con un poco de azar
        // para que la figura no salga siempre exactamente centrada.
        ax = Math.floor((GRID_COLS - piece.w) / 2) + randInt(-1, 1);
        ay = Math.floor((GRID_ROWS - piece.h) / 2) + randInt(-1, 1);
      } else {
        const ref = filledList[randInt(0, filledList.length - 1)];
        ax = ref[0] - randInt(0, piece.w - 1);
        ay = ref[1] - randInt(0, piece.h - 1);
      }
      const cells = piece.cells.map(([dx, dy]) => [ax + dx, ay + dy]);
      const inBounds = cells.every(([x, y]) => x >= 0 && x < GRID_COLS && y >= 0 && y < GRID_ROWS);
      if (!inBounds) continue;
      if (cells.some(([x, y]) => filled.has(cellKey(x, y)))) continue; // se pisa con otra pieza
      if (i > 0) {
        // Tiene que tocar, de canto (no en diagonal), a la mancha existente.
        const touches = cells.some(([x, y]) =>
          filled.has(cellKey(x - 1, y)) || filled.has(cellKey(x + 1, y)) ||
          filled.has(cellKey(x, y - 1)) || filled.has(cellKey(x, y + 1))
        );
        if (!touches) continue;
      }
      cells.forEach(([x, y]) => {
        filled.add(cellKey(x, y));
        filledList.push([x, y]);
      });
      placed.push({ type, anchorX: ax, anchorY: ay, cells });
      ok = true;
    }
    if (!ok) return null;
  }
  return placed;
}

// Arma una ronda completa: la figura (piezas solución ya ubicadas) + la
// bandeja de 10 piezas mezcladas (solución + las que sobran, si hay). Si
// el armado se traba mucho (raro, pero el algoritmo es al azar), baja de
// a una la cantidad de piezas solución hasta que encuentra una figura
// válida — así SIEMPRE sale una ronda jugable, nunca deja al jugador
// trabado esperando algo que no va a aparecer.
function generateRound() {
  let decoyCount = randomDecoyCount();
  let solutionCount = TOTAL_PIECES - decoyCount;
  let placed = null;
  while (solutionCount > 0 && !placed) {
    for (let tries = 0; tries < 25 && !placed; tries++) {
      placed = tryPlacePieces(solutionCount);
    }
    if (!placed) solutionCount--;
  }
  decoyCount = TOTAL_PIECES - solutionCount;
  const solutionPieces = placed.map((p, i) => ({
    id: "s" + i,
    type: p.type,
    anchorX: p.anchorX,
    anchorY: p.anchorY,
    isDecoy: false,
  }));
  const decoyPieces = Array.from({ length: decoyCount }, (_, i) => ({
    id: "d" + i,
    type: TETROMINO_TYPES[randInt(0, TETROMINO_TYPES.length - 1)],
    isDecoy: true,
  }));
  const targetCells = new Set();
  placed.forEach((p) => p.cells.forEach(([x, y]) => targetCells.add(cellKey(x, y))));
  return {
    tray: shuffleArr([...solutionPieces, ...decoyPieces]),
    targetCells,
    solutionCount,
  };
}

// ==================== TABLERO + BANDEJA (la mecánica central) ====================
// Una pieza "chip" (para la bandeja, chiquita) o "board" (para el tablero
// o mientras se arrastra, tamaño real) — el mismo render, dos escalas.
function PieceShape({ type, cellSize, style }) {
  const piece = TETROMINOES[type];
  return (
    <div style={{ position: "relative", width: piece.w * cellSize, height: piece.h * cellSize, ...style }}>
      {piece.cells.map(([dx, dy], i) => (
        <div
          key={i}
          style={{
            position: "absolute",
            left: dx * cellSize,
            top: dy * cellSize,
            width: cellSize,
            height: cellSize,
            boxSizing: "border-box",
            border: "1.5px solid rgba(10,5,26,0.4)",
            borderRadius: 3,
            background: `linear-gradient(155deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 45%, rgba(0,0,0,0.18) 100%), ${piece.color}`,
          }}
        />
      ))}
    </div>
  );
}

// El componente entero de una ronda: tablero + bandeja + arrastre a mano
// con Pointer Events (no HTML5 drag-and-drop, que anda mal en celulares
// — mismo motivo por el que el multitouch de Bloques usa touch events a
// mano en vez del onClick de siempre). Un solo dedo a la vez alcanza acá
// (no hace falta soltar varias piezas juntas), así que un pointer normal
// (mouse+touch unificado) es más simple que separar touch/mouse.
function PuzzleRound({ round, onSolved }) {
  const [placedIds, setPlacedIds] = useState(() => new Set());
  // drag = { id, type, isDecoy, anchorX, anchorY (si es de solución), x, y (px, esquina sup-izq relativa al viewport) }
  const [drag, setDrag] = useState(null);
  const boardRef = useRef(null);
  const dragRef = useRef(null); // espejo síncrono de `drag`, para leer la posición más nueva en pointerup sin depender del closure de React
  dragRef.current = drag;

  const boardW = GRID_COLS * CELL;
  const boardH = GRID_ROWS * CELL;

  const startDrag = (piece, e) => {
    e.preventDefault();
    const rect = boardRef.current.getBoundingClientRect();
    const px = e.clientX ?? e.touches?.[0]?.clientX;
    const py = e.clientY ?? e.touches?.[0]?.clientY;
    const shape = TETROMINOES[piece.type];
    // Centra la pieza (a tamaño de tablero) bajo el dedo/cursor.
    const next = {
      id: piece.id,
      type: piece.type,
      isDecoy: piece.isDecoy,
      anchorX: piece.anchorX,
      anchorY: piece.anchorY,
      x: px - (shape.w * CELL) / 2 - rect.left,
      y: py - (shape.h * CELL) / 2 - rect.top,
    };
    setDrag(next);
  };

  useEffect(() => {
    if (!drag) return;
    const move = (e) => {
      const rect = boardRef.current.getBoundingClientRect();
      const px = e.clientX ?? e.touches?.[0]?.clientX;
      const py = e.clientY ?? e.touches?.[0]?.clientY;
      if (px == null || py == null) return;
      const shape = TETROMINOES[dragRef.current.type];
      setDrag((d) => (d ? { ...d, x: px - (shape.w * CELL) / 2 - rect.left, y: py - (shape.h * CELL) / 2 - rect.top } : d));
    };
    const up = () => {
      const d = dragRef.current;
      if (d) {
        const gx = Math.round(d.x / CELL);
        const gy = Math.round(d.y / CELL);
        if (!d.isDecoy && gx === d.anchorX && gy === d.anchorY) {
          setPlacedIds((prev) => {
            const next = new Set(prev);
            next.add(d.id);
            return next;
          });
        }
      }
      setDrag(null);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("touchmove", move, { passive: false });
    window.addEventListener("touchend", up);
    return () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("touchmove", move);
      window.removeEventListener("touchend", up);
    };
  }, [!!drag]);

  useEffect(() => {
    if (placedIds.size > 0 && placedIds.size === round.solutionCount) onSolved();
  }, [placedIds.size]);

  // Posición "fantasma" de la pieza que se está arrastrando, encajada a
  // la celda más cercana — verde si es justo su lugar, gris si no.
  let ghost = null;
  if (drag) {
    const gx = Math.round(drag.x / CELL);
    const gy = Math.round(drag.y / CELL);
    const correct = !drag.isDecoy && gx === drag.anchorX && gy === drag.anchorY;
    ghost = { gx, gy, correct, type: drag.type };
  }

  const trayPieces = round.tray.filter((p) => !placedIds.has(p.id));

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: "100%" }}>
      <div
        ref={boardRef}
        data-board="1"
        style={{
          position: "relative",
          width: boardW,
          height: boardH,
          margin: "0 auto 18px",
          touchAction: "none",
        }}
      >
        {/* Casilleros vacíos de la figura — el "molde" a rellenar. */}
        {[...round.targetCells].map((key) => {
          const [x, y] = key.split(",").map(Number);
          return (
            <div
              key={key}
              style={{
                position: "absolute",
                left: x * CELL,
                top: y * CELL,
                width: CELL,
                height: CELL,
                boxSizing: "border-box",
                border: "1.5px dashed rgba(255,255,255,0.22)",
                borderRadius: 3,
                background: "rgba(255,255,255,0.04)",
              }}
            />
          );
        })}
        {/* Piezas ya encastradas correctamente. */}
        {round.tray
          .filter((p) => !p.isDecoy && placedIds.has(p.id))
          .map((p) => (
            <div key={p.id} style={{ position: "absolute", left: p.anchorX * CELL, top: p.anchorY * CELL }}>
              <PieceShape type={p.type} cellSize={CELL} />
            </div>
          ))}
        {/* Fantasma de la pieza en arrastre, encajado a la celda más cercana. */}
        {ghost && (
          <div
            style={{
              position: "absolute",
              left: ghost.gx * CELL,
              top: ghost.gy * CELL,
              opacity: ghost.correct ? 0.9 : 0.35,
              filter: ghost.correct ? "none" : "grayscale(0.6)",
              transition: "opacity 0.08s ease",
              pointerEvents: "none",
            }}
          >
            <PieceShape type={ghost.type} cellSize={CELL} />
          </div>
        )}
        {/* La pieza en arrastre de verdad, siguiendo el dedo/cursor. */}
        {drag && (
          <div
            style={{
              position: "absolute",
              left: drag.x,
              top: drag.y,
              zIndex: 20,
              pointerEvents: "none",
              filter: "drop-shadow(0 8px 10px rgba(0,0,0,0.45))",
              transform: "scale(1.04)",
            }}
          >
            <PieceShape type={drag.type} cellSize={CELL} />
          </div>
        )}
      </div>

      {/* Bandeja: las piezas que todavía no encastraron (de solución o de
          sobra, mezcladas — no se distinguen a simple vista). */}
      <div
        style={{
          display: "flex",
          flexWrap: "wrap",
          gap: 10,
          justifyContent: "center",
          width: "100%",
          maxWidth: 460,
          padding: 12,
          borderRadius: 18,
          background: "rgba(255,255,255,0.05)",
          border: "1px solid rgba(255,255,255,0.1)",
          minHeight: TRAY_CELL * 2 + 24,
        }}
      >
        {trayPieces.map((p) => (
          <div
            key={p.id}
            data-piece-id={p.id}
            onPointerDown={(e) => startDrag(p, e)}
            onTouchStart={(e) => startDrag(p, e)}
            style={{ cursor: "grab", opacity: drag && drag.id === p.id ? 0.25 : 1, transition: "opacity 0.1s ease" }}
          >
            <PieceShape type={p.type} cellSize={TRAY_CELL} />
          </div>
        ))}
      </div>
    </div>
  );
}

// ==================== MODO PRÁCTICA (cronometrado, en cadena) ====================
function PracticeGame({ onBack }) {
  const [roundCount, setRoundCount] = useState(DEFAULT_ROUNDS);
  const [session, setSession] = useState(null); // { rounds: [...], index, startTime }
  const [finished, setFinished] = useState(false);
  const [finalMs, setFinalMs] = useState(null);
  const [elapsedMs, setElapsedMs] = useState(0);
  const [bestMs, setBestMs] = useState(null);
  const [isNewBest, setIsNewBest] = useState(false);

  useEffect(() => {
    try {
      const v = localStorage.getItem(`${PRACTICE_BEST_KEY}:${roundCount}`);
      setBestMs(v ? parseInt(v, 10) : null);
    } catch {
      setBestMs(null);
    }
  }, [roundCount]);

  useEffect(() => {
    if (!session || finished) return;
    const id = setInterval(() => setElapsedMs(Date.now() - session.startTime), 100);
    return () => clearInterval(id);
  }, [session, finished]);

  const newRun = () => {
    setSession({ rounds: Array.from({ length: roundCount }, generateRound), index: 0, startTime: Date.now() });
    setFinished(false);
    setFinalMs(null);
    setElapsedMs(0);
    setIsNewBest(false);
  };

  const onRoundSolved = () => {
    setSession((s) => {
      if (!s) return s;
      if (s.index + 1 >= s.rounds.length) {
        const ms = Date.now() - s.startTime;
        setFinalMs(ms);
        setFinished(true);
        if (bestMs == null || ms < bestMs) {
          try {
            localStorage.setItem(`${PRACTICE_BEST_KEY}:${roundCount}`, String(ms));
          } catch {}
          setBestMs(ms);
          setIsNewBest(true);
        }
        return s;
      }
      return { ...s, index: s.index + 1 };
    });
  };

  const fmt = (ms) => (Math.max(0, ms) / 1000).toFixed(1) + "s";

  if (!session) {
    return (
      <Screen>
        <Title size={26}>🧩 Sin Vueltas</Title>
        <Sub style={{ marginTop: -10 }}>Encastrá las piezas sin girarlas, contra el reloj</Sub>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Cantidad de figuras</div>
          <div style={{ display: "flex", gap: 8 }}>
            {ROUND_OPTIONS.map((n) => (
              <button key={n} onClick={() => setRoundCount(n)} style={pillStyle(roundCount === n)}>
                {n}
              </button>
            ))}
          </div>
        </Card>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 6, fontWeight: 700 }}>Cómo se juega</div>
          <div style={{ fontSize: 13.5, lineHeight: 1.55, color: "#F3EEFF" }}>
            🧩 Aparecen 10 piezas de Tetris abajo. Arrastrá cada una al lugar que le corresponde en la
            figura de arriba — sin girarlas, tal cual las ves.
            <br />
            👻 Mientras arrastrás, se ve un fantasma de dónde caería: se pone bien visible cuando estás
            justo en su lugar.
            <br />
            🎯 No hace falta usar las 10 — a veces sobra alguna que no entra en ningún lado.
          </div>
        </Card>
        {bestMs != null && (
          <Sub style={{ marginTop: -6 }}>
            🏆 Tu mejor tiempo: <b style={{ color: "#FFD23F" }}>{fmt(bestMs)}</b>
          </Sub>
        )}
        <BigButton onClick={newRun}>Empezar ▶️</BigButton>
        <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Volver
        </BigButton>
      </Screen>
    );
  }

  return (
    <Screen homeConfirm={finished ? null : "¿Salir? Perdés el progreso de este intento."} style={{ padding: "20px 10px 40px" }}>
      <Title size={24}>🧩 Sin Vueltas</Title>
      <div style={{ fontSize: 36, fontWeight: 800, fontFamily: "'Baloo 2', sans-serif", color: finished ? (isNewBest ? "#3DDC84" : "#FFD23F") : "#F3EEFF", marginBottom: 2 }}>
        {fmt(finished ? finalMs : elapsedMs)}
      </div>
      {bestMs != null && <Sub style={{ marginTop: 0, fontSize: 13 }}>Mejor marca: {fmt(bestMs)}</Sub>}

      {finished ? (
        <Card style={{ width: "100%", maxWidth: 420, textAlign: "center" }}>
          {isNewBest && <div style={{ color: "#3DDC84", fontWeight: 800, marginBottom: 10 }}>🎉 ¡Nueva mejor marca!</div>}
          <BigButton onClick={newRun}>Otra 🔁</BigButton>
          <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
            Volver al menú
          </BigButton>
        </Card>
      ) : (
        <>
          <Sub style={{ marginTop: 0, marginBottom: 10 }}>
            Figura <b style={{ color: "#FFD23F" }}>{session.index + 1}</b> de {session.rounds.length}
          </Sub>
          <PuzzleRound key={session.index} round={session.rounds[session.index]} onSolved={onRoundSolved} />
        </>
      )}
    </Screen>
  );
}

function App() {
  useInjectFont();
  const [mode, setMode] = useState("home");
  if (mode === "home") return <Home onSelect={setMode} />;
  return <PracticeGame onBack={() => setMode("home")} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
