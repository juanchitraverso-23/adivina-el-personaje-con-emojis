  // sala (room.soundOff — ver el Card "Sonido" en el lobby, más abajo), a
  // diferencia del botón 🔊/🔇 de arriba que es una preferencia personal
  // por dispositivo. isSoundMuted() ya chequea las dos cosas (ver su
  // definición, cerca del resto del motor de sonido), así que acá alcanza
  // con mantener sincronizada esa variable de módulo cada vez que cambia
  // room.soundOff. Mismo motivo que los dos hooks de arriba para ir ANTES
  // del "if (!room) return": tiene que correr también en el primer render,
  // cuando room todavía es null.
  useEffect(() => {
    setBloquesRoomSoundOff(!!(room && room.soundOff));
  }, [room && room.soundOff]);

  if (!room) {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <Sub>Cargando sala...</Sub>
      </Screen>
    );
  }

  const players = room.players || [];
  const myIsLara = isLaraName((players.find((p) => p.id === myId) || {}).name);
  const effectiveHost =
    players.find((p) => p.id === room.hostId) ||
    [...players].sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0))[0] ||
    null;
  const isHost = !!effectiveHost && effectiveHost.id === myId;
  const roomMode = room.mode || "torneo";
  const stage = room.stage || "elim";
  const countdownEndsAt = room.countdownEndsAt || 0;
  const inCountdown = room.phase === "playing" && now < countdownEndsAt;
  // El online siempre tiene penalidad activa: fuera de la Final, "tocar
  // mal" frena los clicks 1s; en la Final el freeze de 3s (o la pausa de
  // 2s en la grilla de grises) es fijo, con su propia duración.
  const registerWrong = (finalGrid3 = false) => {
    if (wrongFlashTimerRef.current) clearTimeout(wrongFlashTimerRef.current);
    setWrongFlash(true);
    if (stage === "final") {
      if (finalGrid3) {
        // No frena clicks: solo pausa el cronómetro mostrado 2s (menos si
        // es Lara).
        setTimerPauseUntil(Date.now() + (myIsLara ? LARA_FINAL_G3_WRONG_PAUSE_MS : FINAL_G3_WRONG_PAUSE_MS));
        wrongFlashTimerRef.current = setTimeout(() => setWrongFlash(false), 500);
      } else {
        setLocked(true);
        wrongFlashTimerRef.current = setTimeout(() => {
          setWrongFlash(false);
          setLocked(false);
        }, myIsLara ? LARA_FINAL_WRONG_FREEZE_MS : FINAL_WRONG_FREEZE_MS);
      }
    } else {
      setLocked(true);
      wrongFlashTimerRef.current = setTimeout(() => {
        setWrongFlash(false);
        setLocked(false);
      }, myIsLara ? LARA_WRONG_FREEZE_MS : 1000);
    }
  };

  const passControlTo = async (targetId) => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.hostId = targetId;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const startGame = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh || fresh.players.length < 2) return;
    const round = fresh.round || 1;
    const initialStage = fresh.mode === "final" ? "final" : fresh.mode === "guerra" ? "guerra" : initialStageFor(fresh.players.length);
    const guerraCount = fresh.mode === "guerra" ? fresh.guerraGridCount || DEFAULT_GUERRA_GRID_COUNT : undefined;
    const newStates = {};
    fresh.players.forEach((p) => {
      newStates[p.id] = freshStateForStage(initialStage, isLaraName(p.name), guerraCount);
    });
    await Promise.all(fresh.players.map((p) => writePlayerState(roomCode, round, p.id, newStates[p.id])));
    fresh.phase = "playing";
    fresh.stage = initialStage;
    fresh.winnerId = null;
    fresh.countdownEndsAt = Date.now() + COUNTDOWN_MS;
    fresh.eliminationOrder = [];
    fresh.finishOrder = [];
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    myLiveStateRef.current = newStates[myId] || null;
    lastKnownServerQueueIdsRef.current = ((newStates[myId] && newStates[myId].queue) || []).map((g) => g.gid);
    setPlayerStates(newStates);
  };

  const setRoomMode = async (value) => {
    // Si ya está en ese modo, no hay nada que escribir — sin este chequeo,
    // tocar el mismo botón dos veces (o mostrar la sala con el modo ya
    // elegido al entrar) gastaba una escritura de Workers KV al pedo, y la
    // cuota gratis de escrituras es la más chica de las cuatro (1.000/día
    // para TODO el sitio).
    if (roomMode === value) return;
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.mode = value;
    if (value === "guerra" && !fresh.guerraGridCount) fresh.guerraGridCount = DEFAULT_GUERRA_GRID_COUNT;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const setGuerraGridCount = async (n) => {
    if ((room.guerraGridCount || DEFAULT_GUERRA_GRID_COUNT) === n) return; // mismo motivo que en setRoomMode
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.guerraGridCount = n;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const setRoomSoundOff = async (value) => {
    if (!!room.soundOff === value) return; // mismo motivo que en setRoomMode
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.soundOff = value;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const playAgain = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.round = (fresh.round || 1) + 1;
    fresh.phase = "lobby";
    fresh.stage = null;
    fresh.winnerId = null;
    fresh.countdownEndsAt = null;
    fresh.eliminationOrder = [];
    fresh.finishOrder = [];
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setPlayerStates({});
  };

  // ---------- LOBBY ----------
  if (room.phase === "lobby") {
    return (
      <Screen homeConfirm="¿Salir de la sala?">
        <Title size={26}>Sala {room.code}</Title>
        <Sub style={{ marginTop: -10 }}>
          Compartí el código para que se sumen ({players.length}/{MAX_PLAYERS}). Mínimo 2 jugadores.
        </Sub>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          {players.map((p) => (
            <div key={p.id} style={{ padding: "6px 2px", color: "#F3EEFF" }}>
              {p.id === effectiveHost?.id ? "👑 " : "• "}
              {p.name}
              {p.id === myId ? " (vos)" : ""}
            </div>
          ))}
        </Card>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Modo de juego</div>
          {isHost ? (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button onClick={() => setRoomMode("torneo")} style={{ ...pillStyle(roomMode === "torneo"), flex: 1, minWidth: 110 }}>
                🏆 Torneo por etapas
              </button>
              <button onClick={() => setRoomMode("final")} style={{ ...pillStyle(roomMode === "final"), flex: 1, minWidth: 110 }}>
                🏁 Final directa
              </button>
              <button onClick={() => setRoomMode("guerra")} style={{ ...pillStyle(roomMode === "guerra"), flex: 1, minWidth: 110 }}>
                💥 Guerra
              </button>
            </div>
          ) : (
            <div style={{ color: "#F3EEFF", fontWeight: 700 }}>
              {roomMode === "final" ? "🏁 Final directa" : roomMode === "guerra" ? "💥 Guerra" : "🏆 Torneo por etapas"}
            </div>
          )}
        </Card>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Sonido</div>
          {isHost ? (
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setRoomSoundOff(false)} style={{ ...pillStyle(!room.soundOff), flex: 1 }}>
                🔊 Con sonido
              </button>
              <button onClick={() => setRoomSoundOff(true)} style={{ ...pillStyle(!!room.soundOff), flex: 1 }}>
                🔇 Sin sonido
              </button>
            </div>
          ) : (
            <div style={{ color: "#F3EEFF", fontWeight: 700 }}>{room.soundOff ? "🔇 Sin sonido" : "🔊 Con sonido"}</div>
          )}
        </Card>
        {roomMode === "guerra" && (
          <Card style={{ width: "100%", maxWidth: 420 }}>
            <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Cantidad de grillas</div>
            {isHost ? (
              <div style={{ display: "flex", gap: 8 }}>
                {GRID_COUNT_OPTIONS.map((n) => (
                  <button key={n} onClick={() => setGuerraGridCount(n)} style={{ ...pillStyle((room.guerraGridCount || DEFAULT_GUERRA_GRID_COUNT) === n), flex: 1 }}>
                    {n}
                  </button>
                ))}
              </div>
            ) : (
              <div style={{ color: "#F3EEFF", fontWeight: 700 }}>{room.guerraGridCount || DEFAULT_GUERRA_GRID_COUNT}</div>
            )}
          </Card>
        )}
        <Card style={{ width: "100%", maxWidth: 420 }}>
          {roomMode === "final" ? (
            <>
              <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 6, fontWeight: 700 }}>Cómo se juega — Final directa</div>
              <div style={{ fontSize: 13.5, lineHeight: 1.55, color: "#F3EEFF" }}>
                Todos (de 2 a 16) juegan la Final directamente, sin etapas de eliminación previas.
                <br />
                ⏱️ Arranca con una cuenta regresiva de 5s — todos empiezan a la vez, sin ventajas.
                <br />
                🏁 3 grillas. Tocar mal frena los clicks 3s. La 2da parpadea sola hasta resolverla, y
                quien la resuelve le manda a un rival (elegís a quién si hay más de uno) el ataque
                "grilla girando" hasta que la termine. La 3ra es en escala de grises (tocar mal pausa el
                cronómetro 2s en vez de frenar).
                <br />
                No se corta cuando alguien gana: se sigue jugando hasta que todos terminan sus 3
                grillas, y quedan ordenados por el orden real en que van terminando.
              </div>
            </>
          ) : roomMode === "guerra" ? (
            <>
              <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 6, fontWeight: 700 }}>Cómo se juega — Guerra</div>
              <div style={{ fontSize: 13.5, lineHeight: 1.55, color: "#F3EEFF" }}>
                De 2 a 16 jugadores, cada uno con su propia cola de {room.guerraGridCount || DEFAULT_GUERRA_GRID_COUNT} grillas.
                <br />
                ⏱️ Arranca con una cuenta regresiva de 5s — todos empiezan a la vez, sin ventajas.
                <br />
                💥 Cada vez que resolvés una grilla (incluida la última), elegís QUÉ ataque mandás —
                🌀 girar, ⚫⚪ blanco y negro intermitente (15s), 🔲 grilla gigante, 🌈 colores extra,
                ♻️ 2-1 o 🧱 grilla extra — y a QUIÉN, las veces que quieras repetir a la misma persona.
                <br />
                Girar, blanco y negro, grilla gigante, colores extra y 2-1 se pueden recibir hasta 2
                veces en la misma grilla: la segunda no cancela, suma — girar el doble de rápido, blanco
                y negro con la fase en gris más larga, grilla gigante se agranda un poco más (la segunda
                vez llega a lo que antes hacía una sola aplicación, aunque cada tap limpia varias piezas
                de una así no es tan difícil), colores extra pasa de 16 colores fijos a que CADA pieza
                sea de un color distinto (tantos colores como piezas tenga la grilla en ese momento), y
                2-1 pasa a "4-3": cada 2 piezas que limpiás reaparece 1 en un lugar donde ya habías
                limpiado (con un color de los que te faltan) — al máximo, cada 4 que limpiás reaparecen
                3. Deja de reaparecer cuando quedan pocas piezas (2, o 4 al máximo), para que siempre se
                pueda terminar. Se pueden combinar entre sí (por ejemplo, alguien puede estar girando Y
                en blanco y negro a la vez, o tener la grilla gigante Y con colores extra al mismo
                tiempo) — y ojo, resolver CUALQUIER grilla te saca todos los ataques que tenías encima,
                así que arrancás la siguiente limpio. La grilla extra (🧱, no confundir con colores
                extra) es distinta: no se acumula en fuerza, pero a cada rival se la podés mandar una
                sola vez en toda la partida — después ya no aparece esa opción para esa persona. 🕊️ Si
                pasan 30 segundos sin que limpies ni una pieza, se te sacan todos los ataques que tenías
                encima (la grilla vuelve a ser estándar) — para no quedar pegado para siempre en una
                combinación demasiado difícil.
                <br />
                No se corta cuando alguien gana: se sigue jugando hasta que todos terminan su cola, y
                quedan ordenados por el orden real en que van terminando.
              </div>
            </>
          ) : (
            <>
              <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 6, fontWeight: 700 }}>Cómo se juega — torneo por etapas</div>
              <div style={{ fontSize: 13.5, lineHeight: 1.55, color: "#F3EEFF" }}>
                ⏱️ Cada etapa arranca con una cuenta regresiva de 5s — todos empiezan a la vez, sin ventajas.
                <br />
                ⚔️ <b style={{ color: "#FFD23F" }}>Eliminación:</b> 3 grillas (la última parpadea). Al terminar
                la 2da se habilita mandar una grilla extra a un rival. El último en terminar la carrera queda
                afuera; se repite hasta llegar a 3 jugadores.
                <br />
                🥈 <b style={{ color: "#FFD23F" }}>Semifinal (3 jugadores):</b> 4 grillas. Al terminar la 1ra se
                habilita "blanco y negro" (dura 15s, 2 seguidos al mismo rival se cancela antes); al terminar la 2da, la
                grilla extra clásica (se acumula); al terminar la 3ra, "freeze" de 5s (se acumula). El que
                queda sin terminar la carrera queda afuera; los otros 2 pasan a la Final.
                <br />
                🏁 <b style={{ color: "#FFD23F" }}>Final:</b> 3 grillas. Tocar mal frena los
                clicks 3s. La 2da parpadea sola hasta resolverla, y quien la resuelve le manda al otro un
                ataque "grilla girando" hasta que la termine. La 3ra es en escala de grises (tocar mal pausa
                el cronómetro 2s en vez de frenar). No se corta cuando alguien gana: se sigue jugando hasta
                que terminan los 2, y queda primero quien terminó antes.
                <br />
                <span style={{ color: "#8b7fa8" }}>Con 3 jugadores se arranca directo en la Semifinal; con 2, directo en la Final.</span>
              </div>
            </>
          )}
        </Card>
        {isHost ? (
          <>
            <BigButton onClick={startGame} disabled={players.length < 2}>
              {players.length < 2 ? "Esperando otro jugador..." : "Empezar 🎮"}
            </BigButton>
            {players.length > 1 && (
              <Card style={{ width: "100%", maxWidth: 420 }}>
                <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 6 }}>Pasarle el mando a otro/a</div>
                {players
                  .filter((p) => p.id !== myId)
                  .map((p) => (
                    <button
                      key={p.id}
                      onClick={() => passControlTo(p.id)}
                      style={{
                        display: "block",
                        width: "100%",
                        textAlign: "left",
                        background: "rgba(255,255,255,0.06)",
                        border: "none",
                        borderRadius: 8,
                        padding: "8px 10px",
                        marginBottom: 4,
                        color: "#F3EEFF",
                        cursor: "pointer",
                      }}
                    >
                      👑 {p.name}
                    </button>
                  ))}
              </Card>
            )}
          </>
        ) : (
          <Sub>Esperando a que {effectiveHost ? effectiveHost.name : "el anfitrión/a"} empiece...</Sub>
        )}
        <BigButton onClick={leaveRoom} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Salir de la sala
        </BigButton>
      </Screen>
    );
  }

  // ---------- ENDED ----------
  if (room.phase === "ended") {
    // El ranking se arma con el historial que vive en la sala (no con el
    // estado por-ronda, que para alguien eliminado hace rato quedó en una
    // ronda vieja y ya no aparece en el listPlayerStates de la ronda
    // actual): primero los que terminaron la Final, en el orden real en
    // que fueron terminando (finishOrder, ya viene ordenado); después los
    // eliminados en Eliminación/Semifinal, del último eliminado (mejor
    // puesto) al primero (eliminationOrder viene en orden cronológico, así
    // que se recorre al revés).
    const orderedIds = [...(room.finishOrder || []), ...[...(room.eliminationOrder || [])].reverse()];
    const seen = new Set();
    const ranked = [];
    orderedIds.forEach((id) => {
      if (seen.has(id)) return;
      const p = players.find((pp) => pp.id === id);
      if (p) {
        ranked.push(p);
        seen.add(id);
      }
    });
    players.forEach((p) => {
      if (!seen.has(p.id)) ranked.push(p);
    });
    const medals = ["🥇", "🥈", "🥉"];
    return (
      <Screen>
        <Title size={26}>🏆 {room.winnerId ? "¡Fin de la partida!" : "Partida terminada"}</Title>
        {room.winnerId && (
          <Sub style={{ marginTop: -10 }}>
            Ganó <b style={{ color: "#FFD23F" }}>{(players.find((p) => p.id === room.winnerId) || {}).name}</b>
          </Sub>
        )}
        <Card style={{ width: "100%", maxWidth: 420 }}>
          {ranked.map((p, i) => (
            <div
              key={p.id}
              style={{
                display: "flex",
                justifyContent: "space-between",
                padding: "8px 2px",
                borderBottom: i < ranked.length - 1 ? "1px solid rgba(255,255,255,0.08)" : "none",
              }}
            >
              <span>
                {medals[i] || `${i + 1}°`} {p.name}
                {p.id === myId ? " (vos)" : ""}
              </span>
            </div>
          ))}
        </Card>
        <BigButton onClick={playAgain}>🔁 Jugar otra ronda</BigButton>
        <BigButton onClick={leaveRoom} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Salir de la sala
        </BigButton>
      </Screen>
    );
  }

  // ---------- PLAYING ----------
  const round = room.round || 1;
  const myState = playerStates[myId];
  const iAmAlive = myState ? myState.alive !== false : true;
  const mySolvedCount = (myState && myState.solvedCount) || 0;
  // Cuántas grillas me quedan (contando la que tengo abierta ahora), no
  // cuántas ya resolví: con Lara la cola arranca una grilla más corta
  // (ver freshStateForStage), así que "es mi última grilla" hay que
  // decidirlo mirando mi propia cola, no comparando contra la cantidad
  // fija de siempre (STAGE_GRID_COUNT) — si no, para ella esa cuenta
  // nunca cierra y su última grilla (o la del medio, en la Final) no se
  // comporta como corresponde.
  const myQueueLen = (myState && myState.queue && myState.queue.length) || 0;
  // Etapa "elim": la última grilla que te toca (la 3ra, o cualquier extra
  // que te hayan mandado después) parpadea color/blanco y negro. Si sos
  // Lara, el ciclo es asimétrico: más tiempo a color, menos en blanco y
  // negro (en vez del 50/50 de siempre).
  const flickerColorMs = myIsLara ? LARA_FLICKER_COLOR_MS : FLICKER_PERIOD_MS;
  const flickerBwMs = myIsLara ? LARA_FLICKER_BW_MS : FLICKER_PERIOD_MS;
  const bwPhase =
    stage === "elim" &&
    myQueueLen === 1 &&
    now % (flickerColorMs + flickerBwMs) >= flickerColorMs;
  // Etapa de 3: debuff "blanco y negro" (dura como máximo BW_DEBUFF_MS, se
  // cancela antes si te mandan otro igual) y freeze acumulable por ataques.
  const myBwDebuff = stage === "semifinal" && now < ((myState && myState.bwUntil) || 0);
  const myFreezeUntil = (myState && myState.freezeUntil) || 0;
  const myFrozen = stage === "semifinal" && now < myFreezeUntil;
  // Modo Guerra: "blanco y negro intermitente" — a diferencia del debuff
  // fijo de Semifinal, acá la grilla PARPADEA entre color y blanco y negro
  // (mismo patrón que bwPhase de la etapa "elim") mientras esté activo. Si
  // te lo mandaron 2 veces (flickerStack), la fase en blanco y negro dura
  // el doble; la fase a color no cambia.
  const myGuerraFlickerActive = stage === "guerra" && now < ((myState && myState.flickerUntil) || 0);
  const myGuerraFlickerStack = (myState && myState.flickerStack) || 1;
  const myGuerraEffectiveBwMs = flickerBwMs * myGuerraFlickerStack;
  const myGuerraFlicker = myGuerraFlickerActive && now % (flickerColorMs + myGuerraEffectiveBwMs) >= flickerColorMs;
  // Final: la última grilla (myQueueLen === 1) es la de escala de grises;
  // la del medio (ya resolví al menos una Y todavía me queda más de una
  // después de esta) parpadea sola blanco y negro/color sin que nadie
  // ataque. Con Lara (2 grillas en vez de 3) no hay "del medio": pasa
  // directo de la primera a la de grises, sin esa fase intermedia.
  const finalG2BwMs = myIsLara ? LARA_FINAL_G2_BW_MS : FINAL_G2_BW_MS;
  const finalG2ColorMs = myIsLara ? LARA_FINAL_G2_COLOR_MS : FINAL_G2_COLOR_MS;
  const finalG2Cycle = stage === "final" && mySolvedCount >= 1 && myQueueLen >= 2
    ? (now % (finalG2BwMs + finalG2ColorMs)) < finalG2BwMs
    : false;
  const finalG3 = stage === "final" && myQueueLen === 1;
  const timerPaused = stage === "final" && now < timerPauseUntil;

  // El picker se cierra YA (no espera red); el guardado real al rival (la
  // grilla extra, el debuff de blanco y negro, el freeze, o el giro —
  // según forcedType o attackCtx.type) pasa en segundo plano. El rival lo
  // va a ver en su próximo sondeo. forcedType se usa para el ataque
  // "grilla girando" de la Final cuando solo hay un rival posible: se
  // manda directo, sin abrir el selector.
  const performAttack = (targetId, forcedType) => {
    const type = forcedType || (attackCtx ? attackCtx.type : "grid");
    setAttackCtx(null);
    // Locutor de pelea, pedido por el usuario ("que se escuche fuerte el
    // nombre de quien atacaste y el poder que tiraste... onda Hurricane to
    // Gaspi!") — solo en la pantalla de quien ataca (no hay forma barata
    // de avisarle al rival apenas aterriza, sin agregar otra vuelta de
    // red). Ver announceAttack cerca del resto de las funciones de sonido,
    // arriba del todo del archivo.
    announceAttack(type, (players.find((p) => p.id === targetId) || {}).name || "alguien");
    const cur = myLiveStateRef.current;
    if (cur) {
      // En Guerra, la grilla extra queda registrada como "ya se la mandé a
      // esta persona" en MI PROPIO estado (gridExtraSentTo) — es un cupo de
      // uno por rival en toda la partida, no por grilla, así que sobrevive
      // aunque yo pase a mi siguiente grilla. Ver GuerraAttackPicker y
      // TargetPicker (excludeIds) para dónde se usa esto.
      const patch = { lastAttacked: targetId };
      if (stage === "guerra" && type === "grid") {
        patch.gridExtraSentTo = [...(cur.gridExtraSentTo || []), targetId];
      }
      setMyStateNow({ ...cur, ...patch });
    }
    // Si el objetivo es Lara, la ventaja la sigue incluso en lo que le
    // manden: el freeze le dura menos, y la grilla extra clásica le llega
    // del mismo tamaño/dificultad fácil que el resto de su cola (si no,
    // una sola grilla de 10x10 y 6 colores se le colaría de golpe).
    const targetIsLara = isLaraName((players.find((p) => p.id === targetId) || {}).name);
    // Calcula el próximo estado del rival a partir de un freshTarget dado
    // — separado en su propia función para poder RECALCULARLO en cada
    // reintento de attackWithRetry (ver más abajo) con el estado más
    // nuevo posible, en vez de quedarnos pegados al primero que leímos.
    const computeNextTargetState = (freshTarget) => {
      let nextTargetState;
      if (type === "bw") {
        // Si ya lo tiene activo, mandarlo de nuevo lo cancela (vuelve a
        // normal YA) en vez de sumar; si no lo tiene, se activa por
        // BW_DEBUFF_MS — así nunca queda pegado para siempre esperando un
        // segundo ataque que capaz nadie manda. (Esto es Semifinal, no
        // Guerra: acá sigue siendo cancelar, no acumular.)
        const active = (freshTarget.bwUntil || 0) > Date.now();
        nextTargetState = { ...freshTarget, bwUntil: active ? null : Date.now() + BW_DEBUFF_MS };
      } else if (type === "flicker") {
        // Modo Guerra: "blanco y negro intermitente" — se puede recibir
        // hasta GUERRA_MAX_STACK (2) veces en la misma grilla. Cada vez que
        // llega, se SUMA (no cancela): se alarga el tiempo activo que le
        // queda (mismo patrón de acumulación que el freeze de Semifinal) Y
        // la fase en blanco y negro del parpadeo se hace más larga (la fase
        // a color no cambia) — ver myGuerraFlicker más abajo. Al tope, un
        // tercer intento no hace nada más.
        const stack = freshTarget.flickerStack || 0;
        if (stack >= GUERRA_MAX_STACK) {
          nextTargetState = freshTarget;
        } else {
          const base = Math.max(freshTarget.flickerUntil || 0, Date.now());
          nextTargetState = { ...freshTarget, flickerStack: stack + 1, flickerUntil: base + GUERRA_FLICKER_MS };
        }
      } else if (type === "freeze") {
        const base = Math.max(freshTarget.freezeUntil || 0, Date.now());
        nextTargetState = { ...freshTarget, freezeUntil: base + (targetIsLara ? LARA_SEMI_FREEZE_MS : SEMI_FREEZE_MS) };
      } else if (type === "spin") {
        // Modo Guerra: se puede recibir hasta GUERRA_MAX_STACK (2) veces —
        // la segunda no cancela, suma velocidad (gira el doble de rápido,
        // ver GridBoard). En la Final nunca llega acá con spinning ya en 1
        // (el ataque de girar se manda una sola vez por jugador), así que
        // ahí este cambio no altera nada — simplemente pasa de 0 a 1.
        const stack = freshTarget.spinning || 0;
        nextTargetState = { ...freshTarget, spinning: Math.min(GUERRA_MAX_STACK, stack + 1) };
      } else if (type === "twoOne") {
        // Modo Guerra: "2-1" — mientras esté activo, cada tanto que limpia
        // piezas reaparece alguna en un lugar donde ya había limpiado (con
        // un color de los que todavía le faltan). El detalle de CUÁNDO y
        // CUÁNTAS reaparecen (2→1, o 4→3 al máximo) vive en tapCell, no
        // acá — acá solo se sube el nivel, igual que girar.
        const stack = freshTarget.twoOneStack || 0;
        nextTargetState = { ...freshTarget, twoOneStack: Math.min(GUERRA_MAX_STACK, stack + 1) };
      } else if (type === "giant") {
        // Modo Guerra: "grilla gigante" — reemplaza la grilla que el rival
        // tiene abierta AHORA (se pierde el progreso de esa, arranca de
        // cero) por una más grande. Se puede recibir hasta GUERRA_MAX_STACK
        // (2) veces en la misma grilla, cada nivel con su propio
        // multiplicador (GUERRA_GIANT_SIZE_MULT_BY_STACK) — el tap también
        // limpia más de una de golpe, según el nivel (GUERRA_GIANT_CLEAR_BY_STACK,
        // ver tapCell). Al tope, un tercer intento no hace nada más. Si no
        // le queda ninguna grilla (ya terminó todas), no hay nada que
        // agrandar: no debería pasar porque TargetPicker ya filtra a quien
        // terminó, pero por las dudas no rompe si pasa. Si la grilla ya
        // tenía colores extra puesto (16 fijos, o uno por pieza), la nueva
        // grilla gigante conserva ese nivel — buildStackedGrid se encarga
        // de recalcular los colores para el tamaño nuevo (si es "un color
        // por pieza", ahora va a haber más piezas y por lo tanto más
        // colores, no se queda pegado en la cantidad vieja).
        const q = freshTarget.queue || [];
        const currentGrid0 = q[0];
        const currentStack = q.length > 0 ? (currentGrid0.giantStack || 0) : GUERRA_MAX_STACK;
        if (q.length > 0 && currentStack < GUERRA_MAX_STACK) {
          const newStack = currentStack + 1;
          const rainbowStack = currentGrid0.rainbowStack || 0;
          const baseSize = Math.round((targetIsLara ? LARA_GRID_SIZE : GRID_SIZE) * GUERRA_GIANT_SIZE_MULT_BY_STACK[newStack]);
          const giantGrid = { ...buildStackedGrid(baseSize, rainbowStack, targetIsLara), giant: true, giantStack: newStack };
          nextTargetState = { ...freshTarget, queue: [giantGrid, ...q.slice(1)] };
        } else {
          nextTargetState = freshTarget;
        }
      } else if (type === "rainbow") {
        // Modo Guerra: "colores extra" — reemplaza la grilla que el rival
        // tiene abierta AHORA por una del mismo tamaño pero con más
        // colores. Se puede recibir hasta GUERRA_MAX_STACK (2) veces: la
        // 1ra son 16 colores fijos en vez de 6 (RAINBOW_COLOR_KEYS), cada
        // uno con menos piezas — hay que ir cambiando de color seguido. La
        // 2da (máximo) es más fuerte todavía: CADA pieza queda de un color
        // distinto (tantos colores como piezas tenga la grilla — ver
        // generateDistinctColors/buildStackedGrid). Al tope, un tercer
        // intento no hace nada más. Si la grilla ya era gigante, conserva
        // esa marca (se combinan).
        const q = freshTarget.queue || [];
        const currentGrid0 = q[0];
        const currentStack = q.length > 0 ? (currentGrid0.rainbowStack || 0) : GUERRA_MAX_STACK;
        if (q.length > 0 && currentStack < GUERRA_MAX_STACK) {
          const newStack = currentStack + 1;
          const rainbowGrid = {
            ...buildStackedGrid(currentGrid0.size, newStack, targetIsLara),
            giant: currentGrid0.giant,
            giantStack: currentGrid0.giantStack,
          };
          nextTargetState = { ...freshTarget, queue: [rainbowGrid, ...q.slice(1)] };
        } else {
          nextTargetState = freshTarget;
        }
      } else {
        const extraGrid = targetIsLara
          ? newQueuedGrid(PIECE_COLOR_KEYS.slice(0, LARA_COLOR_COUNT), LARA_GRID_SIZE)
          : newQueuedGrid();
        const newQueue = [...(freshTarget.queue || []), extraGrid];
        nextTargetState = { ...freshTarget, queue: newQueue };
      }
      // Modo Guerra: cada ataque que aterriza reinicia la cuenta del
      // minuto de "gracia" (GUERRA_ATTACK_EXPIRE_MS) — ver el efecto más
      // abajo, cerca de tapCell.
      if (stage === "guerra") nextTargetState = { ...nextTargetState, lastClearAt: Date.now() };
      return nextTargetState;
    };

    // Ataque a mí mismo: posible desde que el easter egg del bichito
    // sortea el ataque entre TODOS los jugadores, uno mismo incluido. Acá
    // NO conviene el camino de leer-y-escribir directo al servidor de
    // abajo: myLiveStateRef.current YA es mi copia más al día que existe
    // (más que cualquier lectura de vuelta al server, que puede tardar),
    // y escribir el efecto por FUERA de setMyStateNow dejaba
    // myLiveStateRef desactualizado — el ataque se veía un instante
    // (playerStates se actualizaba directo) pero mis propios taps
    // seguían usando la grilla vieja de la ref, y mi próximo sync de
    // fondo terminaba pisando el ataque con esa copia vieja (exactamente
    // lo que reportó el usuario: "apareció y se fue"). Se arregla
    // mandándolo por el mismo camino de siempre para MI estado: local YA
    // + sync de fondo, con todo el merge ya endurecido.
    if (targetId === myId) {
      const latest = myLiveStateRef.current;
      if (latest) setMyStateNow(computeNextTargetState(latest));
      return;
    }

    (async () => {
      const fallbackCount = stage === "guerra" ? room.guerraGridCount : undefined;
      // El rival tiene su PROPIO sync en segundo plano corriendo todo el
      // tiempo (runSyncLoop) que también lee-y-escribe esta misma key —
      // si toca justo en el medio de nuestra escritura (típico: el rival
      // está tocando su grilla activamente cuando lo atacamos), su
      // escritura puede basarse en una lectura de ANTES de la nuestra y
      // pisarla enterita, revirtiendo el ataque sin que nadie se entere
      // (ver memoria known-unfixed-kv-races, ítem 2 — carrera de dos
      // escritores sobre la misma key). No hay compare-and-swap en KV
      // para evitarlo de raíz, así que en vez de confiar en una sola
      // escritura, VERIFICAMOS que haya quedado y reintentamos si no:
      // escribimos, esperamos, releemos, y si la "firma" de nuestro
      // ataque (attackSignature) volvió exactamente a como estaba ANTES
      // de mandarlo (la huella exacta de "me lo pisaron"), recalculamos
      // desde el estado actual y reintentamos. Si en cambio cambió por
      // otro motivo legítimo (el rival avanzó de grilla, o alguien más le
      // mandó otro ataque mientras tanto), NO insistimos — reaplicar a
      // ciegas podría pegarle a la grilla equivocada.
      //
      // CHECK_DELAY_MS tiene que ser MÁS que SYNC_DEBOUNCE_MS (500ms): si
      // el rival tenía un tap sin sincronizar todavía en el momento
      // exacto del ataque, su sync puede tardar hasta ese debounce entero
      // en salir — verificar demasiado rápido (300ms) daba por buena
      // nuestra escritura ANTES de que esa sync tardía llegara a
      // pisarla, dejando el ataque revertido sin que nadie lo note
      // ("apareció y se fue"). Por eso además hacemos DOS chequeos
      // seguidos por intento (no uno): la primera lectura puede caer
      // justo antes de que esa sync tardía termine.
      const CHECK_DELAY_MS = 650;
      for (let attempt = 0; attempt < 3; attempt++) {
        const freshTarget = (await readPlayerState(roomCode, round, targetId)) || freshStateForStage(stage, targetIsLara, fallbackCount);
        const beforeSig = attackSignature(type, freshTarget);
        const nextTargetState = computeNextTargetState(freshTarget);
        await writePlayerState(roomCode, round, targetId, nextTargetState);
        setPlayerStates((m) => ({ ...m, [targetId]: nextTargetState }));
        const appliedSig = attackSignature(type, nextTargetState);
        if (attempt === 2) break; // último intento: ya escribimos, no verificamos más
        let ok = true;
        for (let check = 0; check < 2; check++) {
          await new Promise((r) => setTimeout(r, CHECK_DELAY_MS));
          const verify = await readPlayerState(roomCode, round, targetId);
          const verifySig = attackSignature(type, verify);
          if (verifySig === appliedSig) continue; // sigue bien, seguimos vigilando un toque más
          if (verifySig !== beforeSig) { ok = true; break; } // cambió por otro motivo legítimo: no insistir
          ok = false; // volvió exacto a como estaba antes de nuestro ataque — nos lo pisaron
          break;
        }
        if (ok) break;
        // si no, reintentamos desde el estado actual (recalcula y vuelve
        // a escribir con lo que haya de verdad en el servidor ahora).
      }
    })();
  };

  // Easter egg pedido por el usuario: tocar uno de los bichitos de
  // critter.js (el fantasma/dino/platito que cruza la pantalla cada
  // tanto, en CUALQUIER juego del sitio) dispara un evento genérico en
  // `window` — critter.js no sabe nada de Guerra ni de ataques, a
  // propósito. Acá, y SOLO en el modo Guerra, reaccionamos mandando un
  // ataque al azar a alguien al azar de la partida — de verdad al azar:
  // puede tocarte a vos mismo. No incluye "grilla extra" en el sorteo
  // porque esa tiene la regla de "una sola vez por rival" (gridExtraSentTo)
  // y saltearla de esta forma la rompería. El listener en sí (más abajo,
  // cerca de los demás refs) se registra una sola vez, SIEMPRE, sin
  // importar si `room` todavía está cargando — por eso la lógica de
  // verdad vive acá, en una simple asignación a una ref, no en un hook
  // nuevo: un useEffect puesto acá (después del "if (!room) return" de
  // más arriba) rompería las Reglas de los Hooks, porque en el render
  // donde `room` todavía es null nunca se llegaría a ejecutar.
  onCritterTapRef.current = () => {
    if (stage !== "guerra") return;
    if (!players || players.length === 0) return;
    const target = players[Math.floor(Math.random() * players.length)];
    const pool = ["spin", "flicker", "giant", "rainbow", "twoOne"];
    const type = pool[Math.floor(Math.random() * pool.length)];
    performAttack(target.id, type);
  };

  // Modo Guerra, pedido del usuario: si pasan 30 segundos SIN que limpie
  // ni una pieza (GUERRA_ATTACK_EXPIRE_MS — ver tapCell, que reinicia la
  // cuenta con cada limpieza), se sacan todos los ataques que tenía
  // encima y la grilla vuelve a ser estándar — porque algunas
  // combinaciones se vuelven demasiado difíciles y sin esto podía quedar
  // pegado para siempre. Un ataque nuevo TAMBIÉN reinicia la cuenta (ver
  // el final de computeNextTargetState, en performAttack) — así no se
  // revierte de golpe un combo recién llegado antes de tener chance de
  // tocarlo. Si la grilla actual está agrandada y/o con colores extra,
  // se regenera una estándar (se pierde el progreso de esa, como con
  // cualquier reemplazo de grilla) — si solo tenía girar/blanco y
  // negro/2-1 sin tocar el tamaño, esos se sacan nomás, la grilla en sí
  // sigue igual.
  expireAttacksRef.current = () => {
    if (stage !== "guerra") return;
    const cur = myLiveStateRef.current;
    if (!cur || !cur.lastClearAt) return;
    if (Date.now() - cur.lastClearAt < GUERRA_ATTACK_EXPIRE_MS) return;
    const q = cur.queue || [];
    const currentGrid0 = q[0];
    const wasModified = currentGrid0 && (currentGrid0.giant || (currentGrid0.rainbowStack || 0) > 0);
    const hasStatusEffects = (cur.spinning || 0) > 0 || (cur.flickerStack || 0) > 0 || (cur.twoOneStack || 0) > 0;
    if (!wasModified && !hasStatusEffects) return; // no hay nada que sacar
    // Misma bandera que usa completeCurrentGrid al sacarse los ataques
    // de encima al resolver una grilla — sin prenderla acá, el merge de
    // la próxima sincronización (runSyncLoop) desconfía de mi limpieza
    // local para spinning/flickerUntil/flickerStack/twoOneStack y los
    // vuelve a pisar con lo último leído del servidor, dejando el
    // "vencimiento" sin efecto un instante después de aplicado.
    myAttacksClearedPendingRef.current = true;
    let newQueue = q;
    if (wasModified) {
      const size = myIsLara ? LARA_GRID_SIZE : GRID_SIZE;
      const colorKeys = myIsLara ? PIECE_COLOR_KEYS.slice(0, LARA_COLOR_COUNT) : PIECE_COLOR_KEYS;
      newQueue = [generateGrid(size, colorKeys), ...q.slice(1)];
    }
    setMyStateNow({ ...cur, queue: newQueue, spinning: 0, flickerUntil: null, flickerStack: 0, twoOneStack: 0, lastClearAt: Date.now() });
  };

  // Se llama cuando se completaron los colores de la grilla que está
  // primera en la cola: la saca de la cola YA (instantáneo).
  //  - Final: si no queda nada en la cola, terminé mis 3 grillas —
  //    finishedAt YA (no gano al instante: se sigue jugando hasta que
  //    todos terminan, ver checkGroupRaceCompletion). Si recién terminé la
  //    grilla 2, ataco "girando" a un rival: si solo queda uno posible,
  //    directo; si hay más de uno, abro el selector para elegir.
  //  - elim/semifinal: si no queda nada, terminé esta carrera y espero a
  //    los demás (checkHeatCompletion se encarga del resto); si no, se
  //    habilita el ataque que corresponda según cuántas llevo resueltas.
  const completeCurrentGrid = (cur) => {
    const newQueue = cur.queue.slice(1);
    const solvedCount = (cur.solvedCount || 0) + 1;

    if (stage === "final") {
      // Misma bandera que en Guerra (ver el comentario de
      // myAttacksClearedPendingRef en runSyncLoop): sin prenderla acá
      // también, el merge de la próxima sincronización podía preferir el
      // spinning viejo del servidor (todavía sin este clear) por encima
      // de este 0 recién puesto, y la grilla seguía girando después de
      // resuelta.
      myAttacksClearedPendingRef.current = true;
      if (newQueue.length === 0) {
        setMyStateNow({ ...cur, queue: newQueue, solvedCount, spinning: 0, finishedAt: Date.now() });
        return;
      }
      setMyStateNow({ ...cur, queue: newQueue, solvedCount, spinning: 0 });
      if (solvedCount === 2) {
        const opponents = players.filter((p) => {
          if (p.id === myId) return false;
          const st = playerStates[p.id] || {};
          return st.alive !== false && !st.finishedAt;
        });
        if (opponents.length === 1) {
          performAttack(opponents[0].id, "spin");
        } else if (opponents.length > 1) {
          setAttackCtx({ type: "spin", title: "🌀 ¡Grilla resuelta! ¿A quién le hacés girar la grilla?" });
        }
      }
      return;
    }

    if (stage === "guerra") {
      const isLastGrid = newQueue.length === 0;
      // Igual que en la Final, terminar la cola entera pone finishedAt YA
      // (así el ranking refleja el momento real en que terminaste de
      // resolver, no cuánto tardaste después eligiendo a quién atacar).
      // Por decisión del usuario, incluso en tu última grilla mandás un
      // último ataque de despedida antes de quedar afuera de la acción.
      // También por decisión del usuario: resolver CUALQUIER grilla te saca
      // todos los ataques que tenías encima (spinning, blanco y negro
      // intermitente, 2-1) — arrancás la siguiente grilla limpio. La
      // grilla gigante no necesita limpieza acá: vive en el objeto de la
      // grilla vieja (newQueue ya no la incluye), no en el estado del
      // jugador. Prendo la bandera para que runSyncLoop sepa, en su
      // próxima sincronización, que este spinning/flickerUntil/
      // flickerStack/twoOneStack en 0 es un limpiado intencional mío y no
      // algo desactualizado — si no, podría pisar con esto un ataque que
      // llegó justo en el medio.
      myAttacksClearedPendingRef.current = true;
      setMyStateNow({ ...cur, queue: newQueue, solvedCount, spinning: 0, flickerUntil: null, flickerStack: 0, twoOneStack: 0, lastClearAt: Date.now(), finishedAt: isLastGrid ? Date.now() : cur.finishedAt || null });
      const candidates = players.filter((p) => {
        if (p.id === myId) return false;
        const st = playerStates[p.id] || {};
        // En Guerra nadie queda eliminado a mitad de partida: el único
        // motivo para no poder atacar a alguien es que ya terminó toda su
        // cola (mismo filtro que ya aplica TargetPicker para candidatos).
        return !st.finishedAt;
      });
      if (candidates.length === 0) return; // nadie a quien atacar todavía
      // A quién le mando cada tipo se resuelve en el picker (el atajo de
      // "un solo rival posible" depende del tipo elegido, porque la grilla
      // extra excluye a quien ya la recibió — ver el onChoose más abajo).
      setAttackCtx({ type: "choose" });
      return;
    }

    if (newQueue.length === 0) {
      setMyStateNow({ ...cur, queue: newQueue, solvedCount, finishedAt: Date.now() });
      return;
    }
    setMyStateNow({ ...cur, queue: newQueue, solvedCount });
    if (stage === "elim" && solvedCount === 2) {
      setAttackCtx({ type: "grid", title: "🧱 ¡Grilla resuelta! ¿A quién le mandás una extra?" });
    } else if (stage === "semifinal" && solvedCount === 1) {
      setAttackCtx({
        type: "bw",
        title: "⚫⚪ ¡Grilla resuelta! ¿A quién le ponés blanco y negro?",
        subtitle: "Dura 15s — si ya lo tiene puesto, se cancela antes y vuelve a la normalidad.",
      });
    } else if (stage === "semifinal" && solvedCount === 2) {
      setAttackCtx({ type: "grid", title: "🧱 ¡Grilla resuelta! ¿A quién le mandás una extra?" });
    } else if (stage === "semifinal" && solvedCount === 3) {
      setAttackCtx({
        type: "freeze",
        title: "🥶 ¡Grilla resuelta! ¿A quién le congelás los clicks?",
        subtitle: "5 segundos — se acumula si le mandan más de uno.",
      });
    }
  };

  // Aplica el click YA sobre mi estado local (síncrono, instantáneo — nunca
  // espera red) y pide que se guarde en segundo plano. myLiveStateRef es la
  // fuente de verdad, así que aunque toques varias piezas rápido cada click
  // parte del resultado real del anterior, no de una copia vieja.
  const tapCell = (idx) => {
    if (locked || inCountdown) return;
    const cur = myLiveStateRef.current;
    if (!cur || cur.alive === false || attackCtx) return;
    if (cur.freezeUntil && now < cur.freezeUntil) return; // congelado por un ataque de la etapa de 3
    const grid = cur.queue && cur.queue[0];
    if (!grid) return;
    const pieceId = grid.cellPiece[idx];
    if (pieceId == null || pieceId < 0) return;
    const piece = grid.pieces[pieceId];
    if (piece.cleared) return;
    const activeColor = grid.colorOrder[grid.activeColorIndex];
    if (piece.color !== activeColor) {
      registerWrong(stage === "final" && cur.queue.length === 1);
      return;
    }
    // Ataque "grilla gigante" (modo Guerra): la grilla tiene más piezas de
    // lo normal, así que cada tap limpia GUERRA_GIANT_CLEAR_BY_STACK[nivel]
    // piezas del color activo de una (la tocada + las que hagan falta), no
    // solo la tocada — para que no sea proporcionalmente más lenta de
    // resolver. En cualquier otra grilla (grid.giant es undefined) esto no
    // cambia nada: se limpia solo la pieza tocada, como siempre.
    const clearCount = grid.giant ? GUERRA_GIANT_CLEAR_BY_STACK[grid.giantStack || 1] : 1;
    const extraIds = grid.pieces
      .filter((p) => p.color === activeColor && !p.cleared && p.id !== pieceId)
      .slice(0, clearCount - 1)
      .map((p) => p.id);
    const idsToClear = new Set([pieceId, ...extraIds]);
    let newPieces = grid.pieces.map((p) => (idsToClear.has(p.id) ? { ...p, cleared: true } : p));
    const remaining = newPieces.some((p) => p.color === activeColor && !p.cleared);
    const newIndex = remaining ? grid.activeColorIndex : grid.activeColorIndex + 1;
    playPlop(grid.colorOrder.indexOf(activeColor));

    // Ataque "2-1" (modo Guerra): mientras esté activo, cada N piezas que
    // limpio reaparecen M en algún lugar donde ya había limpiado — nivel 1
    // ("2-1"): N=2, M=1; nivel 2 ("4-3", al recibirlo 2 veces): N=4, M=3.
    // El color de cada una que reaparece sale de los que TODAVÍA me faltan
    // (colorOrder desde newIndex en adelante) — nunca del color que recién
    // terminé con este mismo tap, así no "revive" algo que el cartelito ya
    // dio por hecho. Deja de reaparecer si quedan pocas piezas (2, o 4 en
    // el nivel máximo) para que la grilla siempre se pueda terminar.
    const twoOneStack = cur.twoOneStack || 0;
    if (twoOneStack > 0) {
      if (twoOneGidRef.current !== grid.gid) {
        twoOneGidRef.current = grid.gid;
        twoOneCounterRef.current = 0;
      }
      const N = twoOneStack >= 2 ? 4 : 2;
      const M = twoOneStack >= 2 ? 3 : 1;
      const threshold = twoOneStack >= 2 ? 4 : 2;
      const before = twoOneCounterRef.current;
      const after = before + idsToClear.size;
      twoOneCounterRef.current = after;
      const triggers = Math.floor(after / N) - Math.floor(before / N);
      const remainingAfterClear = newPieces.filter((p) => !p.cleared).length;
      const pendingColors = grid.colorOrder.slice(newIndex);
      if (triggers > 0 && remainingAfterClear > threshold && pendingColors.length > 0) {
        const clearedPool = shuffleArr(newPieces.filter((p) => p.cleared));
        const toRevive = Math.min(M * triggers, clearedPool.length);
        const reviveIds = new Set(clearedPool.slice(0, toRevive).map((p) => p.id));
        newPieces = newPieces.map((p) =>
          reviveIds.has(p.id)
            ? { ...p, cleared: false, color: pendingColors[Math.floor(Math.random() * pendingColors.length)] }
            : p
        );
      }
    }

    const newGrid = { ...grid, pieces: newPieces, activeColorIndex: newIndex };

    if (newIndex >= grid.colorOrder.length) {
      playGridDone();
      completeCurrentGrid(cur);
      return;
    }
    const nextQueue = [newGrid, ...cur.queue.slice(1)];
    // Modo Guerra: cada pieza limpiada reinicia la cuenta de "sin
    // progreso" (30s, GUERRA_ATTACK_EXPIRE_MS / expireAttacksRef) —
    // así los ataques encima solo se sacan solos cuando de verdad no
    // lográs avanzar, no por simple mala suerte de timing.
    setMyStateNow({ ...cur, queue: nextQueue, ...(stage === "guerra" ? { lastClearAt: Date.now() } : {}) });
  };

  const currentGrid = myState && myState.queue && myState.queue[0];

  const stageLabel =
    stage === "guerra" ? "💥 Guerra" :
    stage === "final" ? "🏁 Final" : stage === "semifinal" ? "🥈 Semifinal (quedan 3)" : "⚔️ Eliminación";
  const stageDesc =
    stage === "guerra"
      ? `${room.guerraGridCount || 5} grillas. Cada una que resolvés, mandás un ataque. Se sigue jugando hasta que todos terminan; queda primero quien las resuelve antes.`
      : stage === "final"
      ? "3 grillas. Se sigue jugando hasta que todos terminan; queda primero quien las resuelve antes."
      : stage === "semifinal"
      ? "4 grillas. El último en terminar queda afuera; los otros 2 pasan a la Final."
      : "3 grillas. El último en terminar queda afuera.";
  const finalElapsedMs = stage === "final" && !inCountdown ? Math.max(0, now - countdownEndsAt) : 0;
  const fmtSecs = (ms) => (ms / 1000).toFixed(1) + "s";

  return (
    <Screen
      homeConfirm="¿Salir? Perdés tu progreso de esta partida."
      style={{ padding: "20px 10px 40px" }}
    >
      {/* Keyframe del ataque "grilla girando" de la Final — una vuelta
          lenta cada 10s, hasta que quien la sufre termina esa grilla. */}
      <style>{`
        @keyframes bloques-spin { to { transform: rotate(360deg); } }
        .bloques-spin { animation: bloques-spin ${SPIN_PERIOD_MS}ms linear infinite; }
        /* Botones "3D" (a quién atacar, qué ataque mandar): se hunden un
           toque al tocarlos, como un botón de verdad — nada más que
           transform, así no cuesta velocidad. */
        .bloques-3dbtn { transition: transform 0.1s ease; }
        .bloques-3dbtn:active { transform: translateY(4px) scale(0.97); }
      `}</style>

      {inCountdown && (
        <div
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(12,6,32,0.88)",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            zIndex: 200,
            padding: 20,
            textAlign: "center",
          }}
        >
          <div style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 800, fontSize: 20, color: "#FFD23F", marginBottom: 10 }}>
            {stageLabel}
          </div>
          <div style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 800, fontSize: 90, color: "#F3EEFF", lineHeight: 1 }}>
            {Math.max(1, Math.ceil((countdownEndsAt - now) / 1000))}
          </div>
          <Sub style={{ marginTop: 10 }}>Preparate — arrancan todos a la vez</Sub>
        </div>
      )}

      <Title size={22}>Sala {room.code}</Title>
      <PlayerBadgeRow players={players} playerStates={playerStates} myId={myId} eliminationOrder={room.eliminationOrder} />

      <div
        style={{
          background: "rgba(255,210,63,0.15)",
          border: "1.5px solid rgba(255,210,63,0.5)",
          borderRadius: 14,
          padding: "8px 16px",
          marginBottom: 14,
          color: "#FFD23F",
          fontWeight: 800,
          fontFamily: "'Baloo 2', sans-serif",
          fontSize: 15,
          textAlign: "center",
        }}
      >
        {stageLabel}
        <div style={{ color: "#F3EEFF", fontWeight: 700, fontSize: 12.5, marginTop: 2 }}>{stageDesc}</div>
      </div>

      {stage === "final" && !inCountdown && (
        <Sub style={{ marginTop: -6, fontSize: 15 }}>
          ⏱️ <b style={{ color: timerPaused ? "#FF5D7A" : "#FFD23F" }}>{fmtSecs(finalElapsedMs)}</b>
          {timerPaused ? " · pausado" : ""}
        </Sub>
      )}

      {!iAmAlive ? (
        <Card style={{ width: "100%", maxWidth: 420, textAlign: "center" }}>
          <div style={{ fontSize: 44, marginBottom: 8 }}>💀</div>
          <Title size={20}>Quedaste afuera</Title>
          <Sub style={{ marginBottom: 0 }}>Mirá cómo sigue la partida arriba.</Sub>
        </Card>
      ) : currentGrid ? (
        <>
          <Sub style={{ marginTop: 0, marginBottom: 8, fontSize: 13 }}>
            Resueltas: <b style={{ color: "#FFD23F" }}>{myState.solvedCount || 0}</b> · Pendientes:{" "}
            <b style={{ color: "#FFD23F" }}>{myState.queue.length}</b>
          </Sub>
          <GridBoard
            grid={currentGrid}
            onTap={tapCell}
            shake={wrongFlash}
            bw={bwPhase || myBwDebuff || finalG2Cycle || myGuerraFlicker}
            locked={locked || myFrozen || inCountdown}
            spinning={(myState && myState.spinning) || 0}
          />
          <ColorIndicator grid={currentGrid} bw={bwPhase || myBwDebuff || finalG2Cycle || myGuerraFlicker} />
          {locked && !myFrozen && <PenaltyNotice />}
          {myFrozen && (
            <div style={{ textAlign: "center", color: "#4FC3F7", fontWeight: 800, fontFamily: "'Baloo 2', sans-serif", fontSize: 14, marginTop: 12 }}>
              🥶 Congelado {Math.max(0, Math.ceil((myFreezeUntil - now) / 1000))}s...
            </div>
          )}
          {myBwDebuff && (
            <div style={{ textAlign: "center", color: "#C9B8F0", fontWeight: 800, fontFamily: "'Baloo 2', sans-serif", fontSize: 14, marginTop: 12 }}>
              ⚫⚪ Te pusieron blanco y negro
            </div>
          )}
          {myGuerraFlickerActive && (
            <div style={{ textAlign: "center", color: "#C9B8F0", fontWeight: 800, fontFamily: "'Baloo 2', sans-serif", fontSize: 14, marginTop: 12 }}>
              ⚫⚪ Blanco y negro intermitente{myGuerraFlickerStack >= 2 ? " (x2, fase gris más larga)" : ""} — {Math.max(0, Math.ceil(((myState.flickerUntil || 0) - now) / 1000))}s
            </div>
          )}
          {myState && myState.spinning > 0 && (
            <div style={{ textAlign: "center", color: "#B983FF", fontWeight: 800, fontFamily: "'Baloo 2', sans-serif", fontSize: 14, marginTop: 12 }}>
              🌀 ¡Te mandaron a girar{myState.spinning >= 2 ? " al doble de velocidad" : ""}! Terminá la grilla para que pare.
            </div>
          )}
          {myState && myState.twoOneStack > 0 && (
            <div style={{ textAlign: "center", color: "#2EC4B6", fontWeight: 800, fontFamily: "'Baloo 2', sans-serif", fontSize: 14, marginTop: 12 }}>
              {myState.twoOneStack >= 2
                ? "♻️ ¡Te pusieron 4-3! Cada 4 piezas que limpiás, reaparecen 3."
                : "♻️ ¡Te pusieron 2-1! Cada 2 piezas que limpiás, reaparece 1."}
            </div>
          )}
          {currentGrid && currentGrid.giant && (
            <div style={{ textAlign: "center", color: "#4FC3F7", fontWeight: 800, fontFamily: "'Baloo 2', sans-serif", fontSize: 14, marginTop: 12 }}>
              🔲 ¡Te agrandaron la grilla{currentGrid.giantStack >= 2 ? " al máximo" : ""}! Cada tap limpia {GUERRA_GIANT_CLEAR_BY_STACK[currentGrid.giantStack || 1]} piezas de una.
            </div>
          )}
          {currentGrid && currentGrid.rainbowStack === 1 && (
            <div style={{ textAlign: "center", color: "#E64AC9", fontWeight: 800, fontFamily: "'Baloo 2', sans-serif", fontSize: 14, marginTop: 12 }}>
              🌈 ¡Te pusieron 16 colores! Hay que ir cambiando de color seguido.
            </div>
          )}
          {currentGrid && currentGrid.rainbowStack >= 2 && (
            <div style={{ textAlign: "center", color: "#E64AC9", fontWeight: 800, fontFamily: "'Baloo 2', sans-serif", fontSize: 14, marginTop: 12 }}>
              🌈 ¡Cada pieza es de un color distinto! ({currentGrid.pieces.length} colores en total)
            </div>
          )}
          {finalG3 && (
            <div style={{ textAlign: "center", color: "#8b7fa8", fontWeight: 700, fontSize: 13, marginTop: 12 }}>
              Última grilla: 4 tonos de gris. Tocar mal pausa el cronómetro 2s.
            </div>
          )}
        </>
      ) : (
        <Card style={{ width: "100%", maxWidth: 420, textAlign: "center" }}>
          <div style={{ fontSize: 40, marginBottom: 6 }}>✅</div>
          <Title size={18}>{stage === "final" ? "¡Terminaste tus 3 grillas!" : "¡Terminaste esta etapa!"}</Title>
          <Sub style={{ marginBottom: 0 }}>Esperando a que terminen los demás...</Sub>
        </Card>
      )}

      {attackCtx && attackCtx.type === "choose" && (
        <GuerraAttackPicker
          hideGridExtra={(() => {
            // La grilla extra ya no aparece como opción cuando no queda
            // NADIE a quien mandársela — es decir, cuando cada rival vivo y
            // sin terminar ya está en gridExtraSentTo.
            const already = new Set((myState && myState.gridExtraSentTo) || []);
            const stillEligible = players.some((p) => p.id !== myId && !(playerStates[p.id] || {}).finishedAt && !already.has(p.id));
            return !stillEligible;
          })()}
          onChoose={(chosenType) => {
            const meta = GUERRA_ATTACK_META[chosenType];
            // A quién le puedo mandar ESTE tipo en particular: para grilla
            // extra, se descartan los rivales que ya la recibieron de mí
            // (una vez por persona en toda la partida); para el resto, da
            // igual — se puede repetir siempre.
            let targets = players.filter((p) => p.id !== myId && !(playerStates[p.id] || {}).finishedAt);
            if (chosenType === "grid") {
              const already = new Set((myState && myState.gridExtraSentTo) || []);
              targets = targets.filter((p) => !already.has(p.id));
            }
            // Si solo queda un rival posible para este tipo, se manda
            // directo (sin abrir el selector de a quién) — mismo atajo que
            // ya usa la Final cuando queda un único rival para girar.
            if (targets.length === 1) {
              performAttack(targets[0].id, chosenType);
            } else {
              setAttackCtx({ type: chosenType, title: meta.title, subtitle: meta.subtitle });
            }
          }}
          onSkip={() => setAttackCtx(null)}
        />
      )}
      {attackCtx && attackCtx.type !== "choose" && (
        <TargetPicker
          players={players}
          playerStates={playerStates}
          myId={myId}
          myLastAttacked={myState ? myState.lastAttacked : null}
          eliminationOrder={room.eliminationOrder}
          allowRepeat={stage === "guerra"}
          excludeIds={stage === "guerra" && attackCtx.type === "grid" ? (myState && myState.gridExtraSentTo) || [] : null}
          title={attackCtx.title}
          subtitle={attackCtx.subtitle}
          onAttack={performAttack}
          onSkip={() => setAttackCtx(null)}
        />
      )}

      <BigButton
        onClick={leaveRoom}
        color="transparent"
        style={{ boxShadow: "none", color: "#C9B8F0", marginTop: 20 }}
      >
        Salir de la sala
      </BigButton>
    </Screen>
  );
}

function App() {
  useInjectFont();
  const [mode, setMode] = useState("home");
  const [roomCode, setRoomCode] = useState(null);
  const [myId, setMyId] = useState(null);

  if (mode === "home") return <Home onSelect={setMode} />;
  if (mode === "practice") return <PracticeGame onBack={() => setMode("home")} />;
  if (mode === "game" && roomCode && myId) {
    return (
      <GameRoom
        roomCode={roomCode}
        myId={myId}
        onBack={() => {
          setRoomCode(null);
          setMyId(null);
          setMode("home");
        }}
      />
    );
  }
  return (
    <JoinScreen
      onJoined={(code, id) => {
        setRoomCode(code);
        setMyId(id);
      }}
      onBack={() => setMode("home")}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
