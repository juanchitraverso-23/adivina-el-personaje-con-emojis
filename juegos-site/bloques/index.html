<!-- Adelanta la conexión (DNS + TLS) a los dos hosts externos de los que
     depende esta página para arrancar — la tipografía y React/Babel —
     así cuando el HTML llega a pedirlos de verdad, la conexión ya está
     lista y se ahorra esa ida y vuelta. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  /* El fondo real (sol + nubes + piso) lo pinta React recién al montar;
     hasta entonces se ve este mismo degradé de cielo (idéntico al de
     BgScene) en vez de un color plano, para que la llegada desde la home
     se sienta continua y no como un salto a "página negra". */
  html, body { margin:0; padding:0; background: linear-gradient(180deg, #2A0F5E 0%, #5A1F94 20%, #9435B0 42%, #E84F8C 62%, #FF6B3D 80%, #FFC93D 100%); background-attachment: fixed; }
  #root { min-height: 100vh; }

  /* ---------- Escena estática (sol+nubes+piso) idéntica a BgScene, pero en
     HTML/CSS puro: pinta YA, sin esperar a que cargue React, para que la
     llegada desde la home se sienta tan fluida como la vuelta al menú
     (que es 100% estática). En cuanto React monta algo en #root, un
     script la saca y queda la escena real. ---------- */
  .jxpre-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .jxpre-sky { position: absolute; inset: 0; background: linear-gradient(180deg, #2A0F5E 0%, #5A1F94 20%, #9435B0 42%, #E84F8C 62%, #FF6B3D 80%, #FFC93D 100%); }
  .jxpre-sun {
    position: absolute; left: 50%; top: 7%; width: 120px; height: 120px; margin-left: -60px;

  }
  @keyframes jxpre-sun-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .jxpre-clouds { position: absolute; inset: 0; overflow: hidden; }
  .jxpre-cloud { position: absolute; font-size: 30px; opacity: 0.92; filter: drop-shadow(0 3px 0 rgba(0,0,0,0.18)); animation: jxpre-drift linear infinite; }
  .jxpre-cloud.c1 { top: -5.6%; font-size: 38px; animation-duration: 48s; animation-delay: -25s; }
  .jxpre-cloud.c2 { top: -3.9%; font-size: 52px; animation-duration: 32s; animation-delay: -34s; }

  .jxpre-cloud.c7 { top: 16.2%; font-size: 44px; animation-duration: 44s; animation-delay: -12s; }
  .jxpre-cloud.c8 { top: 17.3%; font-size: 40px; animation-duration: 36s; animation-delay: -3s; }
  .jxpre-cloud.c9 { top: 21.8%; font-size: 32px; animation-duration: 38s; animation-delay: -9s; }
  .jxpre-cloud.c10 { top: 24.1%; font-size: 36px; animation-duration: 24s; animation-delay: -4s; }
  .jxpre-cloud.c11 { top: 28.2%; font-size: 44px; animation-duration: 34s; animation-delay: -11s; }
  .jxpre-cloud.c12 { top: 32.5%; font-size: 30px; animation-duration: 24s; animation-delay: -25s; }
  .jxpre-cloud.c13 { top: 34.6%; font-size: 28px; animation-duration: 38s; animation-delay: -15s; }
  .jxpre-cloud.c14 { top: 38.6%; font-size: 48px; animation-duration: 30s; animation-delay: -15s; }
  .jxpre-cloud.c15 { top: 43.4%; font-size: 30px; animation-duration: 48s; animation-delay: -8s; }
  .jxpre-cloud.c16 { top: 46.6%; font-size: 46px; animation-duration: 42s; animation-delay: -11s; }
  @keyframes jxpre-drift { from { transform: translateX(115vw); } to { transform: translateX(-45vw); } }
  .jxpre-floor {
    position: absolute; left: -70%; right: -70%; bottom: -4%; height: 36vh;
    background-color: #3a1665;
    background-image: linear-gradient(90deg, rgba(255,255,255,0.16) 50%, transparent 50%), linear-gradient(rgba(255,255,255,0.16) 50%, transparent 50%);
    background-size: 64px 64px;
    transform: perspective(280px) rotateX(58deg);

  }
  @keyframes jxpre-floor-move { from { background-position: 0 0, 0 0; } to { background-position: 64px 0, 0 64px; } }
  .jxpre-fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,6,32,0) 0%, rgba(12,6,32,0.15) 40%, rgba(12,6,32,0.6) 75%, rgba(12,6,32,0.9) 100%); }
  @media (prefers-reduced-motion: reduce) {
    .jxpre-sun, .jxpre-cloud, .jxpre-floor { animation: none; }

<div id="root"></div>
<script>
  // Apenas React mete el primer contenido en #root, sacamos esta escena
  // estática (ya cumplió su función) y queda la real. OJO: este script
  // tiene que ir DESPUÉS del <div id="root">, si no getElementById("root")
  // da null (el parser todavía no llegó a esa línea) y el observer nunca
  // se arma.
  (function () {
    var root = document.getElementById("root");
    var pre = document.getElementById("jxPreScene");
    if (!root || !pre) return;
    var obs = new MutationObserver(function () {
      if (root.childElementCount > 0) {
        pre.remove();
        obs.disconnect();
      }
    });
    obs.observe(root, { childList: true });
  })();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ============================================================
// Bloques en Cadena: hasta 8 jugadores, cada uno en su celu.
// Cada grilla es un tablero 10x10 cubierto de piezas tipo Tetris
// de 6 colores. Los colores se revelan de a uno: hay que tocar
// todas las piezas del color activo para pasar al siguiente, hasta
// vaciar el tablero entero. Cada grilla resuelta te da una ficha
// de ataque para mandarle una grilla extra a un rival (como una
// línea de Tetris). Cada 1 minuto queda afuera quien tenga más
// grillas pendientes (si hay empate, siguen todos); quien llegue a
// 10 pendientes por ataques queda afuera al instante. Al quedar 2
// en pie es la final: no hay más ataques y su grilla actual
// parpadea entre colores y blanco y negro cada 5 segundos, hasta
// que uno de los dos la termina y gana.
// ============================================================
const STORAGE_PREFIX = "bloques:sala:";
const POLL_MS = 1000;
// El listado de "salas abiertas ahora" (JoinScreen, antes de entrar a
// jugar) usa list() de Workers KV, que en el plan gratuito tiene una
// cuota diaria mucho más chica que get() (1.000/día contra 100.000/día,
// compartida por todo el sitio). No hace falta que se actualice cada
// segundo — nadie necesita precisión al segundo para ver qué salas hay
// abiertas — así que sondea bastante más espaciado.
const LOBBY_LIST_POLL_MS = 8000;
// Igual motivo que LOBBY_LIST_POLL_MS (cuota diaria compartida de
// Workers KV), pero del lado de las escrituras: agrupa los clicks
// seguidos de cada jugador en una sola escritura en vez de una por
// click (ver hasPendingWrite/scheduleSync más abajo).
const SYNC_DEBOUNCE_MS = 500;
const SESSION_KEY = "bloques:sesion";
const MAX_PLAYERS = 16;
const GRID_SIZE = 10;
const PRACTICE_BEST_KEY = "bloques:practica:mejorTiempo";
const DEFAULT_GRID_COUNT = 3; // cantidad de grillas por defecto en Práctica (elegible ahí, ver PracticeGame)
const GRID_COUNT_OPTIONS = [3, 5, 7];
const DEFAULT_GUERRA_GRID_COUNT = 5; // modo Guerra: mismo selector 3/5/7 que Práctica, 5 por defecto

// ---- Modo Guerra online: torneo por etapas (ver comentario grande antes
// de GameRoom para el detalle completo de reglas por etapa). ----
const COUNTDOWN_MS = 5000; // "preparate" antes de cada ronda/etapa nueva, para que nadie arranque con ventaja
const FLICKER_PERIOD_MS = 5000; // etapa de eliminación: la última grilla parpadea color/blanco y negro cada 5s
const FINAL_G2_BW_MS = 5000; // Final, grilla 2: fase en blanco y negro
const FINAL_G2_COLOR_MS = 2000; // Final, grilla 2: fase a color (se alternan sin parar)
const FINAL_WRONG_FREEZE_MS = 3000; // Final, grillas 1 y 2: tocar mal frena los clicks 3s
const FINAL_G3_WRONG_PAUSE_MS = 2000; // Final, grilla 3 (escala de grises): tocar mal pausa el cronómetro 2s (no frena clicks)
const SEMI_FREEZE_MS = 5000; // etapa de 3: cada ataque de freeze suma 5s (se acumulan)
const SPIN_PERIOD_MS = 16000; // Final: la grilla atacada gira, una vuelta cada 16s
const BW_DEBUFF_MS = 15000; // etapa de 3: "blanco y negro" dura como máximo esto — antes quedaba pegado para siempre si nadie mandaba un segundo ataque igual para cancelarlo
// Modo Guerra — girar, blanco y negro intermitente, grilla gigante y
// colores extra se pueden recibir hasta GUERRA_MAX_STACK veces (2) en la
// MISMA grilla: la segunda vez no se cancela, se suma y el efecto se hace
// más fuerte (ver cada ataque abajo). Ni bien resolvés la grilla entera,
// se te sacan todos (completeCurrentGrid). La grilla extra (🧱, distinta
// de "colores extra") es aparte: no se acumula ni tiene tope de veces,
// pero solo se le puede mandar UNA vez a cada rival en toda la partida
// (gridExtraSentTo). Colores extra: 1 vez son 16 colores fijos; la 2da
// vez, CADA pieza queda de un color distinto (tantos colores como piezas
// tenga la grilla en ese momento — ver generateDistinctColors). Se puede
// combinar con grilla gigante (una grilla puede terminar siendo gigante Y
// con colores extra a la vez, cada ataque preserva el nivel del otro).
const GUERRA_MAX_STACK = 2;
const GUERRA_FLICKER_MS = 15000; // "blanco y negro intermitente": cada vez que te lo mandan (hasta 2 veces) se suma este tiempo a lo que te queda activo — mismo patrón que el freeze de Semifinal
// "grilla gigante": el usuario probó las dos aplicaciones en familia y
// pidió rebalancear — la de 1 vez (antes x2 por dimensión, 4 veces más
// piezas) ya era "muy difícil", y la de 2 veces (antes x4, 16 veces más
// piezas) resultaba "imposible". Se corrió todo un escalón: la de 1 vez
// ahora es más liviana (x1.4 por dimensión, ~el doble de piezas), y la
// de 2 veces (máximo) es lo que ANTES hacía una sola aplicación (x2 por
// dimensión, 4 veces más piezas) — "un ataque más leve, y que dos
// ataques sea lo mismo que hoy es uno solo". El tap también limpia menos
// de golpe en el nivel liviano, proporcional al tamaño de cada uno.
const GUERRA_GIANT_SIZE_MULT_BY_STACK = { 1: 1.4, 2: 2 };
const GUERRA_GIANT_CLEAR_BY_STACK = { 1: 2, 2: 4 };
const LARA_RAINBOW_COLOR_COUNT = 8; // "16 colores": para Lara, la mitad (8) — misma proporción que el resto de sus ventajas
// Modo Guerra: si pasan 30 segundos SIN que limpies ni una pieza (ni una
// sola, ver tapCell), se te sacan todos los ataques que tenías encima y
// la grilla que tenías abierta vuelve a ser estándar (normal, sin
// gigante ni colores extra) — pedido del usuario porque algunas
// combinaciones se vuelven demasiado difíciles y sin esto podías quedar
// pegado para siempre (al principio eran 2 minutos desde el último
// ataque recibido; después pasó a 1 minuto sin limpiar nada; ahora la
// mitad de eso). Cualquier limpieza reinicia la cuenta (y también un
// ataque nuevo, o pasar a la siguiente grilla — ver lastClearAt).
const GUERRA_ATTACK_EXPIRE_MS = 30000;
// Cantidad de grillas por etapa: fija (no elegible), así quedó después de
// jugarlo en familia — de entrada son 3, la etapa de 3 jugadores son 4, y
// la final son 3.
const STAGE_GRID_COUNT = { elim: 3, semifinal: 4, final: 3 };

// Ventaja para Lara (7 años): mismas reglas para todos, pero si alguien
// entra con ese nombre juega con una grilla menos por etapa, grillas más
// chicas y con menos colores (más fáciles de resolver), y los efectos que
// frenan/oscurecen la pantalla (freeze al errar, blanco y negro) le duran
// menos cuando le tocan a ella — nunca a quienes la atacan a ella ni a
// nadie más. No es una opción del lobby: se detecta sola por el nombre,
// así no hace falta que nadie se acuerde de activar nada.
function isLaraName(name) {
  return typeof name === "string" && name.trim().toLowerCase() === "lara";
}
const LARA_GRID_SIZE = 7; // en vez de 10x10
const LARA_COLOR_COUNT = 4; // en vez de 6 colores por grilla
const LARA_WRONG_FREEZE_MS = 500; // en vez de 1000 (elim/semifinal, tocar mal)
const LARA_FINAL_WRONG_FREEZE_MS = 1500; // en vez de 3000 (Final, grillas 1 y 2)
const LARA_FINAL_G3_WRONG_PAUSE_MS = 1000; // en vez de 2000 (Final, grilla 3)
const LARA_SEMI_FREEZE_MS = 2500; // en vez de 5000, cuando LA congelan (no cuando ataca)
const LARA_FLICKER_COLOR_MS = 8000; // elim: más tiempo a color...
const LARA_FLICKER_BW_MS = 2000; // ...y menos tiempo en blanco y negro
const LARA_FINAL_G2_BW_MS = 2500; // Final grilla 2: menos tiempo en blanco y negro...
const LARA_FINAL_G2_COLOR_MS = 3500; // ...y más tiempo a color

const PLAYER_COLORS = [
  "#FF3E7F", "#5B4B8A", "#FFD23F", "#3DDC84",
  "#4FC3F7", "#FF9F1C", "#B983FF", "#FF6B6B",
  "#2EC4B6", "#C9E265", "#FF8AD8", "#7C9BFF",
  "#F4A261", "#8DE0A0", "#C77DFF", "#FF6FA0",
];

const PIECE_COLORS = [
  { key: "red", hex: "#FF5D7A", name: "Rojo" },
  { key: "blue", hex: "#4FC3F7", name: "Celeste" },
  { key: "yellow", hex: "#FFD23F", name: "Amarillo" },
  { key: "green", hex: "#3DDC84", name: "Verde" },
  { key: "purple", hex: "#B983FF", name: "Violeta" },
  { key: "orange", hex: "#FF9F1C", name: "Naranja" },
];
// La última grilla de la Final no usa colores: son 4 tonos de gris (blanco
// a negro, bien separados entre sí) en vez de los 6 colores de siempre.
const GRAYSCALE_COLORS = [
  { key: "gray1", hex: "#F4F4F6", name: "Blanco" },
  { key: "gray2", hex: "#9A9BA3", name: "Gris claro" },
  { key: "gray3", hex: "#4E4F56", name: "Gris oscuro" },
  { key: "gray4", hex: "#17171A", name: "Negro" },
];
const PIECE_COLOR_KEYS = PIECE_COLORS.map((c) => c.key);
const GRAYSCALE_COLOR_KEYS = GRAYSCALE_COLORS.map((c) => c.key);
// Ataque "16 colores" del modo Guerra: 10 colores más, sumados a los 6 de
// siempre, para llegar a 16 bien distinguibles entre sí.
const RAINBOW_EXTRA_COLORS = [
  { key: "pink", hex: "#FF6FA0", name: "Rosa" },
  { key: "teal", hex: "#2EC4B6", name: "Turquesa" },
  { key: "lime", hex: "#C4E538", name: "Lima" },
  { key: "indigo", hex: "#6C5DD3", name: "Índigo" },
  { key: "magenta", hex: "#E64AC9", name: "Magenta" },
  { key: "cyan", hex: "#22D3EE", name: "Cian" },
  { key: "brown", hex: "#C97B3D", name: "Marrón" },
  { key: "olive", hex: "#9AA83C", name: "Oliva" },
  { key: "maroon", hex: "#A83250", name: "Bordó" },
  { key: "steel", hex: "#6E8FB0", name: "Acero" },
];
const RAINBOW_COLORS = [...PIECE_COLORS, ...RAINBOW_EXTRA_COLORS];
const RAINBOW_COLOR_KEYS = RAINBOW_COLORS.map((c) => c.key);
const PIECE_COLORS_MAP = Object.fromEntries([...PIECE_COLORS, ...GRAYSCALE_COLORS, ...RAINBOW_EXTRA_COLORS].map((c) => [c.key, c]));

function randomId() {
  return Math.random().toString(36).slice(2, 10);
}
function randomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
const MY_DEVICE_ID = (() => {
  const KEY = "bloques:deviceId";
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = randomId();
    localStorage.setItem(KEY, id);
  }
  return id;
})();

// ---------- Sonido ----------
// Pedido del usuario: "sonidos divertidos... plop cuando vas terminando
// grillas... y cuando atacamos que se escuche fuerte el nombre de quien
// atacaste y el poder que tiraste". Todo generado con la Web Audio API
// (osciladores + envolventes) en vez de archivos de sonido — mismo
// espíritu que critter.js (nada de assets externos, así no hay
// problema de licencias ni peso agregado al sitio). El relato del
// ataque usa la síntesis de voz del navegador (SpeechSynthesis): es la
// única forma de "decir" un nombre de jugador que no conocemos de
// antemano. Con mute persistente para no volverse molesto en partidas
// largas — ver SoundToggleButton, en Screen.
const SOUND_MUTE_KEY = "bloques:sonido:mute";
// Pedido nuevo del usuario: además del mute personal de arriba (por
// dispositivo, en localStorage), el anfitrión/a de una sala Guerra/Torneo
// puede apagar el sonido para TODA la sala (room.soundOff) — es una sola
// decisión que vale para todos los jugadores. GameRoom mantiene esta
// variable de módulo sincronizada con room.soundOff (ver el useEffect
// cerca de expireAttacksRef), así isSoundMuted() sirve como el único
// chequeo que ya usan todas las funciones de sonido, sin tener que
// pasarles `room` a cada una.
let bloquesRoomSoundOff = false;
function setBloquesRoomSoundOff(value) {
  bloquesRoomSoundOff = !!value;
}
function isSoundMuted() {
  if (bloquesRoomSoundOff) return true;
  try {
    return localStorage.getItem(SOUND_MUTE_KEY) === "1";
  } catch {
    return false;
  }
}
function setSoundMuted(muted) {
  try {
    localStorage.setItem(SOUND_MUTE_KEY, muted ? "1" : "0");
  } catch {}
}
let bloquesAudioCtx = null;
function getAudioCtx() {
  // Los navegadores exigen un gesto del usuario para arrancar/reanudar el
  // audio — como esto solo se llama desde adentro de un onClick (tocar
  // una pieza, mandar un ataque), siempre estamos dentro de ese gesto.
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!bloquesAudioCtx) bloquesAudioCtx = new AC();
  if (bloquesAudioCtx.state === "suspended") bloquesAudioCtx.resume();
  return bloquesAudioCtx;
}
// Un tono cortito con ataque instantáneo y caída exponencial — la base de
// todos los efectos de acá. type/gain/duration bajitos a propósito: se
// dispara en cada tap, así que tiene que ser un click satisfactorio, no
// un ruido cansador a la centésima vez.
function playTone(freq, { duration = 0.12, type = "sine", gain = 0.16, delay = 0 } = {}) {
  if (isSoundMuted()) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(g);
  g.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}
// "Plop" al limpiar una pieza: una escala tipo marimba (una nota por
// posición en colorOrder), así cada color suena distinto en vez del
// mismo click repetido todo el rato — el "algo más sutil por colores"
// que pidió el usuario.
const PLOP_SCALE = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5, 1174.66, 1318.51];
function playPlop(colorIndex) {
  const i = ((colorIndex % PLOP_SCALE.length) + PLOP_SCALE.length) % PLOP_SCALE.length;
  playTone(PLOP_SCALE[i], { duration: 0.1, type: "triangle", gain: 0.13 });
}
// Fanfarria cortita al terminar una grilla entera.
function playGridDone() {
  if (isSoundMuted()) return;

// ---------- Tablero de piezas ----------
// Toda la grilla se ve en color y al mismo brillo desde el arranque (no hay
// piezas "bloqueadas" en gris): el único indicador de qué color tocar es el
// cuadrado grande de abajo. Tocar una pieza de otro color no hace nada más
// que sacudir el tablero (shake).
// Busca la definición {hex,name} de un color de pieza: primero en la
// propia grilla (grid.colorDefs — donde viven los colores generados al
// vuelo del ataque "colores extra" al máximo, que NO existen en el mapa
// global porque son distintos en cada grilla y viajan pegados a ella en
// el JSON del estado), y si no está ahí, en el mapa global de siempre
// (los 6/16 colores fijos de toda la vida).
function colorDefFor(grid, key) {
  return (grid.colorDefs && grid.colorDefs[key]) || PIECE_COLORS_MAP[key];
}
// "Firma" del efecto de un ataque sobre el estado de un jugador — un
// valor chico que cambia si y solo si ESE ataque en particular está
// presente/aplicado. La usa performAttack para verificar (después de
// escribir) que el ataque realmente quedó puesto y no se lo pisó una
// escritura concurrente del propio rival (ver el comentario grande en
// performAttack). Cada tipo mira el campo que ese ataque en particular
// toca — girar/blanco y negro/freeze/bw viven en el jugador directamente,
// mientras que grilla gigante y colores extra reemplazan la grilla de la
// posición 0 entera (su gid cambia), y grilla extra le suma una al final
// (cambia el largo de la cola).
function attackSignature(type, st) {
  if (!st) return null;
  const q = st.queue || [];
  if (type === "bw") return st.bwUntil || 0;
  if (type === "flicker") return (st.flickerStack || 0) + ":" + (st.flickerUntil || 0);
  if (type === "freeze") return st.freezeUntil || 0;
  if (type === "spin") return st.spinning || 0;
  if (type === "twoOne") return st.twoOneStack || 0;
  if (type === "giant" || type === "rainbow") return q[0] ? q[0].gid : null;
  return q.length; // "grid" (grilla extra)
}
function GridBoard({ grid, onTap, shake, bw, locked, spinning }) {
  const borders = useMemo(() => computeCellBorders(grid.size, grid.cellPiece), [grid.cellPiece]);
  // `spinning` es la cantidad de veces que le mandaron el ataque de girar
  // (0 = no gira, 1 = velocidad normal, 2 = el doble de rápido en Guerra —
  // ver GUERRA_MAX_STACK). La animación es la misma clase de siempre, pero
  // con la duración calculada acá para poder variar la velocidad; en las
  // demás etapas spinning nunca pasa de 1, así que se ve igual que antes.
  const spinStack = spinning || 0;

  // Pedido del usuario: multitouch — poder limpiar varias piezas a la vez
  // tocándolas con varios dedos juntos. El onClick de siempre (más abajo)
  // NO alcanza para esto: los navegadores solo emulan un evento "click" a
  // partir del PRIMER dedo de un gesto multitouch — el resto de los dedos
  // que tocan al mismo tiempo no generan click en absoluto (así lo define
  // el estándar de Touch Events). Por eso acá se escucha "touchstart" a
  // mano, con addEventListener directo (NO el onTouchStart de React: desde
  // React 17 ese listener se registra "passive", y ahí preventDefault() no
  // hace nada — necesitamos que sí haga algo, para evitar el click
  // duplicado del dedo principal). onTapRef mantiene siempre la versión más
  // nueva de `onTap` sin tener que volver a registrar el listener en cada
  // render (mismo patrón que onCritterTapRef/expireAttacksRef en GameRoom).
  const onTapRef = useRef(onTap);
  onTapRef.current = onTap;
  const boardRef = useRef(null);
  useEffect(() => {
    const el = boardRef.current;
    if (!el) return;
    const handleTouchStart = (e) => {
      // Frena el click emulado del dedo principal (si no, esa pieza se
      // tocaría dos veces: una acá, otra por el onClick de siempre) y
      // cualquier gesto propio del navegador (zoom, scroll) en esta zona.
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const target = document.elementFromPoint(t.clientX, t.clientY);
        const btn = target && target.closest && target.closest("[data-cell-idx]");
        if (!btn || btn.disabled) continue;
        onTapRef.current(Number(btn.dataset.cellIdx));
      }
    };
    el.addEventListener("touchstart", handleTouchStart, { passive: false });
    return () => el.removeEventListener("touchstart", handleTouchStart);
  }, []);

  return (
    <div
      ref={boardRef}
      className={spinStack > 0 ? "bloques-spin" : ""}
      style={{
        // Pedido del usuario: relieve/3D en las piezas y transiciones más
        // vivas, "sin perder velocidad" — por eso el relieve es un
        // gradiente en vez de sombras (mucho más barato de pintar cuando
        // hay cientos de celdas, como en una grilla gigante), y la
        // animación de "tocada" es solo transform/opacity (acelerado por
        // GPU, no dispara reflow) y se aplica nada más que a la pieza que
        // se tocó, no a la grilla entera. Ver la clase .bloques-piece más
        // abajo — mismo <style> que ya usa .bloques-spin, siempre
        // presente porque GridBoard es compartido entre Guerra/etapas y
        // Práctica.
        display: "grid",
        // minmax(0, 1fr) y no 1fr a secas: por default una columna de grid
        // no se achica más allá del contenido "mínimo" de lo que tiene
        // adentro, y un <button> en iOS Safari (a diferencia de Mac Safari,
        // que es más laxo con esto) impone un ancho mínimo propio bastante
        // grande si no se lo saca de encima — con pocas columnas no se
        // nota, pero con las 20-40 columnas de una grilla gigante del modo
        // Guerra, esos mínimos sumados empujan la grilla entera bien
        // afuera de la pantalla del celular. minmax(0, 1fr) le dice a cada
        // columna "no tenés mínimo", y listo.
        gridTemplateColumns: `repeat(${grid.size}, minmax(0, 1fr))`,
        gap: 2,
        width: "100%",
        maxWidth: 460,
        margin: "0 auto",
        padding: 6,
        borderRadius: 14,
        border: shake ? "2px solid #FF5D7A" : "2px solid transparent",
        filter: bw ? "grayscale(1)" : "none",
        opacity: locked ? 0.55 : 1,
        transition: "filter 0.6s ease, opacity 0.15s ease",
        boxSizing: "border-box",
        // Refuerza el preventDefault() de arriba: sin esto, en el ratito
        // antes de que el listener de touchstart corra, el navegador puede
        // igual arrancar a interpretar el gesto como scroll/zoom.
        touchAction: "none",
        animationDuration: spinStack > 0 ? Math.round(SPIN_PERIOD_MS / spinStack) + "ms" : undefined,
      }}
    >
      <style>{`
        /* Relieve/3D de las piezas + feedback de toque, pedido por el
           usuario ("meterle una especie de relieve"): el brillo es un
           gradiente (una sola pintada, barato incluso con cientos de
           celdas), y el "toque" es nada más que transform+filter — no
           dispara layout ni pinta de nuevo la grilla entera, así que no
           cuesta velocidad ni en una grilla gigante de cientos de piezas.
        */
        .bloques-piece { transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.12s ease, opacity 0.25s ease; }
        .bloques-piece:active:not(:disabled) { transform: scale(0.84); filter: brightness(1.25); }
      `}</style>
      {grid.cellPiece.map((pieceId, i) => {
        const piece = pieceId >= 0 ? grid.pieces[pieceId] : null;
        const cleared = !piece || piece.cleared;
        const colorDef = piece ? colorDefFor(grid, piece.color) : null;
        const b = borders[i];
        const borderColor = "rgba(10,5,26,0.55)";
        return (
          <button
            key={i}
            className="bloques-piece"
            data-cell-idx={i}
            onClick={() => !cleared && !locked && onTap(i)}
            disabled={cleared || locked}
            style={{
              // appearance: none + minWidth/minHeight: 0 — refuerzan lo de
              // minmax(0, 1fr) de arriba: sin esto, iOS Safari le sigue
              // aplicando al <button> su apariencia/tamaño nativo por
              // debajo, y esa mínima intrínseca puede seguir empujando la
              // columna aunque el grid ya le haya dicho que no tiene piso.
              appearance: "none",
              WebkitAppearance: "none",
              minWidth: 0,
              minHeight: 0,
              boxSizing: "border-box",
              aspectRatio: "1",
              borderRadius: 4,
              padding: 0,
              cursor: cleared || locked ? "default" : "pointer",
              borderTop: b.top ? "2px solid " + borderColor : "2px solid transparent",
              borderLeft: b.left ? "2px solid " + borderColor : "2px solid transparent",
              borderRight: b.right ? "2px solid " + borderColor : "2px solid transparent",
              borderBottom: b.bottom ? "2px solid " + borderColor : "2px solid transparent",
              // El relieve: un brillo arriba a la izquierda que se apaga
              // hacia una sombra abajo a la derecha, como una piecita de
              // verdad en vez de un cuadrado plano. Al limpiarla, un
              // pequeño achique + desvanecido (transform/opacity, ver
              // .bloques-piece) en vez del cambio brusco de antes.
              background: cleared
                ? "rgba(255,255,255,0.04)"
                : `linear-gradient(155deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.05) 45%, rgba(0,0,0,0.18) 100%), ${colorDef.hex}`,
              transform: cleared ? "scale(0.78)" : "scale(1)",
              opacity: cleared ? 0.7 : 1,
            }}
          />
        );
      })}
    </div>
  );
}

// Cuadrado grande debajo de la grilla: muestra el color que hay que tocar
// ahora. Cuando se agota ese color, este indicador cambia al siguiente.
function ColorIndicator({ grid, bw }) {
  const activeColor = grid.colorOrder[grid.activeColorIndex];
  const colorDef = colorDefFor(grid, activeColor);
  const remaining = grid.pieces.filter((p) => p.color === activeColor && !p.cleared).length;
  // Ataque "colores extra" al máximo: cada pieza es de un color distinto
  // generado al vuelo (colorDef.name es genérico, "este color" — no tiene
  // sentido escribirlo en mayúsculas como si fuera un nombre real).
  const isDynamicColor = !!(grid.colorDefs && grid.colorDefs[activeColor]);
  return (
    <div
      style={{
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        gap: 8,
        marginTop: 16,
        filter: bw ? "grayscale(1)" : "none",
        transition: "filter 0.6s ease",
      }}
    >
      <style>{`
        @keyframes bloques-swatch-pop { 0% { transform: scale(0.7); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .bloques-swatch { animation: bloques-swatch-pop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
      `}</style>
      <div
        key={activeColor}
        className="bloques-swatch"
        style={{
          width: 72,
          height: 72,
          borderRadius: 18,
          background: `radial-gradient(circle at 32% 26%, rgba(255,255,255,0.65), rgba(255,255,255,0) 45%), ${colorDef.hex}`,
          boxShadow: "0 6px 0 rgba(0,0,0,0.3), inset 0 0 0 3px rgba(255,255,255,0.35), inset 0 -10px 14px rgba(0,0,0,0.2)",
        }}
      />
      <div
        style={{
          fontFamily: "'Baloo 2', sans-serif",
          fontWeight: 800,
          color: colorDef.hex,
          fontSize: 16,
          textAlign: "center",
        }}
      >
        {isDynamicColor ? "🎨 Tocá la pieza de este color" : `Tocá todas las ${colorDef.name.toUpperCase()} · quedan ${remaining}`}
      </div>
    </div>
  );
}

function PlayerBadgeRow({ players, playerStates, myId, eliminationOrder }) {
  // A quién ya eliminamos es autoridad de la sala (room.eliminationOrder),
  // no algo que se pueda inferir de si playerStates trae su id: alguien
  // eliminado en una etapa anterior no tiene estado en la ronda actual
  // (cada etapa tiene su propio namespace), así que "sin estado" no es lo
  // mismo que "sigue vivo" — sin esto, un eliminado volvía a mostrarse
  // como si siguiera jugando en las etapas siguientes.
  const eliminatedIds = new Set(eliminationOrder || []);
  return (
    <div
      style={{
        display: "grid",
        gridTemplateColumns: "repeat(4, 1fr)",
        gap: 8,
        width: "100%",
        maxWidth: 460,
        marginBottom: 14,
      }}
    >
      {players.map((p, i) => {
        const st = playerStates[p.id];
        const alive = !eliminatedIds.has(p.id);
        const qLen = st ? (st.queue || []).length : 0;
        const qualified = st && !!st.finishedAt; // ya terminó esta etapa, espera a que terminen los demás
        return (
          <div
            key={p.id}
            style={{
              background: alive ? PLAYER_COLORS[i % PLAYER_COLORS.length] : "#241d38",
              borderRadius: 12,
              padding: "8px 6px",
              textAlign: "center",
              opacity: alive ? 1 : 0.6,
              border: p.id === myId ? "2px solid #FFD23F" : "2px solid transparent",
              position: "relative",
              boxSizing: "border-box",
            }}
          >
            {qualified && alive && <span style={{ position: "absolute", top: -10, right: -4, fontSize: 16 }}>✅</span>}
            <div
              style={{
                fontSize: 12,
                fontWeight: 800,
                color: alive ? "#1B1035" : "#8b7fa8",
                overflow: "hidden",
                textOverflow: "ellipsis",
                whiteSpace: "nowrap",
              }}
            >
              {alive ? p.name : "💀 " + p.name}
            </div>
            <div style={{ fontSize: 20, fontWeight: 800, color: alive ? "#1B1035" : "#5a4d6e" }}>
              {alive ? qLen : ""}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// Selector de a quién atacar: un cuadrado grande de color por rival (mismo
// color que su ficha en PlayerBadgeRow), con el nombre grande adentro —
// "cuadrados de colores con el nombre de cada uno grande, en el medio de
// la pantalla", como pidieron después de jugarlo en familia.
function TargetPicker({ players, playerStates, myId, myLastAttacked, eliminationOrder, title, subtitle, onAttack, onSkip, allowRepeat, excludeIds }) {
  // Igual que en PlayerBadgeRow: quién sigue vivo se decide con
  // room.eliminationOrder, no con playerStates — alguien eliminado en una
  // etapa anterior no tiene estado en la ronda actual, así que "sin
  // estado" no puede leerse como "vivo" o se lo podría volver a atacar.
  const eliminatedIds = new Set(eliminationOrder || []);
  const excludedIds = new Set(excludeIds || []);
  const aliveList = players.filter((p) => !eliminatedIds.has(p.id));
  const aliveCount = aliveList.length;
  const candidates = aliveList.filter((p) => {
    if (p.id === myId) return false;
    if ((playerStates[p.id] || {}).finishedAt) return false; // ya terminó esta etapa, no se lo puede atacar más
    // Modo Guerra, ataque "grilla extra": ya se la mandé a esta persona
    // (una sola vez por rival en toda la partida) — no aparece más como
    // candidato para ESTE tipo de ataque específicamente.
    if (excludedIds.has(p.id)) return false;
    // Modo Guerra: se puede repetir el mismo objetivo siempre (así lo pidió
    // el usuario), así que ahí no se aplica el "no le pegues dos veces
    // seguidas al mismo" que sí rige en el resto de las etapas.
    if (!allowRepeat && aliveCount > 2 && p.id === myLastAttacked) return false;
    return true;
  });
  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(0,0,0,0.75)",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        zIndex: 100,
        padding: 20,
      }}
    >
      <Card style={{ maxWidth: 420, marginBottom: 0 }}>
        <Title size={22}>{title || "🧱 ¡Grilla resuelta! ¿A quién atacás?"}</Title>
        {subtitle && <Sub style={{ marginTop: -8 }}>{subtitle}</Sub>}
        {candidates.length === 0 ? (
          <Sub style={{ marginBottom: 12 }}>No hay a quién atacar ahora mismo.</Sub>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10, marginBottom: 12 }}>
            {candidates.map((p) => {

                    justifyContent: "center",
                    textAlign: "center",

                    border: "none",

                    fontFamily: "'Baloo 2', sans-serif",

          {candidates.length === 0 ? "Seguir jugando" : "Saltear (no atacar)"}

}

// Los 6 tipos de ataque que se pueden elegir en el modo Guerra. title/subtitle
// son los que ve el ATACANTE en el paso siguiente (elegir a quién). Girar,
// blanco y negro intermitente, grilla gigante, colores extra y 2-1 se
// pueden recibir hasta 2 veces en la MISMA grilla (GUERRA_MAX_STACK): la
// segunda no cancela, suma y el efecto se hace más fuerte (ver el detalle
// de cada uno en performAttack). Grilla extra (🧱) es distinta: no tiene
// tope de veces ni se acumula en fuerza, pero solo se le puede mandar a
// cada rival UNA vez en toda la partida (gridExtraSentTo) — por eso en
// GuerraAttackPicker desaparece del todo cuando ya se la mandaste a
// todos.
// `shout` es el nombre "de combo" que grita el locutor al mandar ese
// ataque (ver announceAttack) — más pegadizo y con onda que el label de
// siempre, a propósito con vocales alargadas ("...OOO", "...EEE") porque
// muchos motores de voz sí las estiran un toque al leerlas, quedando más
// cerca de un grito de pelea que de una lectura plana. Por default el
// locutor deja una pausa entre el grito y el nombre (para que no se
// mezclen, pedido del usuario) y dice el nombre aparte; `flowsIntoName:
// true` es para los que ya terminan en una palabra que conecta directo
// con el nombre (como "blanco y negro PARAAAA {nombre}"), sin pausa ni
// exclamación propia en el medio. `sound` (cuando existe) es el nombre de
// un clip grabado de verdad por el usuario en juegos-site/bloques/sounds/
// — cuando está, reemplaza al `shout` sintetizado: suena el audio real y
// después solo se dice el nombre del rival con SpeechSynthesis (ver
// announceAttack). `shout` se deja igual como respaldo, por si ese clip
// no llegara a cargar.

  giant: { emoji: "🔲", label: "Grilla gigante", shout: "¡GRILLA GIGANTEEE!", sound: "giant", desc: "Agranda un poco la grilla que tiene abierta. Recibirlo 2 veces la agranda al doble (como antes hacía una sola vez).", title: "🔲 ¿A quién le agrandás la grilla?", subtitle: "Dura hasta que la resuelva — cada tap le limpia varias piezas de una, así no es taaan difícil. Si ya la tenía agrandada, se agranda más (máximo 2 veces)." },

function PracticeGame({ onBack }) {
  // Igual que en modo batalla: se arranca con 5 grillas para resolver, una
  // detrás de otra. La última (la 5ta) parpadea entre colores y blanco y
  // negro cada 5 segundos, como en la final del modo batalla.
  const [queue, setQueue] = useState(null);
  // Espejo síncrono de `queue`, para el multitouch (ver tapCell y el
  // useEffect de touchstart en GridBoard): si tocás dos piezas con dos
  // dedos a la vez, tapCell se llama dos veces SEGUIDAS en el mismo tick de
  // JS, antes de que React vuelva a renderizar — si la segunda llamada
  // leyera `queue` (el closure de React, que recién se actualiza en el
  // próximo render), no vería lo que acaba de limpiar la primera y la
  // pisaría. Leyendo/escribiendo este ref en cambio, cada llamada parte del
  // resultado real de la anterior. Mismo mecanismo que myLiveStateRef en
  // GameRoom (ver ahí el comentario grande, es el mismo problema).
  const queueRef = useRef(null);
  const setQueueNow = (next) => {
    queueRef.current = next;
    setQueue(next);
  };
  const [gridCount, setGridCount] = useState(DEFAULT_GRID_COUNT);
  const [solvedCount, setSolvedCount] = useState(0);
  const [startTime, setStartTime] = useState(null);
  const [elapsedMs, setElapsedMs] = useState(0);
  const [finished, setFinished] = useState(false);
  const [finalMs, setFinalMs] = useState(null);
  const [bestMs, setBestMs] = useState(null);
  const [isNewBest, setIsNewBest] = useState(false);
  const [wrongFlash, setWrongFlash] = useState(false);
  const [penalty, setPenalty] = useState(false);
  // Modo "con penalidad": cada color equivocado frena todo click por 1s
  // (en vez del flash rojo breve de siempre).
  const [locked, setLocked] = useState(false);
  const wrongFlashTimerRef = useRef(null);
  const registerWrong = () => {
    if (wrongFlashTimerRef.current) clearTimeout(wrongFlashTimerRef.current);
    setWrongFlash(true);
    if (penalty) {
      setLocked(true);
      wrongFlashTimerRef.current = setTimeout(() => {
        setWrongFlash(false);
        setLocked(false);
      }, 1000);
    } else {
      wrongFlashTimerRef.current = setTimeout(() => setWrongFlash(false), 400);
    }
  };

  useEffect(() => {
    try {
      const v = localStorage.getItem(`${PRACTICE_BEST_KEY}:${gridCount}`);
      setBestMs(v ? parseInt(v, 10) : null);
    } catch {
      setBestMs(null);
    }
  }, [gridCount]);

  useEffect(() => {
    if (!queue || finished || !startTime) return;
    const id = setInterval(() => setElapsedMs(Date.now() - startTime), 100);
    return () => clearInterval(id);
  }, [queue, finished, startTime]);

  const fmt = (ms) => (Math.max(0, ms) / 1000).toFixed(1) + "s";

  const newRun = () => {
    setQueueNow(Array.from({ length: gridCount }, () => newQueuedGrid()));
    setSolvedCount(0);
    setFinished(false);
    setFinalMs(null);
    setIsNewBest(false);
    setElapsedMs(0);
    setStartTime(Date.now());
    if (wrongFlashTimerRef.current) clearTimeout(wrongFlashTimerRef.current);
    setWrongFlash(false);
    setLocked(false);
  };

  const finishRun = (ms) => {
    setFinished(true);
    setFinalMs(ms);
    if (bestMs == null || ms < bestMs) {
      try {
        localStorage.setItem(`${PRACTICE_BEST_KEY}:${gridCount}`, String(ms));
      } catch {}
      setBestMs(ms);
      setIsNewBest(true);
    }
  };

  // Lee y escribe queueRef (no el `queue` del closure) para que el
  // multitouch funcione bien: si tocás dos piezas del mismo color con dos
  // dedos, esto se llama dos veces seguidas ANTES de que React vuelva a
  // renderizar, así que la segunda llamada tiene que ver lo que la primera
  // acaba de limpiar (ver el comentario grande en queueRef, más arriba).
  const tapCell = (idx) => {
    if (!queueRef.current || finished || locked) return;
    const grid = queueRef.current[0];
    // Puede ser undefined si un dedo terminó la última grilla y, en el
    // mismo tick, otro dedo todavía estaba tocando algo — `finished` recién
    // se refleja acá en el próximo render, así que este chequeo (y no ese
    // closure stale) es lo que evita reventar leyendo cellPiece de nada.
    if (!grid) return;
    const pieceId = grid.cellPiece[idx];
    if (pieceId < 0) return;
    const piece = grid.pieces[pieceId];
    if (piece.cleared) return;
    const activeColor = grid.colorOrder[grid.activeColorIndex];
    if (piece.color !== activeColor) {
      registerWrong();
      return;
    }
    const newPieces = grid.pieces.map((p) => (p.id === pieceId ? { ...p, cleared: true } : p));
    const remaining = newPieces.some((p) => p.color === activeColor && !p.cleared);
    const newIndex = remaining ? grid.activeColorIndex : grid.activeColorIndex + 1;
    playPlop(grid.colorOrder.indexOf(activeColor));

    if (newIndex >= grid.colorOrder.length) {
      playGridDone();
      const newQueue = queueRef.current.slice(1);
      const newSolvedCount = solvedCount + 1;
      queueRef.current = newQueue;
      if (newQueue.length === 0) {
        finishRun(Date.now() - startTime);
        setSolvedCount(newSolvedCount);
      } else {
        setQueueNow(newQueue);
        setSolvedCount(newSolvedCount);
      }
      return;
    }
    const newGrid = { ...grid, pieces: newPieces, activeColorIndex: newIndex };
    setQueueNow([newGrid, ...queueRef.current.slice(1)]);
  };

  if (!queue) {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <Title size={26}>🏋️ Practicar</Title>
        <Sub style={{ marginTop: -10 }}>
          Solo/a, contra el reloj — {gridCount} grillas seguidas, sin ataques ni rivales
        </Sub>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Cantidad de grillas</div>
          <div style={{ display: "flex", gap: 8 }}>
            {GRID_COUNT_OPTIONS.map((n) => (
              <button key={n} onClick={() => setGridCount(n)} style={pillStyle(gridCount === n)}>
                {n}
              </button>
            ))}
          </div>
        </Card>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Dificultad</div>
          <button onClick={() => setPenalty((v) => !v)} style={pillStyle(penalty)}>
            ⏱️ Con penalidad (1s frenado si te equivocás de color)
          </button>
        </Card>
        {bestMs != null && (
          <Sub style={{ marginTop: -6 }}>
            🏆 Tu mejor tiempo: <b style={{ color: "#FFD23F" }}>{fmt(bestMs)}</b>
          </Sub>
        )}
        <BigButton onClick={newRun}>Empezar ▶️</BigButton>
        <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Volver
        </BigButton>
      </Screen>
    );
  }

  const currentGrid = queue[0];
  const isLastGrid = queue.length === 1;
  const bwPhase = !finished && isLastGrid && Math.floor(Date.now() / FLICKER_PERIOD_MS) % 2 === 1;

  return (
    <Screen
      homeConfirm={finished ? null : "¿Salir? Perdés el progreso de este intento."}
      style={{ padding: "20px 10px 40px" }}
    >
      <Title size={24}>🏋️ Practicando</Title>
      <div
        style={{
          fontSize: 36,
          fontWeight: 800,
          fontFamily: "'Baloo 2', sans-serif",
          color: finished ? (isNewBest ? "#3DDC84" : "#FFD23F") : "#F3EEFF",
          marginBottom: 2,
        }}
      >
        {fmt(finished ? finalMs : elapsedMs)}
      </div>
      {bestMs != null && <Sub style={{ marginTop: 0, fontSize: 13 }}>Mejor marca: {fmt(bestMs)}</Sub>}

      {finished ? (
        <Card style={{ width: "100%", maxWidth: 420, textAlign: "center" }}>
          {isNewBest && <div style={{ color: "#3DDC84", fontWeight: 800, marginBottom: 10 }}>🎉 ¡Nueva mejor marca!</div>}
          <BigButton onClick={newRun}>Otra 🔁</BigButton>
          <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
            Volver
          </BigButton>
        </Card>
      ) : (
        <>
          <Sub style={{ marginTop: 0, marginBottom: 8, fontSize: 13 }}>
            Grilla <b style={{ color: "#FFD23F" }}>{solvedCount + 1}</b> de {gridCount}
            {isLastGrid ? " · ¡última! 🏁" : ""}
          </Sub>
          <GridBoard grid={currentGrid} onTap={tapCell} shake={wrongFlash} bw={bwPhase} locked={locked} />
          <ColorIndicator grid={currentGrid} bw={bwPhase} />
          {locked && <PenaltyNotice />}
        </>
      )}
      {!finished && (
        <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0", marginTop: 16 }}>
          Salir
        </BigButton>
      )}
    </Screen>
  );
}

function JoinScreen({ onJoined, onBack }) {
  const [name, setName] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [joinError, setJoinError] = useState("");
  const [joining, setJoining] = useState(false);
  const [openRooms, setOpenRooms] = useState([]);
  const [resumable, setResumable] = useState(null);

  useEffect(() => {
    let cancelled = false;
    const tick = async () => {
      try {
        const entries = await window.storage.list(STORAGE_PREFIX);
        if (cancelled) return;
        const rooms = entries
          .map((e) => {
            if (!/^bloques:sala:[^:]+$/.test(e.key)) return null;
            try {
              return JSON.parse(e.value);
            } catch {
              return null;
            }
          })
          .filter((r) => r && r.phase === "lobby" && Date.now() - (r.createdAt || 0) < 3 * 60 * 60 * 1000)
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        setOpenRooms(rooms);
      } catch {}
    };
    tick();
    const id = setInterval(tick, LOBBY_LIST_POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      let saved;
      try {
        saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      } catch {
        saved = null;
      }
      if (!saved || !saved.code || !saved.playerId) {
        setResumable(null);
        return;
      }
      const existing = await readRoom(saved.code);
      if (cancelled) return;
      if (existing && existing.players.some((p) => p.id === saved.playerId)) {
        setResumable({
          code: saved.code,
          playerId: saved.playerId,
          name: (existing.players.find((p) => p.id === saved.playerId) || {}).name,
        });
      } else {
        localStorage.removeItem(SESSION_KEY);
        setResumable(null);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, []);

  const doJoin = async (codeMaybe) => {
    const trimmed = name.trim();
    if (!trimmed) {
      setJoinError("Escribí tu nombre.");
      return;
    }
    setJoining(true);
    setJoinError("");
    try {
      const code = codeMaybe || (codeInput.trim() ? codeInput.trim().toUpperCase() : randomCode());
      let existing = await readRoom(code);
      if (existing && existing.phase !== "lobby") {
        setJoinError("Esa sala ya está jugando. Esperá a la próxima ronda.");
        setJoining(false);
        return;
      }
      const me = { id: randomId(), name: trimmed, deviceId: MY_DEVICE_ID, joinedAt: Date.now() };
      if (!existing) {
        existing = {
          code,
          hostId: me.id,
          players: [me],
          phase: "lobby",
          round: 1,
          stage: null,
          mode: "torneo",
          winnerId: null,
          countdownEndsAt: null,
          eliminationOrder: [],
          finishOrder: [],
          createdAt: Date.now(),
        };
      } else {
        if (existing.players.length >= MAX_PLAYERS) {
          setJoinError(`Sala llena (máximo ${MAX_PLAYERS} jugadores).`);
          setJoining(false);
          return;
        }
        if (existing.players.some((p) => p.name.toLowerCase() === trimmed.toLowerCase())) {
          setJoinError(`Ya hay alguien llamado "${trimmed}" en esa sala. Cambiá el nombre.`);
          setJoining(false);
          return;
        }
        existing.players = [...existing.players, me];
      }
      await writeRoom(code, existing);
      window.storage.incrementCounter("players").catch(() => {});
      localStorage.setItem(SESSION_KEY, JSON.stringify({ code, playerId: me.id }));
      onJoined(code, me.id);
    } catch (e) {
      setJoinError(window.storage.friendlyErrorMessage(e));
    } finally {
      setJoining(false);
    }
  };

  return (
    <Screen>
      <Title size={26}>Bloques en Cadena</Title>
      <Sub style={{ marginTop: -10 }}>Hasta 16 jugadores, cada uno en su celu</Sub>
      <Card style={{ width: "100%", maxWidth: 420 }}>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Tu nombre" style={inputStyle} />
        <input
          value={codeInput}
          onChange={(e) => setCodeInput(e.target.value.toUpperCase())}
          placeholder="Código de sala (opcional)"
          style={inputStyle}
        />
        {joinError && <div style={{ color: "#FF5D7A", fontSize: 13, marginBottom: 8 }}>{joinError}</div>}
        <BigButton onClick={() => doJoin(null)} disabled={joining}>
          {codeInput.trim() ? "Unirme a esa sala" : "Crear sala nueva"}
        </BigButton>
      </Card>

      {resumable && (
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <Sub style={{ marginTop: 0 }}>
            Ya estabas en la sala <b>{resumable.code}</b> como {resumable.name}
          </Sub>
          <BigButton onClick={() => onJoined(resumable.code, resumable.playerId)} color="#1D5FB8">
            Volver a esa sala
          </BigButton>
        </Card>
      )}

      {openRooms.length > 0 && (
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", fontWeight: 700, marginBottom: 8 }}>Salas abiertas ahora</div>
          {openRooms.map((r) => (
            <button
              key={r.code}
              onClick={() => {
                setCodeInput(r.code);
                doJoin(r.code);
              }}
              style={{
                display: "flex",
                justifyContent: "space-between",
                width: "100%",
                background: "rgba(255,255,255,0.06)",
                border: "none",
                borderRadius: 10,
                padding: "10px 12px",
                marginBottom: 6,
                color: "#F3EEFF",
                cursor: "pointer",
                fontWeight: 700,
              }}
            >
              <span>{r.code}</span>
              <span style={{ color: "#8b7fa8" }}>{(r.players || []).length}/{MAX_PLAYERS} jugadores</span>
            </button>
          ))}
        </Card>
      )}

      <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
        Volver
      </BigButton>
    </Screen>
  );
}

// ============================================================
// Modo Guerra online: torneo por etapas (armado después de jugarlo en
// familia). Cada "etapa" es una carrera: todos arrancan a la vez (con una
// cuenta regresiva de 5s para que nadie tenga ventaja) y quien queda sin
// terminar cuando todos los demás ya terminaron, queda afuera — no hay más
// eliminación por tiempo ni por cola larga.
//
//  - "elim": arranca con todos los jugadores. 3 grillas, la última
//    parpadea color/blanco y negro. Al terminar la 2da se habilita el
//    ataque clásico (mandar una grilla extra). Se repite (una carrera por
//    vez, elimina uno por carrera) hasta llegar a 3 jugadores. Si la sala
//    arrancó con exactamente 3, esta etapa se saltea.
//  - "semifinal": 3 jugadores, 4 grillas. Al terminar la 1ra se habilita
//    "blanco y negro" (dura 15s como máximo; si el rival ya lo tiene, se
//    cancela antes); al terminar
//    la 2da, la grilla extra clásica (se acumula); al terminar la 3ra,
//    "freeze" de 5s (se acumula si te mandan varios). El que queda sin
//    terminar la carrera, queda afuera; los otros 2 pasan a la Final. Si
//    la sala arrancó con exactamente 2, esta etapa también se saltea.
//  - "final": 3 grillas. Tocar mal frena los clicks 3s (grilla 3 es
//    distinto, ver abajo). Grilla 2: parpadea sola (blanco/negro 5s,
//    color 2s) hasta resolverla, y quien la resuelve le manda a un rival
//    (elegido con el mismo selector de cuadrados si hay más de uno; si
//    solo queda un rival, va directo a él) el ataque "grilla girando"
//    (una vuelta cada 16s) hasta que la termine. Grilla 3: 4 tonos de
//    gris en vez de colores, y tocar mal pausa el cronómetro 2s (no
//    frena los clicks). No termina la partida apenas alguien gana sus 3
//    grillas: se sigue jugando hasta que TODOS terminan, y quedan
//    ordenados por el orden real en que van terminando (el primero, el
//    torneo entero o quien eligió la Final directa, es el ganador).
//
// El anfitrión/a elige en el lobby el "modo" de la sala (room.mode):
//  - "torneo" (por defecto): arranca en la etapa que corresponda según
//    cuántos jugadores hay (ver initialStageFor) y va bajando de a una
//    hasta la Final.
//  - "final": todos (de 2 a 16) arrancan directo en la Final, sin pasar
//    por Eliminación ni Semifinal — una carrera grupal con las reglas de
//    la Final de siempre, generalizadas a cualquier cantidad de gente.
// ============================================================

// Etapa inicial según cuántos jugadores hay al arrancar (solo aplica en
// modo "torneo"): con 2 se saltean "elim" y "semifinal" y arrancan
// directo en la Final; con 3, se saltea solo "elim".
function initialStageFor(playerCount) {
  if (playerCount <= 2) return "final";
  if (playerCount === 3) return "semifinal";
  return "elim";
}

// Arma el estado inicial de cada jugador para una etapa nueva (grillas
// frescas, contadores de ataque en cero). `easy` es la ventaja de Lara
// (ver isLaraName): una grilla menos, y cada grilla más chica y con
// menos colores. `forcedCount`, si se pasa, reemplaza STAGE_GRID_COUNT
// (lo usa el modo Guerra, donde la cantidad de grillas la elige el
// anfitrión en el lobby en vez de estar fija por etapa).
function freshStateForStage(stage, easy, forcedCount) {
  const baseCount = forcedCount || STAGE_GRID_COUNT[stage] || 3;
  const count = easy ? Math.max(1, baseCount - 1) : baseCount;
  const size = easy ? LARA_GRID_SIZE : GRID_SIZE;
  const colorKeys = easy ? PIECE_COLOR_KEYS.slice(0, LARA_COLOR_COUNT) : PIECE_COLOR_KEYS;
  const queue = Array.from({ length: count }, (_, i) => {
    // La última grilla de la Final no tiene colores: son 4 tonos de gris
    // (ya son solo 4, así que para Lara no hace falta recortarlos más).
    const useGray = stage === "final" && i === count - 1;
    return newQueuedGrid(useGray ? GRAYSCALE_COLOR_KEYS : colorKeys, size);
  });
  return {
    queue,
    solvedCount: 0,
    alive: true,
    finishedAt: null,
    lastAttacked: null,
    eliminatedAt: null,
    bwUntil: null,
    freezeUntil: null,
    spinning: 0, // 0 = no gira; en Guerra puede llegar a 2 (el doble de rápido) — ver GUERRA_MAX_STACK
    flickerUntil: null, // modo Guerra: ataque "blanco y negro intermitente"
    flickerStack: 0, // ...cuántas veces te lo mandaron en esta grilla (máx. GUERRA_MAX_STACK) — cada una alarga la fase en gris
    twoOneStack: 0, // modo Guerra: ataque "2-1" — 0 = no activo, 1 = "2-1" (cada 2 que borra reaparece 1), 2 = "4-3" (cada 4 reaparecen 3) — ver tapCell
    lastClearAt: Date.now(), // modo Guerra: cuándo limpié una pieza por última vez (arranca "ahora") — ver GUERRA_ATTACK_EXPIRE_MS
    gridExtraSentTo: [], // modo Guerra: a quién ya le mandé el ataque "grilla extra" (solo una vez por rival, en toda la partida)
  };
}

// Escribe una etapa/ronda nueva para todos los jugadores todavía vivos:
// arranca el round siguiente (cada etapa tiene su propio namespace de
// estado, así no queda nada pegado de la carrera anterior), genera
// grillas frescas y arma la cuenta regresiva de 5s.
async function startStage(roomCode, freshRoom, stage, alivePlayers) {
  const round = (freshRoom.round || 1) + 1;
  const newStates = {};
  alivePlayers.forEach((p) => {
    newStates[p.id] = freshStateForStage(stage, isLaraName(p.name));
  });
  await Promise.all(alivePlayers.map((p) => writePlayerState(roomCode, round, p.id, newStates[p.id])));
  freshRoom.round = round;
  freshRoom.stage = stage;
  freshRoom.countdownEndsAt = Date.now() + COUNTDOWN_MS;
  await writeRoom(roomCode, freshRoom);
  return newStates;
}

// Se llama desde el tick de sondeo de cualquier cliente, para las etapas
// "elim"/"semifinal". Detecta si la carrera de la etapa actual ya
// terminó (todos menos uno resolvieron su cola) y, si es así, elimina a
// quien quedó sin terminar (queda registrado en freshRoom.eliminationOrder,
// que vive en la sala y no en el estado por-ronda, así sobrevive aunque
// el jugador eliminado ya no tenga estado en las rondas siguientes — eso
// es lo que usa la pantalla de fin de partida para armar el ranking) y
// arranca la siguiente etapa. Vuelve a leer todo fresco y compara
// freshRoom.round contra el round con el que se llamó como guarda de
// idempotencia: si alguien más ya lo procesó, el round ya cambió y no
// hace nada.
async function checkHeatCompletion(roomCode, round, stage) {
  const freshRoom = await readRoom(roomCode);
  if (!freshRoom || freshRoom.phase !== "playing") return;
  if (freshRoom.round !== round || freshRoom.stage !== stage) return; // ya lo procesó otro cliente
  const states = await readAllPlayerStates(roomCode, round, (freshRoom.players || []).map((p) => p.id));
  // Quién sigue activo se decide con freshRoom.players + eliminationOrder
  // (una lectura de UNA sola key, fuerte), no con qué aparece en `states`
  // (list() sobre un prefijo, con consistencia más floja en Workers KV:
  // una key recién escrita puede tardar en aparecer en un list() desde
  // otro cliente/edge). Si activePlayers saliera de `states`, a alguien
  // cuya key todavía no propagó lo dejaba afuera de la cuenta entera —
  // no "todavía no terminó", directamente "no existe" — y eso podía
  // declarar perdedor a otro jugador por error, mucho antes de que la
  // carrera realmente terminara.
  const eliminatedIds = new Set(freshRoom.eliminationOrder || []);
  const activePlayers = (freshRoom.players || []).filter((p) => !eliminatedIds.has(p.id));
  if (activePlayers.length < 2) return; // nada que resolver todavía
  const finished = activePlayers.filter((p) => states[p.id] && !!states[p.id].finishedAt);
  const unfinished = activePlayers.filter((p) => !(states[p.id] && states[p.id].finishedAt));
  if (unfinished.length !== 1 || finished.length < 1) return; // la carrera sigue

  const loserId = unfinished[0].id;
  const loserState = states[loserId] || {};
  await writePlayerState(roomCode, round, loserId, { ...loserState, alive: false, eliminatedAt: Date.now() });
  freshRoom.eliminationOrder = [...(freshRoom.eliminationOrder || []), loserId];

  const stillAlive = activePlayers.filter((p) => p.id !== loserId);
  if (stage === "elim") {
    if (stillAlive.length === 3) {
      await startStage(roomCode, freshRoom, "semifinal", stillAlive);
    } else {
      await startStage(roomCode, freshRoom, "elim", stillAlive);
    }
  } else if (stage === "semifinal") {
    await startStage(roomCode, freshRoom, "final", stillAlive);
  }
}

// Se llama desde el tick de sondeo de cualquier cliente, en las etapas
// "final" y "guerra" (mismo comportamiento en las dos: a diferencia de
// "elim"/"semifinal", acá nadie queda eliminado a mitad de carrera — se
// sigue jugando hasta que TODOS terminan su cola de grillas, y quedan
// ordenados por el momento real en que cada uno terminó
// (freshRoom.finishOrder, primero = ganador). Misma guarda de
// idempotencia que checkHeatCompletion.
async function checkGroupRaceCompletion(roomCode, round, stage) {
  const freshRoom = await readRoom(roomCode);
  if (!freshRoom || freshRoom.phase !== "playing") return;
  if (freshRoom.round !== round || freshRoom.stage !== stage) return; // ya lo procesó otro cliente
  const states = await readAllPlayerStates(roomCode, round, (freshRoom.players || []).map((p) => p.id));
  // Mismo motivo que en checkHeatCompletion: quién sigue en carrera sale
  // de freshRoom.players (lectura fuerte), no de `states` (list(), más
  // floja) — si no, a alguien cuya key todavía no propagó lo dejaba
  // afuera de la cuenta y la partida podía darse por terminada con
  // gente que en realidad seguía jugando (el bug que reportó el usuario:
  // "empieza y ya dice terminaste, como si esperara a un tercero").
  const eliminatedIds = new Set(freshRoom.eliminationOrder || []);
  const activePlayers = (freshRoom.players || []).filter((p) => !eliminatedIds.has(p.id));
  if (activePlayers.length < 1) return;
  const stillPlaying = activePlayers.some((p) => !(states[p.id] && states[p.id].finishedAt));
  if (stillPlaying) return; // todavía falta alguien

  const finishOrder = [...activePlayers]
    .sort((a, b) => (states[a.id].finishedAt || 0) - (states[b.id].finishedAt || 0))
    .map((p) => p.id);
  freshRoom.finishOrder = finishOrder;
  freshRoom.winnerId = finishOrder[0] || null;
  freshRoom.phase = "ended";
  await writeRoom(roomCode, freshRoom);
}

function GameRoom({ roomCode, myId, onBack }) {
  const [room, setRoom] = useState(null);
  const [playerStates, setPlayerStates] = useState({});
  const [wrongFlash, setWrongFlash] = useState(false);
  // Contexto del selector de a quién atacar: null si está cerrado, o
  // { type: "grid"|"bw"|"freeze", title, subtitle } — el mismo componente
  // TargetPicker se reusa para los 3 tipos de ataque de la etapa de 3
  // jugadores (y el clásico de la etapa de eliminación).
  const [attackCtx, setAttackCtx] = useState(null);
  const [now, setNow] = useState(Date.now());
  // El modo online siempre tiene penalidad: cada color equivocado frena
  // todo click por 1s (en vez del flash rojo breve de Práctica sin
  // penalidad). En la Final este freeze pasa a ser fijo (3s), ver
  // registerWrong más abajo.
  const [locked, setLocked] = useState(false);
  // Final, grilla 3 (escala de grises): tocar mal no frena clicks, pausa
  // el cronómetro mostrado hasta este timestamp.
  const [timerPauseUntil, setTimerPauseUntil] = useState(0);
  const wrongFlashTimerRef = useRef(null);
  // Cada click aplica YA en lo local (instantáneo, sin esperar red) y el
  // guardado real al servidor pasa en segundo plano por acá. myLiveStateRef
  // es la fuente de verdad de "mi estado" en todo momento (se lee y escribe
  // de forma síncrona, así que nunca queda desactualizada entre clicks
  // rápidos, a diferencia de leer del estado de React que puede tardar un
  // tick en reflejarse). El sync en segundo plano relee el servidor recién
  // antes de escribir y solo "estampa" mi progreso encima — así, si llegó
  // un ataque mientras tanto (alguien me sumó una grilla al final de la
  // cola), no se pierde: se preserva y se agrega. pendingWritesRef, mientras
  // hay una sincronización en vuelo, evita que el sondeo cada 1s pise mi
  // propio estado local con una lectura del server que todavía no llegó a
  // reflejar el último click.
  const myLiveStateRef = useRef(null);
  const pendingWritesRef = useRef(0);
  const syncingRef = useRef(false);
  const syncDirtyRef = useRef(false);
  // Modo Guerra, ataque "2-1": cuenta cuántas piezas llevo limpiadas en la
  // grilla ACTUAL (no en toda la partida), para saber cuándo toca que
  // reaparezca alguna — ver tapCell. Puramente local (nunca viaja al
  // servidor: es solo el ritmo de MI propio tapCell), se resetea sola
  // apenas noto que cambié de grilla (gid distinto al que veníamos
  // contando, ya sea porque la completé yo o porque me llegó una nueva
  // por ataque de grilla gigante/colores extra).
  const twoOneCounterRef = useRef(0);
  const twoOneGidRef = useRef(null);
  // Última "huella" de ataques que vi en MI PROPIO estado (ver
  // attackFingerprint/checkForIncomingAttack) — para notar cuándo me
  // acaban de atacar y disparar la reacción cómica ("¡esta se
  // complica!"), sin importar si en ese momento estoy jugando activo o
  // tranquilo esperando.
  const lastAttackFingerprintRef = useRef(null);
  const checkForIncomingAttack = (st) => {
    if (!st) return;
    const next = attackFingerprint(st);
    const prev = lastAttackFingerprintRef.current;
    if (prev && attackFingerprintIncreased(prev, next)) playAttackReceived();
    lastAttackFingerprintRef.current = next;
  };
  // Agrupa varios clicks seguidos en UNA sola escritura al servidor, en
  // vez de una por click: sin esto, limpiar una grilla entera (decenas
  // de clicks en pocos segundos) gastaba una escritura de Workers KV por
  // cada click — con la cuota gratuita de 1.000 escrituras/día
  // compartida por todo el sitio, alcanzaba con que una familia jugara
  // un rato para agotarla. Ahora se espera a que pasen SYNC_DEBOUNCE_MS
  // sin clicks nuevos antes de mandar la escritura, así que una racha de
  // clicks termina en una sola escritura con el estado final — el
  // feedback local (myLiveStateRef, lo que ves en pantalla) sigue siendo
  // instantáneo, lo único que se demora un toque es lo que se guarda en
  // el servidor.
  const syncDebounceRef = useRef(null);
  // Mientras haya una escritura programada (todavía esperando el
  // debounce) o en vuelo (ya viajando por la red), no hay que dejar que
  // el sondeo de cada segundo pise el estado local con una lectura del
  // servidor que todavía no la refleja.
  const hasPendingWrite = () => pendingWritesRef.current > 0 || syncDebounceRef.current !== null;
  // Los ids (gid) de las grillas de mi cola la última vez que supimos con
  // certeza qué tenía el servidor (recién leído, o recién escrito por mí).
  // Comparar la cola fresca contra ESTO — y no contra mi cola local actual —
  // es lo que distingue "llegó un ataque nuevo" de "todavía no sincronicé
  // que yo misma acorté mi cola al completar una grilla": si comparara
  // contra mi cola local, completar una grilla (que la acorta) haría
  // parecer que el servidor "tiene de más", y ese sobrante (en realidad la
  // grilla vieja que ya completé) se volvería a agregar solo. Usar ids en
  // vez de solo el largo también es lo que permite notar cuando el
  // servidor reemplazó la grilla de la posición 0 (el ataque "grilla
  // gigante" del modo Guerra), no solo cuando agregó al final (la "grilla
  // extra" clásica) — contar largo nomás no distinguía esos dos casos.
  const lastKnownServerQueueIdsRef = useRef([]);
  // true mientras tengo un "se te fueron todos los ataques de encima" (lo
  // que hace completeCurrentGrid en Guerra al resolver cualquier grilla)
  // aplicado localmente pero todavía no confirmado en el servidor — ver el
  // comentario en runSyncLoop sobre por qué hace falta esta bandera.
  const myAttacksClearedPendingRef = useRef(false);

  // Persiste myLiveStateRef.current al servidor. Relee fresco justo antes de
  // escribir y conserva cualquier grilla extra que haya llegado por ataque
  // desde la última vez que sincronizamos. Se corre en loop propio: si
  // durante una sincronización se pide otra (por otro click), no se pisan
  // ni se amontonan pedidos — cuando termina la que está en curso, vuelve a
  // sincronizar una vez más con el estado más nuevo, y listo.
  const runSyncLoop = async (roomCode, round, myId) => {
    if (syncingRef.current) return;
    syncingRef.current = true;
    pendingWritesRef.current += 1;
    try {
      while (syncDirtyRef.current) {
        syncDirtyRef.current = false;
        const cur = myLiveStateRef.current;
        if (!cur) break;
        const fresh = (await readPlayerState(roomCode, round, myId)) || cur;
        const freshQueue = fresh.queue || [];
        let liveNow = myLiveStateRef.current;
        let liveQueue = liveNow.queue || [];
        const lastIds = lastKnownServerQueueIdsRef.current || [];
        let queueChanged = false;

        // ¿La grilla que el servidor tiene en la posición 0 es una
        // DISTINTA de la que yo tengo ahí localmente? Eso pasa cuando
        // alguien manda el ataque "grilla gigante" (modo Guerra): reemplaza
        // la grilla de esa posición entera por una nueva, más grande — no
        // le suma nada a la cola, la cambia. Se nota comparando el gid de
        // freshQueue[0] contra el mío Y contra el que ya conocía del
        // servidor (si coincidiera con este último, es una que ya adopté
        // antes, no hay nada nuevo). Cuando sí cambió de verdad, adopto la
        // del servidor — se pierde el progreso que tenía en la vieja, pero
        // es lo esperado: es una grilla distinta. Sin este chequeo (antes
        // solo se comparaba el LARGO de la cola, que la grilla gigante no
        // cambia) mi próximo guardado pisaba el ataque recién llegado con
        // mi grilla vieja, y la grilla "nunca se agrandaba".
        if (
          freshQueue.length > 0 &&
          liveQueue.length > 0 &&
          freshQueue[0].gid !== liveQueue[0].gid &&
          freshQueue[0].gid !== lastIds[0]
        ) {
          liveQueue = [freshQueue[0], ...liveQueue.slice(1)];
          queueChanged = true;
        }

        // ¿Se sumaron grillas nuevas al FINAL desde la última vez que
        // sincronizamos (el ataque clásico de "grilla extra")? Comparar
        // contra `lastIds` (lo último que supe con certeza del servidor) y
        // no contra mi cola local actual es lo que distingue "llegó un
        // ataque nuevo" de "todavía no sincronicé que yo misma acorté mi
        // cola al completar una grilla".
        if (freshQueue.length > lastIds.length) {
          const extra = freshQueue.slice(lastIds.length);
          liveQueue = liveQueue.concat(extra);
          queueChanged = true;
        }

        if (queueChanged) {
          liveNow = { ...liveNow, queue: liveQueue };
          myLiveStateRef.current = liveNow;
          setPlayerStates((m) => ({ ...m, [myId]: liveNow }));
        }

        // Los ataques que me manda OTRA gente (girar, blanco y negro
        // intermitente) llegan escritos directo en mi estado del servidor
        // — mi copia local nunca los toca, salvo en el momento puntual en
        // que YO los limpio al completar una grilla en Guerra
        // (myAttacksClearedPendingRef, prendida por completeCurrentGrid).
        // Fuera de ese momento, siempre vale la versión del servidor: si
        // uso mi copia local a ciegas todo el tiempo (como hacía antes),
        // un ataque que llega mientras tengo clicks pendientes de
        // sincronizar se pierde apenas sincronizo — piso el ataque recién
        // llegado con mi valor de antes de que me atacaran. Con varias
        // personas jugando y atacando todo el tiempo (el caso real de una
        // partida en familia) esto pasaba todo el rato, no solo a veces.
        const useMyClearedAttacks = myAttacksClearedPendingRef.current;
        myAttacksClearedPendingRef.current = false; // se consume: la próxima sync ya no aplica, salvo que completar otra grilla lo vuelva a prender

        const merged = {
          ...fresh,
          queue: liveQueue,
          solvedCount: liveNow.solvedCount,
          lastAttacked: liveNow.lastAttacked,
          alive: liveNow.alive === false || fresh.alive === false ? false : true,
          eliminatedAt: liveNow.eliminatedAt || fresh.eliminatedAt || null,
          // Sin esto, terminar una carrera (queue vacía, finishedAt puesto
          // localmente en completeCurrentGrid) se perdía en el próximo
          // sync: el merge partía de `fresh` (lo último leído del server,
          // todavía sin mi finishedAt) y nunca lo pisaba con mi valor
          // local, así que el servidor jamás se enteraba de que terminé.
          finishedAt: liveNow.finishedAt || fresh.finishedAt || null,
          spinning: useMyClearedAttacks ? liveNow.spinning : fresh.spinning,
          flickerUntil: useMyClearedAttacks ? liveNow.flickerUntil : fresh.flickerUntil,
          flickerStack: useMyClearedAttacks ? liveNow.flickerStack : fresh.flickerStack,
          twoOneStack: useMyClearedAttacks ? liveNow.twoOneStack : fresh.twoOneStack,
          // lastClearAt no sigue el mismo patrón que arriba (no hace
          // falta la bandera): sea que avanzó por mi propio tap o porque
          // me acaba de llegar un ataque nuevo (que también lo pisa,
          // desde el otro lado, en computeNextTargetState), el que vale
          // siempre es el más RECIENTE de los dos — así nunca se pierde
          // ni mi progreso ni un ataque recién llegado.
          lastClearAt: Math.max(liveNow.lastClearAt || 0, fresh.lastClearAt || 0),
          // gridExtraSentTo solo lo modifico yo mismo (cuando ATACO a otro,
          // no cuando me atacan a mí), así que siempre vale mi copia local.
          gridExtraSentTo: liveNow.gridExtraSentTo || [],
        };
        checkForIncomingAttack(merged);
        await writePlayerState(roomCode, round, myId, merged);
        lastKnownServerQueueIdsRef.current = merged.queue.map((g) => g.gid);
      }
    } finally {
      syncingRef.current = false;
      pendingWritesRef.current = Math.max(0, pendingWritesRef.current - 1);
    }
  };
  const scheduleSync = () => {
    syncDirtyRef.current = true;
    if (syncDebounceRef.current) clearTimeout(syncDebounceRef.current);
    syncDebounceRef.current = setTimeout(() => {
      syncDebounceRef.current = null;
      runSyncLoop(roomCode, room ? room.round || 1 : 1, myId);
    }, SYNC_DEBOUNCE_MS);
  };
  // Aplica `next` como mi estado YA (React + la referencia síncrona) y pide
  // que se guarde en segundo plano.
  const setMyStateNow = (next) => {
    myLiveStateRef.current = next;
    setPlayerStates((m) => ({ ...m, [myId]: next }));
    scheduleSync();
  };

  // Pedido del usuario, bug reportado: un solo click sin querer (por
  // ejemplo, apuntarle al bichito de critter.js justo cuando pasa por esta
  // misma zona de la pantalla, o simplemente un mal cálculo con el mouse)
  // sacaba de la sala de una sin avisar — a diferencia del botón "Menú" de
  // arriba, que hace exactamente lo mismo (dejar la sala) y YA pedía
  // confirmación (ver HomeButton/homeConfirm, unas líneas más arriba). Acá
  // sumamos la misma confirmación, así un click de más no tira por la
  // borda una partida en curso.
  const leaveRoom = async () => {
    if (!window.confirm("¿Salir de la sala?")) return;
    try {
      const fresh = await readRoom(roomCode);
      if (fresh) {
        fresh.players = (fresh.players || []).filter((p) => p.id !== myId);
        await writeRoom(roomCode, fresh);
      }
    } catch {}
    localStorage.removeItem(SESSION_KEY);
    onBack();
  };

  useEffect(() => {
    let cancelled = false;
    const tick = async () => {
      const r = await readRoom(roomCode);
      if (cancelled || !r) return;
      setRoom(r);
      setNow(Date.now());
      const round = r.round || 1;
      if (r.phase === "playing" || r.phase === "ended") {
        const states = await readAllPlayerStates(roomCode, round, (r.players || []).map((p) => p.id));
        if (cancelled) return;
        // Si el sondeo no trajo NADA (falló el pedido — por ejemplo, se
        // agotó alguna cuota diaria de Workers KV — o la sala genuinamente
        // no tiene estado todavía), no lo tratamos como "no hay nadie
        // jugando": se descarta este sondeo entero y se mantiene lo que ya
        // se sabía. Sin este chequeo, un sondeo fallido pisaba mi propio
        // progreso (y el de todos) con un objeto vacío, mostrando "ya
        // terminaste, esperando a los demás" sin haber tocado nada.
        const hasData = states && Object.keys(states).length > 0;
        if (!hasData) return;
        // Mientras tengo una sincronización propia programada (esperando
        // el debounce) o en vuelo, no piso mi estado local (ni la
        // referencia síncrona que usan los clicks) con esta lectura del
        // server, que puede no reflejar todavía mi último click.
        if (!hasPendingWrite()) {
          checkForIncomingAttack(states[myId]);
          myLiveStateRef.current = states[myId] || myLiveStateRef.current;
          lastKnownServerQueueIdsRef.current = ((myLiveStateRef.current && myLiveStateRef.current.queue) || []).map((g) => g.gid);
        }
        setPlayerStates((prev) =>
          hasPendingWrite() && prev[myId] ? { ...states, [myId]: prev[myId] } : states
        );

        if (r.phase === "playing" && Date.now() >= (r.countdownEndsAt || 0)) {
          if (r.stage === "final" || r.stage === "guerra") {
            await checkGroupRaceCompletion(roomCode, round, r.stage);
          } else {
            await checkHeatCompletion(roomCode, round, r.stage);
          }
        }
      }
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, [roomCode]);

  // Easter egg "tocá el bichito, mandás un ataque al azar" (ver el
  // comentario grande donde se ASIGNA onCritterTapRef.current, más abajo,
  // cerca de performAttack). El listener en sí tiene que registrarse acá
  // arriba, ANTES del "if (!room) return" de abajo — si no, en el primer
  // render (room todavía null) este hook no se llamaría, y en el
  // siguiente sí, violando las Reglas de los Hooks (React error #310).
  // Se registra una sola vez (deps vacías) y siempre llama a la versión
  // MÁS RECIENTE de la lógica a través de la ref, así no queda pegado a
  // datos viejos de stage/players/performAttack del primer render.
  const onCritterTapRef = useRef(() => {});
  useEffect(() => {
    const onCritterTap = () => onCritterTapRef.current();
    window.addEventListener("jx-critter-tap", onCritterTap);
    return () => window.removeEventListener("jx-critter-tap", onCritterTap);
  }, []);

  // Modo Guerra: cada 1s se fija si pasó GUERRA_ATTACK_EXPIRE_MS (30s)
  // sin que limpie ni una pieza — si es así, se sacan los ataques que
  // tenía encima (ver la lógica en expireAttacksRef.current, más abajo
  // cerca de performAttack). Mismo patrón de ref-estable que
  // onCritterTapRef, y por el mismo motivo: este setInterval tiene que
  // registrarse ANTES del "if (!room) return" de acá abajo para no
  // violar las Reglas de los Hooks.
  const expireAttacksRef = useRef(() => {});
  useEffect(() => {
    const id = setInterval(() => expireAttacksRef.current(), 1000);
    return () => clearInterval(id);
  }, []);

  // Pedido del usuario: el anfitrión/a puede apagar el sonido para TODA la
