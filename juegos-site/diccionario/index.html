<script>
  // Apenas React mete el primer contenido en #root, sacamos esta escena
  // estática (ya cumplió su función) y queda la real. OJO: este script
  // tiene que ir DESPUÉS del <div id="root">, si no getElementById("root")
  // da null (el parser todavía no llegó a esa línea) y el observer nunca
  // se arma.
  (function () {
    var root = document.getElementById("root");
    var pre = document.getElementById("jxPreScene");
    if (!root || !pre) return;
    var obs = new MutationObserver(function () {
      if (root.childElementCount > 0) {
        pre.remove();
        obs.disconnect();
      }
    });
    obs.observe(root, { childList: true });
  })();
</script>

function randomId() {
  return Math.random().toString(36).slice(2, 10);
}
function randomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
const MY_DEVICE_ID = (() => {
  const KEY = "dicc:deviceId";
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = randomId();
    localStorage.setItem(KEY, id);
  }
  return id;
})();

async function readRoom(code) {
  try {
    const res = await window.storage.get(STORAGE_PREFIX + code, true);
    if (!res) return null;
    return JSON.parse(res.value);
  } catch {
    return null;
  }
}
async function writeRoom(code, room) {
  await window.storage.set(STORAGE_PREFIX + code, JSON.stringify(room), true);
}
function playerKey(code, round, playerId) {
  return STORAGE_PREFIX + code + ":r" + round + ":player:" + playerId;
}
async function readPlayerState(code, round, playerId) {
  try {
    const res = await window.storage.get(playerKey(code, round, playerId), true);
    if (!res) return null;
    return JSON.parse(res.value);
  } catch {
    return null;
  }
}
async function writePlayerState(code, round, playerId, state) {
  await window.storage.set(playerKey(code, round, playerId), JSON.stringify(state), true);
}
// Pide el estado de cada jugador por su clave exacta, en paralelo — nunca
// list() (ver el comentario de LOBBY_LIST_POLL_MS más arriba).
async function readAllPlayerStates(code, round, playerIds) {
  const entries = await Promise.all(
    (playerIds || []).map(async (id) => [id, await readPlayerState(code, round, id)])
  );
  const map = {};
  entries.forEach(([id, state]) => {
    if (state) map[id] = state;
  });
  return map;
}

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickNewWord(usedWordIds) {
  const available = WORD_BANK.filter((w) => !usedWordIds.includes(w.id));
  const pool = available.length > 0 ? available : WORD_BANK;
  return pool[Math.floor(Math.random() * pool.length)];
}

// Arma la ronda nueva: elige palabra, resetea el estado de cada
// jugador (sin definición ni voto todavía) y pone la sala en "writing"
// con su cuenta regresiva.
async function startRound(roomCode, freshRoom) {
  const round = (freshRoom.round || 0) + 1;
  const word = pickNewWord(freshRoom.usedWordIds || []);
  await Promise.all(
    freshRoom.players.map((p) =>
      writePlayerState(roomCode, round, p.id, { definition: null, submittedAt: null, votedFor: null, votedAt: null })
    )
  );
  freshRoom.round = round;
  freshRoom.usedWordIds = [...(freshRoom.usedWordIds || []), word.id];
  freshRoom.currentWordId = word.id;
  freshRoom.currentOptions = null;
  freshRoom.phase = "writing";
  freshRoom.phaseEndsAt = Date.now() + WRITING_MS;
  await writeRoom(roomCode, freshRoom);
  return round;
}

// Se llama desde el sondeo de cualquier cliente mientras la sala está en
// "writing". Si todos ya mandaron su definición (o si se acabó el
// tiempo, lo que pase primero) arma la lista de opciones (las
// inventadas + la real, todas mezcladas) y pasa a "voting". Guarda de
// idempotencia igual que en los otros juegos: si freshRoom.round o
// freshRoom.phase ya cambiaron, alguien más lo procesó primero.
async function checkWritingComplete(roomCode, round) {
  const freshRoom = await readRoom(roomCode);
  if (!freshRoom || freshRoom.phase !== "writing" || freshRoom.round !== round) return;
  const states = await readAllPlayerStates(roomCode, round, freshRoom.players.map((p) => p.id));
  const allSubmitted = freshRoom.players.every((p) => states[p.id] && states[p.id].definition);
  const timeUp = Date.now() >= (freshRoom.phaseEndsAt || 0);
  if (!allSubmitted && !timeUp) return;

  const word = WORD_BANK.find((w) => w.id === freshRoom.currentWordId);
  const fakeOptions = freshRoom.players
    .filter((p) => states[p.id] && states[p.id].definition)
    .map((p) => ({ key: p.id, text: states[p.id].definition }));
  const options = shuffleArr([{ key: "real", text: word ? word.def : "" }, ...fakeOptions]);

  freshRoom.currentOptions = options;
  freshRoom.phase = "voting";
  freshRoom.phaseEndsAt = Date.now() + VOTING_MS;
  await writeRoom(roomCode, freshRoom);
}

// Igual que checkWritingComplete, pero para "voting": cuando todos
// votaron (o se acabó el tiempo), calcula puntos y pasa a "reveal".
// Puntos: CORRECT_VOTE_POINTS por votar la definición real,
// FOOLED_VOTE_POINTS por cada voto que le mandaron a tu mentira.
async function checkVotingComplete(roomCode, round) {
  const freshRoom = await readRoom(roomCode);
  if (!freshRoom || freshRoom.phase !== "voting" || freshRoom.round !== round) return;
  const states = await readAllPlayerStates(roomCode, round, freshRoom.players.map((p) => p.id));
  const allVoted = freshRoom.players.every((p) => states[p.id] && states[p.id].votedFor);
  const timeUp = Date.now() >= (freshRoom.phaseEndsAt || 0);
  if (!allVoted && !timeUp) return;

  const votes = freshRoom.players.map((p) => (states[p.id] || {}).votedFor).filter(Boolean);
  const pointsById = {};
  freshRoom.players.forEach((p) => { pointsById[p.id] = 0; });
  votes.forEach((v) => {
    if (v === "real") return; // se suma más abajo, por votante
  });
  freshRoom.players.forEach((p) => {
    const myVote = (states[p.id] || {}).votedFor;
    if (myVote === "real") pointsById[p.id] = (pointsById[p.id] || 0) + CORRECT_VOTE_POINTS;
  });
  // Cuántos votos recibió cada mentira (por autor).
  votes.forEach((v) => {
    if (v === "real") return;
    if (pointsById[v] === undefined) return;
    pointsById[v] += FOOLED_VOTE_POINTS;
  });
  freshRoom.players = freshRoom.players.map((p) => ({
    ...p,
    score: (p.score || 0) + (pointsById[p.id] || 0),
    lastRoundPoints: pointsById[p.id] || 0,
  }));
  freshRoom.phase = "reveal";
  await writeRoom(roomCode, freshRoom);
}

// ==================== JOIN / LOBBY ====================
function JoinScreen({ onJoined, onBack }) {
  const [name, setName] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [joinError, setJoinError] = useState("");
  const [joining, setJoining] = useState(false);
  const [openRooms, setOpenRooms] = useState([]);
  const [resumable, setResumable] = useState(null);

  useEffect(() => {
    let cancelled = false;
    const tick = async () => {
      try {
        const entries = await window.storage.list(STORAGE_PREFIX);
        if (cancelled) return;
        const rooms = entries
          .map((e) => {
            if (!/^dicc:sala:[^:]+$/.test(e.key)) return null;
            try {
              return JSON.parse(e.value);
            } catch {
              return null;
            }
          })
          .filter((r) => r && r.phase === "lobby" && Date.now() - (r.createdAt || 0) < 3 * 60 * 60 * 1000)
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        setOpenRooms(rooms);
      } catch {}
    };
    tick();
    const id = setInterval(tick, LOBBY_LIST_POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      let saved;
      try {
        saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      } catch {
        saved = null;
      }
      if (!saved || !saved.code || !saved.playerId) {
        setResumable(null);
        return;
      }
      const existing = await readRoom(saved.code);
      if (cancelled) return;
      if (existing && existing.players.some((p) => p.id === saved.playerId)) {
        setResumable({ code: saved.code, playerId: saved.playerId, name: (existing.players.find((p) => p.id === saved.playerId) || {}).name });
      } else {
        localStorage.removeItem(SESSION_KEY);
        setResumable(null);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const doJoin = async (codeMaybe) => {
    const trimmed = name.trim();
    if (!trimmed) {
      setJoinError("Escribí tu nombre.");
      return;
    }
    setJoining(true);
    setJoinError("");
    try {
      const code = codeMaybe || (codeInput.trim() ? codeInput.trim().toUpperCase() : randomCode());
      let existing = await readRoom(code);
      if (existing && existing.phase !== "lobby") {
        setJoinError("Esa sala ya está jugando. Esperá a la próxima partida.");
        setJoining(false);
        return;
      }
      const me = { id: randomId(), name: trimmed, deviceId: MY_DEVICE_ID, joinedAt: Date.now(), score: 0 };
      if (!existing) {
        existing = {
          code,
          hostId: me.id,
          players: [me],
          phase: "lobby",
          round: 0,
          totalRounds: DEFAULT_ROUNDS,
          usedWordIds: [],
          currentWordId: null,
          currentOptions: null,
          phaseEndsAt: null,
          createdAt: Date.now(),
        };
      } else {
        if (existing.players.length >= MAX_PLAYERS) {
          setJoinError(`Sala llena (máximo ${MAX_PLAYERS} jugadores).`);
          setJoining(false);
          return;
        }
        if (existing.players.some((p) => p.name.toLowerCase() === trimmed.toLowerCase())) {
          setJoinError(`Ya hay alguien llamado "${trimmed}" en esa sala. Cambiá el nombre.`);
          setJoining(false);
          return;
        }
        existing.players = [...existing.players, me];
      }
      await writeRoom(code, existing);
      window.storage.incrementCounter("players").catch(() => {});
      localStorage.setItem(SESSION_KEY, JSON.stringify({ code, playerId: me.id }));
      onJoined(code, me.id);
    } catch (e) {
      setJoinError("No se pudo conectar a la sala. Probá de nuevo.");
    } finally {
      setJoining(false);
    }
  };

  return (
    <Screen>
      <Title size={26}>Diccionario Trucho</Title>
      <Sub style={{ marginTop: -10 }}>De {MIN_PLAYERS} a {MAX_PLAYERS} jugadores, cada uno en su celu</Sub>
      <Card style={{ width: "100%", maxWidth: 420 }}>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Tu nombre" style={inputStyle} />
        <input
          value={codeInput}
          onChange={(e) => setCodeInput(e.target.value.toUpperCase())}
          placeholder="Código de sala (opcional)"
          style={inputStyle}
        />
        {joinError && <div style={{ color: "#FF5D7A", fontSize: 13, marginBottom: 8 }}>{joinError}</div>}
        <BigButton onClick={() => doJoin(null)} disabled={joining}>
          {codeInput.trim() ? "Unirme a esa sala" : "Crear sala nueva"}
        </BigButton>
      </Card>

      {resumable && (
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <Sub style={{ marginTop: 0 }}>Ya estabas en la sala <b>{resumable.code}</b> como {resumable.name}</Sub>
          <BigButton onClick={() => onJoined(resumable.code, resumable.playerId)} color="#3E9EFF">
            Volver a esa sala
          </BigButton>
        </Card>
      )}

      {openRooms.length > 0 && (
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", fontWeight: 700, marginBottom: 8 }}>Salas abiertas ahora</div>
          {openRooms.map((r) => (
            <button
              key={r.code}
              onClick={() => { setCodeInput(r.code); doJoin(r.code); }}
              style={{ display: "flex", justifyContent: "space-between", width: "100%", background: "rgba(255,255,255,0.06)", border: "none", borderRadius: 10, padding: "10px 12px", marginBottom: 6, color: "#F3EEFF", cursor: "pointer", fontWeight: 700 }}
            >
              <span>{r.code}</span>
              <span style={{ color: "#8b7fa8" }}>{(r.players || []).length}/{MAX_PLAYERS} jugadores</span>
            </button>
          ))}
        </Card>
      )}

      <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
        Volver
      </BigButton>
    </Screen>
  );
}

// ==================== SALA ====================
function GameRoom({ roomCode, myId, onBack }) {
  const [room, setRoom] = useState(null);
  const [myState, setMyState] = useState(null);
  const [draft, setDraft] = useState("");
  const [now, setNow] = useState(Date.now());

  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 500);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    let cancelled = false;
    const tick = async () => {
      const r = await readRoom(roomCode);
      if (cancelled || !r) return;
      setRoom(r);
      const round = r.round || 0;
      if (round > 0 && (r.phase === "writing" || r.phase === "voting" || r.phase === "reveal")) {
        const st = await readPlayerState(roomCode, round, myId);
        if (cancelled) return;
        setMyState(st);
        // checkWritingComplete/checkVotingComplete ya deciden solas si hay
        // que avanzar de fase (todos listos, o se acabó el tiempo) — no
        // hace falta duplicar esa condición acá.
        if (r.phase === "writing") {
          await checkWritingComplete(roomCode, round);
        } else if (r.phase === "voting") {
          await checkVotingComplete(roomCode, round);
        }
      }
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, [roomCode, myId]);

  if (!room) {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <Sub>Cargando sala...</Sub>
      </Screen>
    );
  }

  const players = room.players || [];
  const effectiveHost = players.find((p) => p.id === room.hostId) || [...players].sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0))[0] || null;
  const isHost = !!effectiveHost && effectiveHost.id === myId;
  const currentWord = WORD_BANK.find((w) => w.id === room.currentWordId);

  const setTotalRounds = async (n) => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.totalRounds = n;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const startGame = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh || fresh.players.length < MIN_PLAYERS) return;
    await startRound(roomCode, fresh);
    const r = await readRoom(roomCode);
    setRoom(r);
    setMyState(await readPlayerState(roomCode, r.round, myId));
    setDraft("");
  };

  const submitDefinition = async () => {
    const trimmed = draft.trim().slice(0, MAX_DEF_LEN);
    if (!trimmed) return;
    const state = { definition: trimmed, submittedAt: Date.now(), votedFor: null, votedAt: null };
    await writePlayerState(roomCode, room.round, myId, state);
    setMyState(state);
  };

  const submitVote = async (optionKey) => {
    const base = myState || {};
    const next = { ...base, votedFor: optionKey, votedAt: Date.now() };
    await writePlayerState(roomCode, room.round, myId, next);
    setMyState(next);
  };

  const nextRound = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    if ((fresh.round || 0) >= (fresh.totalRounds || DEFAULT_ROUNDS)) {
      fresh.phase = "ended";
      await writeRoom(roomCode, fresh);
      setRoom(fresh);
      return;
    }
    await startRound(roomCode, fresh);
    const r = await readRoom(roomCode);
    setRoom(r);
    setMyState(await readPlayerState(roomCode, r.round, myId));
    setDraft("");
  };

  const playAgain = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.phase = "lobby";
    fresh.round = 0;
    fresh.usedWordIds = [];
    fresh.currentWordId = null;
    fresh.currentOptions = null;
    fresh.phaseEndsAt = null;
    fresh.players = fresh.players.map((p) => ({ ...p, score: 0, lastRoundPoints: 0 }));
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setMyState(null);
  };

  const leaveRoom = async () => {
    const fresh = await readRoom(roomCode);
    if (fresh) {
      fresh.players = fresh.players.filter((p) => p.id !== myId);
      await writeRoom(roomCode, fresh);
    }
    localStorage.removeItem(SESSION_KEY);
    onBack();
  };

  // ---------- LOBBY ----------
  if (room.phase === "lobby") {
    const totalRounds = room.totalRounds || DEFAULT_ROUNDS;
    return (
      <Screen homeConfirm="¿Salir de la sala?">
        <Title size={26}>Sala {room.code}</Title>
        <Sub style={{ marginTop: -10 }}>Compartí el código para que se sumen ({players.length}/{MAX_PLAYERS}). Mínimo {MIN_PLAYERS} jugadores.</Sub>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          {players.map((p) => (
            <div key={p.id} style={{ padding: "6px 2px", color: "#F3EEFF" }}>
              {p.id === effectiveHost?.id ? "👑 " : "• "}
              {p.name}
              {p.id === myId ? " (vos)" : ""}
            </div>
          ))}
        </Card>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 6, fontWeight: 700 }}>Cómo se juega</div>
          <div style={{ fontSize: 13.5, lineHeight: 1.55, color: "#F3EEFF" }}>
            📖 Sale una palabra rara. Todos escriben una definición inventada pero creíble ({Math.round(WRITING_MS / 1000)}s para pensarla).
            <br />
            🗳️ Se mezclan todas las definiciones con la real, de incógnito, y todos votan cuál creen que es la verdadera ({Math.round(VOTING_MS / 1000)}s para votar). No podés votar la tuya.
            <br />
            🏆 Sumás {CORRECT_VOTE_POINTS} puntos si acertás la verdadera, y {FOOLED_VOTE_POINTS} punto por cada voto que le mandan a tu mentira.
          </div>
        </Card>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Cantidad de palabras</div>
          {isHost ? (
            <div style={{ display: "flex", gap: 8 }}>
              {ROUND_OPTIONS.map((n) => (
                <button key={n} onClick={() => setTotalRounds(n)} style={{ ...pillStyle(totalRounds === n), flex: 1 }}>
                  {n}
                </button>
              ))}
            </div>
          ) : (
            <div style={{ color: "#F3EEFF", fontWeight: 700 }}>{totalRounds} palabras</div>
          )}
        </Card>
        {isHost ? (
          <BigButton onClick={startGame} disabled={players.length < MIN_PLAYERS}>
            {players.length < MIN_PLAYERS ? `Esperando jugadores (mín. ${MIN_PLAYERS})...` : "Empezar 🎮"}
          </BigButton>
        ) : (
          <Sub>Esperando a que {effectiveHost ? effectiveHost.name : "el anfitrión/a"} empiece...</Sub>
        )}
        <BigButton onClick={leaveRoom} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Salir de la sala
        </BigButton>
      </Screen>
    );
  }

  // ---------- ENDED ----------
  if (room.phase === "ended") {
    const ranked = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
    const medals = ["🥇", "🥈", "🥉"];
    return (
      <Screen>
        <Title size={26}>🏆 ¡Fin de la partida!</Title>
        {ranked[0] && <Sub style={{ marginTop: -10 }}>Ganó <b style={{ color: "#FFD23F" }}>{ranked[0].name}</b> con {ranked[0].score || 0} puntos</Sub>}
        <Card style={{ width: "100%", maxWidth: 420 }}>
          {ranked.map((p, i) => (
            <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 2px", borderBottom: i < ranked.length - 1 ? "1px solid rgba(255,255,255,0.08)" : "none" }}>
              <span>{medals[i] || `${i + 1}°`} {p.name}{p.id === myId ? " (vos)" : ""}</span>
              <span style={{ color: "#FFD23F", fontWeight: 800 }}>{p.score || 0}</span>
            </div>
          ))}
        </Card>
        <BigButton onClick={playAgain}>🔁 Jugar otra vez</BigButton>
        <BigButton onClick={leaveRoom} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Salir de la sala
        </BigButton>
      </Screen>
    );
  }

  // ---------- WRITING ----------
  if (room.phase === "writing") {
    // No mostramos quién ya mandó la suya en tiempo real (evitaría un
    // pedido de red extra por segundo, uno por jugador): el chequeo de
    // fondo (checkWritingComplete) igual avanza de fase solo apenas
    // están todas, sin que haga falta verlo acá.
    const iSubmitted = !!(myState && myState.definition);
    return (
      <Screen homeConfirm="¿Salir? Perdés el progreso de esta partida.">
        <Title size={22}>Sala {room.code}</Title>
        <PlayerBadgeRow players={players} doneIds={new Set()} myId={myId} showDone={false} />
        <Countdown endsAt={room.phaseEndsAt || Date.now()} now={now} label="Para escribir:" />
        <Card style={{ width: "100%", maxWidth: 460, textAlign: "center" }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 6, fontWeight: 700 }}>Palabra {room.round}/{room.totalRounds || DEFAULT_ROUNDS}</div>
          <Title size={30}>{currentWord ? currentWord.word : "…"}</Title>
        </Card>
        {iSubmitted ? (
          <Card style={{ width: "100%", maxWidth: 420, textAlign: "center" }}>
            <div style={{ fontSize: 40, marginBottom: 6 }}>✅</div>
            <Title size={18}>¡Ya mandaste tu definición!</Title>
            <Sub style={{ marginBottom: 0 }}>Esperando a que terminen los demás...</Sub>
          </Card>
        ) : (
          <Card style={{ width: "100%", maxWidth: 460 }}>
            <textarea
              value={draft}
              onChange={(e) => setDraft(e.target.value.slice(0, MAX_DEF_LEN))}
              placeholder="Escribí una definición inventada, lo más creíble posible…"
              rows={4}
              style={{ ...inputStyle, resize: "none", marginBottom: 6 }}
            />
            <Sub style={{ margin: "0 0 10px", fontSize: 12 }}>{draft.length}/{MAX_DEF_LEN}</Sub>
            <BigButton onClick={submitDefinition} disabled={!draft.trim()}>
              Mandar definición
            </BigButton>
          </Card>
        )}
      </Screen>
    );
  }

  // ---------- VOTING ----------
  if (room.phase === "voting") {
    const options = room.currentOptions || [];
    const myVote = myState && myState.votedFor;
    return (
      <Screen homeConfirm="¿Salir? Perdés el progreso de esta partida.">
        <Title size={22}>Sala {room.code}</Title>
        <PlayerBadgeRow players={players} doneIds={new Set()} myId={myId} showDone={false} />
        <Countdown endsAt={room.phaseEndsAt || Date.now()} now={now} label="Para votar:" />
        <Card style={{ width: "100%", maxWidth: 460, textAlign: "center" }}>
          <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 6, fontWeight: 700 }}>¿Cuál definición de "{currentWord ? currentWord.word : "…"}" es la verdadera?</div>
        </Card>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, width: "100%", maxWidth: 460, marginBottom: 14 }}>
          {options.map((o) => {
            const isMine = o.key === myId;
            const selected = myVote === o.key;
            return (
              <button
                key={o.key}
                onClick={() => !isMine && !myVote && submitVote(o.key)}
                disabled={isMine || !!myVote}
                style={{
                  textAlign: "left",
                  padding: "14px 16px",
                  borderRadius: 16,
                  border: selected ? "2px solid #FFD23F" : "1.5px solid rgba(255,255,255,0.15)",
                  background: selected ? "rgba(255,210,63,0.18)" : isMine ? "rgba(255,255,255,0.03)" : "rgba(255,255,255,0.07)",
                  color: isMine ? "#8b7fa8" : "#F3EEFF",
                  fontFamily: "'Nunito', sans-serif",
                  fontSize: 15,
                  lineHeight: 1.4,
                  cursor: isMine || myVote ? "default" : "pointer",
                  opacity: myVote && !selected ? 0.55 : 1,
                }}
              >
                {o.text}
                {isMine && <div style={{ marginTop: 4, fontSize: 12, color: "#8b7fa8" }}>✍️ la escribiste vos</div>}
              </button>
            );
          })}
        </div>
        {myVote && (
          <Card style={{ width: "100%", maxWidth: 420, textAlign: "center" }}>
            <div style={{ fontSize: 32, marginBottom: 4 }}>🗳️</div>
            <Sub style={{ marginBottom: 0 }}>Ya votaste. Esperando a que terminen los demás...</Sub>
          </Card>
        )}
      </Screen>
    );
  }

  // ---------- REVEAL ----------
  if (room.phase === "reveal") {
    const options = room.currentOptions || [];
    const isLastRound = (room.round || 0) >= (room.totalRounds || DEFAULT_ROUNDS);
    return (
      <RevealScreen
        roomCode={roomCode}
        round={room.round}
        players={players}
        myId={myId}
        word={currentWord}
        options={options}
        isHost={isHost}
        isLastRound={isLastRound}
        onNext={nextRound}
      />
    );
  }

  return (
    <Screen style={{ justifyContent: "center" }}>
      <Sub>Cargando...</Sub>
    </Screen>
  );
}

// Pantalla de resultados de la ronda: necesita leer el voto de cada
// jugador para armar el conteo (quién votó qué), así que trae su propio
// estado con readAllPlayerStates (por clave exacta, nunca list()).
function RevealScreen({ roomCode, round, players, myId, word, options, isHost, isLastRound, onNext }) {
  const [votesByOption, setVotesByOption] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const states = await readAllPlayerStates(roomCode, round, players.map((p) => p.id));
      if (cancelled) return;
      const tally = {};
      players.forEach((p) => {
        const v = (states[p.id] || {}).votedFor;
        if (!v) return;
        tally[v] = tally[v] || [];
        tally[v].push(p.name);
      });
      setVotesByOption(tally);
    })();
    return () => { cancelled = true; };
  }, [roomCode, round]);

  const authorName = (key) => (players.find((p) => p.id === key) || {}).name || "?";
  const myPointsThisRound = (players.find((p) => p.id === myId) || {}).lastRoundPoints || 0;

  return (
    <Screen>
      <Title size={22}>Sala — Ronda {round}</Title>
      <Card style={{ width: "100%", maxWidth: 460, textAlign: "center" }}>
        <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 6, fontWeight: 700 }}>La palabra era</div>
        <Title size={26}>{word ? word.word : "…"}</Title>
        <Sub style={{ marginBottom: 0 }}>{word ? word.def : ""}</Sub>
      </Card>

      <div style={{ display: "flex", flexDirection: "column", gap: 10, width: "100%", maxWidth: 460, marginBottom: 14 }}>
        {options.map((o) => {
          const isReal = o.key === "real";
          const voters = (votesByOption && votesByOption[o.key]) || [];
          return (
            <div
              key={o.key}
              style={{
                padding: "14px 16px",
                borderRadius: 16,
                border: isReal ? "2px solid #3DDC84" : "1.5px solid rgba(255,255,255,0.15)",
                background: isReal ? "rgba(61,220,132,0.15)" : "rgba(255,255,255,0.06)",
              }}
            >
              <div style={{ fontSize: 15, lineHeight: 1.4, color: "#F3EEFF" }}>{o.text}</div>
              <div style={{ marginTop: 6, fontSize: 12, color: isReal ? "#3DDC84" : "#8b7fa8", fontWeight: 700 }}>
                {isReal ? "✅ La verdadera" : `✍️ Mentira de ${authorName(o.key)}`}
                {voters.length > 0 && ` · votada por ${voters.join(", ")}`}
              </div>
            </div>
          );
        })}
      </div>

      <Card style={{ width: "100%", maxWidth: 420 }}>
        <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 8, fontWeight: 700 }}>Puntaje</div>
        {[...players].sort((a, b) => (b.score || 0) - (a.score || 0)).map((p) => (
          <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 2px" }}>
            <span>{p.name}{p.id === myId ? " (vos)" : ""}</span>
            <span>
              {p.lastRoundPoints ? <span style={{ color: "#3DDC84", fontWeight: 700, marginRight: 8 }}>+{p.lastRoundPoints}</span> : null}
              <b style={{ color: "#FFD23F" }}>{p.score || 0}</b>
            </span>
          </div>
        ))}
      </Card>

      {isHost ? (
        <BigButton onClick={onNext}>{isLastRound ? "Ver resultados finales 🏆" : "Siguiente palabra ➜"}</BigButton>
      ) : (
        <Sub>Esperando a que el anfitrión/a siga...</Sub>
      )}
    </Screen>
  );
}

function App() {
  useInjectFont();
  const [mode, setMode] = useState("home");
  const [roomCode, setRoomCode] = useState(null);
  const [myId, setMyId] = useState(null);

  if (mode === "home") return <Home onSelect={setMode} />;
  if (mode === "game" && roomCode && myId) {
    return (
      <GameRoom
        roomCode={roomCode}
        myId={myId}
        onBack={() => {
          setRoomCode(null);
          setMyId(null);
          setMode("home");
        }}
      />
    );
  }
  return (
    <JoinScreen
      onJoined={(code, id) => {
        setRoomCode(code);
        setMyId(id);
      }}
      onBack={() => setMode("home")}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
