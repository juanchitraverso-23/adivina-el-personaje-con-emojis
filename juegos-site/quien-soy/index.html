                    width: "100%",
                    textAlign: "left",
                    background: "rgba(255,255,255,0.06)",
                    border: "1px solid rgba(255,255,255,0.1)",
                    borderRadius: 10,
                    padding: "8px 12px",
                    marginBottom: 6,
                    color: "#F3EEFF",
                    cursor: "pointer",
                  }}
                >
                  "{a.text}" — <span style={{ color: "#FFD23F", fontWeight: 700 }}>marcar como correcta ✓</span>
                </button>
              ))}
            </div>
          ))}
        </Card>
      )}

      {isHost && <BigButton onClick={onPlayAgain}>🔁 Jugar otra ronda</BigButton>}
      <BigButton onClick={onLeave} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
        Salir de la sala
      </BigButton>
    </Screen>
  );
}

function SimultaneousGame({ onBack }) {
  const [screen, setScreen] = useState("join");
  const [name, setName] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [joinError, setJoinError] = useState("");
  const [joining, setJoining] = useState(false);
  const [openRooms, setOpenRooms] = useState([]);
  const [resumable, setResumable] = useState(null);

  const [roomCode, setRoomCode] = useState(null);
  const [myId, setMyId] = useState(null);
  const [room, setRoom] = useState(null);
  const [secrets, setSecrets] = useState({});
  const [progressMap, setProgressMap] = useState({});

  useEffect(() => {
    if (screen !== "join") return;
    let cancelled = false;
    const tick = async () => {
      try {
        const entries = await window.storage.list(SIM_STORAGE_PREFIX);
        if (cancelled) return;
        const rooms = entries
          .map((e) => {
            if (!/^quiensoy-todos:sala:[^:]+$/.test(e.key)) return null;
            try {
              return JSON.parse(e.value);
            } catch {
              return null;
            }
          })
          .filter((r) => r && r.phase === "lobby" && Date.now() - (r.createdAt || 0) < 3 * 60 * 60 * 1000)
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        setOpenRooms(rooms);
      } catch {}
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, [screen]);

  useEffect(() => {
    if (screen !== "join") return;
    let cancelled = false;
    (async () => {
      let saved;
      try {
        saved = JSON.parse(localStorage.getItem(SIM_SESSION_KEY) || "null");
      } catch {
        saved = null;
      }
      if (!saved || !saved.code || !saved.playerId) {
        setResumable(null);
        return;
      }
      const existing = await simReadRoom(saved.code);
      if (cancelled) return;
      if (existing && existing.players.some((p) => p.id === saved.playerId)) {
        setResumable({
          code: saved.code,
          playerId: saved.playerId,
          name: (existing.players.find((p) => p.id === saved.playerId) || {}).name,
        });
      } else {
        localStorage.removeItem(SIM_SESSION_KEY);
        setResumable(null);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [screen]);

  const resumeSession = () => {
    if (!resumable) return;
    setRoomCode(resumable.code);
    setMyId(resumable.playerId);
    setScreen("game");
  };

  const doJoin = async (codeMaybe) => {
    const trimmed = name.trim();
    if (!trimmed) {
      setJoinError("Escribí tu nombre.");
      return;
    }
    setJoining(true);
    setJoinError("");
    try {
      const code = codeMaybe || (codeInput.trim() ? codeInput.trim().toUpperCase() : randomCode());
      let existing = await simReadRoom(code);
      if (existing && existing.phase !== "lobby" && existing.phase !== "setup") {
        setJoinError("Esa sala ya está adivinando. Esperá a que termine la ronda.");
        setJoining(false);
        return;
      }
      const me = { id: randomId(), name: trimmed, deviceId: MY_DEVICE_ID, joinedAt: Date.now() };
      if (!existing) {
        existing = {
          code,
          hostId: me.id,
          players: [me],
          phase: "lobby",
          round: 1,
          createdAt: Date.now(),
        };
      } else {
        if (existing.players.some((p) => p.name.toLowerCase() === trimmed.toLowerCase())) {
          setJoinError(`Ya hay alguien llamado "${trimmed}" en esa sala. Cambiá el nombre.`);
          setJoining(false);
          return;
        }
        existing.players = [...existing.players, me];
      }
      await simWriteRoom(code, existing);
      window.storage.incrementCounter("players").catch(() => {});
      localStorage.setItem(SIM_SESSION_KEY, JSON.stringify({ code, playerId: me.id }));
      setRoomCode(code);
      setMyId(me.id);
      setScreen("game");
    } catch (e) {
      setJoinError("No se pudo conectar a la sala. Probá de nuevo.");
    } finally {
      setJoining(false);
    }
  };

  const leaveRoom = async () => {
    try {
      const fresh = await simReadRoom(roomCode);
      if (fresh) {
        fresh.players = (fresh.players || []).filter((p) => p.id !== myId);
        await simWriteRoom(roomCode, fresh);
      }
    } catch {}
    localStorage.removeItem(SIM_SESSION_KEY);
    onBack();
  };

  useEffect(() => {
    if (!roomCode) return;
    let cancelled = false;
    const tick = async () => {
      const r = await simReadRoom(roomCode);
      if (cancelled || !r) return;
      setRoom(r);
      const round = r.round || 1;
      if (r.phase === "setup" || r.phase === "guessing") {
        const s = await simListSecrets(roomCode, round);
        if (cancelled) return;
        setSecrets(s);
        if (r.phase === "setup" && r.players.length >= 2 && Object.keys(s).length >= r.players.length) {
          const fresh = await simReadRoom(roomCode);
          if (fresh && fresh.phase === "setup") {
            fresh.phase = "guessing";
            await simWriteRoom(roomCode, fresh);
          }
        }
      }
      if (r.phase === "guessing" || r.phase === "results") {
        const p = await simListProgress(roomCode, round);
        if (!cancelled) setProgressMap(p);
      }
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, [roomCode]);

  const players = room?.players || [];
  const effectiveHost =
    players.find((p) => p.id === room?.hostId) ||
    [...players].sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0))[0] ||
    null;
  const isHost = !!effectiveHost && effectiveHost.id === myId;

  const passControlTo = async (targetId) => {
    const fresh = await simReadRoom(roomCode);
    if (!fresh) return;
    fresh.hostId = targetId;
    await simWriteRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const startSetup = async () => {
    const fresh = await simReadRoom(roomCode);
    if (!fresh || fresh.players.length < 2) return;
    fresh.phase = "setup";
    await simWriteRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const endRound = async () => {
    const fresh = await simReadRoom(roomCode);
    if (!fresh) return;
    fresh.phase = "results";
    await simWriteRoom(roomCode, fresh);
    setRoom(fresh);
  };

  const playAgain = async () => {
    const fresh = await simReadRoom(roomCode);
    if (!fresh) return;
    fresh.round = (fresh.round || 1) + 1;
    fresh.phase = "setup";
    await simWriteRoom(roomCode, fresh);
    setRoom(fresh);
    setSecrets({});
    setProgressMap({});
  };

  if (screen === "join") {
    return (
      <Screen>
        <Title size={26}>Todos a la vez</Title>
        <Sub style={{ marginTop: -10 }}>Todos piensan un personaje y después se adivinan entre todos</Sub>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          <input
            value={name}
            onChange={(e) => setName(e.target.value)}
            placeholder="Tu nombre"
            style={inputStyle}
          />
          <input
            value={codeInput}
            onChange={(e) => setCodeInput(e.target.value.toUpperCase())}
            placeholder="Código de sala (opcional)"
            style={inputStyle}
          />
          {joinError && <div style={{ color: "#FF5D7A", fontSize: 13, marginBottom: 8 }}>{joinError}</div>}
          <BigButton onClick={() => doJoin(null)} disabled={joining}>
            {codeInput.trim() ? "Unirme a esa sala" : "Crear sala nueva"}
          </BigButton>
        </Card>

        {resumable && (
          <Card style={{ width: "100%", maxWidth: 420 }}>
            <Sub style={{ marginTop: 0 }}>
              Ya estabas en la sala <b>{resumable.code}</b> como {resumable.name}
            </Sub>
            <BigButton onClick={resumeSession} color="#5B4B8A">
              Volver a esa sala
            </BigButton>
          </Card>
        )}

        {openRooms.length > 0 && (
          <Card style={{ width: "100%", maxWidth: 420 }}>
            <div style={{ fontSize: 13, color: "#8b7fa8", fontWeight: 700, marginBottom: 8 }}>Salas abiertas ahora</div>
            {openRooms.map((r) => (
              <button
                key={r.code}
                onClick={() => {
                  setCodeInput(r.code);
                  doJoin(r.code);
                }}
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  width: "100%",
                  background: "rgba(255,255,255,0.06)",
                  border: "none",
                  borderRadius: 10,
                  padding: "10px 12px",
                  marginBottom: 6,
                  color: "#F3EEFF",
                  cursor: "pointer",
                  fontWeight: 700,
                }}
              >
                <span>{r.code}</span>
                <span style={{ color: "#8b7fa8" }}>{(r.players || []).length} jugador(es)</span>
              </button>
            ))}
          </Card>
        )}

        <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Volver
        </BigButton>
      </Screen>
    );
  }

  if (!room) {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <Sub>Cargando sala...</Sub>
      </Screen>
    );
  }

  if (room.phase === "lobby") {
    return (
      <Screen homeConfirm="¿Salir de la sala?">
        <Title size={26}>Sala {room.code}</Title>
        <Sub style={{ marginTop: -10 }}>Compartí el código para que se sumen. Mínimo 2 jugadores.</Sub>
        <Card style={{ width: "100%", maxWidth: 420 }}>
          {players.map((p) => (
            <div key={p.id} style={{ padding: "6px 2px", color: "#F3EEFF" }}>
              {p.id === effectiveHost?.id ? "👑 " : "• "}
              {p.name}
              {p.id === myId ? " (vos)" : ""}
            </div>
          ))}
        </Card>
        {isHost ? (
          <>
            <BigButton onClick={startSetup} disabled={players.length < 2}>
              {players.length < 2 ? "Esperando otro jugador..." : "Empezar 🎬"}
            </BigButton>
            {players.length > 1 && (
              <Card style={{ width: "100%", maxWidth: 420 }}>
                <div style={{ fontSize: 13, color: "#8b7fa8", marginBottom: 6 }}>Pasarle el mando a otro/a</div>
                {players
                  .filter((p) => p.id !== myId)
                  .map((p) => (
                    <button
                      key={p.id}
                      onClick={() => passControlTo(p.id)}
                      style={{
                        display: "block",
                        width: "100%",
                        textAlign: "left",
                        background: "rgba(255,255,255,0.06)",
                        border: "none",
                        borderRadius: 8,
                        padding: "8px 10px",
                        marginBottom: 4,
                        color: "#F3EEFF",
                        cursor: "pointer",
                      }}
                    >
                      👑 {p.name}
                    </button>
                  ))}
              </Card>
            )}
          </>
        ) : (
          <Sub>Esperando a que {effectiveHost ? effectiveHost.name : "el anfitrión/a"} empiece...</Sub>
        )}
        <BigButton onClick={leaveRoom} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Salir de la sala
        </BigButton>
      </Screen>
    );
  }

  if (room.phase === "setup") {
    return <SimSetupScreen room={room} myId={myId} secrets={secrets} onBack={leaveRoom} />;
  }

  if (room.phase === "guessing") {
    return (
      <SimGuessingScreen
        room={room}
        myId={myId}
        secrets={secrets}
        progressMap={progressMap}
        setProgressMap={setProgressMap}
        isHost={isHost}
        onEndRound={endRound}
        onLeave={leaveRoom}
      />
    );
  }

  if (room.phase === "results") {
    return (
      <SimResultsScreen
        room={room}
        myId={myId}
        secrets={secrets}
        progressMap={progressMap}
        setProgressMap={setProgressMap}
        isHost={isHost}
        onPlayAgain={playAgain}
        onLeave={leaveRoom}
      />
    );
  }

  return null;
}
