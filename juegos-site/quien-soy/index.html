<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>¿Quién Soy? — Juego de emojis</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="¿Quién Soy?" />
<meta name="theme-color" content="#1B1035" />
<style>
  html, body { margin:0; padding:0; background:#0c0620; }
  #root { min-height: 100vh; }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../storage.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ---- Salas online: mismo patrón de KV vía storage.js que los otros juegos ----
const STORAGE_PREFIX = "quien-soy:sala:";
const POLL_MS = 1200;
const SESSION_KEY = "quien-soy:session";

function randomId() {
  return Math.random().toString(36).slice(2, 10);
}
function randomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
async function readRoom(code) {
  try {
    const res = await window.storage.get(STORAGE_PREFIX + code, true);
    if (!res) return null;
    return JSON.parse(res.value);
  } catch {
    return null;
  }
}
async function writeRoom(code, room) {
  await window.storage.set(STORAGE_PREFIX + code, JSON.stringify(room), true);
}

// Identidad del CELU (no de una persona): estable entre recargas, para que
// un mismo teléfono con varios jugadores de la misma casa se reconozca como
// tal al volver a entrar. Cada jugador de esa casa es una entrada aparte en
// room.players, todas con este mismo deviceId.
const MY_DEVICE_ID = (() => {
  const KEY = "quien-soy:deviceId";
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = randomId();
    localStorage.setItem(KEY, id);
  }
  return id;
})();


// Pensados para describir a UNA PERSONA con pocos toques: gente (género,
// edad, pareja), colores, animales conocidos y deportes conocidos son los
// que más se repiten al armar pistas. Si falta alguno puntual, siempre se
// puede escribir/pegar cualquier otro emoji abajo de esta grilla.
const QUICK_EMOJIS = [
  "👨","👩","💑","👴","👵","👶","🧒","👑","🤴","👸",
  "🔴","🟠","🟡","🟢","🔵","🟣","⚫","⚪",
  "🐶","🐱","🦁","🐘","🐴","🐍","🦅","🐻","🐺","🐐",
  "⚽","🏀","🏈","🎾","🏐","🚴","🥊","🏆",
  "🎤","🎬","🎨","🧙","🦸","🤖","👽","🎩","🔥","🌟","🚀","🎸",
];

const GRADIENT_BG =
  "radial-gradient(circle at 20% -10%, #3a2166 0%, #170b2e 45%, #0c0620 100%)";

function useInjectFont() {
  useEffect(() => {
    if (document.getElementById("aq-fonts")) return;
    const link = document.createElement("link");
    link.id = "aq-fonts";
    link.rel = "stylesheet";
    link.href =
      "https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap";
    document.head.appendChild(link);
  }, []);
}

function Screen({ children, style, homeConfirm }) {
  return (
    <div
      style={{
        minHeight: "100vh",
        width: "100%",
        background: GRADIENT_BG,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "flex-start",
        padding: "28px 18px 40px",
        fontFamily: "'Nunito', sans-serif",
        color: "#F3EEFF",
        boxSizing: "border-box",
        ...style,
      }}
    >
      {homeConfirm !== null && <HomeButton confirmMessage={homeConfirm} />}
      {children}
    </div>
  );
}

// Botón fijo para volver al menú de juegos desde cualquier pantalla. Si
// confirmMessage viene seteado, pide confirmación antes de salir (para no
// perder progreso de la partida por un toque de más).
function HomeButton({ confirmMessage }) {
  return (
    <a
      href="../"
      onClick={(e) => {
        if (confirmMessage && !window.confirm(confirmMessage)) e.preventDefault();
      }}
      title="Volver al menú de juegos"
      style={{
        position: "fixed",
        top: "calc(env(safe-area-inset-top, 0px) + 14px)",
        left: 14,
        zIndex: 50,
        display: "flex",
        alignItems: "center",
        gap: 6,
        padding: "9px 16px 9px 11px",
        borderRadius: 30,
        background: "rgba(0,0,0,0.6)",
        border: "1.5px solid rgba(255,255,255,0.4)",
        color: "#fff",
        fontFamily: "'Nunito', sans-serif",
        fontWeight: 800,
        fontSize: 15,
        textDecoration: "none",
        boxShadow: "0 4px 14px rgba(0,0,0,0.35)",
      }}
    >
      <span style={{ fontSize: 19 }}>🏠</span> Menú
    </a>
  );
}

function Title({ children, size = 30 }) {
  return (
    <h1
      style={{
        fontFamily: "'Baloo 2', sans-serif",
        fontWeight: 800,
        fontSize: size,
        color: "#FFD23F",
        textShadow: "0 3px 0 rgba(0,0,0,0.35)",
        margin: "0 0 6px",
        textAlign: "center",
        letterSpacing: 0.3,
      }}
    >
      {children}
    </h1>
  );
}

function Sub({ children, style }) {
  return (
    <p
      style={{
        color: "#C9B8F0",
        fontSize: 16,
        textAlign: "center",
        margin: "0 0 22px",
        lineHeight: 1.4,
        ...style,
      }}
    >
      {children}
    </p>
  );
}

function joinNames(names) {
  if (names.length === 0) return "";
  if (names.length === 1) return names[0];
  return `${names.slice(0, -1).join(", ")} y ${names[names.length - 1]}`;
}

function BigButton({ children, onClick, color = "#FF3E7F", disabled, style }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{
        width: "100%",
        maxWidth: 380,
        padding: "16px 20px",
        borderRadius: 18,
        border: "none",
        background: disabled ? "#4a3d63" : color,
        color: disabled ? "#8b7fa8" : "#1B1035",
        fontFamily: "'Baloo 2', sans-serif",
        fontWeight: 700,
        fontSize: 18,
        boxShadow: disabled ? "none" : "0 6px 0 rgba(0,0,0,0.28)",
        cursor: disabled ? "default" : "pointer",
        marginBottom: 14,
        transition: "transform 0.08s ease",
        ...style,
      }}
      onMouseDown={(e) => {
        if (!disabled) e.currentTarget.style.transform = "translateY(4px)";
      }}
      onMouseUp={(e) => {
        e.currentTarget.style.transform = "translateY(0)";
      }}
      onTouchStart={(e) => {
        if (!disabled) e.currentTarget.style.transform = "translateY(4px)";
      }}
      onTouchEnd={(e) => {
        e.currentTarget.style.transform = "translateY(0)";
      }}
    >
      {children}
    </button>
  );
}

function Card({ children, style }) {
  return (
    <div
      style={{
        width: "100%",
        maxWidth: 420,
        background: "rgba(255,255,255,0.06)",
        border: "1px solid rgba(255,255,255,0.12)",
        borderRadius: 22,
        padding: 20,
        boxSizing: "border-box",
        ...style,
      }}
    >
      {children}
    </div>
  );
}

function ClueTrail({ clues }) {
  if (!clues.length) return null;
  return (
    <div
      style={{
        width: "100%",
        maxWidth: 420,
        display: "flex",
        flexWrap: "wrap",
        gap: 8,
        justifyContent: "center",
        marginBottom: 22,
        padding: "14px 12px",
        background: "rgba(0,0,0,0.25)",
        borderRadius: 18,
        border: "1px dashed rgba(255,210,63,0.4)",
      }}
    >
      {clues.map((c, i) => (
        <div
          key={i}
          style={{
            fontSize: 34,
            background: "rgba(255,255,255,0.08)",
            borderRadius: 12,
            padding: "6px 10px",
            position: "relative",
          }}
        >
          {c}
          <span
            style={{
              position: "absolute",
              top: -8,
              right: -4,
              fontSize: 11,
              background: "#FFD23F",
              color: "#1B1035",
              borderRadius: 8,
              padding: "1px 5px",
              fontWeight: 800,
              fontFamily: "'Baloo 2', sans-serif",
            }}
          >
            {i + 1}
          </span>
        </div>
      ))}
    </div>
  );
}

// Fondo animado estilo SNES (cielo + sol + nubes + piso Mode 7), solo para
// la pantalla de entrada (Home) de cada juego — position:fixed, así que da
// igual dónde vive en el árbol: siempre cubre el viewport detrás de todo.
function BgScene() {
  return (
    <>
      <style>{`
        @keyframes bgsun-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        @keyframes bgcloud-drift { from { transform: translateX(115vw); } to { transform: translateX(-45vw); } }
        @keyframes bgfloor-move { from { background-position: 0 0, 0 0; } to { background-position: 64px 0, 0 64px; } }
        .bgscene-sun { animation: bgsun-pulse 3.2s ease-in-out infinite; }
        .bgscene-cloud { animation: bgcloud-drift linear infinite; }
        .bgscene-floor { animation: bgfloor-move 1.1s linear infinite; }
        @media (prefers-reduced-motion: reduce) {
          .bgscene-sun, .bgscene-cloud, .bgscene-floor { animation: none; }
        }
      `}</style>
      <div style={{ position: "fixed", inset: 0, zIndex: 0, overflow: "hidden", pointerEvents: "none" }}>
        <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, #241249 0%, #4a2478 20%, #7a3390 42%, #c85a86 62%, #ef7a4f 80%, #ffcf6b 100%)" }} />
        <div className="bgscene-sun" style={{ position: "absolute", left: "50%", top: "7%", width: 120, height: 120, marginLeft: -60, borderRadius: "50%", background: "radial-gradient(circle at 34% 30%, #fff8d8, #ffd23f 55%, #ff9a1c 100%)", boxShadow: "0 0 80px 22px rgba(255,199,82,0.5)" }} />
        <div style={{ position: "absolute", inset: 0, overflow: "hidden" }}>
          <span className="bgscene-cloud" style={{ position: "absolute", top: "12%", fontSize: 56, opacity: 0.92, filter: "drop-shadow(0 3px 0 rgba(0,0,0,0.18))", animationDuration: "26s" }}>☁️</span>
          <span className="bgscene-cloud" style={{ position: "absolute", top: "24%", fontSize: 34, opacity: 0.92, filter: "drop-shadow(0 3px 0 rgba(0,0,0,0.18))", animationDuration: "34s", animationDelay: "-11s" }}>☁️</span>
          <span className="bgscene-cloud" style={{ position: "absolute", top: "6%", fontSize: 26, opacity: 0.92, filter: "drop-shadow(0 3px 0 rgba(0,0,0,0.18))", animationDuration: "30s", animationDelay: "-21s" }}>☁️</span>
          <span className="bgscene-cloud" style={{ position: "absolute", top: "33%", fontSize: 42, opacity: 0.92, filter: "drop-shadow(0 3px 0 rgba(0,0,0,0.18))", animationDuration: "40s", animationDelay: "-6s" }}>☁️</span>
        </div>
        <div className="bgscene-floor" style={{ position: "absolute", left: "-70%", right: "-70%", bottom: "-4%", height: "36vh", backgroundColor: "#3a1665", backgroundImage: "linear-gradient(90deg, rgba(255,255,255,0.16) 50%, transparent 50%), linear-gradient(rgba(255,255,255,0.16) 50%, transparent 50%)", backgroundSize: "64px 64px", transform: "perspective(280px) rotateX(58deg)", transformOrigin: "bottom" }} />
        <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(12,6,32,0) 0%, rgba(12,6,32,0.15) 40%, rgba(12,6,32,0.6) 75%, rgba(12,6,32,0.9) 100%)" }} />
      </div>
    </>
  );
}

function Home({ onSelect }) {
  return (
    <Screen style={{ justifyContent: "center", background: "transparent" }}>
      <BgScene />
      <div style={{ position: "relative", zIndex: 1, width: "100%", display: "flex", flexDirection: "column", alignItems: "center" }}>
        <div style={{ fontSize: 64, marginBottom: 6 }}>🕵️‍♂️</div>
        <Title size={36}>¿Quién Soy?</Title>
        <Sub>
          Uno piensa una persona o personaje famoso y lo describe con emojis.
          Los demás intentan adivinar. ¡Sin hablar!
        </Sub>
        <BigButton onClick={() => onSelect("offline")} color="#FF3E7F">
          📴 Jugar Offline (pasando el celu)
        </BigButton>
        <BigButton onClick={() => onSelect("online")} color="#5B4B8A">
          🌐 Jugar Online
        </BigButton>
        <BigButton onClick={() => onSelect("simultaneo")} color="#FFD23F" style={{ color: "#1B1035" }}>
          🎉 Todos a la vez
        </BigButton>
      </div>
    </Screen>
  );
}

function App() {
  useInjectFont();
  const [mode, setMode] = useState("home");
  if (mode === "home") return <Home onSelect={setMode} />;
  if (mode === "online") return <OnlineGame onBack={() => setMode("home")} />;
  if (mode === "simultaneo") return <SimultaneousGame onBack={() => setMode("home")} />;
  return <OfflineGame onBack={() => setMode("home")} />;
}

function OfflineGame({ onBack }) {
  const [screen, setScreen] = useState("count");
  const [players, setPlayers] = useState([]);
  const [nameDraft, setNameDraft] = useState("");
  const [playerCount, setPlayerCount] = useState(4);
  const [scores, setScores] = useState({});
  const [clueGiverIdx, setClueGiverIdx] = useState(0);
  const [clues, setClues] = useState([]);
  const [emojiDraft, setEmojiDraft] = useState("");
  const [guessers, setGuessers] = useState([]);
  const [guessIdx, setGuessIdx] = useState(0);
  const [guessDraft, setGuessDraft] = useState("");
  const [guesses, setGuesses] = useState([]);
  const [secretCharacter, setSecretCharacter] = useState("");
  const [selectedWinners, setSelectedWinners] = useState([]);
  const [lastWinners, setLastWinners] = useState([]);
  const [lastPool, setLastPool] = useState(0);
  const [lastShare, setLastShare] = useState(0);
  const [round, setRound] = useState(1);
  const inputRef = useRef(null);

  const clueGiver = players[clueGiverIdx];

  function goHome() {
    setPlayers([]);
    setScores({});
    setClues([]);
    setGuesses([]);
    setSecretCharacter("");
    setSelectedWinners([]);
    setLastWinners([]);
    setRound(1);
    setClueGiverIdx(0);
    setScreen("count");
    onBack();
  }

  function confirmCount() {
    setPlayers(Array.from({ length: playerCount }, () => ""));
    setScreen("names");
  }

  function setPlayerName(i, val) {
    setPlayers((prev) => {
      const copy = [...prev];
      copy[i] = val;
      return copy;
    });
  }

  function namesReady() {
    const cleaned = players.map((p, i) => p.trim() || `Jugador ${i + 1}`);
    setPlayers(cleaned);
    setScores(Object.fromEntries(cleaned.map((n) => [n, 0])));
    setScreen("passToClue");
  }

  function beginClueInput() {
    setClues([]);
    setEmojiDraft("");
    setSecretCharacter("");
    setSelectedWinners([]);
    setScreen("clueInput");
  }

  function addClueAndPass() {
    const val = emojiDraft.trim();
    if (!val) return;
    setClues((prev) => [...prev, val]);
    setEmojiDraft("");
    const gList = players.filter((_, i) => i !== clueGiverIdx);
    setGuessers(gList);
    setGuessIdx(0);
    setGuesses([]);
    setGuessDraft("");
    setScreen("passToGuess");
  }

  function submitGuess() {
    const g = { name: guessers[guessIdx], text: guessDraft.trim() || "(sin respuesta)" };
    setGuesses((prev) => [...prev, g]);
    setGuessDraft("");
    if (guessIdx + 1 < guessers.length) {
      setGuessIdx((i) => i + 1);
      setScreen("passToGuess");
    } else {
      setScreen("passToReview");
    }
  }

  function toggleWinner(name) {
    setSelectedWinners((prev) =>
      prev.includes(name) ? prev.filter((n) => n !== name) : [...prev, name]
    );
  }

  function confirmRoundResults() {
    if (selectedWinners.length === 0) return;
    // El pool arranca en 10 y baja 1 punto por cada pista extra que hizo falta, piso 0.
    const pool = Math.max(0, 10 - (clues.length - 1));
    // Se reparte parejo entre quien pensó el personaje y todos los que acertaron.
    const winners = [clueGiver, ...selectedWinners];
    const share = Math.round(pool / winners.length);
    setScores((prev) => {
      const next = { ...prev };
      winners.forEach((name) => {
        next[name] = (next[name] || 0) + share;
      });
      return next;
    });
    setLastWinners(selectedWinners);
    setLastPool(pool);
    setLastShare(share);
    setScreen("winner");
  }

  function nobodyGuessed() {
    setScreen("clueInputAgain");
  }

  function nextRound() {
    setClueGiverIdx((i) => (i + 1) % players.length);
    setRound((r) => r + 1);
    setClues([]);
    setGuesses([]);
    setSecretCharacter("");
    setSelectedWinners([]);
    setLastWinners([]);
    setScreen("passToClue");
  }

  // ---------- COUNT ----------
  if (screen === "count") {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <Title>¿Cuántos juegan?</Title>
        <Sub>Entre 3 y 8 jugadores</Sub>
        <div
          style={{
            display: "flex",
            alignItems: "center",
            gap: 18,
            marginBottom: 26,
          }}
        >
          <button
            onClick={() => setPlayerCount((c) => Math.max(3, c - 1))}
            style={counterBtnStyle}
          >
            −
          </button>
          <div
            style={{
              fontFamily: "'Baloo 2', sans-serif",
              fontSize: 48,
              color: "#FFD23F",
              width: 70,
              textAlign: "center",
            }}
          >
            {playerCount}
          </div>
          <button
            onClick={() => setPlayerCount((c) => Math.min(8, c + 1))}
            style={counterBtnStyle}
          >
            +
          </button>
        </div>
        <BigButton onClick={confirmCount}>Siguiente ➜</BigButton>
        <BigButton onClick={goHome} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          ← Volver
        </BigButton>
      </Screen>
    );
  }

  // ---------- NAMES ----------
  if (screen === "names") {
    const allFilled = true; // names optional, defaults applied
    return (
      <Screen homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <Title size={26}>Nombres de los jugadores</Title>
        <Sub>Se van a ir pasando el celu en este orden</Sub>
        <Card style={{ marginBottom: 20 }}>
          {players.map((p, i) => (
            <input
              key={i}
              value={p}
              onChange={(e) => setPlayerName(i, e.target.value)}
              placeholder={`Jugador ${i + 1}`}
              style={inputStyle}
            />
          ))}
        </Card>
        <BigButton onClick={namesReady}>¡Listo, arrancar! 🎉</BigButton>
      </Screen>
    );
  }

  // ---------- PASS TO CLUE GIVER ----------
  if (screen === "passToClue") {
    return (
      <Screen style={{ justifyContent: "center" }} homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <div style={{ fontSize: 56, marginBottom: 10 }}>🤫</div>
        <Title size={24}>Ronda {round}</Title>
        <Sub>
          Pasale el celu a <b style={{ color: "#FFD23F" }}>{clueGiver}</b>.
          Nadie más tiene que mirar la pantalla.
        </Sub>
        <BigButton onClick={beginClueInput}>
          Ya lo tengo yo, {clueGiver} 👀
        </BigButton>
      </Screen>
    );
  }

  // ---------- CLUE INPUT (first clue of the round) ----------
  if (screen === "clueInput" || screen === "clueInputAgain") {
    const isAgain = screen === "clueInputAgain";
    return (
      <Screen homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <Title size={24}>
          {isAgain ? "Nadie adivinó 😬" : `Pensá a alguien, ${clueGiver}`}
        </Title>
        <Sub>
          {isAgain
            ? "Agregá otro emoji como pista extra"
            : "Elegí una persona o personaje que todos conozcan, y describilo con un emoji"}
        </Sub>
        <ClueTrail clues={clues} />
        <Card style={{ marginBottom: 16 }}>
          {!isAgain && (
            <input
              value={secretCharacter}
              onChange={(e) => setSecretCharacter(e.target.value)}
              placeholder="¿Quién es? (queda guardado, nadie más lo ve)"
              style={inputStyle}
            />
          )}
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "repeat(6, 1fr)",
              gap: 6,
              marginBottom: 14,
            }}
          >
            {QUICK_EMOJIS.map((e) => (
              <button
                key={e}
                onClick={() => setEmojiDraft(e)}
                style={{
                  fontSize: 22,
                  background:
                    emojiDraft === e ? "rgba(255,210,63,0.3)" : "rgba(255,255,255,0.06)",
                  border: "1px solid rgba(255,255,255,0.1)",
                  borderRadius: 10,
                  padding: "6px 0",
                  cursor: "pointer",
                }}
              >
                {e}
              </button>
            ))}
          </div>
          <input
            value={emojiDraft}
            onChange={(e) => setEmojiDraft(e.target.value)}
            placeholder="o escribí/pegá tu propio emoji"
            style={inputStyle}
          />
        </Card>
        <BigButton
          onClick={isAgain ? () => {
            const val = emojiDraft.trim();
            if (!val) return;
            setClues((prev) => [...prev, val]);
            setEmojiDraft("");
            setGuessIdx(0);
            setGuesses([]);
            setGuessDraft("");
            setScreen("passToGuess");
          } : addClueAndPass}
          disabled={!emojiDraft.trim() || (!isAgain && !secretCharacter.trim())}
        >
          Pasar el celu para adivinar ➜
        </BigButton>
      </Screen>
    );
  }

  // ---------- PASS TO GUESSER ----------
  if (screen === "passToGuess") {
    const current = guessers[guessIdx];
    return (
      <Screen style={{ justifyContent: "center" }} homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <div style={{ fontSize: 56, marginBottom: 10 }}>📲</div>
        <Sub>
          Jugador {guessIdx + 1} de {guessers.length}
        </Sub>
        <Title size={24}>Pasale el celu a {current}</Title>
        <BigButton onClick={() => setScreen("guessing")}>
          Soy {current}, ¡a adivinar! 🔍
        </BigButton>
      </Screen>
    );
  }

  // ---------- GUESSING ----------
  if (screen === "guessing") {
    const current = guessers[guessIdx];
    return (
      <Screen homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <Title size={22}>¿Quién es, {current}?</Title>
        <ClueTrail clues={clues} />
        <Card style={{ marginBottom: 16 }}>
          <input
            autoFocus
            value={guessDraft}
            onChange={(e) => setGuessDraft(e.target.value)}
            placeholder="Escribí tu respuesta..."
            style={inputStyle}
            onKeyDown={(e) => e.key === "Enter" && submitGuess()}
          />
        </Card>
        <BigButton onClick={submitGuess}>Confirmar respuesta ✅</BigButton>
      </Screen>
    );
  }

  // ---------- PASS TO REVIEW ----------
  if (screen === "passToReview") {
    return (
      <Screen style={{ justifyContent: "center" }} homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <div style={{ fontSize: 56, marginBottom: 10 }}>🎯</div>
        <Sub>Ya respondieron todos</Sub>
        <Title size={24}>Pasale el celu a {clueGiver}</Title>
        <BigButton onClick={() => setScreen("review")}>
          Soy {clueGiver}, veamos las respuestas 👁️
        </BigButton>
      </Screen>
    );
  }

  // ---------- REVIEW ----------
  if (screen === "review") {
    const pool = Math.max(0, 10 - (clues.length - 1));
    return (
      <Screen homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <Title size={22}>Respuestas — {clueGiver} decide</Title>
        <Sub>Tocá a todos los que acertaron (puede ser más de uno)</Sub>
        <ClueTrail clues={clues} />
        <Card style={{ marginBottom: 16 }}>
          {guesses.map((g, i) => {
            const isSelected = selectedWinners.includes(g.name);
            return (
              <div
                key={i}
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  gap: 10,
                  padding: "10px 6px",
                  borderBottom:
                    i < guesses.length - 1 ? "1px solid rgba(255,255,255,0.08)" : "none",
                }}
              >
                <div>
                  <div style={{ fontSize: 13, color: "#C9B8F0" }}>{g.name}</div>
                  <div style={{ fontSize: 17, fontWeight: 700 }}>{g.text}</div>
                </div>
                <button
                  onClick={() => toggleWinner(g.name)}
                  style={isSelected ? correctBtnStyleActive : correctBtnStyle}
                >
                  {isSelected ? "✅ Acertó" : "¡Correcto! 🏆"}
                </button>
              </div>
            );
          })}
        </Card>
        <Sub style={{ marginTop: -10 }}>
          Esta ronda vale {pool} {pool === 1 ? "punto" : "puntos"}, repartidos entre {clueGiver} y quienes acertaron
        </Sub>
        <BigButton onClick={confirmRoundResults} disabled={selectedWinners.length === 0}>
          Confirmar ganadores ✅
        </BigButton>
        <BigButton onClick={nobodyGuessed} color="#5B4B8A">
          Nadie acertó, doy otra pista 🔁
        </BigButton>
      </Screen>
    );
  }

  // ---------- WINNER ----------
  if (screen === "winner") {
    const winnersLabel = joinNames(lastWinners);
    return (
      <Screen style={{ justifyContent: "center" }} homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <div style={{ fontSize: 70, marginBottom: 6 }}>🎉</div>
        <Title size={30}>
          {lastWinners.length > 1 ? `¡${winnersLabel} acertaron!` : `¡${winnersLabel} acertó!`}
        </Title>
        <Sub>
          Era <b style={{ color: "#FFD23F" }}>{secretCharacter}</b> — {clueGiver} dio {clues.length} {clues.length === 1 ? "pista" : "pistas"}
        </Sub>
        <Sub style={{ marginTop: -14 }}>
          Ronda de {lastPool} {lastPool === 1 ? "punto" : "puntos"} repartidos: +{lastShare} para cada ganador ({clueGiver} incluido)
        </Sub>
        <Card style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: "'Baloo 2', sans-serif", fontSize: 16, color: "#FFD23F", marginBottom: 8 }}>
            Puntajes
          </div>
          {Object.entries(scores)
            .sort((a, b) => b[1] - a[1])
            .map(([name, pts]) => (
              <div
                key={name}
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  padding: "6px 2px",
                  fontSize: 16,
                }}
              >
                <span>{name}</span>
                <span style={{ color: "#FFD23F", fontWeight: 800 }}>{pts} ⭐</span>
              </div>
            ))}
        </Card>
        <BigButton onClick={nextRound}>Siguiente ronda ➜</BigButton>
        <BigButton onClick={goHome} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Terminar juego
        </BigButton>
      </Screen>
    );
  }

  return null;
}

// ==================== ONLINE: SALA COMPARTIDA ====================

// Botón de "pasar de etapa" (arrancar/siguiente ronda) para el modo online:
// solo lo puede tocar quien tiene el mando. El resto ve quién lo tiene y
// espera. El mando también puede cedérselo a otra persona a mano.
function RoundControl({ effectiveHost, isHost, players, onAdvance, onPassControl, canAdvance, label }) {
  const [showHandoff, setShowHandoff] = useState(false);
  const others = players.filter((p) => p.id !== effectiveHost?.id);

  return (
    <div style={{ width: "100%", maxWidth: 380 }}>
      <div
        style={{
          textAlign: "center",
          fontSize: 13,
          color: "#C9B8F0",
          marginBottom: 10,
        }}
      >
        👑 {isHost ? "Vos tenés" : `${effectiveHost?.name || "Alguien"} tiene`} el mando de la sala
      </div>

      {isHost ? (
        <>
          <BigButton onClick={onAdvance} disabled={!canAdvance}>
            {label}
          </BigButton>
          {others.length > 0 && (
            <>
              <button
                onClick={() => setShowHandoff((s) => !s)}
                style={{
                  display: "block",
                  margin: "0 auto 12px",
                  background: "none",
                  border: "none",
                  color: "#8b7fa8",
                  fontSize: 12.5,
                  textDecoration: "underline",
                  cursor: "pointer",
                }}
              >
                {showHandoff ? "Cancelar" : "Pasarle el mando a otro/a"}
              </button>
              {showHandoff && (
                <Card style={{ marginBottom: 14 }}>
                  {others.map((p) => (
                    <button
                      key={p.id}
                      onClick={() => {
                        onPassControl(p.id);
                        setShowHandoff(false);
                      }}
                      style={{
                        width: "100%",
                        textAlign: "left",
                        background: "none",
                        border: "none",
                        color: "#F3EEFF",
                        fontSize: 15,
                        padding: "8px 4px",
                        cursor: "pointer",
                      }}
                    >
                      👑 {p.name}
                    </button>
                  ))}
                </Card>
              )}
            </>
          )}
        </>
      ) : (
        <Sub>Esperando a que {effectiveHost?.name || "el anfitrión/a"} empiece...</Sub>
      )}
    </div>
  );
}

function OnlineGame({ onBack }) {
  const [screen, setScreen] = useState("join"); // "join" | "game"
  const [localNames, setLocalNames] = useState([]);
  const [nameDraft, setNameDraft] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [joinError, setJoinError] = useState("");
  const [joining, setJoining] = useState(false);
  const [openRooms, setOpenRooms] = useState([]);
  const [resumable, setResumable] = useState(null);

  const [roomCode, setRoomCode] = useState(null);
  const [room, setRoom] = useState(null);
  const [copied, setCopied] = useState(false);

  const [emojiDraft, setEmojiDraft] = useState("");
  const [secretDraft, setSecretDraft] = useState("");
  const [guessDraft, setGuessDraft] = useState("");
  const [selected, setSelected] = useState([]);

  // Nombres de las personas que juegan desde ESTE celu (puede ser más de una).
  const addLocalName = () => {
    const val = nameDraft.trim();
    if (!val) return;
    if (localNames.some((n) => n.toLowerCase() === val.toLowerCase())) {
      setNameDraft("");
      return;
    }
    setLocalNames((prev) => [...prev, val]);
    setNameDraft("");
  };
  const removeLocalName = (i) => {
    setLocalNames((prev) => prev.filter((_, idx) => idx !== i));
  };

  // Salas abiertas: solo mientras estamos eligiendo a cuál unirnos.
  useEffect(() => {
    if (screen !== "join") return;
    let cancelled = false;
    const tick = async () => {
      try {
        const entries = await window.storage.list(STORAGE_PREFIX);
        if (cancelled) return;
        const rooms = entries
          .map((e) => {
            try {
              return JSON.parse(e.value);
            } catch {
              return null;
            }
          })
          .filter((r) => r && r.phase === "lobby" && Date.now() - (r.createdAt || 0) < 3 * 60 * 60 * 1000)
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        setOpenRooms(rooms);
      } catch {
        // sin salas visibles, no molesta con un error
      }
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, [screen]);

  // Sesión guardada: por si volviste al menú por error. Se identifica por
  // este CELU (MY_DEVICE_ID), no por una persona puntual — así vuelven
  // todos los de esta casa juntos.
  useEffect(() => {
    if (screen !== "join") return;
    let cancelled = false;
    (async () => {
      let saved;
      try {
        saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      } catch {
        saved = null;
      }
      if (!saved || !saved.code) {
        setResumable(null);
        return;
      }
      const existing = await readRoom(saved.code);
      if (cancelled) return;
      const mine = existing ? existing.players.filter((p) => p.deviceId === MY_DEVICE_ID) : [];
      if (mine.length > 0) {
        setResumable({ code: saved.code, names: mine.map((p) => p.name) });
      } else {
        localStorage.removeItem(SESSION_KEY);
        setResumable(null);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [screen]);

  const resumeSession = async () => {
    if (!resumable) return;
    const existing = await readRoom(resumable.code);
    if (!existing) {
      localStorage.removeItem(SESSION_KEY);
      setResumable(null);
      return;
    }
    setRoom(existing);
    setRoomCode(resumable.code);
    setScreen("game");
  };

  // Si la sala ya está jugando una ronda (no está en "lobby" ni "roundEnd",
  // que son los únicos momentos "entre rondas" donde sumar gente no rompe
  // nada), no metemos jugadores nuevos a mitad de ronda: quedan esperando
  // acá y los sumamos solos apenas la sala vuelve a un punto seguro.
  const [pendingJoin, setPendingJoin] = useState(null); // { code, names } | null

  const canJoinPhase = (phase) => phase === "lobby" || phase === "roundEnd";

  const actuallyJoin = async (code, names) => {
    let existing = await readRoom(code);
    const newPlayers = names.map((n) => ({
      id: randomId(),
      name: n,
      deviceId: MY_DEVICE_ID,
      score: 0,
      joinedAt: Date.now(),
    }));
    if (!existing) {
      existing = {
        code,
        players: newPlayers,
        hostId: newPlayers[0].id, // el/la primero/a en crear la sala tiene el mando
        phase: "lobby",
        clueGiverIdx: -1,
        clueGiverId: null,
        secretCharacter: null,
        clues: [],
        guesses: {},
        round: 0,
        createdAt: Date.now(),
      };
    } else {
      const clash = newPlayers.find((np) =>
        existing.players.some((p) => p.name.toLowerCase() === np.name.toLowerCase())
      );
      if (clash) {
        return { error: `Ya hay alguien llamado "${clash.name}" en esa sala. Cambiá el nombre.` };
      }
      existing.players = [...existing.players, ...newPlayers];
    }
    await writeRoom(code, existing);
    window.storage.incrementCounter("players", newPlayers.length).catch(() => {});
    localStorage.setItem(SESSION_KEY, JSON.stringify({ code }));
    setRoom(existing);
    setRoomCode(code);
    setScreen("game");
    return { ok: true };
  };

  const doJoin = async (codeMaybe) => {
    if (localNames.length === 0) {
      setJoinError("Sumá al menos una persona de este celu.");
      return;
    }
    setJoining(true);
    setJoinError("");
    try {
      const code = codeMaybe || (codeInput.trim() ? codeInput.trim().toUpperCase() : randomCode());
      const existing = await readRoom(code);
      if (existing && !canJoinPhase(existing.phase)) {
        // La sala existe pero está en medio de una ronda: esperamos.
        setPendingJoin({ code, names: [...localNames] });
        setJoining(false);
        return;
      }
      const result = await actuallyJoin(code, localNames);
      if (result.error) {
        setJoinError(result.error);
      }
    } catch (e) {
      setJoinError("No se pudo conectar a la sala. Probá de nuevo.");
    } finally {
      setJoining(false);
    }
  };

  // Mientras alguien espera para sumarse, seguimos consultando la sala y
  // entramos solos apenas quede libre (entre rondas).
  useEffect(() => {
    if (!pendingJoin) return;
    let cancelled = false;
    const tick = async () => {
      const fresh = await readRoom(pendingJoin.code);
      if (cancelled || !fresh) return;
      if (canJoinPhase(fresh.phase)) {
        const result = await actuallyJoin(pendingJoin.code, pendingJoin.names);
        if (cancelled) return;
        if (result.error) {
          setJoinError(result.error);
        }
        setPendingJoin(null);
      }
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pendingJoin?.code]);

  const quickJoin = (code) => {
    setCodeInput(code);
    doJoin(code);
  };

  // Al salir de verdad sacamos a los jugadores de ESTE celu de la sala (no
  // solo localmente): así, si el que se va tenía el mando, la sala lo nota
  // y pasa el mando a quien sigue. Si algo falla igual dejamos salir a la
  // persona en vez de trabarla acá.
  const leaveRoom = async () => {
    try {
      const fresh = await readRoom(roomCode);
      if (fresh) {
        fresh.players = (fresh.players || []).filter((p) => p.deviceId !== MY_DEVICE_ID);
        await writeRoom(roomCode, fresh);
      }
    } catch {
      /* seguimos igual */
    }
    localStorage.removeItem(SESSION_KEY);
    onBack();
  };

  // Polling del estado de la sala una vez adentro.
  useEffect(() => {
    if (!roomCode) return;
    let cancelled = false;
    const tick = async () => {
      const r = await readRoom(roomCode);
      if (!cancelled && r) setRoom(r);
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, [roomCode]);

  const myPlayers = (room?.players || []).filter((p) => p.deviceId === MY_DEVICE_ID);
  const clueGiver = room?.players?.find((p) => p.id === room?.clueGiverId) || null;
  const isMyDeviceClueGiver = !!clueGiver && clueGiver.deviceId === MY_DEVICE_ID;

  const copyCode = () => {
    if (!roomCode) return;
    navigator.clipboard?.writeText(roomCode).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  const startRound = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh || fresh.players.length < 3) return;
    const nextIdx = ((fresh.clueGiverIdx ?? -1) + 1) % fresh.players.length;
    fresh.clueGiverIdx = nextIdx;
    fresh.clueGiverId = fresh.players[nextIdx].id;
    fresh.secretCharacter = null;
    fresh.clues = [];
    fresh.guesses = {};
    fresh.phase = "clueInput";
    fresh.round = (fresh.round || 0) + 1;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setEmojiDraft("");
    setSecretDraft("");
  };

  const submitFirstClue = async () => {
    const emoji = emojiDraft.trim();
    const secret = secretDraft.trim();
    if (!emoji || !secret) return;
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.secretCharacter = secret;
    fresh.clues = [emoji];
    fresh.guesses = {};
    fresh.phase = "guessing";
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setEmojiDraft("");
  };

  const submitAnotherClue = async () => {
    const emoji = emojiDraft.trim();
    if (!emoji) return;
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.clues = [...(fresh.clues || []), emoji];
    fresh.guesses = {};
    fresh.phase = "guessing";
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setEmojiDraft("");
  };

  const submitGuessFor = async (forId, forName) => {
    const text = guessDraft.trim() || "(sin respuesta)";
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.guesses = { ...(fresh.guesses || {}), [forId]: { name: forName, text } };
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setGuessDraft("");
  };

  const goToReview = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.phase = "review";
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setSelected([]);
  };

  const nobodyGuessedOnline = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.phase = "clueInputAgain";
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setEmojiDraft("");
  };

  const toggleSelected = (id) => {
    setSelected((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };

  const confirmWinners = async () => {
    if (selected.length === 0) return;
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    const pool = Math.max(0, 10 - ((fresh.clues || []).length - 1));
    const winnerIds = [fresh.clueGiverId, ...selected];
    const share = Math.round(pool / winnerIds.length);
    fresh.players = fresh.players.map((p) =>
      winnerIds.includes(p.id) ? { ...p, score: (p.score || 0) + share } : p
    );
    const winnerNames = selected
      .map((id) => (fresh.players.find((p) => p.id === id) || {}).name)
      .filter(Boolean);
    fresh.lastRound = {
      winnerNames,
      pool,
      share,
      secretCharacter: fresh.secretCharacter,
      clueGiverName: (fresh.players.find((p) => p.id === fresh.clueGiverId) || {}).name,
      cluesCount: (fresh.clues || []).length,
    };
    fresh.phase = "roundEnd";
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  // ---------- PANTALLA DE UNIRSE ----------
  if (screen === "join" && pendingJoin) {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <div style={{ fontSize: 56, marginBottom: 10 }}>⏳</div>
        <Title size={24}>Esperando un huequito...</Title>
        <Sub>
          La sala {pendingJoin.code} está jugando una ronda ahora mismo. Te sumamos {joinNames(pendingJoin.names)}{" "}
          automáticamente apenas termine — no hace falta que hagas nada.
        </Sub>
        <BigButton
          onClick={() => setPendingJoin(null)}
          color="transparent"
          style={{ boxShadow: "none", color: "#C9B8F0" }}
        >
          ← Cancelar
        </BigButton>
      </Screen>
    );
  }

  if (screen === "join") {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <div style={{ fontSize: 56, marginBottom: 6 }}>🌐</div>
        <Title size={28}>Jugar Online</Title>
        <Sub>Una sala por familia/casa. Si en tu casa juegan varios con el mismo celu, sumalos a todos abajo.</Sub>

        {resumable && (
          <button
            onClick={resumeSession}
            style={{
              width: "100%",
              maxWidth: 380,
              textAlign: "left",
              borderRadius: 18,
              padding: 16,
              marginBottom: 14,
              cursor: "pointer",
              background: "rgba(255,210,63,0.18)",
              border: "1px solid #FFD23F",
              color: "#F3EEFF",
              fontFamily: "'Nunito', sans-serif",
            }}
          >
            <div style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 800, color: "#FFD23F", fontSize: 16 }}>
              ↩️ Volver a tu sala ({resumable.code})
            </div>
            <div style={{ fontSize: 13.5, color: "#C9B8F0", marginTop: 2 }}>
              Eran {joinNames(resumable.names)} — siguen ahí adentro
            </div>
          </button>
        )}

        <Card style={{ marginBottom: 16 }}>
          <div
            style={{
              fontFamily: "'Baloo 2', sans-serif",
              fontSize: 13,
              color: "#FFD23F",
              marginBottom: 8,
              textTransform: "uppercase",
              letterSpacing: 1,
            }}
          >
            ¿Quiénes juegan desde este celu?
          </div>
          {localNames.length > 0 && (
            <div style={{ marginBottom: 10 }}>
              {localNames.map((n, i) => (
                <div
                  key={i}
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    background: "rgba(255,255,255,0.06)",
                    border: "1px solid rgba(255,255,255,0.1)",
                    borderRadius: 10,
                    padding: "8px 12px",
                    marginBottom: 6,
                  }}
                >
                  <span style={{ fontWeight: 700 }}>{n}</span>
                  <button
                    onClick={() => removeLocalName(i)}
                    style={{ background: "none", border: "none", color: "#FF6B9D", fontSize: 13, fontWeight: 700, cursor: "pointer" }}
                  >
                    Quitar
                  </button>
                </div>
              ))}
            </div>
          )}
          <div style={{ display: "flex", gap: 8, marginBottom: 4 }}>
            <input
              value={nameDraft}
              onChange={(e) => setNameDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addLocalName()}
              placeholder="Nombre de la persona"
              style={{ ...inputStyle, marginBottom: 0, flex: 1 }}
              maxLength={16}
            />
            <button
              onClick={addLocalName}
              style={{
                width: 44,
                borderRadius: 12,
                border: "none",
                background: "#FF3E7F",
                color: "#1B1035",
                fontSize: 22,
                fontWeight: 800,
                cursor: "pointer",
              }}
            >
              +
            </button>
          </div>
        </Card>

        <Card style={{ marginBottom: 16 }}>
          <input
            value={codeInput}
            onChange={(e) => setCodeInput(e.target.value.toUpperCase())}
            placeholder="Código de sala (dejalo vacío para crear)"
            style={{ ...inputStyle, marginBottom: 0, letterSpacing: 3, textTransform: "uppercase" }}
            maxLength={4}
          />
          {joinError && <div style={{ color: "#FF6B9D", fontSize: 14, marginTop: 8 }}>{joinError}</div>}
        </Card>
        <BigButton onClick={() => doJoin()} disabled={joining}>
          {joining ? "Entrando..." : codeInput.trim() ? "Unirme a la sala" : "Crear sala y jugar"}
        </BigButton>

        {openRooms.length > 0 && (
          <Card style={{ marginTop: 4 }}>
            <div
              style={{
                fontFamily: "'Baloo 2', sans-serif",
                fontSize: 13,
                color: "#FFD23F",
                marginBottom: 8,
                textTransform: "uppercase",
                letterSpacing: 1,
              }}
            >
              Salas abiertas ahora
            </div>
            {openRooms.map((r) => (
              <button
                key={r.code}
                onClick={() => quickJoin(r.code)}
                disabled={joining}
                style={{
                  width: "100%",
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  background: "rgba(255,255,255,0.06)",
                  border: "1px solid rgba(255,255,255,0.1)",
                  borderRadius: 12,
                  padding: "10px 12px",
                  marginBottom: 8,
                  cursor: "pointer",
                  color: "#F3EEFF",
                  fontFamily: "'Nunito', sans-serif",
                  fontWeight: 700,
                  fontSize: 15,
                }}
              >
                <span>{r.players.map((p) => p.name).join(", ")}</span>
                <span style={{ color: "#FFD23F", fontWeight: 800, fontSize: 13, letterSpacing: 2 }}>{r.code}</span>
              </button>
            ))}
          </Card>
        )}

        <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          ← Volver
        </BigButton>
      </Screen>
    );
  }

  if (!room) {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <Sub>Cargando sala...</Sub>
      </Screen>
    );
  }

  const players = room.players || [];
  const sorted = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
  const guessesList = Object.entries(room.guesses || {}).map(([id, g]) => ({ id, ...g }));
  const myPlayerIds = myPlayers.map((p) => p.id);

  // El "mando" (quién puede pasar de etapa: arrancar/pasar de ronda) es
  // quien llegó primero a la sala. No lo recalculamos y reescribimos por
  // separado: si esa persona ya no está entre los jugadores (se fue),
  // TODOS los celus derivan solos, a partir de los mismos datos ya
  // sincronizados, que el mando pasa a quien le sigue en orden de llegada
  // — sin ninguna escritura extra que pueda pisarse entre varios celus.
  const effectiveHost =
    players.find((p) => p.id === room.hostId) ||
    [...players].sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0))[0] ||
    null;
  const isHost = !!effectiveHost && myPlayerIds.includes(effectiveHost.id);

  const passControlTo = async (playerId) => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.hostId = playerId;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  // ---------- LOBBY ----------
  if (room.phase === "lobby") {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <div style={{ display: "flex", justifyContent: "space-between", width: "100%", maxWidth: 420, marginBottom: 10 }}>
          <span style={{ color: "#C9B8F0", fontSize: 14 }}>
            Este celu: <b style={{ color: "#F3EEFF" }}>{joinNames(myPlayers.map((p) => p.name))}</b>
          </span>
          <button
            onClick={copyCode}
            style={{
              background: "rgba(255,255,255,0.08)",
              border: "none",
              borderRadius: 20,
              padding: "4px 12px",
              color: "#FFD23F",
              fontWeight: 800,
              letterSpacing: 2,
              fontSize: 14,
              cursor: "pointer",
            }}
          >
            {roomCode} {copied ? "✓" : "📋"}
          </button>
        </div>
        <Title size={26}>Sala {roomCode}</Title>
        <Card style={{ marginBottom: 20 }}>
          {sorted.map((p) => (
            <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 2px", fontSize: 16 }}>
              <span>
                {p.name}
                {myPlayerIds.includes(p.id) && <span style={{ color: "#8b7fa8", fontSize: 12 }}> (vos)</span>}
              </span>
              <span style={{ color: "#FFD23F", fontWeight: 800 }}>{p.score || 0} ⭐</span>
            </div>
          ))}
        </Card>
        {players.length < 3 && <Sub>Necesitás al menos 3 jugadores en total. Compartí el código.</Sub>}
        <RoundControl
          effectiveHost={effectiveHost}
          isHost={isHost}
          players={players}
          onAdvance={startRound}
          onPassControl={passControlTo}
          canAdvance={players.length >= 3}
          label="Siguiente ronda ➜"
        />
        <BigButton onClick={leaveRoom} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Salir de la sala
        </BigButton>
      </Screen>
    );
  }

  // ---------- CLUE INPUT / CLUE INPUT AGAIN ----------
  if (room.phase === "clueInput" || room.phase === "clueInputAgain") {
    const isAgain = room.phase === "clueInputAgain";
    if (!isMyDeviceClueGiver) {
      return (
        <Screen style={{ justifyContent: "center" }}>
          <div style={{ fontSize: 56, marginBottom: 10 }}>🤫</div>
          <Title size={22}>{isAgain ? "Nadie adivinó..." : `${clueGiver?.name || "..."} está pensando`}</Title>
          <Sub>
            Esperá a que {clueGiver?.name} {isAgain ? "dé otra pista" : "piense a alguien"}...
          </Sub>
          <ClueTrail clues={room.clues || []} />
        </Screen>
      );
    }
    return (
      <Screen>
        <Title size={24}>{isAgain ? "Pistas extra" : `Pensá a alguien, ${clueGiver?.name}`}</Title>
        <Sub>{isAgain ? "Agregá otro emoji como pista" : "Elegí una persona famosa y escribila (queda guardada)"}</Sub>
        <ClueTrail clues={room.clues || []} />
        <Card style={{ marginBottom: 16 }}>
          {!isAgain && (
            <input
              value={secretDraft}
              onChange={(e) => setSecretDraft(e.target.value)}
              placeholder="¿Quién es? (nadie más lo ve)"
              style={inputStyle}
            />
          )}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 6, marginBottom: 14 }}>
            {QUICK_EMOJIS.map((e) => (
              <button
                key={e}
                onClick={() => setEmojiDraft(e)}
                style={{
                  fontSize: 22,
                  background: emojiDraft === e ? "rgba(255,210,63,0.3)" : "rgba(255,255,255,0.06)",
                  border: "1px solid rgba(255,255,255,0.1)",
                  borderRadius: 10,
                  padding: "6px 0",
                  cursor: "pointer",
                }}
              >
                {e}
              </button>
            ))}
          </div>
          <input
            value={emojiDraft}
            onChange={(e) => setEmojiDraft(e.target.value)}
            placeholder="o escribí tu propio emoji"
            style={inputStyle}
          />
        </Card>
        <BigButton
          onClick={isAgain ? submitAnotherClue : submitFirstClue}
          disabled={!emojiDraft.trim() || (!isAgain && !secretDraft.trim())}
        >
          Mandar pista a todos ➜
        </BigButton>
      </Screen>
    );
  }

  // ---------- GUESSING ----------
  if (room.phase === "guessing") {
    // Jugadores de ESTE celu que todavía no mandaron respuesta (nunca incluye
    // a quien piensa, esté en el celu que esté). Si hay más de uno, se van
    // pasando el celu entre ellos, uno a la vez.
    const pendingLocal = myPlayers.filter(
      (p) => p.id !== room.clueGiverId && !(room.guesses || {})[p.id]
    );

    if (pendingLocal.length > 0) {
      const current = pendingLocal[0];
      return (
        <Screen>
          <Title size={22}>¿Quién es, {current.name}?</Title>
          {myPlayers.length > 1 && (
            <Sub style={{ marginTop: -12 }}>Pasale el celu a {current.name} si no lo tiene ya</Sub>
          )}
          <ClueTrail clues={room.clues || []} />
          <Card style={{ marginBottom: 16 }}>
            <input
              autoFocus
              value={guessDraft}
              onChange={(e) => setGuessDraft(e.target.value)}
              placeholder="Escribí tu respuesta..."
              style={inputStyle}
              onKeyDown={(e) => e.key === "Enter" && submitGuessFor(current.id, current.name)}
            />
          </Card>
          <BigButton onClick={() => submitGuessFor(current.id, current.name)}>Confirmar respuesta ✅</BigButton>
        </Screen>
      );
    }

    if (isMyDeviceClueGiver) {
      const answered = guessesList.length;
      const total = players.length - 1;
      const missing = players.filter((p) => p.id !== room.clueGiverId && !(room.guesses || {})[p.id]);
      const allAnswered = answered >= total;
      return (
        <Screen>
          <Title size={22}>Esperando respuestas</Title>
          <Sub>
            {answered} de {total} ya contestaron
          </Sub>
          <ClueTrail clues={room.clues || []} />
          <Card style={{ marginBottom: 16 }}>
            {guessesList.length === 0 && <Sub style={{ margin: 0 }}>Todavía nadie contestó...</Sub>}
            {guessesList.map((g) => (
              <div key={g.id} style={{ padding: "6px 2px", fontSize: 15, color: "#C9B8F0" }}>
                {g.name} ya respondió
              </div>
            ))}
          </Card>
          <BigButton onClick={goToReview} disabled={!allAnswered}>
            Ver respuestas 👁️
          </BigButton>
          {!allAnswered && answered > 0 && (
            <button
              onClick={() => {
                const names = joinNames(missing.map((p) => p.name));
                if (window.confirm(`Todavía falta${missing.length === 1 ? "" : "n"} ${names}. ¿Ver las respuestas igual?`)) {
                  goToReview();
                }
              }}
              style={{
                display: "block",
                margin: "-4px auto 0",
                background: "none",
                border: "none",
                color: "#8b7fa8",
                fontSize: 12.5,
                textDecoration: "underline",
                cursor: "pointer",
              }}
            >
              Ver de todos modos (faltan {missing.map((p) => p.name).join(", ")})
            </button>
          )}
        </Screen>
      );
    }

    return (
      <Screen style={{ justifyContent: "center" }}>
        <div style={{ fontSize: 56, marginBottom: 10 }}>✅</div>
        <Title size={22}>
          {myPlayers.length > 1 ? "¡Ya mandaron sus respuestas!" : "¡Mandaste tu respuesta!"}
        </Title>
        <Sub>Esperando a los demás...</Sub>
        <ClueTrail clues={room.clues || []} />
      </Screen>
    );
  }

  // ---------- REVIEW ----------
  if (room.phase === "review") {
    if (!isMyDeviceClueGiver) {
      return (
        <Screen style={{ justifyContent: "center" }}>
          <div style={{ fontSize: 56, marginBottom: 10 }}>🎯</div>
          <Title size={22}>{clueGiver?.name} está revisando</Title>
          <Sub>Ya se mandaron las respuestas, esperá el resultado...</Sub>
        </Screen>
      );
    }
    const pool = Math.max(0, 10 - ((room.clues || []).length - 1));
    return (
      <Screen>
        <Title size={22}>Respuestas — vos decidís</Title>
        <Sub>Tocá a todos los que acertaron (puede ser más de uno)</Sub>
        <ClueTrail clues={room.clues || []} />
        <Card style={{ marginBottom: 16 }}>
          {guessesList.map((g, i) => {
            const isSelected = selected.includes(g.id);
            return (
              <div
                key={g.id}
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  gap: 10,
                  padding: "10px 6px",
                  borderBottom: i < guessesList.length - 1 ? "1px solid rgba(255,255,255,0.08)" : "none",
                }}
              >
                <div>
                  <div style={{ fontSize: 13, color: "#C9B8F0" }}>{g.name}</div>
                  <div style={{ fontSize: 17, fontWeight: 700 }}>{g.text}</div>
                </div>
                <button onClick={() => toggleSelected(g.id)} style={isSelected ? correctBtnStyleActive : correctBtnStyle}>
                  {isSelected ? "✅ Acertó" : "¡Correcto! 🏆"}
                </button>
              </div>
            );
          })}
        </Card>
        <Sub style={{ marginTop: -10 }}>
          Esta ronda vale {pool} {pool === 1 ? "punto" : "puntos"}, repartidos entre vos y quienes acertaron
        </Sub>
        <BigButton onClick={confirmWinners} disabled={selected.length === 0}>
          Confirmar ganadores ✅
        </BigButton>
        <BigButton onClick={nobodyGuessedOnline} color="#5B4B8A">
          Nadie acertó, doy otra pista 🔁
        </BigButton>
      </Screen>
    );
  }

  // ---------- ROUND END ----------
  if (room.phase === "roundEnd") {
    const lr = room.lastRound || {};
    const winnersLabel = joinNames(lr.winnerNames || []);
    return (
      <Screen style={{ justifyContent: "center" }}>
        <div style={{ fontSize: 70, marginBottom: 6 }}>🎉</div>
        <Title size={28}>
          {(lr.winnerNames || []).length > 1 ? `¡${winnersLabel} acertaron!` : `¡${winnersLabel} acertó!`}
        </Title>
        <Sub>
          Era <b style={{ color: "#FFD23F" }}>{lr.secretCharacter}</b> — {lr.clueGiverName} dio {lr.cluesCount}{" "}
          {lr.cluesCount === 1 ? "pista" : "pistas"}
        </Sub>
        <Sub style={{ marginTop: -14 }}>
          Ronda de {lr.pool} {lr.pool === 1 ? "punto" : "puntos"}: +{lr.share} para cada ganador
        </Sub>
        <Card style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: "'Baloo 2', sans-serif", fontSize: 16, color: "#FFD23F", marginBottom: 8 }}>
            Puntajes
          </div>
          {sorted.map((p) => (
            <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 2px", fontSize: 16 }}>
              <span>{p.name}</span>
              <span style={{ color: "#FFD23F", fontWeight: 800 }}>{p.score || 0} ⭐</span>
            </div>
          ))}
        </Card>
        <RoundControl
          effectiveHost={effectiveHost}
          isHost={isHost}
          players={players}
          onAdvance={startRound}
          onPassControl={passControlTo}
          canAdvance={true}
          label="Siguiente ronda ➜"
        />
        <BigButton onClick={leaveRoom} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Salir de la sala
        </BigButton>
      </Screen>
    );
  }

  return null;
}

// ============================================================
// MODO "TODOS A LA VEZ": todos piensan un personaje y arman sus
// pistas al mismo tiempo, y despues todos adivinan a todos en
// simultaneo. Sala propia (prefijo distinto), un jugador por
// celular. Cada ronda usa su propio numero (room.round) para que
// "jugar de nuevo" no pise los personajes/progreso de la ronda
// anterior: alcanza con subir el numero, no hace falta borrar nada.
// ============================================================
const SIM_STORAGE_PREFIX = "quiensoy-todos:sala:";
const SIM_SESSION_KEY = "quien-soy-todos:sesion";
const SIM_MAX_CLUES = 10;

function simSecretKey(code, round, playerId) {
  return SIM_STORAGE_PREFIX + code + ":r" + round + ":secret:" + playerId;
}
function simProgressKey(code, round, playerId) {
  return SIM_STORAGE_PREFIX + code + ":r" + round + ":progress:" + playerId;
}
async function simReadRoom(code) {
  try {
    const res = await window.storage.get(SIM_STORAGE_PREFIX + code, true);
    if (!res) return null;
    return JSON.parse(res.value);
  } catch {
    return null;
  }
}
async function simWriteRoom(code, room) {
  await window.storage.set(SIM_STORAGE_PREFIX + code, JSON.stringify(room), true);
}
async function simWriteSecret(code, round, playerId, secret) {
  await window.storage.set(simSecretKey(code, round, playerId), JSON.stringify(secret), true);
}
async function simListSecrets(code, round) {
  const prefix = simSecretKey(code, round, "");
  let entries = [];
  try {
    entries = await window.storage.list(prefix);
  } catch {
    entries = [];
  }
  const map = {};
  entries.forEach((e) => {
    const playerId = e.key.slice(prefix.length);
    try {
      map[playerId] = JSON.parse(e.value);
    } catch {}
  });
  return map;
}
async function simReadProgress(code, round, playerId) {
  try {
    const res = await window.storage.get(simProgressKey(code, round, playerId), true);
    if (!res) return {};
    return JSON.parse(res.value);
  } catch {
    return {};
  }
}
async function simWriteProgress(code, round, playerId, data) {
  await window.storage.set(simProgressKey(code, round, playerId), JSON.stringify(data), true);
}
async function simListProgress(code, round) {
  const prefix = simProgressKey(code, round, "");
  let entries = [];
  try {
    entries = await window.storage.list(prefix);
  } catch {
    entries = [];
  }
  const map = {};
  entries.forEach((e) => {
    const playerId = e.key.slice(prefix.length);
    try {
      map[playerId] = JSON.parse(e.value);
    } catch {}
  });
  return map;
}

// -- coincidencia tolerante a errores de tipeo --
function simNormalize(s) {
  return String(s || "")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}
function simLevenshtein(a, b) {
  const m = a.length,
    n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = new Array(n + 1);
  for (let j = 0; j <= n; j++) dp[j] = j;
  for (let i = 1; i <= m; i++) {
    let prev = dp[0];
    dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const tmp = dp[j];
      dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
      prev = tmp;
    }
  }
  return dp[n];
}
function simIsMatch(guess, answers) {
  const g = simNormalize(guess);
  if (!g) return false;
  return (answers || []).some((ans) => {
    const a = simNormalize(ans);
    if (!a) return false;
    if (g === a) return true;
    const tolerance = Math.max(1, Math.floor(Math.max(a.length, g.length) * 0.2));
    return simLevenshtein(g, a) <= tolerance;
  });
}
function simPointsFor(revealedAt) {
  return Math.max(1, 11 - (revealedAt || 1));
}

function EmojiSequenceInput({ clues, setClues }) {
  const [draft, setDraft] = useState("");
  const addClue = (e) => {
    if (clues.length >= SIM_MAX_CLUES) return;
    setClues([...clues, e]);
  };
  const addCustom = () => {
    const t = draft.trim();
    if (!t) return;
    addClue(t);
    setDraft("");
  };
  const removeAt = (i) => setClues(clues.filter((_, idx) => idx !== i));

  return (
    <div style={{ marginTop: 6, marginBottom: 6 }}>
      <div
        style={{
          fontSize: 13,
          color: "#8b7fa8",
          fontWeight: 700,
          marginBottom: 6,
        }}
      >
        Tus pistas en orden ({clues.length}/{SIM_MAX_CLUES}) — la primera es la que se ve primero
      </div>
      <div
        style={{
          display: "flex",
          flexWrap: "wrap",
          gap: 6,
          minHeight: 40,
          marginBottom: 10,
          padding: 8,
          background: "rgba(0,0,0,0.18)",
          borderRadius: 10,
        }}
      >
        {clues.length === 0 && (
          <span style={{ color: "#5a4d6e", fontSize: 13, alignSelf: "center" }}>
            Todavía no pusiste ninguna pista
          </span>
        )}
        {clues.map((c, i) => (
          <button
            key={i}
            onClick={() => removeAt(i)}
            title="Tocar para sacarla"
            style={{
              fontSize: 26,
              background: "rgba(255,255,255,0.08)",
              border: "none",
              borderRadius: 8,
              padding: "2px 6px",
              cursor: "pointer",
              position: "relative",
            }}
          >
            {c}
          </button>
        ))}
      </div>
      <div
        style={{
          display: "grid",
          gridTemplateColumns: "repeat(6, 1fr)",
          gap: 6,
          marginBottom: 10,
        }}
      >
        {QUICK_EMOJIS.map((e) => (
          <button
            key={e}
            onClick={() => addClue(e)}
            disabled={clues.length >= SIM_MAX_CLUES}
            style={{
              fontSize: 22,
              padding: "6px 0",
              background: "rgba(255,255,255,0.06)",
              border: "none",
              borderRadius: 8,
              cursor: clues.length >= SIM_MAX_CLUES ? "default" : "pointer",
              opacity: clues.length >= SIM_MAX_CLUES ? 0.4 : 1,
            }}
          >
            {e}
          </button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <input
          value={draft}
          onChange={(ev) => setDraft(ev.target.value)}
          onKeyDown={(ev) => ev.key === "Enter" && addCustom()}
          placeholder="O pegá cualquier otro emoji"
          style={{ ...inputStyle, marginBottom: 0, flex: 1 }}
        />
        <button
          onClick={addCustom}
          disabled={clues.length >= SIM_MAX_CLUES}
          style={{
            background: "#5B4B8A",
            color: "#F3EEFF",
            border: "none",
            borderRadius: 10,
            padding: "0 16px",
            fontWeight: 800,
            cursor: "pointer",
          }}
        >
          +
        </button>
      </div>
    </div>
  );
}

function SimSetupScreen({ room, myId, secrets, onBack }) {
  const [nameDraft, setNameDraft] = useState("");
  const [aliasDraft, setAliasDraft] = useState("");
  const [clues, setClues] = useState([]);
  const [saving, setSaving] = useState(false);
  const mySecret = secrets[myId];

  if (mySecret) {
    const total = (room.players || []).length;
    const doneCount = Object.keys(secrets).length;
    return (
      <Screen homeConfirm="¿Salir? Se pierde tu personaje para esta ronda.">
        <div style={{ fontSize: 52, marginBottom: 10 }}>✅</div>
        <Title size={22}>Ya armaste tus pistas</Title>
        <Sub>Esperando a que todos terminen ({doneCount}/{total})...</Sub>
      </Screen>
    );
  }

  const confirm = async () => {
    const name = nameDraft.trim();
    if (!name || clues.length === 0 || saving) return;
    setSaving(true);
    const aliases = aliasDraft
      .split(",")
      .map((s) => s.trim())
      .filter(Boolean);
    await simWriteSecret(room.code, room.round || 1, myId, { answers: [name, ...aliases], clues });
    setSaving(false);
  };

  return (
    <Screen homeConfirm="¿Salir? Se pierde tu personaje para esta ronda.">
      <Title size={22}>Pensá a alguien</Title>
      <Sub style={{ marginTop: -10 }}>
        Elegí una persona o personaje y describilo con hasta 10 emojis, en orden
      </Sub>
      <Card style={{ marginBottom: 16, width: "100%", maxWidth: 420 }}>
        <input
          value={nameDraft}
          onChange={(e) => setNameDraft(e.target.value)}
          placeholder="¿Quién es? (nadie más lo ve)"
          style={inputStyle}
        />
        <input
          value={aliasDraft}
          onChange={(e) => setAliasDraft(e.target.value)}
          placeholder="¿Se escribe de otra forma? (separá con coma, opcional)"
          style={inputStyle}
        />
        <EmojiSequenceInput clues={clues} setClues={setClues} />
      </Card>
      <BigButton onClick={confirm} disabled={!nameDraft.trim() || clues.length === 0 || saving}>
        {saving ? "Guardando..." : "Confirmar pistas ✅"}
      </BigButton>
    </Screen>
  );
}

function SimTargetCard({ target, targetPlayer, myProgress, onGuess, onRequestClue }) {
  const [guessDraft, setGuessDraft] = useState("");
  const [wrongFlash, setWrongFlash] = useState(false);
  const revealed = myProgress?.revealed || 1;
  const solved = !!myProgress?.solved;
  const cluesShown = (target.clues || []).slice(0, revealed);
  const maxClues = Math.min(SIM_MAX_CLUES, (target.clues || []).length);
  const canAskMore = !solved && revealed < maxClues;

  const submit = async () => {
    const text = guessDraft.trim();
    if (!text || solved) return;
    const ok = await onGuess(text);
    if (ok) {
      setGuessDraft("");
    } else {
      setWrongFlash(true);
      setGuessDraft("");
      setTimeout(() => setWrongFlash(false), 700);
    }
  };

  return (
    <Card style={{ marginBottom: 14, width: "100%", maxWidth: 420 }}>
      <div
        style={{
          fontSize: 13,
          color: "#8b7fa8",
          fontWeight: 800,
          marginBottom: 8,
          textTransform: "uppercase",
          letterSpacing: 1,
        }}
      >
        {targetPlayer.name}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
        {cluesShown.map((c, i) => (
          <div
            key={i}
            style={{ fontSize: 30, background: "rgba(255,255,255,0.08)", borderRadius: 10, padding: "4px 8px" }}
          >
            {c}
          </div>
        ))}
      </div>
      {solved ? (
        <div style={{ color: "#3DDC84", fontWeight: 800, fontSize: 16 }}>
          ✅ ¡Era {target.answers && target.answers[0]}! +{simPointsFor(myProgress.solvedAtRevealed)} pts
        </div>
      ) : (
        <>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input
              value={guessDraft}
              onChange={(e) => setGuessDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submit()}
              placeholder="¿Quién es?"
              style={{
                ...inputStyle,
                marginBottom: 0,
                flex: 1,
                border: wrongFlash ? "2px solid #FF5D7A" : inputStyle.border,
              }}
            />
            <button
              onClick={submit}
              style={{
                background: "#FFD23F",
                color: "#1B1035",
                border: "none",
                borderRadius: 10,
                padding: "0 16px",
                fontWeight: 800,
                cursor: "pointer",
              }}
            >
              OK
            </button>
          </div>
          <button
            onClick={onRequestClue}
            disabled={!canAskMore}
            style={{
              background: "none",
              border: "1px solid rgba(255,255,255,0.15)",
              borderRadius: 10,
              padding: "6px 10px",
              color: canAskMore ? "#F3EEFF" : "#5a4d6e",
              fontSize: 13,
              cursor: canAskMore ? "pointer" : "default",
              fontWeight: 700,
            }}
          >
            🔍 Pedir otra pista ({revealed}/{maxClues})
          </button>
        </>
      )}
    </Card>
  );
}

function SimGuessingScreen({ room, myId, secrets, progressMap, setProgressMap, isHost, onEndRound, onLeave }) {
  const others = (room.players || []).filter((p) => p.id !== myId);
  const myProgress = progressMap[myId] || {};
  const round = room.round || 1;

  const submitGuess = async (targetId, guessText) => {
    const target = secrets[targetId];
    if (!target) return false;
    const fresh = (await simReadProgress(room.code, round, myId)) || {};
    const cur = fresh[targetId] || { revealed: 1, solved: false, solvedAtRevealed: null, wrongAttempts: [] };
    if (cur.solved) return true;
    const isRight = simIsMatch(guessText, target.answers);
    const next = { ...fresh };
    if (isRight) {
      next[targetId] = { ...cur, solved: true, solvedAtRevealed: cur.revealed };
    } else {
      next[targetId] = { ...cur, wrongAttempts: [...(cur.wrongAttempts || []), { text: guessText, atRevealed: cur.revealed }] };
    }
    await simWriteProgress(room.code, round, myId, next);
    setProgressMap((m) => ({ ...m, [myId]: next }));
    return isRight;
  };

  const requestClue = async (targetId) => {
    const target = secrets[targetId];
    if (!target) return;
    const fresh = (await simReadProgress(room.code, round, myId)) || {};
    const cur = fresh[targetId] || { revealed: 1, solved: false, solvedAtRevealed: null, wrongAttempts: [] };
    const maxClues = Math.min(SIM_MAX_CLUES, (target.clues || []).length);
    if (cur.solved || cur.revealed >= maxClues) return;
    const next = { ...fresh, [targetId]: { ...cur, revealed: cur.revealed + 1 } };
    await simWriteProgress(room.code, round, myId, next);
    setProgressMap((m) => ({ ...m, [myId]: next }));
  };

  const solvedCount = others.filter((o) => myProgress[o.id]?.solved).length;
  const myScore = others.reduce((s, o) => {
    const t = myProgress[o.id];
    return s + (t && t.solved ? simPointsFor(t.solvedAtRevealed) : 0);
  }, 0);

  return (
    <Screen homeConfirm="¿Salir? Se pierde tu progreso adivinando en esta ronda.">
      <Title size={24}>Adiviná a los demás</Title>
      <Sub style={{ marginTop: -10 }}>
        Acertaste {solvedCount} de {others.length} — {myScore} pts
      </Sub>
      {others.map((o) => (
        <SimTargetCard
          key={o.id}
          target={secrets[o.id] || { answers: [], clues: [] }}
          targetPlayer={o}
          myProgress={myProgress[o.id]}
          onGuess={(text) => submitGuess(o.id, text)}
          onRequestClue={() => requestClue(o.id)}
        />
      ))}
      {isHost ? (
        <BigButton onClick={onEndRound} color="#5B4B8A" style={{ marginTop: 6 }}>
          🏁 Terminar ronda y ver resultados
        </BigButton>
      ) : (
        <Sub style={{ fontSize: 13, color: "#8b7fa8" }}>El anfitrión/a corta la ronda cuando quiera.</Sub>
      )}
      <BigButton onClick={onLeave} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
        Salir de la sala
      </BigButton>
    </Screen>
  );
}

function SimResultsScreen({ room, myId, secrets, progressMap, setProgressMap, isHost, onPlayAgain, onLeave }) {
  const players = room.players || [];
  const round = room.round || 1;
  const scores = {};
  players.forEach((p) => {
    scores[p.id] = 0;
  });
  Object.entries(progressMap).forEach(([guesserId, targets]) => {
    Object.entries(targets || {}).forEach(([targetId, t]) => {
      if (t.solved) scores[guesserId] = (scores[guesserId] || 0) + simPointsFor(t.solvedAtRevealed);
    });
  });
  const ranked = [...players].sort((a, b) => (scores[b.id] || 0) - (scores[a.id] || 0));
  const medals = ["🥇", "🥈", "🥉"];

  const markCorrect = async (guesserId, attemptIdx) => {
    const fresh = (await simReadProgress(room.code, round, guesserId)) || {};
    const cur = fresh[myId];
    if (!cur || cur.solved) return;
    const attempt = (cur.wrongAttempts || [])[attemptIdx];
    if (!attempt) return;
    const next = { ...fresh, [myId]: { ...cur, solved: true, solvedAtRevealed: attempt.atRevealed } };
    await simWriteProgress(room.code, round, guesserId, next);
    setProgressMap((m) => ({ ...m, [guesserId]: next }));
  };

  const pendingReviews = [];
  players.forEach((p) => {
    if (p.id === myId) return;
    const t = progressMap[p.id] && progressMap[p.id][myId];
    if (t && !t.solved && (t.wrongAttempts || []).length > 0) {
      pendingReviews.push({ guesser: p, attempts: t.wrongAttempts });
    }
  });

  return (
    <Screen>
      <Title size={26}>🏆 Resultados</Title>
      <Card style={{ marginBottom: 20, width: "100%", maxWidth: 420 }}>
        {ranked.map((p, i) => (
          <div
            key={p.id}
            style={{
              display: "flex",
              justifyContent: "space-between",
              gap: 10,
              padding: "8px 2px",
              borderBottom: i < ranked.length - 1 ? "1px solid rgba(255,255,255,0.08)" : "none",
            }}
          >
            <span>
              {medals[i] || `${i + 1}°`} {p.name}
              {p.id === myId ? " (vos)" : ""} — era{" "}
              <b style={{ color: "#FFD23F" }}>{(secrets[p.id] && secrets[p.id].answers && secrets[p.id].answers[0]) || "?"}</b>
            </span>
            <span style={{ color: "#FFD23F", fontWeight: 800, whiteSpace: "nowrap" }}>{scores[p.id] || 0}</span>
          </div>
        ))}
      </Card>

      {pendingReviews.length > 0 && (
        <Card style={{ marginBottom: 20, width: "100%", maxWidth: 420 }}>
          <div style={{ fontFamily: "'Baloo 2', sans-serif", color: "#FFD23F", marginBottom: 10, fontWeight: 700 }}>
            ¿Alguna de estas en realidad iba? (tu personaje era{" "}
            {secrets[myId] && secrets[myId].answers && secrets[myId].answers[0]})
          </div>
          {pendingReviews.map(({ guesser, attempts }) => (
            <div key={guesser.id} style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 13, color: "#C9B8F0", marginBottom: 4 }}>{guesser.name} probó:</div>
              {attempts.map((a, i) => (
                <button
                  key={i}
                  onClick={() => markCorrect(guesser.id, i)}
                  style={{
                    display: "block",
