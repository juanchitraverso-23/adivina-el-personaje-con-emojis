<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>¿Quién Soy? — Juego de emojis</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="¿Quién Soy?" />
<meta name="theme-color" content="#1B1035" />
<style>
  html, body { margin:0; padding:0; background:#0c0620; }
  #root { min-height: 100vh; }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../storage.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ---- Salas online: mismo patrón de KV vía storage.js que los otros juegos ----
const STORAGE_PREFIX = "quien-soy:sala:";
const POLL_MS = 1200;
const SESSION_KEY = "quien-soy:session";

function randomId() {
  return Math.random().toString(36).slice(2, 10);
}
function randomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
async function readRoom(code) {
  try {
    const res = await window.storage.get(STORAGE_PREFIX + code, true);
    if (!res) return null;
    return JSON.parse(res.value);
  } catch {
    return null;
  }
}
async function writeRoom(code, room) {
  await window.storage.set(STORAGE_PREFIX + code, JSON.stringify(room), true);
}

// Identidad del CELU (no de una persona): estable entre recargas, para que
// un mismo teléfono con varios jugadores de la misma casa se reconozca como
// tal al volver a entrar. Cada jugador de esa casa es una entrada aparte en
// room.players, todas con este mismo deviceId.
const MY_DEVICE_ID = (() => {
  const KEY = "quien-soy:deviceId";
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = randomId();
    localStorage.setItem(KEY, id);
  }
  return id;
})();


const QUICK_EMOJIS = [
  "😀","😎","🤴","👑","🎤","⚽","🏎️","🎬","🎸","🥊",
  "🚀","🧙","🦸","🎨","📚","💃","🕺","🐐","🔥","🌟",
  "🍕","🍺","🐍","🦁","👽","🤖","🎩","🥋","⛳","🏆",
];

const GRADIENT_BG =
  "radial-gradient(circle at 20% -10%, #3a2166 0%, #170b2e 45%, #0c0620 100%)";

function useInjectFont() {
  useEffect(() => {
    if (document.getElementById("aq-fonts")) return;
    const link = document.createElement("link");
    link.id = "aq-fonts";
    link.rel = "stylesheet";
    link.href =
      "https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap";
    document.head.appendChild(link);
  }, []);
}

function Screen({ children, style, homeConfirm }) {
  return (
    <div
      style={{
        minHeight: "100vh",
        width: "100%",
        background: GRADIENT_BG,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "flex-start",
        padding: "28px 18px 40px",
        fontFamily: "'Nunito', sans-serif",
        color: "#F3EEFF",
        boxSizing: "border-box",
        ...style,
      }}
    >
      {homeConfirm !== null && <HomeButton confirmMessage={homeConfirm} />}
      {children}
    </div>
  );
}

// Botón fijo para volver al menú de juegos desde cualquier pantalla. Si
// confirmMessage viene seteado, pide confirmación antes de salir (para no
// perder progreso de la partida por un toque de más).
function HomeButton({ confirmMessage }) {
  return (
    <a
      href="../"
      onClick={(e) => {
        if (confirmMessage && !window.confirm(confirmMessage)) e.preventDefault();
      }}
      title="Volver al menú de juegos"
      style={{
        position: "fixed",
        top: 14,
        left: 14,
        zIndex: 50,
        display: "flex",
        alignItems: "center",
        gap: 6,
        padding: "9px 16px 9px 11px",
        borderRadius: 30,
        background: "rgba(0,0,0,0.6)",
        border: "1.5px solid rgba(255,255,255,0.4)",
        color: "#fff",
        fontFamily: "'Nunito', sans-serif",
        fontWeight: 800,
        fontSize: 14,
        textDecoration: "none",
        boxShadow: "0 4px 14px rgba(0,0,0,0.35)",
      }}
    >
      <span style={{ fontSize: 19 }}>🏠</span> Menú
    </a>
  );
}

function Title({ children, size = 30 }) {
  return (
    <h1
      style={{
        fontFamily: "'Baloo 2', sans-serif",
        fontWeight: 800,
        fontSize: size,
        color: "#FFD23F",
        textShadow: "0 3px 0 rgba(0,0,0,0.35)",
        margin: "0 0 6px",
        textAlign: "center",
        letterSpacing: 0.3,
      }}
    >
      {children}
    </h1>
  );
}

function Sub({ children, style }) {
  return (
    <p
      style={{
        color: "#C9B8F0",
        fontSize: 15,
        textAlign: "center",
        margin: "0 0 22px",
        lineHeight: 1.4,
        ...style,
      }}
    >
      {children}
    </p>
  );
}

function joinNames(names) {
  if (names.length === 0) return "";
  if (names.length === 1) return names[0];
  return `${names.slice(0, -1).join(", ")} y ${names[names.length - 1]}`;
}

function BigButton({ children, onClick, color = "#FF3E7F", disabled, style }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{
        width: "100%",
        maxWidth: 380,
        padding: "16px 20px",
        borderRadius: 18,
        border: "none",
        background: disabled ? "#4a3d63" : color,
        color: disabled ? "#8b7fa8" : "#1B1035",
        fontFamily: "'Baloo 2', sans-serif",
        fontWeight: 700,
        fontSize: 18,
        boxShadow: disabled ? "none" : "0 6px 0 rgba(0,0,0,0.28)",
        cursor: disabled ? "default" : "pointer",
        marginBottom: 14,
        transition: "transform 0.08s ease",
        ...style,
      }}
      onMouseDown={(e) => {
        if (!disabled) e.currentTarget.style.transform = "translateY(4px)";
      }}
      onMouseUp={(e) => {
        e.currentTarget.style.transform = "translateY(0)";
      }}
      onTouchStart={(e) => {
        if (!disabled) e.currentTarget.style.transform = "translateY(4px)";
      }}
      onTouchEnd={(e) => {
        e.currentTarget.style.transform = "translateY(0)";
      }}
    >
      {children}
    </button>
  );
}

function Card({ children, style }) {
  return (
    <div
      style={{
        width: "100%",
        maxWidth: 420,
        background: "rgba(255,255,255,0.06)",
        border: "1px solid rgba(255,255,255,0.12)",
        borderRadius: 22,
        padding: 20,
        boxSizing: "border-box",
        ...style,
      }}
    >
      {children}
    </div>
  );
}

function ClueTrail({ clues }) {
  if (!clues.length) return null;
  return (
    <div
      style={{
        width: "100%",
        maxWidth: 420,
        display: "flex",
        flexWrap: "wrap",
        gap: 8,
        justifyContent: "center",
        marginBottom: 22,
        padding: "14px 12px",
        background: "rgba(0,0,0,0.25)",
        borderRadius: 18,
        border: "1px dashed rgba(255,210,63,0.4)",
      }}
    >
      {clues.map((c, i) => (
        <div
          key={i}
          style={{
            fontSize: 34,
            background: "rgba(255,255,255,0.08)",
            borderRadius: 12,
            padding: "6px 10px",
            position: "relative",
          }}
        >
          {c}
          <span
            style={{
              position: "absolute",
              top: -8,
              right: -4,
              fontSize: 10,
              background: "#FFD23F",
              color: "#1B1035",
              borderRadius: 8,
              padding: "1px 5px",
              fontWeight: 800,
              fontFamily: "'Baloo 2', sans-serif",
            }}
          >
            {i + 1}
          </span>
        </div>
      ))}
    </div>
  );
}

function Home({ onSelect }) {
  return (
    <Screen style={{ justifyContent: "center" }} homeConfirm={null}>
      <div style={{ fontSize: 64, marginBottom: 6 }}>🕵️‍♂️</div>
      <Title size={36}>¿Quién Soy?</Title>
      <Sub>
        Uno piensa una persona o personaje famoso y lo describe con emojis.
        Los demás intentan adivinar. ¡Sin hablar!
      </Sub>
      <BigButton onClick={() => onSelect("offline")} color="#FF3E7F">
        📴 Jugar Offline (pasando el celu)
      </BigButton>
      <BigButton onClick={() => onSelect("online")} color="#5B4B8A">
        🌐 Jugar Online
      </BigButton>
    </Screen>
  );
}

function App() {
  useInjectFont();
  const [mode, setMode] = useState("home");
  if (mode === "home") return <Home onSelect={setMode} />;
  if (mode === "online") return <OnlineGame onBack={() => setMode("home")} />;
  return <OfflineGame onBack={() => setMode("home")} />;
}

function OfflineGame({ onBack }) {
  const [screen, setScreen] = useState("count");
  const [players, setPlayers] = useState([]);
  const [nameDraft, setNameDraft] = useState("");
  const [playerCount, setPlayerCount] = useState(4);
  const [scores, setScores] = useState({});
  const [clueGiverIdx, setClueGiverIdx] = useState(0);
  const [clues, setClues] = useState([]);
  const [emojiDraft, setEmojiDraft] = useState("");
  const [guessers, setGuessers] = useState([]);
  const [guessIdx, setGuessIdx] = useState(0);
  const [guessDraft, setGuessDraft] = useState("");
  const [guesses, setGuesses] = useState([]);
  const [secretCharacter, setSecretCharacter] = useState("");
  const [selectedWinners, setSelectedWinners] = useState([]);
  const [lastWinners, setLastWinners] = useState([]);
  const [lastPool, setLastPool] = useState(0);
  const [lastShare, setLastShare] = useState(0);
  const [round, setRound] = useState(1);
  const inputRef = useRef(null);

  const clueGiver = players[clueGiverIdx];

  function goHome() {
    setPlayers([]);
    setScores({});
    setClues([]);
    setGuesses([]);
    setSecretCharacter("");
    setSelectedWinners([]);
    setLastWinners([]);
    setRound(1);
    setClueGiverIdx(0);
    setScreen("count");
    onBack();
  }

  function confirmCount() {
    setPlayers(Array.from({ length: playerCount }, () => ""));
    setScreen("names");
  }

  function setPlayerName(i, val) {
    setPlayers((prev) => {
      const copy = [...prev];
      copy[i] = val;
      return copy;
    });
  }

  function namesReady() {
    const cleaned = players.map((p, i) => p.trim() || `Jugador ${i + 1}`);
    setPlayers(cleaned);
    setScores(Object.fromEntries(cleaned.map((n) => [n, 0])));
    setScreen("passToClue");
  }

  function beginClueInput() {
    setClues([]);
    setEmojiDraft("");
    setSecretCharacter("");
    setSelectedWinners([]);
    setScreen("clueInput");
  }

  function addClueAndPass() {
    const val = emojiDraft.trim();
    if (!val) return;
    setClues((prev) => [...prev, val]);
    setEmojiDraft("");
    const gList = players.filter((_, i) => i !== clueGiverIdx);
    setGuessers(gList);
    setGuessIdx(0);
    setGuesses([]);
    setGuessDraft("");
    setScreen("passToGuess");
  }

  function submitGuess() {
    const g = { name: guessers[guessIdx], text: guessDraft.trim() || "(sin respuesta)" };
    setGuesses((prev) => [...prev, g]);
    setGuessDraft("");
    if (guessIdx + 1 < guessers.length) {
      setGuessIdx((i) => i + 1);
      setScreen("passToGuess");
    } else {
      setScreen("passToReview");
    }
  }

  function toggleWinner(name) {
    setSelectedWinners((prev) =>
      prev.includes(name) ? prev.filter((n) => n !== name) : [...prev, name]
    );
  }

  function confirmRoundResults() {
    if (selectedWinners.length === 0) return;
    // El pool arranca en 10 y baja 1 punto por cada pista extra que hizo falta, piso 0.
    const pool = Math.max(0, 10 - (clues.length - 1));
    // Se reparte parejo entre quien pensó el personaje y todos los que acertaron.
    const winners = [clueGiver, ...selectedWinners];
    const share = Math.round(pool / winners.length);
    setScores((prev) => {
      const next = { ...prev };
      winners.forEach((name) => {
        next[name] = (next[name] || 0) + share;
      });
      return next;
    });
    setLastWinners(selectedWinners);
    setLastPool(pool);
    setLastShare(share);
    setScreen("winner");
  }

  function nobodyGuessed() {
    setScreen("clueInputAgain");
  }

  function nextRound() {
    setClueGiverIdx((i) => (i + 1) % players.length);
    setRound((r) => r + 1);
    setClues([]);
    setGuesses([]);
    setSecretCharacter("");
    setSelectedWinners([]);
    setLastWinners([]);
    setScreen("passToClue");
  }

  // ---------- COUNT ----------
  if (screen === "count") {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <Title>¿Cuántos juegan?</Title>
        <Sub>Entre 3 y 8 jugadores</Sub>
        <div
          style={{
            display: "flex",
            alignItems: "center",
            gap: 18,
            marginBottom: 26,
          }}
        >
          <button
            onClick={() => setPlayerCount((c) => Math.max(3, c - 1))}
            style={counterBtnStyle}
          >
            −
          </button>
          <div
            style={{
              fontFamily: "'Baloo 2', sans-serif",
              fontSize: 48,
              color: "#FFD23F",
              width: 70,
              textAlign: "center",
            }}
          >
            {playerCount}
          </div>
          <button
            onClick={() => setPlayerCount((c) => Math.min(8, c + 1))}
            style={counterBtnStyle}
          >
            +
          </button>
        </div>
        <BigButton onClick={confirmCount}>Siguiente ➜</BigButton>
        <BigButton onClick={goHome} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          ← Volver
        </BigButton>
      </Screen>
    );
  }

  // ---------- NAMES ----------
  if (screen === "names") {
    const allFilled = true; // names optional, defaults applied
    return (
      <Screen homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <Title size={26}>Nombres de los jugadores</Title>
        <Sub>Se van a ir pasando el celu en este orden</Sub>
        <Card style={{ marginBottom: 20 }}>
          {players.map((p, i) => (
            <input
              key={i}
              value={p}
              onChange={(e) => setPlayerName(i, e.target.value)}
              placeholder={`Jugador ${i + 1}`}
              style={inputStyle}
            />
          ))}
        </Card>
        <BigButton onClick={namesReady}>¡Listo, arrancar! 🎉</BigButton>
      </Screen>
    );
  }

  // ---------- PASS TO CLUE GIVER ----------
  if (screen === "passToClue") {
    return (
      <Screen style={{ justifyContent: "center" }} homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <div style={{ fontSize: 56, marginBottom: 10 }}>🤫</div>
        <Title size={24}>Ronda {round}</Title>
        <Sub>
          Pasale el celu a <b style={{ color: "#FFD23F" }}>{clueGiver}</b>.
          Nadie más tiene que mirar la pantalla.
        </Sub>
        <BigButton onClick={beginClueInput}>
          Ya lo tengo yo, {clueGiver} 👀
        </BigButton>
      </Screen>
    );
  }

  // ---------- CLUE INPUT (first clue of the round) ----------
  if (screen === "clueInput" || screen === "clueInputAgain") {
    const isAgain = screen === "clueInputAgain";
    return (
      <Screen homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <Title size={24}>
          {isAgain ? "Nadie adivinó 😬" : `Pensá a alguien, ${clueGiver}`}
        </Title>
        <Sub>
          {isAgain
            ? "Agregá otro emoji como pista extra"
            : "Elegí una persona o personaje que todos conozcan, y describilo con un emoji"}
        </Sub>
        <ClueTrail clues={clues} />
        <Card style={{ marginBottom: 16 }}>
          {!isAgain && (
            <input
              value={secretCharacter}
              onChange={(e) => setSecretCharacter(e.target.value)}
              placeholder="¿Quién es? (queda guardado, nadie más lo ve)"
              style={inputStyle}
            />
          )}
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "repeat(6, 1fr)",
              gap: 6,
              marginBottom: 14,
            }}
          >
            {QUICK_EMOJIS.map((e) => (
              <button
                key={e}
                onClick={() => setEmojiDraft(e)}
                style={{
                  fontSize: 22,
                  background:
                    emojiDraft === e ? "rgba(255,210,63,0.3)" : "rgba(255,255,255,0.06)",
                  border: "1px solid rgba(255,255,255,0.1)",
                  borderRadius: 10,
                  padding: "6px 0",
                  cursor: "pointer",
                }}
              >
                {e}
              </button>
            ))}
          </div>
          <input
            value={emojiDraft}
            onChange={(e) => setEmojiDraft(e.target.value)}
            placeholder="o escribí/pegá tu propio emoji"
            style={inputStyle}
          />
        </Card>
        <BigButton
          onClick={isAgain ? () => {
            const val = emojiDraft.trim();
            if (!val) return;
            setClues((prev) => [...prev, val]);
            setEmojiDraft("");
            setGuessIdx(0);
            setGuesses([]);
            setGuessDraft("");
            setScreen("passToGuess");
          } : addClueAndPass}
          disabled={!emojiDraft.trim() || (!isAgain && !secretCharacter.trim())}
        >
          Pasar el celu para adivinar ➜
        </BigButton>
      </Screen>
    );
  }

  // ---------- PASS TO GUESSER ----------
  if (screen === "passToGuess") {
    const current = guessers[guessIdx];
    return (
      <Screen style={{ justifyContent: "center" }} homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <div style={{ fontSize: 56, marginBottom: 10 }}>📲</div>
        <Sub>
          Jugador {guessIdx + 1} de {guessers.length}
        </Sub>
        <Title size={24}>Pasale el celu a {current}</Title>
        <BigButton onClick={() => setScreen("guessing")}>
          Soy {current}, ¡a adivinar! 🔍
        </BigButton>
      </Screen>
    );
  }

  // ---------- GUESSING ----------
  if (screen === "guessing") {
    const current = guessers[guessIdx];
    return (
      <Screen homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <Title size={22}>¿Quién es, {current}?</Title>
        <ClueTrail clues={clues} />
        <Card style={{ marginBottom: 16 }}>
          <input
            autoFocus
            value={guessDraft}
            onChange={(e) => setGuessDraft(e.target.value)}
            placeholder="Escribí tu respuesta..."
            style={inputStyle}
            onKeyDown={(e) => e.key === "Enter" && submitGuess()}
          />
        </Card>
        <BigButton onClick={submitGuess}>Confirmar respuesta ✅</BigButton>
      </Screen>
    );
  }

  // ---------- PASS TO REVIEW ----------
  if (screen === "passToReview") {
    return (
      <Screen style={{ justifyContent: "center" }} homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <div style={{ fontSize: 56, marginBottom: 10 }}>🎯</div>
        <Sub>Ya respondieron todos</Sub>
        <Title size={24}>Pasale el celu a {clueGiver}</Title>
        <BigButton onClick={() => setScreen("review")}>
          Soy {clueGiver}, veamos las respuestas 👁️
        </BigButton>
      </Screen>
    );
  }

  // ---------- REVIEW ----------
  if (screen === "review") {
    const pool = Math.max(0, 10 - (clues.length - 1));
    return (
      <Screen homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <Title size={22}>Respuestas — {clueGiver} decide</Title>
        <Sub>Tocá a todos los que acertaron (puede ser más de uno)</Sub>
        <ClueTrail clues={clues} />
        <Card style={{ marginBottom: 16 }}>
          {guesses.map((g, i) => {
            const isSelected = selectedWinners.includes(g.name);
            return (
              <div
                key={i}
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  gap: 10,
                  padding: "10px 6px",
                  borderBottom:
                    i < guesses.length - 1 ? "1px solid rgba(255,255,255,0.08)" : "none",
                }}
              >
                <div>
                  <div style={{ fontSize: 12, color: "#C9B8F0" }}>{g.name}</div>
                  <div style={{ fontSize: 16, fontWeight: 700 }}>{g.text}</div>
                </div>
                <button
                  onClick={() => toggleWinner(g.name)}
                  style={isSelected ? correctBtnStyleActive : correctBtnStyle}
                >
                  {isSelected ? "✅ Acertó" : "¡Correcto! 🏆"}
                </button>
              </div>
            );
          })}
        </Card>
        <Sub style={{ marginTop: -10 }}>
          Esta ronda vale {pool} {pool === 1 ? "punto" : "puntos"}, repartidos entre {clueGiver} y quienes acertaron
        </Sub>
        <BigButton onClick={confirmRoundResults} disabled={selectedWinners.length === 0}>
          Confirmar ganadores ✅
        </BigButton>
        <BigButton onClick={nobodyGuessed} color="#5B4B8A">
          Nadie acertó, doy otra pista 🔁
        </BigButton>
      </Screen>
    );
  }

  // ---------- WINNER ----------
  if (screen === "winner") {
    const winnersLabel = joinNames(lastWinners);
    return (
      <Screen style={{ justifyContent: "center" }} homeConfirm={"¿Salir? Se pierde el progreso de esta partida."}>
        <div style={{ fontSize: 70, marginBottom: 6 }}>🎉</div>
        <Title size={30}>
          {lastWinners.length > 1 ? `¡${winnersLabel} acertaron!` : `¡${winnersLabel} acertó!`}
        </Title>
        <Sub>
          Era <b style={{ color: "#FFD23F" }}>{secretCharacter}</b> — {clueGiver} dio {clues.length} {clues.length === 1 ? "pista" : "pistas"}
        </Sub>
        <Sub style={{ marginTop: -14 }}>
          Ronda de {lastPool} {lastPool === 1 ? "punto" : "puntos"} repartidos: +{lastShare} para cada ganador ({clueGiver} incluido)
        </Sub>
        <Card style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: "'Baloo 2', sans-serif", fontSize: 15, color: "#FFD23F", marginBottom: 8 }}>
            Puntajes
          </div>
          {Object.entries(scores)
            .sort((a, b) => b[1] - a[1])
            .map(([name, pts]) => (
              <div
                key={name}
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  padding: "6px 2px",
                  fontSize: 15,
                }}
              >
                <span>{name}</span>
                <span style={{ color: "#FFD23F", fontWeight: 800 }}>{pts} ⭐</span>
              </div>
            ))}
        </Card>
        <BigButton onClick={nextRound}>Siguiente ronda ➜</BigButton>
        <BigButton onClick={goHome} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Terminar juego
        </BigButton>
      </Screen>
    );
  }

  return null;
}

// ==================== ONLINE: SALA COMPARTIDA ====================

function OnlineGame({ onBack }) {
  const [screen, setScreen] = useState("join"); // "join" | "game"
  const [localNames, setLocalNames] = useState([]);
  const [nameDraft, setNameDraft] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [joinError, setJoinError] = useState("");
  const [joining, setJoining] = useState(false);
  const [openRooms, setOpenRooms] = useState([]);
  const [resumable, setResumable] = useState(null);

  const [roomCode, setRoomCode] = useState(null);
  const [room, setRoom] = useState(null);
  const [copied, setCopied] = useState(false);

  const [emojiDraft, setEmojiDraft] = useState("");
  const [secretDraft, setSecretDraft] = useState("");
  const [guessDraft, setGuessDraft] = useState("");
  const [selected, setSelected] = useState([]);

  // Nombres de las personas que juegan desde ESTE celu (puede ser más de una).
  const addLocalName = () => {
    const val = nameDraft.trim();
    if (!val) return;
    if (localNames.some((n) => n.toLowerCase() === val.toLowerCase())) {
      setNameDraft("");
      return;
    }
    setLocalNames((prev) => [...prev, val]);
    setNameDraft("");
  };
  const removeLocalName = (i) => {
    setLocalNames((prev) => prev.filter((_, idx) => idx !== i));
  };

  // Salas abiertas: solo mientras estamos eligiendo a cuál unirnos.
  useEffect(() => {
    if (screen !== "join") return;
    let cancelled = false;
    const tick = async () => {
      try {
        const entries = await window.storage.list(STORAGE_PREFIX);
        if (cancelled) return;
        const rooms = entries
          .map((e) => {
            try {
              return JSON.parse(e.value);
            } catch {
              return null;
            }
          })
          .filter((r) => r && r.phase === "lobby" && Date.now() - (r.createdAt || 0) < 3 * 60 * 60 * 1000)
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        setOpenRooms(rooms);
      } catch {
        // sin salas visibles, no molesta con un error
      }
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, [screen]);

  // Sesión guardada: por si volviste al menú por error. Se identifica por
  // este CELU (MY_DEVICE_ID), no por una persona puntual — así vuelven
  // todos los de esta casa juntos.
  useEffect(() => {
    if (screen !== "join") return;
    let cancelled = false;
    (async () => {
      let saved;
      try {
        saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      } catch {
        saved = null;
      }
      if (!saved || !saved.code) {
        setResumable(null);
        return;
      }
      const existing = await readRoom(saved.code);
      if (cancelled) return;
      const mine = existing ? existing.players.filter((p) => p.deviceId === MY_DEVICE_ID) : [];
      if (mine.length > 0) {
        setResumable({ code: saved.code, names: mine.map((p) => p.name) });
      } else {
        localStorage.removeItem(SESSION_KEY);
        setResumable(null);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [screen]);

  const resumeSession = async () => {
    if (!resumable) return;
    const existing = await readRoom(resumable.code);
    if (!existing) {
      localStorage.removeItem(SESSION_KEY);
      setResumable(null);
      return;
    }
    setRoom(existing);
    setRoomCode(resumable.code);
    setScreen("game");
  };

  const doJoin = async (codeMaybe) => {
    if (localNames.length === 0) {
      setJoinError("Sumá al menos una persona de este celu.");
      return;
    }
    setJoining(true);
    setJoinError("");
    try {
      const code = codeMaybe || (codeInput.trim() ? codeInput.trim().toUpperCase() : randomCode());
      let existing = await readRoom(code);
      const newPlayers = localNames.map((n) => ({ id: randomId(), name: n, deviceId: MY_DEVICE_ID, score: 0 }));
      if (!existing) {
        existing = {
          code,
          players: newPlayers,
          phase: "lobby",
          clueGiverIdx: -1,
          clueGiverId: null,
          secretCharacter: null,
          clues: [],
          guesses: {},
          round: 0,
          createdAt: Date.now(),
        };
      } else {
        const clash = newPlayers.find((np) =>
          existing.players.some((p) => p.name.toLowerCase() === np.name.toLowerCase())
        );
        if (clash) {
          setJoinError(`Ya hay alguien llamado "${clash.name}" en esa sala. Cambiá el nombre.`);
          setJoining(false);
          return;
        }
        existing.players = [...existing.players, ...newPlayers];
      }
      await writeRoom(code, existing);
      localStorage.setItem(SESSION_KEY, JSON.stringify({ code }));
      setRoom(existing);
      setRoomCode(code);
      setScreen("game");
    } catch (e) {
      setJoinError("No se pudo conectar a la sala. Probá de nuevo.");
    } finally {
      setJoining(false);
    }
  };

  const quickJoin = (code) => {
    setCodeInput(code);
    doJoin(code);
  };

  const leaveRoom = () => {
    localStorage.removeItem(SESSION_KEY);
    onBack();
  };

  // Polling del estado de la sala una vez adentro.
  useEffect(() => {
    if (!roomCode) return;
    let cancelled = false;
    const tick = async () => {
      const r = await readRoom(roomCode);
      if (!cancelled && r) setRoom(r);
    };
    tick();
    const id = setInterval(tick, POLL_MS);
    return () => {
      cancelled = true;
      clearInterval(id);
    };
  }, [roomCode]);

  const myPlayers = (room?.players || []).filter((p) => p.deviceId === MY_DEVICE_ID);
  const clueGiver = room?.players?.find((p) => p.id === room?.clueGiverId) || null;
  const isMyDeviceClueGiver = !!clueGiver && clueGiver.deviceId === MY_DEVICE_ID;

  const copyCode = () => {
    if (!roomCode) return;
    navigator.clipboard?.writeText(roomCode).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  const startRound = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh || fresh.players.length < 3) return;
    const nextIdx = ((fresh.clueGiverIdx ?? -1) + 1) % fresh.players.length;
    fresh.clueGiverIdx = nextIdx;
    fresh.clueGiverId = fresh.players[nextIdx].id;
    fresh.secretCharacter = null;
    fresh.clues = [];
    fresh.guesses = {};
    fresh.phase = "clueInput";
    fresh.round = (fresh.round || 0) + 1;
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setEmojiDraft("");
    setSecretDraft("");
  };

  const submitFirstClue = async () => {
    const emoji = emojiDraft.trim();
    const secret = secretDraft.trim();
    if (!emoji || !secret) return;
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.secretCharacter = secret;
    fresh.clues = [emoji];
    fresh.guesses = {};
    fresh.phase = "guessing";
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setEmojiDraft("");
  };

  const submitAnotherClue = async () => {
    const emoji = emojiDraft.trim();
    if (!emoji) return;
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.clues = [...(fresh.clues || []), emoji];
    fresh.guesses = {};
    fresh.phase = "guessing";
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setEmojiDraft("");
  };

  const submitGuessFor = async (forId, forName) => {
    const text = guessDraft.trim() || "(sin respuesta)";
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.guesses = { ...(fresh.guesses || {}), [forId]: { name: forName, text } };
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setGuessDraft("");
  };

  const goToReview = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.phase = "review";
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setSelected([]);
  };

  const nobodyGuessedOnline = async () => {
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    fresh.phase = "clueInputAgain";
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
    setEmojiDraft("");
  };

  const toggleSelected = (id) => {
    setSelected((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };

  const confirmWinners = async () => {
    if (selected.length === 0) return;
    const fresh = await readRoom(roomCode);
    if (!fresh) return;
    const pool = Math.max(0, 10 - ((fresh.clues || []).length - 1));
    const winnerIds = [fresh.clueGiverId, ...selected];
    const share = Math.round(pool / winnerIds.length);
    fresh.players = fresh.players.map((p) =>
      winnerIds.includes(p.id) ? { ...p, score: (p.score || 0) + share } : p
    );
    const winnerNames = selected
      .map((id) => (fresh.players.find((p) => p.id === id) || {}).name)
      .filter(Boolean);
    fresh.lastRound = {
      winnerNames,
      pool,
      share,
      secretCharacter: fresh.secretCharacter,
      clueGiverName: (fresh.players.find((p) => p.id === fresh.clueGiverId) || {}).name,
      cluesCount: (fresh.clues || []).length,
    };
    fresh.phase = "roundEnd";
    await writeRoom(roomCode, fresh);
    setRoom(fresh);
  };

  // ---------- PANTALLA DE UNIRSE ----------
  if (screen === "join") {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <div style={{ fontSize: 56, marginBottom: 6 }}>🌐</div>
        <Title size={28}>Jugar Online</Title>
        <Sub>Una sala por familia/casa. Si en tu casa juegan varios con el mismo celu, sumalos a todos abajo.</Sub>

        {resumable && (
          <button
            onClick={resumeSession}
            style={{
              width: "100%",
              maxWidth: 380,
              textAlign: "left",
              borderRadius: 18,
              padding: 16,
              marginBottom: 14,
              cursor: "pointer",
              background: "rgba(255,210,63,0.18)",
              border: "1px solid #FFD23F",
              color: "#F3EEFF",
              fontFamily: "'Nunito', sans-serif",
            }}
          >
            <div style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 800, color: "#FFD23F", fontSize: 15 }}>
              ↩️ Volver a tu sala ({resumable.code})
            </div>
            <div style={{ fontSize: 12.5, color: "#C9B8F0", marginTop: 2 }}>
              Eran {joinNames(resumable.names)} — siguen ahí adentro
            </div>
          </button>
        )}

        <Card style={{ marginBottom: 16 }}>
          <div
            style={{
              fontFamily: "'Baloo 2', sans-serif",
              fontSize: 12,
              color: "#FFD23F",
              marginBottom: 8,
              textTransform: "uppercase",
              letterSpacing: 1,
            }}
          >
            ¿Quiénes juegan desde este celu?
          </div>
          {localNames.length > 0 && (
            <div style={{ marginBottom: 10 }}>
              {localNames.map((n, i) => (
                <div
                  key={i}
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    background: "rgba(255,255,255,0.06)",
                    border: "1px solid rgba(255,255,255,0.1)",
                    borderRadius: 10,
                    padding: "8px 12px",
                    marginBottom: 6,
                  }}
                >
                  <span style={{ fontWeight: 700 }}>{n}</span>
                  <button
                    onClick={() => removeLocalName(i)}
                    style={{ background: "none", border: "none", color: "#FF6B9D", fontSize: 12, fontWeight: 700, cursor: "pointer" }}
                  >
                    Quitar
                  </button>
                </div>
              ))}
            </div>
          )}
          <div style={{ display: "flex", gap: 8, marginBottom: 4 }}>
            <input
              value={nameDraft}
              onChange={(e) => setNameDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addLocalName()}
              placeholder="Nombre de la persona"
              style={{ ...inputStyle, marginBottom: 0, flex: 1 }}
              maxLength={16}
            />
            <button
              onClick={addLocalName}
              style={{
                width: 44,
                borderRadius: 12,
                border: "none",
                background: "#FF3E7F",
                color: "#1B1035",
                fontSize: 22,
                fontWeight: 800,
                cursor: "pointer",
              }}
            >
              +
            </button>
          </div>
        </Card>

        <Card style={{ marginBottom: 16 }}>
          <input
            value={codeInput}
            onChange={(e) => setCodeInput(e.target.value.toUpperCase())}
            placeholder="Código de sala (dejalo vacío para crear)"
            style={{ ...inputStyle, marginBottom: 0, letterSpacing: 3, textTransform: "uppercase" }}
            maxLength={4}
          />
          {joinError && <div style={{ color: "#FF6B9D", fontSize: 13, marginTop: 8 }}>{joinError}</div>}
        </Card>
        <BigButton onClick={() => doJoin()} disabled={joining}>
          {joining ? "Entrando..." : codeInput.trim() ? "Unirme a la sala" : "Crear sala y jugar"}
        </BigButton>

        {openRooms.length > 0 && (
          <Card style={{ marginTop: 4 }}>
            <div
              style={{
                fontFamily: "'Baloo 2', sans-serif",
                fontSize: 12,
                color: "#FFD23F",
                marginBottom: 8,
                textTransform: "uppercase",
                letterSpacing: 1,
              }}
            >
              Salas abiertas ahora
            </div>
            {openRooms.map((r) => (
              <button
                key={r.code}
                onClick={() => quickJoin(r.code)}
                disabled={joining}
                style={{
                  width: "100%",
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  background: "rgba(255,255,255,0.06)",
                  border: "1px solid rgba(255,255,255,0.1)",
                  borderRadius: 12,
                  padding: "10px 12px",
                  marginBottom: 8,
                  cursor: "pointer",
                  color: "#F3EEFF",
                  fontFamily: "'Nunito', sans-serif",
                  fontWeight: 700,
                  fontSize: 14,
                }}
              >
                <span>{r.players.map((p) => p.name).join(", ")}</span>
                <span style={{ color: "#FFD23F", fontWeight: 800, fontSize: 12, letterSpacing: 2 }}>{r.code}</span>
              </button>
            ))}
          </Card>
        )}

        <BigButton onClick={onBack} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          ← Volver
        </BigButton>
      </Screen>
    );
  }

  if (!room) {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <Sub>Cargando sala...</Sub>
      </Screen>
    );
  }

  const players = room.players || [];
  const sorted = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
  const guessesList = Object.entries(room.guesses || {}).map(([id, g]) => ({ id, ...g }));
  const myPlayerIds = myPlayers.map((p) => p.id);

  // ---------- LOBBY ----------
  if (room.phase === "lobby") {
    return (
      <Screen style={{ justifyContent: "center" }}>
        <div style={{ display: "flex", justifyContent: "space-between", width: "100%", maxWidth: 420, marginBottom: 10 }}>
          <span style={{ color: "#C9B8F0", fontSize: 13 }}>
            Este celu: <b style={{ color: "#F3EEFF" }}>{joinNames(myPlayers.map((p) => p.name))}</b>
          </span>
          <button
            onClick={copyCode}
            style={{
              background: "rgba(255,255,255,0.08)",
              border: "none",
              borderRadius: 20,
              padding: "4px 12px",
              color: "#FFD23F",
              fontWeight: 800,
              letterSpacing: 2,
              fontSize: 13,
              cursor: "pointer",
            }}
          >
            {roomCode} {copied ? "✓" : "📋"}
          </button>
        </div>
        <Title size={26}>Sala {roomCode}</Title>
        <Card style={{ marginBottom: 20 }}>
          {sorted.map((p) => (
            <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 2px", fontSize: 15 }}>
              <span>
                {p.name}
                {myPlayerIds.includes(p.id) && <span style={{ color: "#8b7fa8", fontSize: 11 }}> (vos)</span>}
              </span>
              <span style={{ color: "#FFD23F", fontWeight: 800 }}>{p.score || 0} ⭐</span>
            </div>
          ))}
        </Card>
        {players.length < 3 && <Sub>Necesitás al menos 3 jugadores en total. Compartí el código.</Sub>}
        <BigButton onClick={startRound} disabled={players.length < 3}>
          Siguiente ronda ➜
        </BigButton>
        <BigButton onClick={leaveRoom} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Salir de la sala
        </BigButton>
      </Screen>
    );
  }

  // ---------- CLUE INPUT / CLUE INPUT AGAIN ----------
  if (room.phase === "clueInput" || room.phase === "clueInputAgain") {
    const isAgain = room.phase === "clueInputAgain";
    if (!isMyDeviceClueGiver) {
      return (
        <Screen style={{ justifyContent: "center" }}>
          <div style={{ fontSize: 56, marginBottom: 10 }}>🤫</div>
          <Title size={22}>{isAgain ? "Nadie adivinó..." : `${clueGiver?.name || "..."} está pensando`}</Title>
          <Sub>
            Esperá a que {clueGiver?.name} {isAgain ? "dé otra pista" : "piense a alguien"}...
          </Sub>
          <ClueTrail clues={room.clues || []} />
        </Screen>
      );
    }
    return (
      <Screen>
        <Title size={24}>{isAgain ? "Pistas extra" : `Pensá a alguien, ${clueGiver?.name}`}</Title>
        <Sub>{isAgain ? "Agregá otro emoji como pista" : "Elegí una persona famosa y escribila (queda guardada)"}</Sub>
        <ClueTrail clues={room.clues || []} />
        <Card style={{ marginBottom: 16 }}>
          {!isAgain && (
            <input
              value={secretDraft}
              onChange={(e) => setSecretDraft(e.target.value)}
              placeholder="¿Quién es? (nadie más lo ve)"
              style={inputStyle}
            />
          )}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 6, marginBottom: 14 }}>
            {QUICK_EMOJIS.map((e) => (
              <button
                key={e}
                onClick={() => setEmojiDraft(e)}
                style={{
                  fontSize: 22,
                  background: emojiDraft === e ? "rgba(255,210,63,0.3)" : "rgba(255,255,255,0.06)",
                  border: "1px solid rgba(255,255,255,0.1)",
                  borderRadius: 10,
                  padding: "6px 0",
                  cursor: "pointer",
                }}
              >
                {e}
              </button>
            ))}
          </div>
          <input
            value={emojiDraft}
            onChange={(e) => setEmojiDraft(e.target.value)}
            placeholder="o escribí tu propio emoji"
            style={inputStyle}
          />
        </Card>
        <BigButton
          onClick={isAgain ? submitAnotherClue : submitFirstClue}
          disabled={!emojiDraft.trim() || (!isAgain && !secretDraft.trim())}
        >
          Mandar pista a todos ➜
        </BigButton>
      </Screen>
    );
  }

  // ---------- GUESSING ----------
  if (room.phase === "guessing") {
    // Jugadores de ESTE celu que todavía no mandaron respuesta (nunca incluye
    // a quien piensa, esté en el celu que esté). Si hay más de uno, se van
    // pasando el celu entre ellos, uno a la vez.
    const pendingLocal = myPlayers.filter(
      (p) => p.id !== room.clueGiverId && !(room.guesses || {})[p.id]
    );

    if (pendingLocal.length > 0) {
      const current = pendingLocal[0];
      return (
        <Screen>
          <Title size={22}>¿Quién es, {current.name}?</Title>
          {myPlayers.length > 1 && (
            <Sub style={{ marginTop: -12 }}>Pasale el celu a {current.name} si no lo tiene ya</Sub>
          )}
          <ClueTrail clues={room.clues || []} />
          <Card style={{ marginBottom: 16 }}>
            <input
              autoFocus
              value={guessDraft}
              onChange={(e) => setGuessDraft(e.target.value)}
              placeholder="Escribí tu respuesta..."
              style={inputStyle}
              onKeyDown={(e) => e.key === "Enter" && submitGuessFor(current.id, current.name)}
            />
          </Card>
          <BigButton onClick={() => submitGuessFor(current.id, current.name)}>Confirmar respuesta ✅</BigButton>
        </Screen>
      );
    }

    if (isMyDeviceClueGiver) {
      const answered = guessesList.length;
      const total = players.length - 1;
      return (
        <Screen>
          <Title size={22}>Esperando respuestas</Title>
          <Sub>
            {answered} de {total} ya contestaron
          </Sub>
          <ClueTrail clues={room.clues || []} />
          <Card style={{ marginBottom: 16 }}>
            {guessesList.length === 0 && <Sub style={{ margin: 0 }}>Todavía nadie contestó...</Sub>}
            {guessesList.map((g) => (
              <div key={g.id} style={{ padding: "6px 2px", fontSize: 14, color: "#C9B8F0" }}>
                {g.name} ya respondió
              </div>
            ))}
          </Card>
          <BigButton onClick={goToReview} disabled={guessesList.length === 0}>
            Ver respuestas 👁️
          </BigButton>
        </Screen>
      );
    }

    return (
      <Screen style={{ justifyContent: "center" }}>
        <div style={{ fontSize: 56, marginBottom: 10 }}>✅</div>
        <Title size={22}>
          {myPlayers.length > 1 ? "¡Ya mandaron sus respuestas!" : "¡Mandaste tu respuesta!"}
        </Title>
        <Sub>Esperando a los demás...</Sub>
        <ClueTrail clues={room.clues || []} />
      </Screen>
    );
  }

  // ---------- REVIEW ----------
  if (room.phase === "review") {
    if (!isMyDeviceClueGiver) {
      return (
        <Screen style={{ justifyContent: "center" }}>
          <div style={{ fontSize: 56, marginBottom: 10 }}>🎯</div>
          <Title size={22}>{clueGiver?.name} está revisando</Title>
          <Sub>Ya se mandaron las respuestas, esperá el resultado...</Sub>
        </Screen>
      );
    }
    const pool = Math.max(0, 10 - ((room.clues || []).length - 1));
    return (
      <Screen>
        <Title size={22}>Respuestas — vos decidís</Title>
        <Sub>Tocá a todos los que acertaron (puede ser más de uno)</Sub>
        <ClueTrail clues={room.clues || []} />
        <Card style={{ marginBottom: 16 }}>
          {guessesList.map((g, i) => {
            const isSelected = selected.includes(g.id);
            return (
              <div
                key={g.id}
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  gap: 10,
                  padding: "10px 6px",
                  borderBottom: i < guessesList.length - 1 ? "1px solid rgba(255,255,255,0.08)" : "none",
                }}
              >
                <div>
                  <div style={{ fontSize: 12, color: "#C9B8F0" }}>{g.name}</div>
                  <div style={{ fontSize: 16, fontWeight: 700 }}>{g.text}</div>
                </div>
                <button onClick={() => toggleSelected(g.id)} style={isSelected ? correctBtnStyleActive : correctBtnStyle}>
                  {isSelected ? "✅ Acertó" : "¡Correcto! 🏆"}
                </button>
              </div>
            );
          })}
        </Card>
        <Sub style={{ marginTop: -10 }}>
          Esta ronda vale {pool} {pool === 1 ? "punto" : "puntos"}, repartidos entre vos y quienes acertaron
        </Sub>
        <BigButton onClick={confirmWinners} disabled={selected.length === 0}>
          Confirmar ganadores ✅
        </BigButton>
        <BigButton onClick={nobodyGuessedOnline} color="#5B4B8A">
          Nadie acertó, doy otra pista 🔁
        </BigButton>
      </Screen>
    );
  }

  // ---------- ROUND END ----------
  if (room.phase === "roundEnd") {
    const lr = room.lastRound || {};
    const winnersLabel = joinNames(lr.winnerNames || []);
    return (
      <Screen style={{ justifyContent: "center" }}>
        <div style={{ fontSize: 70, marginBottom: 6 }}>🎉</div>
        <Title size={28}>
          {(lr.winnerNames || []).length > 1 ? `¡${winnersLabel} acertaron!` : `¡${winnersLabel} acertó!`}
        </Title>
        <Sub>
          Era <b style={{ color: "#FFD23F" }}>{lr.secretCharacter}</b> — {lr.clueGiverName} dio {lr.cluesCount}{" "}
          {lr.cluesCount === 1 ? "pista" : "pistas"}
        </Sub>
        <Sub style={{ marginTop: -14 }}>
          Ronda de {lr.pool} {lr.pool === 1 ? "punto" : "puntos"}: +{lr.share} para cada ganador
        </Sub>
        <Card style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: "'Baloo 2', sans-serif", fontSize: 15, color: "#FFD23F", marginBottom: 8 }}>
            Puntajes
          </div>
          {sorted.map((p) => (
            <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 2px", fontSize: 15 }}>
              <span>{p.name}</span>
              <span style={{ color: "#FFD23F", fontWeight: 800 }}>{p.score || 0} ⭐</span>
            </div>
          ))}
        </Card>
        <BigButton onClick={startRound}>Siguiente ronda ➜</BigButton>
        <BigButton onClick={leaveRoom} color="transparent" style={{ boxShadow: "none", color: "#C9B8F0" }}>
          Salir de la sala
        </BigButton>
      </Screen>
    );
  }

  return null;
}

const inputStyle = {
  width: "100%",
  boxSizing: "border-box",
  padding: "12px 14px",
  borderRadius: 12,
  border: "1px solid rgba(255,255,255,0.15)",
  background: "rgba(0,0,0,0.25)",
  color: "#F3EEFF",
  fontSize: 16,
  marginBottom: 10,
  outline: "none",
  fontFamily: "'Nunito', sans-serif",
};

const counterBtnStyle = {
  width: 52,
  height: 52,
  borderRadius: "50%",
  border: "none",
  background: "#FF3E7F",
  color: "#1B1035",
  fontSize: 28,
  fontWeight: 800,
  cursor: "pointer",
};

const correctBtnStyle = {
  background: "#FFD23F",
  color: "#1B1035",
  border: "none",
  borderRadius: 10,
  padding: "8px 10px",
  fontWeight: 800,
  fontFamily: "'Baloo 2', sans-serif",
  fontSize: 13,
  cursor: "pointer",
  whiteSpace: "nowrap",
};

const correctBtnStyleActive = {
  ...correctBtnStyle,
  background: "#3DDC84",
  color: "#0c2e1c",
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
