function computeDifficulty(readingOk, kidsUnder12) {
  if (readingOk === false) return "easy";
  if (kidsUnder12 === true) return "normal";
  return "hard"; // todos leen bien y no hay menores de 12
}

// Elige un elemento al azar de "candidates", evitando los que aparecen en "recentKeys"
// (los últimos "maxRecent" valores según keyFn). Si al filtrar no queda nada, usa la lista completa.
function pickExcludingRecent(candidates, recentKeys, maxRecent, keyFn) {
  const recentSet = new Set((recentKeys || []).slice(-maxRecent).map(k => (k || "").toString().toLowerCase()));
  let pool = candidates.filter(c => !recentSet.has(keyFn(c).toString().toLowerCase()));
  if (pool.length === 0) pool = candidates;
  return pool[Math.floor(Math.random() * pool.length)];
}

function pickRoundWord(difficulty, recentWords) {
  const set = wordSets[difficulty] || wordSets.normal;
  const flat = [];
  Object.keys(set).forEach(cat => { set[cat].forEach(w => flat.push({ category: cat, word: w.word, emoji: w.emoji, hints: w.hints || [] })); });
  const pick = pickExcludingRecent(flat, recentWords || [], 8, w => w.word);
  const catWords = set[pick.category];
  let decoy = pick;
  if (catWords.length > 1) {
    do { decoy = catWords[Math.floor(Math.random() * catWords.length)]; } while (decoy.word === pick.word);
  }
  return { category: pick.category, word: pick.word, emoji: pick.emoji, hints: pick.hints, decoyWord: decoy.word, decoyEmoji: decoy.emoji };
}

// Lista combinada de todas las palabras por categoría (para el plan B sin internet)
function allWordsForCategory(category) {
  const combined = [];
  ["easy", "normal", "hard"].forEach(tier => {
    if (wordSets[tier][category]) combined.push(...wordSets[tier][category]);
  });
  return combined;
}
function fallbackClueWord(category, excludeWord, hints, usedWords) {
  const used = (usedWords || []).map(w => (w || "").toLowerCase().trim());
  // 1) preferir las pistas específicas de la palabra secreta
  const hintPool = (hints || []).filter(h => !used.includes(h.toLowerCase().trim()) && h !== excludeWord);
  if (hintPool.length > 0) return hintPool[Math.floor(Math.random() * hintPool.length)];
  // 2) si ya se usaron todas las pistas, otra palabra de la misma categoría que no se haya dicho
  const pool = allWordsForCategory(category).filter(w => w.word !== excludeWord && !used.includes(w.word.toLowerCase()));
  if (pool.length > 0) return pool[Math.floor(Math.random() * pool.length)].word;
  return category;
}

// Llama a la API con límite de tiempo; si falla o tarda de más, devuelve una palabra de respaldo (sin internet)
async function askBotForClue(prompt, category, excludeWord, hints, usedWords) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 8000);
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    clearTimeout(timeoutId);
    if (!response.ok) throw new Error("bad status");
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === "text");
    let text = textBlock ? textBlock.text.trim() : "";
    const used = (usedWords || []).map(w => (w || "").toLowerCase().trim());
    if (!text || used.includes(text.toLowerCase())) {
      text = fallbackClueWord(category, excludeWord, hints, usedWords);
    }
    return text;
  } catch (e) {
    clearTimeout(timeoutId);
    return fallbackClueWord(category, excludeWord, hints, usedWords);
  }
}

function speakAloud(text) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "es-AR";
    utter.rate = 0.95;
    window.speechSynthesis.speak(utter);
  } catch (e) { /* silencioso */ }
}

function genId(len) { return Math.random().toString(36).slice(2, 2 + (len || 8)); }
function genRoomCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

/* ================= ESTADO GLOBAL ================= */
// myId estable entre recargas de página: así, si volvés a tu sala después
// de haber tocado "Volver" o cerrado la pestaña por error, el servidor te

const myId = (() => {

}

/* ================= NAVEGACIÓN RAÍZ ================= */
function chooseMode(mode) {

  } else state.screen = "localSetup";

/* ---- Sesión guardada: "Volver a tu sala" si tocaste Volver por error ---- */
const SESSION_KEY = "impostor:session";
function saveSession(code, name) {
  localStorage.setItem(SESSION_KEY, JSON.stringify({ code, name }));
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}
async function checkResumableSession() {
  state.resumableRoom = null;
  let saved;
  try { saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch { saved = null; }
  if (!saved || !saved.code) return;
  const existing = await loadRoom(saved.code);
  if (existing && existing.players.some(p => p.id === myId)) {
    state.resumableRoom = { code: saved.code, name: saved.name };
    render();
  } else {
    clearSession();
  }
}
async function resumeSession() {
  if (!state.resumableRoom) return;
  const { code, name } = state.resumableRoom;
  const existing = await loadRoom(code);
  if (!existing) { clearSession(); state.resumableRoom = null; render(); return; }
  stopOpenRoomsPolling();
  state.room = existing;
  state.roomCode = code;
  state.myName = name;
  state.joinError = "";
  syncScreenFromRoom();
  startPolling();
  render();
}

function backToModeSelect() {
  if (state.pollHandle) clearInterval(state.pollHandle);
  state.pollHandle = null;
  stopOpenRoomsPolling();
  state.room = null;
  state.roomCode = null;
  state.mode = null;
  state.screen = "modeSelect";
  render();
}

/* ---- Salas abiertas: listado para no depender de pasarse el código ---- */
const ROOM_PREFIX = "room:";

function stopOpenRoomsPolling() {
  if (state.openRoomsPollHandle) clearInterval(state.openRoomsPollHandle);
  state.openRoomsPollHandle = null;
  state.openRooms = [];
}

function renderOpenRoomsBlock() {
  if (state.openRooms.length === 0) return "";
  return `
    <div class="divider">— o elegí una sala abierta —</div>
    <div class="openRoomsList">
      ${state.openRooms.map(r => `
        <button class="openRoomRow" onclick="quickJoinRoom('${r.code}')">
          <span class="openRoomNames">${r.players.map(p => p.name).join(", ")}</span>
          <span class="openRoomCode">${r.code}</span>
        </button>
      `).join("")}
    </div>
  `;
}

function startOpenRoomsPolling() {
  stopOpenRoomsPolling();
  const tick = async () => {
    if (state.screen !== "onlineHome") { stopOpenRoomsPolling(); return; }
    try {
      const entries = await window.storage.list(ROOM_PREFIX);
      const rooms = entries
        .map(e => { try { return JSON.parse(e.value); } catch { return null; } })
        .filter(r => r && r.phase === "lobby" && Date.now() - (r.createdAt || 0) < 3 * 60 * 60 * 1000)
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      state.openRooms = rooms;
      // Actualiza SOLO este bloque, nunca la tarjeta entera: un render()
      // completo acá reemplazaría los inputs de nombre/código y le haría
      // perder el foco (y lo tipeado) a quien está escribiendo su nombre.
      const container = document.getElementById("openRoomsBlock");
      if (container) container.innerHTML = renderOpenRoomsBlock();
      else render();
    } catch (e) { /* sin salas visibles, no molesta al jugador con un error */ }
  };
  tick();
  state.openRoomsPollHandle = setInterval(tick, 1800);
}

async function quickJoinRoom(code) {
  const nameInput = document.getElementById("nameInput") || document.getElementById("nameInputJoin");
  const name = (nameInput ? nameInput.value : "").trim();
  if (!name) { state.joinError = "Poné tu nombre primero (arriba o abajo)."; render(); return; }
  const existing = await loadRoom(code);
  if (!existing) { state.joinError = "Esa sala ya no está disponible."; render(); return; }
  if (existing.phase !== "lobby") { state.joinError = "Esa partida ya empezó. Esperá a la próxima ronda."; render(); return; }
  if (existing.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    state.joinError = "Ya hay alguien con ese nombre, probá otro."; render(); return;
  }
  existing.players.push({ id: myId, name, isBot: false });
  await saveRoom(existing);
  stopOpenRoomsPolling();
  saveSession(code, name);
  state.room = existing;
  state.roomCode = code;
  state.myName = name;
  state.screen = "lobby";
  state.joinError = "";
  startPolling();
  render();
}

/* ================= MODO ONLINE ================= */
async function saveRoom(r) {
  try { await window.storage.set("room:" + r.code, JSON.stringify(r), true); }
  catch (e) { console.error(e); }
}
async function loadRoom(code) {
  try {
    const res = await window.storage.get("room:" + code, true);
    return res ? JSON.parse(res.value) : null;
  } catch (e) { return null; }
}
function startPolling() {
  if (state.pollHandle) clearInterval(state.pollHandle);
  state.pollHandle = setInterval(async () => {
    if (!state.roomCode) return;
    const fresh = await loadRoom(state.roomCode);
    if (fresh) {
      state.room = fresh;
      syncScreenFromRoom();
      render();
    }
  }, 1800);
}
function syncScreenFromRoom() {
  const r = state.room;
  if (!r) return;
  if (r.phase === "lobby") state.screen = "lobby";
  else if (r.phase === "playing") state.screen = "playing";
  else if (r.phase === "clues") state.screen = "clues";
  else if (r.phase === "voting") state.screen = "voting";
}

async function createRoom() {
  const nameInput = document.getElementById("nameInput");
  const name = (nameInput ? nameInput.value : "").trim();
  if (!name) { state.joinError = "Poné tu nombre primero."; render(); return; }
  const code = genRoomCode();
  state.myName = name;
  state.roomCode = code;
  state.room = {
    code, hostId: myId,
    players: [{ id: myId, name, isBot: false }],
    botCount: 0, readingOk: true, kidsUnder12: false, impostorHelp: false,
    phase: "lobby", recentImpostorIds: [], recentStarterIds: [], recentWords: [], round: 0,
    createdAt: Date.now()
  };
  await saveRoom(state.room);
  stopOpenRoomsPolling();
  saveSession(code, name);
  state.screen = "lobby";
  startPolling();
  render();
}

async function joinRoom() {
  const nameInput = document.getElementById("nameInputJoin");
  const codeInput = document.getElementById("codeInput");
  const name = (nameInput ? nameInput.value : "").trim();
  const code = (codeInput ? codeInput.value : "").trim().toUpperCase();
  if (!name || !code) { state.joinError = "Completá tu nombre y el código de sala."; render(); return; }
  const existing = await loadRoom(code);
  if (!existing) { state.joinError = "No encontramos esa sala. Revisá el código."; render(); return; }
  if (existing.phase !== "lobby") { state.joinError = "Esa partida ya empezó. Esperá a la próxima ronda."; render(); return; }
  if (existing.players.length >= 15) { state.joinError = "La sala ya tiene el máximo de 15 jugadores."; render(); return; }
  if (existing.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    state.joinError = "Ya hay alguien con ese nombre, probá otro."; render(); return;
  }
  existing.players.push({ id: myId, name, isBot: false });
  await saveRoom(existing);
  stopOpenRoomsPolling();
  saveSession(code, name);
  state.room = existing;
  state.roomCode = code;
  state.myName = name;
  state.screen = "lobby";
  state.joinError = "";
  startPolling();
  render();
}

async function setBotCountOnline(n) {
  if (!state.room || state.room.hostId !== myId) return;
  state.room.botCount = n;
  await saveRoom(state.room);
  render();
}
async function setRoomFlag(key, val) {
  if (!state.room || state.room.hostId !== myId) return;
  state.room[key] = val;
  await saveRoom(state.room);
  render();
}
function totalPlayersCountOnline() {
  if (!state.room) return 0;
  return state.room.players.length + state.room.botCount;
}

async function startGameOnline() {
  const room = state.room;
  if (!room || room.hostId !== myId) return;
  const total = totalPlayersCountOnline();
  if (total < 3) return;

  const bots = [];
  for (let i = 0; i < room.botCount; i++) bots.push({ id: "bot-" + (i + 1), name: botNamesPool[i], isBot: true });
  const snapshotPlayers = room.players.map(p => ({ id: p.id, name: p.name, isBot: false })).concat(bots);

  const difficulty = computeDifficulty(room.readingOk, room.kidsUnder12);
  const picked = pickRoundWord(difficulty, room.recentWords);

  // evitar que el impostor sea alguien que ya lo fue en las últimas rondas (si el grupo lo permite)
  const impostorMaxRecent = Math.max(1, Math.min(2, snapshotPlayers.length - 2));
  const impostor = pickExcludingRecent(snapshotPlayers, room.recentImpostorIds, impostorMaxRecent, p => p.id);

  // evitar que arranque quien ya arrancó en las últimas rondas
  const starterMaxRecent = Math.max(1, Math.min(2, snapshotPlayers.length - 1));
  const starter = pickExcludingRecent(snapshotPlayers, room.recentStarterIds, starterMaxRecent, p => p.id);
  const starterIdx = snapshotPlayers.findIndex(p => p.id === starter.id);
  const turnOrder = [];
  for (let i = 0; i < snapshotPlayers.length; i++) turnOrder.push(snapshotPlayers[(starterIdx + i) % snapshotPlayers.length].id);

  room.snapshotPlayers = snapshotPlayers;
  room.category = picked.category; room.word = picked.word; room.emoji = picked.emoji;
  room.hints = picked.hints; room.decoyWord = picked.decoyWord; room.decoyEmoji = picked.decoyEmoji;
  room.impostorId = impostor.id;
  room.starterId = starter.id;
  room.turnOrder = turnOrder; room.turnIndex = 0; room.clues = {};
  room.revealed = false; room.round += 1; room.phase = "playing";

  room.recentImpostorIds = (room.recentImpostorIds || []).concat([impostor.id]).slice(-3);
  room.recentStarterIds = (room.recentStarterIds || []).concat([starter.id]).slice(-3);
  room.recentWords = (room.recentWords || []).concat([picked.word]).slice(-8);

  await saveRoom(room);
  state.screen = "playing";
  state.revealedRole = false;
  render();
}

async function goToCluesOnline() {
  if (!state.room || state.room.hostId !== myId) return;
  state.room.phase = "clues";
  await saveRoom(state.room);
  state.screen = "clues";
  render();
}
function isBotId(id) { return id && id.indexOf("bot-") === 0; }

async function fetchBotClueOnline(botId, botName, isImpostor) {
  state.clueLoading = true; render();
  const room = state.room;
  const usedWords = Object.values(room.clues || {});
  const prompt = isImpostor
    ? `Jugamos "El Impostor". Sos ${botName}, EL IMPOSTOR. No sabés la palabra secreta, solo la categoría: "${room.category}". Decí UNA sola palabra (no una frase) creíble dentro de esa categoría, para disimular sin saber la palabra real. ${usedWords.length ? `Ya se dijeron estas palabras, no las repitas: ${usedWords.join(", ")}.` : ""} Respondé solo con esa palabra, sin comillas ni explicaciones, en español rioplatense.`
    : `Jugamos "El Impostor". Sos ${botName}, NO sos el impostor. La palabra secreta es "${room.word}" (categoría: "${room.category}"). Decí UNA sola palabra relacionada a "${room.word}" sin decir esa palabra. ${usedWords.length ? `Ya se dijeron estas palabras, no las repitas: ${usedWords.join(", ")}.` : ""} Respondé solo con esa palabra, sin comillas ni explicaciones, en español rioplatense.`;
  room.clues[botId] = await askBotForClue(prompt, room.category, room.word, room.hints, usedWords);
  await saveRoom(room);
  state.clueLoading = false; render();
}

async function advanceTurnOnline() {
  const room = state.room; if (!room) return;
  room.turnIndex += 1;
  if (room.turnIndex >= room.turnOrder.length) { room.phase = "voting"; room.revealed = false; }
  await saveRoom(room);
  state.screen = room.phase === "voting" ? "voting" : "clues";
  render();
}
async function revealAnswerOnline() {
  if (!state.room || state.room.hostId !== myId) return;
  state.room.revealed = true; await saveRoom(state.room); render();
}
async function newRoundOnline() {
  if (!state.room || state.room.hostId !== myId) return;
  state.room.phase = "lobby"; await saveRoom(state.room);
  state.screen = "lobby"; state.revealedRole = false; render();
}
function leaveRoom() {
  if (state.pollHandle) clearInterval(state.pollHandle);
  state.pollHandle = null; state.room = null; state.roomCode = null;
  clearSession();
  state.screen = "onlineHome"; state.joinError = ""; render();
  startOpenRoomsPolling();
}

/* ================= MODO LOCAL (PASAMANOS) ================= */
function localAdjustHumans(delta) {
  state.local.humanCount = Math.max(1, Math.min(15, state.local.humanCount + delta));
  render();
}
function localAdjustBots(delta) {
  state.local.botCount = Math.max(0, Math.min(4, state.local.botCount + delta));
  render();
}
function localSetReading(val) { state.local.readingOk = val; render(); }
function localSetKids(val) { state.local.kidsUnder12 = val; render(); }
function localSetHelp(val) { state.local.impostorHelp = val; render(); }

function localGoToNames() {
  state.local.names = [];
  state.local.nameStep = 0;
  state.screen = "nameEntry";
  render();
}
function localSaveName() {
  const input = document.getElementById("localNameInput");
  const val = (input ? input.value : "").trim() || ("Jugador " + (state.local.nameStep + 1));
  state.local.names.push(val);
  state.local.nameStep += 1;
  if (state.local.nameStep >= state.local.humanCount) {
    localPickRound();
  } else {
    render();
  }
}

function localPickRound() {
  const L = state.local;
  L.allPlayers = L.names.concat(botNamesPool.slice(0, L.botCount));
  const difficulty = computeDifficulty(L.readingOk, L.kidsUnder12);
  const picked = pickRoundWord(difficulty, L.recentWords);
  L.category = picked.category; L.word = picked.word; L.emoji = picked.emoji;
  L.hints = picked.hints; L.decoyWord = picked.decoyWord; L.decoyEmoji = picked.decoyEmoji;
  L.usedClueWords = [];

  const indices = L.allPlayers.map((_, i) => i);
  const impostorMaxRecent = Math.max(1, Math.min(2, L.allPlayers.length - 2));
  L.impostorIndex = pickExcludingRecent(indices, L.recentImpostorIndices, impostorMaxRecent, i => L.allPlayers[i]);

  const starterMaxRecent = Math.max(1, Math.min(2, L.allPlayers.length - 1));
  L.starter = pickExcludingRecent(indices, L.recentStarterIndices, starterMaxRecent, i => L.allPlayers[i]);
  const starterIndex = L.starter;

  L.recentImpostorIndices = (L.recentImpostorIndices || []).concat([L.allPlayers[L.impostorIndex]]).slice(-3);
  L.recentStarterIndices = (L.recentStarterIndices || []).concat([L.allPlayers[starterIndex]]).slice(-3);
  L.recentWords = (L.recentWords || []).concat([picked.word]).slice(-8);

  const order = [];
  for (let i = 0; i < L.allPlayers.length; i++) order.push((starterIndex + i) % L.allPlayers.length);
  L.clueOrder = order; L.clueStep = 0; L.clueLoading = false; L.clueText = null; L.clueError = null;

  L.roundHumans = L.names.slice();
  L.currentIndex = 0; L.revealed = false;
  state.screen = L.roundHumans.length > 0 ? "localReveal" : "localClueIntro";
  render();
}

function localShowSecret(idx) { state.local.currentIndex = idx; state.local.revealed = true; render(); }
function localNextPlayer() {
  const L = state.local;
  L.revealed = false;
  if (L.currentIndex + 1 >= L.roundHumans.length) state.screen = "localClueIntro";
  L.currentIndex += 1;
  render();
}
function localStartClueRound() {
  state.screen = "localClueRound";
  state.local.clueStep = 0; state.local.clueText = null; state.local.clueError = null;
  render();
}
function localIsBotName(name) { return botNamesPool.includes(name); }

async function localFetchBotClue(name) {
  const L = state.local;
  L.clueLoading = true; render();
  const globalIndex = L.allPlayers.indexOf(name);
  const isImpostor = globalIndex === L.impostorIndex;
  const usedWords = L.usedClueWords || [];
  const prompt = isImpostor
    ? `Jugamos "El Impostor" (juego de mesa presencial). Sos ${name}, EL IMPOSTOR. No sabés la palabra secreta, solo la categoría: "${L.category}". Decí UNA sola palabra (no una frase) creíble dentro de esa categoría para disimular. ${usedWords.length ? `Ya se dijeron estas palabras, no las repitas: ${usedWords.join(", ")}.` : ""} Respondé solo con esa palabra, sin comillas ni explicaciones, en español rioplatense.`
    : `Jugamos "El Impostor" (juego de mesa presencial). Sos ${name}, NO sos el impostor. La palabra secreta es "${L.word}" (categoría: "${L.category}"). Decí UNA sola palabra relacionada a "${L.word}" sin decir esa palabra. ${usedWords.length ? `Ya se dijeron estas palabras, no las repitas: ${usedWords.join(", ")}.` : ""} Respondé solo con esa palabra, sin comillas ni explicaciones, en español rioplatense.`;
  L.clueText = await askBotForClue(prompt, L.category, L.word, L.hints, usedWords);
  L.usedClueWords = (L.usedClueWords || []).concat([L.clueText]);
  speakAloud(L.clueText);
  L.clueLoading = false; render();
}

function localNextClueStep() {
  const L = state.local;
  L.clueStep += 1; L.clueText = null; L.clueError = null;
  if (L.clueStep >= L.clueOrder.length) state.screen = "localDone";
  render();
}
function localRevealAnswer() { state.local.showAnswer = true; render(); }
function localNewRound() { localPickRound(); }
function localChangePlayers() {
  state.screen = "localSetup";
  render();
}

/* ================= RENDER ================= */
function render() {
  const card = document.getElementById("card");

  if (state.screen === "modeSelect") {
    card.innerHTML = `
      <h1>🕵️ El Impostor</h1>
      <div class="sub">¿Cómo quieren jugar?</div>
      <button class="btn btnPrimary" onclick="chooseMode('online')">🌐 Online (cada uno con su celular, desde donde sea)</button>
      <button class="btn btnPastel" onclick="chooseMode('local')">📱 Pasamanos (un solo celular, todos juntos)</button>
      <div class="footerNote">Online: compartís un código de sala. Pasamanos: se van pasando el mismo teléfono.</div>
    `;
    return;
  }

  /* ---------- ONLINE ---------- */
  if (state.mode === "online") { renderOnline(card); return; }

  /* ---------- LOCAL ---------- */
  if (state.mode === "local") { renderLocal(card); return; }
}

function renderOnline(card) {
  const room = state.room;

  if (state.screen === "onlineHome") {
    const prevName = document.getElementById("nameInput"); const prevNameVal = prevName ? prevName.value : "";
    const prevJoinName = document.getElementById("nameInputJoin"); const prevJoinVal = prevJoinName ? prevJoinName.value : "";
    const prevCode = document.getElementById("codeInput"); const prevCodeVal = prevCode ? prevCode.value : "";
    card.innerHTML = `
      <h1>🌐 Online</h1>
      <div class="sub">Jugá con quien quieras, estén donde estén</div>
      ${state.resumableRoom ? `
        <button class="resumeBanner" onclick="resumeSession()">
          <div class="t">↩️ Volver a tu sala (${state.resumableRoom.code})</div>
          <div class="s">Eras ${state.resumableRoom.name} — seguís ahí adentro</div>
        </button>
      ` : ""}
      <input id="nameInput" type="text" placeholder="Tu nombre" value="${prevNameVal}">
      <button class="btn btnPrimary" onclick="createRoom()">Crear sala nueva</button>
      <div class="divider">— o —</div>
      <input id="nameInputJoin" type="text" placeholder="Tu nombre" value="${prevJoinVal}">
      <input id="codeInput" class="codeInput" type="text" maxlength="4" placeholder="CÓDIGO" value="${prevCodeVal}">
      <button class="btn btnSecondary" onclick="joinRoom()">Unirme a una sala</button>
      ${state.joinError ? `<div class="err">${state.joinError}</div>` : ""}
      <div id="openRoomsBlock">${renderOpenRoomsBlock()}</div>
      <button class="linkBtn" onclick="backToModeSelect()">← Volver</button>
    `;
    return;
  }

  if (!room) { card.innerHTML = `<h1>😵 Sala perdida</h1><button class="btn btnSecondary" onclick="leaveRoom()">Volver</button>`; return; }
  const isHost = room.hostId === myId;

  if (state.screen === "lobby") {
    const humanItems = room.players.map(p => `<div class="playerItem"><span>${p.name}</span><span class="tag hostTag">${p.id === room.hostId ? 'HOST' : ''}</span></div>`).join("");
    const botButtons = [0, 1, 2, 3, 4].map(n => `<button class="botOption ${room.botCount === n ? 'botOptionActive' : ''}" ${isHost ? `onclick="setBotCountOnline(${n})"` : "disabled"}>${n}</button>`).join("");
    const total = totalPlayersCountOnline();
    const canStart = total >= 3;
    card.innerHTML = `
      <h1>🕵️ El Impostor</h1>
      <div class="roomCodeBox"><div class="roomCodeLabel">CÓDIGO DE SALA</div><div class="roomCode">${room.code}</div></div>
      <div class="sub">Jugadores en la sala (${room.players.length})</div>
      <div class="playerList">${humanItems}</div>
      <div class="selectorRow"><div class="selectorLabel">¿Cuántos jugadores Claude suman?</div><div class="botOptions">${botButtons}</div></div>
      ${renderDifficultyControls(room, isHost, "Online")}
      ${isHost
        ? `${!canStart ? `<div class="warn">Necesitás al menos 3 jugadores en total.</div>` : ""}
           <button class="btn btnPrimary" ${canStart ? "" : "disabled"} onclick="startGameOnline()">Empezar partida (${total} jugadores)</button>`
        : `<div class="warn">Esperando a que el host empiece la partida...</div>`}
      <button class="linkBtn" onclick="leaveRoom()">Salir de la sala</button>
    `;
    return;
  }

  if (state.screen === "playing") {
    const me = (room.snapshotPlayers || []).find(p => p.id === myId);
    const isImpostor = me && me.id === room.impostorId;
    const starterName = (room.snapshotPlayers || []).find(p => p.id === room.starterId);
    if (!me) { card.innerHTML = `<h1>⏳ Ronda en curso</h1><div class="sub">Esta ronda ya empezó sin vos. Esperá a la próxima.</div>`; return; }
    if (!state.revealedRole) {
      card.innerHTML = `
        <h1>🕵️ Tu rol</h1>
        <div class="sub">${me.name}, tocá para ver tu palabra a solas</div>
        <button class="btn btnPrimary" onclick="state.revealedRole = true; render();">Ver mi palabra</button>
        <div class="footerNote">Cada uno lo ve en su propio dispositivo.</div>
      `;
    } else {
      card.innerHTML = `
        <div class="reveal ${isImpostor ? 'impostor' : 'crew'}">
          <div class="role">${me.name}, vos sos...</div>
          <div class="emoji-big">${isImpostor ? '🕶️' : room.emoji}</div>
          <div class="word">${isImpostor ? 'EL IMPOSTOR' : room.word.toUpperCase()}</div>
          ${isImpostor
            ? `<div class="category-tag">Categoría: ${room.category.toUpperCase()} — no sabés la palabra, ¡disimulá!</div>`
            : `<div class="category-tag">Categoría: ${room.category.toUpperCase()}</div>`}
          ${isImpostor && room.impostorHelp ? `<div class="helpBox">🤫 Ayuda: una palabra parecida de la misma categoría es <b>${room.decoyWord.toUpperCase()}</b> (no es la real, pero te puede servir para disimular).</div>` : ""}
        </div>
        ${isHost
          ? `<button class="btn btnPrimary" onclick="goToCluesOnline()">Empezar ronda de pistas (arranca ${starterName ? starterName.name.toUpperCase() : ''})</button>`
          : `<div class="warn">Esperando a que el host arranque la ronda de pistas...</div>`}
      `;
    }
    return;
  }

  if (state.screen === "clues") {
    const idx = room.turnIndex;
    const currentId = room.turnOrder[idx];
    const current = (room.snapshotPlayers || []).find(p => p.id === currentId);
    const isMyTurn = currentId === myId;
    const bot = isBotId(currentId);
    const botIsImpostor = currentId === room.impostorId;
    const clueText = room.clues ? room.clues[currentId] : null;
    let bodyHtml = "";
    if (bot) {
      bodyHtml = `
        <div class="turnBanner">
          <div class="turnName">🤖 ${current ? current.name.toUpperCase() : ''}</div>
          ${state.clueLoading ? `<div class="loading">Pensando la pista...</div>` : ""}
          ${clueText ? `<div class="clueBubble">${clueText.toUpperCase()}</div>` : `<div class="turnHint">Va a decir UNA palabra</div>`}
        </div>
        ${isHost && !clueText && !state.clueLoading ? `<button class="btn btnLavender" onclick="fetchBotClueOnline('${currentId}','${current.name}',${botIsImpostor})">Pedir la pista de ${current.name}</button>` : ""}
        ${isHost && clueText ? `<button class="btn btnSecondary" onclick="advanceTurnOnline()">Siguiente</button>` : ""}
        ${!isHost ? `<div class="warn">Esperando la pista...</div>` : ""}
      `;
    } else if (isMyTurn) {
      bodyHtml = `
        <div class="turnBanner myTurn"><div class="turnName">¡ES TU TURNO!</div><div class="turnHint">Decí UNA sola palabra en voz alta</div></div>
        <button class="btn btnPrimary" onclick="advanceTurnOnline()">Ya la dije, siguiente</button>
      `;
    } else {
      bodyHtml = `<div class="turnBanner"><div class="turnName">${current ? current.name.toUpperCase() : ''}</div><div class="turnHint">Esperando su palabra...</div></div>`;
    }
    card.innerHTML = `<h1>🗣️ Ronda de pistas</h1><div class="sub">Turno ${idx + 1} de ${room.turnOrder.length}</div>${bodyHtml}`;
    return;
  }

  if (state.screen === "voting") {
    const impostorPlayer = (room.snapshotPlayers || []).find(p => p.id === room.impostorId);
    card.innerHTML = `
      <h1>🗳️ A votar</h1>
      <div class="sub">Ya escucharon todas las palabras. Discutan y voten quién creen que es el impostor.</div>
      ${room.revealed
        ? `<div class="reveal impostor"><div class="role">El impostor era...</div><div class="word">${impostorPlayer ? impostorPlayer.name.toUpperCase() : '?'}</div><div class="category-tag">La palabra era: ${room.word.toUpperCase()}</div></div>`
        : ""}
      ${isHost
        ? `${!room.revealed ? `<button class="btn btnSecondary" onclick="revealAnswerOnline()">Revelar quién era el impostor</button>` : ""}
           <button class="btn btnPrimary" onclick="newRoundOnline()">Jugar otra ronda</button>`
        : `<div class="warn">Esperando al host para la próxima ronda...</div>`}
    `;
    return;
  }
}

function renderDifficultyControls(cfgObj, isHost, prefixCtx) {
  const readingOk = cfgObj.readingOk;
  const kidsUnder12 = cfgObj.kidsUnder12;
  const impostorHelp = cfgObj.impostorHelp;
  const setReadFn = prefixCtx === "Online" ? "setRoomFlag('readingOk', " : "localSetReading(";
  const setKidsFn = prefixCtx === "Online" ? "setRoomFlag('kidsUnder12', " : "localSetKids(";
  const setHelpFn = prefixCtx === "Online" ? "setRoomFlag('impostorHelp', " : "localSetHelp(";
  const disabledAttr = isHost ? "" : "disabled";
  return `
    <div class="selectorRow">
      <div class="selectorLabel">¿Todos los jugadores saben leer bien?</div>
      <div class="pillOptions">
        <button class="pill ${readingOk ? 'pillActiveAlt' : ''}" ${disabledAttr} onclick="${setReadFn}true)">Sí</button>
        <button class="pill ${readingOk === false ? 'pillActive' : ''}" ${disabledAttr} onclick="${setReadFn}false)">No</button>
      </div>
    </div>
    <div class="selectorRow">
      <div class="selectorLabel">¿Juegan con menores de 12 años?</div>
      <div class="pillOptions">
        <button class="pill ${kidsUnder12 ? 'pillActiveAlt' : ''}" ${disabledAttr} onclick="${setKidsFn}true)">Sí</button>
        <button class="pill ${kidsUnder12 === false ? 'pillActive' : ''}" ${disabledAttr} onclick="${setKidsFn}false)">No</button>
      </div>
    </div>
    <div class="selectorRow">
      <div class="selectorLabel">¿Ayuda al impostor? (le muestra una pista para disimular)</div>
      <div class="pillOptions">
        <button class="pill ${impostorHelp ? 'pillActiveAlt' : ''}" ${disabledAttr} onclick="${setHelpFn}true)">Sí</button>
        <button class="pill ${impostorHelp === false ? 'pillActive' : ''}" ${disabledAttr} onclick="${setHelpFn}false)">No</button>
      </div>
    </div>
  `;
}

function renderLocal(card) {
  const L = state.local;

  if (state.screen === "localSetup") {
    card.innerHTML = `
      <h1>📱 Pasamanos</h1>
      <div class="sub">Configurá la partida antes de arrancar</div>
      <div class="selectorRow">
        <div class="selectorLabel">Jugadores humanos</div>
        <div class="stepper">
          <button class="stepBtn" onclick="localAdjustHumans(-1)" ${L.humanCount <= 1 ? "disabled" : ""}>−</button>
          <div class="stepValue">${L.humanCount}</div>
          <button class="stepBtn" onclick="localAdjustHumans(1)" ${L.humanCount >= 15 ? "disabled" : ""}>+</button>
        </div>
      </div>
      <div class="selectorRow">
        <div class="selectorLabel">Jugadores Claude</div>
        <div class="stepper">
          <button class="stepBtn" onclick="localAdjustBots(-1)" ${L.botCount <= 0 ? "disabled" : ""}>−</button>
          <div class="stepValue">${L.botCount}</div>
          <button class="stepBtn" onclick="localAdjustBots(1)" ${L.botCount >= 4 ? "disabled" : ""}>+</button>
        </div>
      </div>
      ${renderDifficultyControls(L, true, "Local")}
      <button class="btn btnPrimary" onclick="localGoToNames()">Continuar</button>
      <button class="linkBtn" onclick="backToModeSelect()">← Volver</button>
    `;
    return;
  }

  if (state.screen === "nameEntry") {
    card.innerHTML = `
      <h1>✍️ Nombres</h1>
      <div class="sub">Jugador ${L.nameStep + 1} de ${L.humanCount}</div>
      <input id="localNameInput" type="text" placeholder="Nombre" autofocus>
      <button class="btn btnPrimary" onclick="localSaveName()">${L.nameStep + 1 >= L.humanCount ? 'Listo, empezar ronda' : 'Siguiente'}</button>
    `;
    return;
  }

  if (state.screen === "localReveal") {
    const name = L.roundHumans[L.currentIndex];
    const globalIndex = L.allPlayers.indexOf(name);
    if (!L.revealed) {
      card.innerHTML = `
        <h1>🕵️ El Impostor</h1>
        <div class="sub">Pasále el celular a <b>${name}</b></div>
        <button class="btn btnPastel" onclick="localShowSecret(${L.currentIndex})">Soy ${name}, mostrame mi palabra</button>
        <div class="footerNote">Jugador ${L.currentIndex + 1} de ${L.roundHumans.length}</div>
      `;
    } else {
      const isImpostor = globalIndex === L.impostorIndex;
      card.innerHTML = `
        <div class="reveal ${isImpostor ? 'impostor' : 'crew'}">
          <div class="role">${name}, vos sos...</div>
          <div class="emoji-big">${isImpostor ? '🕶️' : L.emoji}</div>
          <div class="word">${isImpostor ? 'EL IMPOSTOR' : L.word.toUpperCase()}</div>
          ${isImpostor
            ? `<div class="category-tag">Categoría: ${L.category.toUpperCase()} — no sabés la palabra, ¡disimulá!</div>`
            : `<div class="category-tag">Categoría: ${L.category.toUpperCase()}</div>`}
          ${isImpostor && L.impostorHelp ? `<div class="helpBox">🤫 Ayuda: una palabra parecida de la misma categoría es <b>${L.decoyWord.toUpperCase()}</b> (no es la real, te puede servir para disimular).</div>` : ""}
        </div>
        <button class="btn btnSecondary" onclick="localNextPlayer()">Ya la vi, pasar al siguiente</button>
      `;
    }
    return;
  }

  if (state.screen === "localClueIntro") {
    const starterName = L.allPlayers[L.starter];
    card.innerHTML = `
      <h1>🎬 ¡A jugar!</h1>
      <div class="sub">Todos vieron su palabra (o su rol de impostor). Ahora, en orden, cada uno dice UNA sola palabra relacionada.</div>
      <div class="roomCodeBox"><div class="roomCodeLabel">EMPIEZA LA RONDA</div><div class="roomCode" style="font-size:26px;letter-spacing:2px;">${starterName.toUpperCase()}</div></div>
      <button class="btn btnPrimary" onclick="localStartClueRound()">Empezar ronda de palabras</button>
    `;
    return;
  }

  if (state.screen === "localClueRound") {
    const idx = L.clueOrder[L.clueStep];
    const name = L.allPlayers[idx];
    const isBot = localIsBotName(name);
    const stepLabel = `Turno ${L.clueStep + 1} de ${L.clueOrder.length}`;
    if (!isBot) {
      card.innerHTML = `
        <h1>🗣️ Ronda de palabras</h1>
        <div class="sub">${stepLabel}</div>
        <div class="turnBanner myTurn"><div class="turnName">${name.toUpperCase()}</div><div class="turnHint">Decí UNA sola palabra en voz alta</div></div>
        <button class="btn btnPrimary" onclick="localNextClueStep()">Listo, siguiente</button>
      `;
    } else {
      card.innerHTML = `
        <h1>🗣️ Ronda de palabras</h1>
        <div class="sub">${stepLabel}</div>
        <div class="turnBanner">
          <div class="turnName">🤖 ${name.toUpperCase()}</div>
          ${L.clueLoading ? `<div class="loading">Pensando la palabra...</div>` : ""}
          ${L.clueText ? `<div class="clueBubble">${L.clueText.toUpperCase()}</div>` : ""}
          ${L.clueError ? `<div class="warn">${L.clueError}</div>` : ""}
        </div>
        ${!L.clueText && !L.clueLoading ? `<button class="btn btnLavender" onclick="localFetchBotClue('${name}')">Pedir la palabra de ${name} 🔊</button>` : ""}
        ${L.clueText ? `<button class="btn btnSecondary" onclick="localNextClueStep()">Siguiente</button>` : ""}
        ${L.clueError ? `<button class="btn btnSecondary" onclick="localFetchBotClue('${name}')">Reintentar</button>` : ""}
        <div class="footerNote">Claude dice su palabra en voz alta por el parlante del teléfono.</div>
      `;
    }
    return;
  }

  if (state.screen === "localDone") {
    const impostorName = L.allPlayers[L.impostorIndex];
    card.innerHTML = `
      <h1>🗳️ A votar</h1>
      <div class="sub">Ya escucharon todas las palabras. Discutan y voten quién creen que es el impostor.</div>
      ${L.showAnswer
        ? `<div class="reveal impostor"><div class="role">El impostor era...</div><div class="word">${impostorName.toUpperCase()}</div><div class="category-tag">La palabra era: ${L.word.toUpperCase()}</div></div>`
        : `<button class="btn btnSecondary" onclick="localRevealAnswer()">Revelar quién era el impostor</button>`}
      <button class="btn btnPrimary" onclick="localNewRound()">Jugar otra ronda (mismos jugadores)</button>
      <button class="linkBtn" onclick="localChangePlayers()">Cambiar jugadores / configuración</button>
    `;
    return;
  }
}

render();
</script>
</body>
</html>
